Button_01_Cap\", \"ring_slot\": \"Button_01_Ring\", \"travel_cm\": 0.8}`; тип `button` → родитель `BP_MechButton`, `door` → `BP_MechDoor`, `key_reader` → `BP_MechKeySlot`.\n\n## Новый интерактивный пропс из Blender (план)\nВ `prop.json` необязательный блок:\n```json\n\"interactive\": { \"type\": \"button\", \"led_slot\": \"M_Button_LED\", \"cap\": \"Button_Cap\", \"travel_cm\": 0.8 }\n```\n`type`: `button`, `door`, `key_reader`. `publish` для интерактивного создаёт `BP_Prop_\u003cИмя>` дочерним от `BP_MechButton` (и т.д.), подставляет меш и материал; колпачок (`cap`) утапливается в `OnMechState`. Меню Fisht и `prop.ps1` принадлежат чату «Пропсы: Blender → игра» / «Меню Fisht»: им нужна одна строка-вызов (`Tools/Mechanisms/` ещё не создан).\n\n## Режимы компонента (добавлено позже)\n- `bToggle`: повторное нажатие из Active возвращает в Ready (кнопка/сенсор включает и выключает).\n- `bShared`: кнопки с одним `OutChannel` зеркалят общий канал (проходной выключатель: любая переключает, все показывают состояние двери).\n- `bPersist` по умолчанию выключен (иначе старый сейв запускает кнопку в Active).\n- `BP_MechButton`: `CanInteract` и `Interact` работают только с лицевой стороны (лицо = +Y меша; `CapDir` = (0,-1,0)).\n- `BP_MechKeySlot` интерактивен (E), поддерживает `bToggle`.\n- Ловушка Python: после каждого `set_editor_property` на компоненте актора объект компонента пересоздаётся; перед следующей установкой получай его заново.\n- Демо-область `SC_*` в `L_JR_Preview` (x 500..1500, y -2100..2800): 1 кнопка-дверь, 2 сенсор+ключ, 3 кабель-лампа-кнопка, 4 три ключа-кнопка, 5/6 проходные на 2/3 кнопки, 7 ключ-дверь, 8 две кнопки (И).\n\n## Известные ограничения\n- Перенос миссий (`TryAdvance`) и шлюз «N кнопок → дверь» не перенесены: шлюз = режим N из M у двери.\n- `HintKey` и `SoundKey` в таблице пока `None`; проигрывание звука/подсказки пока не подключено.\n- Переопределение цвета/таблицы на экземпляре не сделано (таблица зашита в `ApplyVisual`).\n- Python-тест: `set_editor_property` на экземпляре в PIE ломает последующие `call_method`; настраивай до PIE.\n","date":"2026-10-29"},{"path":"Docs/INTERACTION.md","title":"Взаимодействие по камере","section":"Уровни","md":"# Взаимодействие по камере (BP_InteractionFocus)\n\nЕдиный слой обнаружения: компонент `BP_InteractionFocus` на `BP_FishtCharacter`. Код: `Tools/Interaction/build_interaction_focus.py` (идемпотентный генератор; запускать при остановленном PIE: `exec(open(path, encoding=\"utf-8-sig\").read()); build_interaction_focus()`).\n\n## Что делает\n- `Scan` (10 Гц): `SphereTraceSingle` от камеры вдоль взгляда; если не попал, второй луч от лап по горизонтали (миски, земля), затем `BP_CarryHolder.FindNearest` (низкие предметы). Каждый попавший актор идёт в `Eval`.\n- `Eval` классифицирует актор:\n  - реализует `BPI_Interactable` и ближе `Reach` (220): `CurrentInteractable`, подсказка из `GetInteractionText`, E вызывает `Interact` (кнопки, двери);\n  - теги `Drink/Eat/Mark/Dig` и ближе `NeedReach` (140): потребность, E идёт в `UseFocus` и `DogActions.ContextAction`;\n  - тег `Item.Carryable` и ближе `NeedReach`: подсказка `Carry.Take`, E берёт `BP_CarryHolder.TryGrab`.\n- Верёвки и физическая переноска не входят в слой: у них своё обнаружение капсулой. Старая нижняя подпись переноски выключена флагом `BP_CarryHolder.bOwnPrompt` (false).\n\n## Контур\n`M_FocusOutline` (постпроцесс) и пользовательский `MI_FocusOutline`: `OutlineColor`, `Thickness`, `Strength`. Фокус-актору ставятся `RenderCustomDepth` и stencil 1 (`SetHl`/`ApplyHighlight`). В `DefaultEngine.ini` `r.CustomDepth=3`.\nПравило: в постпроцессе читать сцену только нативными узлами `SceneTexture` (+ `ScreenPosition.ViewportUV`). Custom-нода с `SceneTextureLookup` даёт мусорную рамку по краю экрана.\n\n## 3D-подсказка\n`WidgetComponent FocusHint` на персонаже, виджет `WBP_FocusHint` (клавиша из `BPFL_InputGlyphs.GetKeyLabel` + название действия). Тексты из String Table `ST_Hints` через `BPFL_Loc.GetHint` (ключи `Interact.*`, `Carry.Take`; русские строки после `Tools\\loc_update.ps1`).\nПозиция считается каждый кадр от bounds фокус-актора: правый верхний угол в осях камеры + `HintMargin`; у больших объектов (`|BoxExtent| > HintBigExtent`) центр bounds, сдвинутый к камере на `HintBigLift`. Размер постоянный на экране: масштаб = `HintSize` × расстояние до камеры. Появление: `HintFade`.\nЛучи: камера (сфера `TraceRadius` 40, длина `TraceLen` 900), запасной от лап (сфера `PawRadius` 8, длина `PawLen` 200, горизонтально на высоте лап). `BP_DogActions.ContextAction` своего луча больше не бьёт: цель = `FocusActor` (патч `Tools/Interaction/patch_context_action.py`). Пока идёт подтягивание, `PullTick` обнуляет `DogActions.AlignT`, чтобы выравнивание StandD не спорило.`n`nПараметры (Details `BP_InteractionFocus`): `Reach`, `NeedReach` (200), `TraceLen`, `TraceRadius`, `PawRadius`, `PawLen`, `Interval`, `HintMargin`, `HintHalfW/H`, `HintSize`, `HintFade`, `HintBigExtent`, `HintBigLift`, `OutlineMaterial`.\n\n## Якоря и подтягивание\nКомпонент `BP_InteractionAnchor` на объекте: `AnchorOffset` (локально к объекту), `AnchorYaw`, `PullTime` (с), `bPull`. При использовании потребности (`UseFocus`) пёс плавно (smoothstep) идёт к якорю и разворачивается к объекту. Без компонента поведение прежнее. Для объектов с `BPI_Interactable` (кнопки, двери) `BeginPull` вызывается в цепочке E персонажа сразу после `Interact`; достаточно добавить объекту компонент `BP_InteractionAnchor` (в уровне: Add Component на экземпляре, либо в Blueprint объекта).\n\nБлюпринт точки: `BP_InteractionPoint` (Actor) и наследники `BP_Point_Drink/Eat/Mark/Dig` (тег потребности в Actor Tags). Стрелка `AnchorArrow` во вьюпорте = куда встанет пёс; Construction Script копирует её в `Anchor`. Параметры в Details: `PullTime`, `bPull`, `AnchorYawOffset`; меш `PointMesh` менять в наследнике. Низ меша держать у пола: `ContextAction` ищет цель низким лучом от лап (140 см).`n`n## Приоритет E\nE действует на фокус-актор. `BP_CarryHolder.TryGrab` в начале спрашивает `BP_InteractionFocus.AllowGrab`: true, если фокуса нет или у фокус-актора тег `Item.Carryable`; false, если подсвечена кнопка/дверь/потребность. При false `TryGrab` выходит с `Consumed=false` (предмет в пасти остаётся, ближайший не берётся), и цепочка E идёт к `Interact`/`UseFocus`. E без цели по-прежнему выбрасывает предмет. Тест: `Tools/Interaction/pie_e_priority_test.py`; генератор: `patch_e_priority.py`.\nИзвестное ограничение: при фокусе на предмете `TryGrab` берёт ближайший к лапам (`FindNearest`), он может отличаться от подсвеченного, если предметы лежат вплотную.\n\n## Как добавить объект\n- Кнопка/дверь: реализовать `BPI_Interactable` (`CanInteract`, `GetInteractionText`, `Interact`).\n- Потребность: тег актора `Drink/Eat/Mark/Dig`.\n- Подбираемый: тег `Item.Carryable` и `BP_CarryableComponent`.\n- Якорь: добавить компонент `BP_InteractionAnchor`.\n\n## Ловушки\n- Компонент, добавленный в Blueprint после размещения в уровне, у стоящих экземпляров пуст: так было с `FocusHint` (класс виджета None, 500×500). Значения ставить на экземпляр и сохранять уровень; в других уровнях с псом проверить.\n- Имена узлов в `build_graph` нечувствительны к регистру (`sW` и `sw` конфликтуют).\n- `GetActorBounds` чистый (без exec).\n- Тесты: `Tools/Interaction/pie_*_test.py`, лог в `Saved/Interaction_*.log`.\n","date":"2026-10-29"},{"path":"Docs/ROPE_BEAM.md","title":"Верёвки и балки","section":"Уровни","md":"# Верёвки и балки (чат «Верёвки и балки», 2026-10-21, обновлено v5)\n\nФишт цепляется зубами (`Mouth_Carry`) за верёвку или балку. Верёвка работает как маятник (тело продолжает линию верёвки), балка качает вперёд-назад поперёк оси. Лазания нет. **Зацеп только автоматический** (в падении/прыжке, когда рот оказывается у цели), отпускание прыжком.\n\n> Разделы «v2…v4c» ниже — история разработки. Актуальные значения и правила — в этой верхней части.\n\n## 1. Как поставить в уровень\n1. Перетащи `BP_Rope` или `BP_Beam` из `/Game/Fisht/Gameplay/Traverse`.\n2. **Верёвка**: подвес = позиция актора, груз висит вниз на длину верёвки. **Балка**: ось = X актора (поворачивай по Yaw), центр = позиция актора.\n3. Размеры и меши меняются в **Details** актора, категория **«Верёвка-балка»**: подкатегория **«Меш и размер»** (всё про вид и габариты) и **«Профиль и качание»** (всё про поведение). Изменения сразу видны в редакторе.\n\n## 2. Как поменять меш и размер (самое частое)\n**Балка** (`BP_Beam`, это могут быть паки, мачты, трубы, перекладины):\n1. В Details актора → «Меш и размер» → `BeamMesh` выбери свой Static Mesh.\n2. `BeamMeshAxis` — какая ось меша **длинная**: `0` = X, `1` = Y, `2` = Z. Цилиндр и большинство столбов вытянуты по Z, значит `2` (по умолчанию). Если меш лежит вдоль X — поставь `0`.\n3. `BeamHalfLength` — **половина** длины в см (метровая балка = 50).\n4. `OvThickness` — толщина в см (больший из двух поперечных размеров меша подгоняется под это значение). Оставь `-1`, чтобы брать из таблицы (4 см).\n- Меш **автоматически вписывается** в заданные длину и толщину по его габаритам (bounds), поэтому не нужно знать его родной размер. Смещённый пивот (например, столб с пивотом у основания) компенсируется: балка всё равно центрируется в актёре.\n- Пропорции поперечного сечения не сохраняются: оба поперечных размера приводятся к `OvThickness`. Плоская доска станет квадратной; для досок/плит оставь родную толщину через большое `OvThickness`, либо делай меш круглым.\n\n**Верёвка** (`BP_Rope`, верёвки, провода, цепи):\n1. `SegMesh` — меш **одного звена** (по умолчанию цилиндр). Верёвка собирается из таких звеньев по кривой. Меш должен быть **вытянут по Z, с пивотом в центре**.\n2. `SegLen` — длина звена в см (по умолчанию 50). Число звеньев = длина верёвки / `SegLen`, максимум 12 (то есть при `SegLen` 50 длина до 600 см; для длиннее увеличь `SegLen`).\n3. `OvLength` — длина верёвки, см (`-1` = из таблицы, 300).\n4. `OvThickness` — толщина, см. Тонкий провод: `1`–`2`; толстый канат: `8`–`10`.\n- Звенья тоже подгоняются по габаритам меша: родной размер не важен.\n\n**Материал**: колонка `Material` строки таблицы `DT_RopeBeam` (раздел 4). У каждого меша свой слот 0, материал ставится на него. Свои материалы подставляй в таблицу: для верёвки `M_Rope_Yellow`, для балки `M_Beam_Orange` (оба в `/Game/Fisht/Gameplay/Traverse`).\n\n## 3. Справочник: параметры актора (Details, категория «Верёвка-балка»)\nПодкатегория **«Меш и размер»**:\n| Параметр | Что делает |\n|---|---|\n| `SegMesh` | Меш звена верёвки (Z-вытянутый, пивот в центре). |\n| `BeamMesh` | Меш балки (любой, ось задаётся `BeamMeshAxis`). |\n| `BeamMeshAxis` | Длинная ось меша балки: 0=X, 1=Y, 2=Z. |\n| `SegLen` | Длина одного звена верёвки, см. Звеньев = длина/`SegLen`, максимум 12. |\n| `BeamHalfLength` | Половина длины балки, см. Она же определяет зону захвата вдоль оси. |\n| `OvLength` | Длина верёвки, см. Перекрывает таблицу; `-1` = из таблицы. (Балка: не используется, длина по `BeamHalfLength`.) |\n| `OvThickness` | Толщина верёвки/балки, см. Перекрывает таблицу; `-1` = из таблицы. |\n\nПодкатегория **«Профиль и качание»**:\n| Параметр | Что делает |\n|---|---|\n| `Profile` | Имя строки таблицы `DT_RopeBeam` (`Rope_Default`, `Rope_Heavy`, `Beam_Default`). Выбирает набор настроек. |\n| `OvSwingForce` | Сила раскачивания от ввода (см/с²). Больше = легче раскачать. `-1` = из таблицы. |\n| `OvDamping` | Затухание качания (1/с). Больше = быстрее останавливается. `-1` = из таблицы. |\n| `OvAutoGrabRadius` | Радиус автозахвата, см. `-1` = из таблицы. |\n| `BeamGravScale` | **Балка**: «тяжесть» маятника. Меньше = медленнее, плавнее качание и шире окно для прыжка (1 = как физический маятник с плечом Length). 0.6. |\r\n| `BeamSoftZone` | **Балка**: с какой доли предела угла (MaxAngle) начинается мягкое торможение (0..1). 0.5. |\r\n| `BeamBrake` | **Балка**: сила мягкого торможения у предела угла, 1/с. Больше = Фишт сильнее замедляется перед крайней точкой, но скорость не обнуляется, он плавно «зависает» и возвращается. 0 = старое резкое отбивание. 14. |\r\n| `BendK` | Изгиб верёвки при движении (с на см): насколько «хвост» отстаёт от скорости. 0 = прямая. |\n| `HangClip` | Анимация позы висения. По умолчанию `AS_Fisht_HangMouthOpen` (`/Game/Fisht/Gameplay/Traverse`): копия `AS_Jump_up_vert` с пастью, открытой на 30°. Угол меняется в `Tools/Traverse/make_hang_mouth_clip.py` (`OPEN_DEG`, запуск через `execute_python_code`). Играется одиночным узлом поверх тела. |\n\nПодкатегория **«Анимации»** (свои клипы; верёвка и балка настраиваются независимо, так как поля стоят на самом акторе):\n| Параметр | Что делает |\n|---|---|\n| `HangClip` | Поза при захвате и подтягивании (цикл). По умолчанию `AS_Fisht_HangMouthOpen`. |\n| `SwingClip` | Клип качания. **Кадр 0 = тело максимально отклонено назад, последний кадр = вперёд, середина = вертикаль.** Играется на меше со скоростью 0, а позиция каждый кадр берётся по наклону тела (тот же угол, что у маятника), поэтому переход вперёд-назад плавный сам. Пусто = только жёсткий наклон тела, как раньше. Для верёвки и балки подходит один и тот же клип. |\n| `SwingClipRange` | Наклон тела в градусах, при котором клип доходит до крайнего кадра. 45. Меньше = клип «досчитывается» от меньших углов. |\n| `SwingTiltScale` | Множитель жёсткого наклона тела (1 = как раньше). Если клип сам наклоняет тело, поставь 0, чтобы не наклонять дважды. |\n| `ReleaseClip` | Клип спрыгивания. Играется один раз в момент отпускания. Пусто = ничего не играется (сразу `ABP_Dog`). |\n| `ReleaseClipHold` | Минимальное время (с) после отпускания до включения `ABP_Dog`, чтобы `ReleaseClip` успел доиграть. Поставь длину клипа. 0 = как раньше. |\nЕсли свой `SwingClip` нарисован вертикально, поставь у компонента `RopeBeam` на персонаже `HangPitch` = 0 (он компенсирует наклон старого клипа на 45°).\nСлужебные переменные категории `Runtime` (`Pos`, `Vel`, `Len`, `Thick`, `Swing` и т.д.) не трогай: они считаются сами.\n\n## 4. Справочник: таблица `DT_RopeBeam` (`/Game/Fisht/Gameplay/Traverse`, структура `FS_RopeBeam`)\nНазвания колонок английские (на них завязаны графы). Три строки: `Rope_Default`, `Rope_Heavy`, `Beam_Default`. Колонки:\n| Колонка | Смысл | Дефолт |\n|---|---|---|\n| `Kind` | Тип: `Rope` (верёвка) или `Beam` (балка). | |\n| `Length` | Верёвка: длина, см. Балка: **плечо маятника** (расстояние от рта до центра тела), см. | 300 / 70 |\n| `Thickness` | Толщина (диаметр), см. | 4 |\n| `Material` | Материал на меш. | жёлтый / оранжевый |\n| `SwingForce` | Ускорение от нажатия кнопки движения, см/с². | 600 |\n| `MaxSwingSpeed` | Предел скорости груза, см/с. | 900 / 700 |\n| `MaxAngle` | **Балка**: предел угла качания, град (у предела скорость гасится с отскоком). Верёвка: не используется. | 35 |\n| `Damping` | Затухание качания, 1/с. | 0.25 / 0.2 |\n| `GrabOffsetX/Y/Z` | Смещение точки зацепа относительно сокета пасти, см. | 0 |\n| `AutoGrabRadius` | Радиус автозахвата (рот ближе этого к точке зацепа), см. 0 = автозахват выключен. | 70 / 60 |\n| `ReachRadius` | Раньше дальность дотягивания для захвата по E. Сейчас **не используется**. | 180 |\n| `PullTime` | Время подтягивания к точке зацепа при захвате, с. | 0.25 |\n| `ReleaseForce` | Множитель скорости маятника при отпускании (инерция броска). | 1.3 / 1.2 |\n| `ReleaseUp` | Добавка скорости вверх при отпускании, см/с. | 300 |\n| `ReleaseBoost` | Добавка скорости вперёд по направлению качания при отпускании, см/с. | 300 / 250 |\n| `AnimRow` | Устарело (строка `DT_ActionAnims`), не используется: поза играется из `HangClip`. | |\n| `BlendIn` | Время поворота тела в позу висения при захвате, с. | 0.2 |\n| `BlendOut` | Время выпрямления тела после отпускания, с. | 0.3 |\n| `AnimScale` | Не используется. | 1 |\n| `Notes` | Твои заметки к строке. | |\nСвою строку (например `Wire_Thin`): добавь в таблице, выбери её в `Profile` актора.\n\n## 5. Справочник: компонент `RopeBeam` на персонаже (`BP_FishtCharacter`, категория «Верёвка-балка (персонаж)»)\n| Параметр | Что делает |\n|---|---|\n| `RegrabCooldown` | Пауза, с, в течение которой **только что отпущенная** верёвка/балка не хватается снова (другие хватаются сразу, можно прыгать с верёвки на верёвку). 0.6. |\n| `OnlyAutoGrabInAir` | Автозахват работает только в падении/прыжке (true), либо и на земле (false). |\n| `HangPitch` | Остаток поворота тела до вертикали при висении, град (клип `AS_Jump_up_vert` сам наклонён на ~45°). 45. |\n| `ReleaseTiltTol` | При отпускании ABP возвращается, когда тело отклонено от вертикали меньше этого угла, град. Меньше = плавнее выпрямление, но полёт начинается позже (3 = ~0.19 с; 0.5 = ~0.4 с; 6 = ~0.13 с, резко). |\r\n| `InterruptSpeed` | Если после отпускания скорость Фишта (по горизонтали) отличается от той, что держит компонент, больше чем на это значение (см/с), считается, что вмешалась другая система (рывок `BP_Ability_Dash` и т.п.), и компонент перестаёт держать инерцию. 250. |\r\n| `AirDrag` | Затухание горизонтальной скорости после отпускания, 1/с. Меньше = Фишт дальше летит по инерции. 0.3. |\n\n## 6. Управление\n- **Зацеп**: автоматически, когда Фишт в падении/прыжке касается зоны `Pick` (капсула вокруг верёвки/балки) и рот ближе `AutoGrabRadius` к точке зацепа. **Кнопка E (действие) больше не цепляет**; пока Фишт висит, E ничего не делает.\n- **Раскачивание**: кнопки движения. Верёвка — маятник в любую сторону. Балка — вперёд/назад поперёк оси; толчок только пока тело движется в ту же сторону, повторные нажатия в такт раскачивают сильнее (предел `MaxAngle`).\n- **Отпустить**: прыжок. Фишт улетает по инерции (`ReleaseForce`, `ReleaseBoost`, `ReleaseUp`, `AirDrag`).\n- **Камера** во время висения: общие настройки камеры (чат камеры), отдельной настройки нет.\n## Устройство\n- `BP_TraverseBase` (родитель `BP_Rope`/`BP_Beam`): `LoadProfile` (BeginPlay), маятник в Tick (точечная масса на нити: `v += (g + ввод·Swing)·dt`, демпфирование, предел скорости, нормировка на длину, убираем радиальную скорость), `GetHoldPoint(Hint)` (верёвка: груз; балка: ближайшая точка оси к рту), капсула `Pick` (канал `Traverse` Block, Pawn Overlap), цилиндр `Visual`. Tick каждый кадр опрашивает перекрытие `Pick` с игроком и зовёт `AutoGrabRequest`.\n- `BP_RopeBeamComponent`: состояния 0 свободен, 1 подтягивание, 2 висит, 3 восстановление (кинематика с гравитацией, поворот к вертикали за `BlendOut`), 4 полёт с инерцией (горизонтальная скорость держится, затухает на `AirDrag`, потому что `BrakingDecelerationFalling` = 1500 гасит её за 0.1 с). В состоянии 1-2 режим движения `MOVE_None`, позицию задаёт компонент.\n- Правки в чужом: `BP_FishtCharacter`: компонент `RopeBeam`; `IA_Interact.Started` и `IA_Jump.Started` идут через `RopeBeam.OnInteract` / `OnJump`, если не «поглощено» (`Consumed`), поток идёт в прежний узел (`TryGrab` / ветку прыжка). `DT_ActionAnims`: 2 строки.\n- Скрипты сборки: `Tools/Traverse/` (`build_rope_table.py`, `build_base.py`, `build_base_graphs.py`, `build_component.py`; тесты PIE `pie_rope_test.py`, `pie_release_test.py`). Имя `build_events` есть и в `build_base_graphs.py` (база), и раньше было в `build_component.py` (теперь `build_comp_events`).\n\n## v2 (2026-10-21, по замечаниям пользователя)\n- **Верёвка гнётся**: 12 сегментов-цилиндров (`Seg0..Seg11`) по кривой подвес-груз, изгиб-хвост против горизонтальной скорости (`BendK` на акторе). Меши задаются переменными `SegMesh`/`BeamMesh` (можно подменить на свои; сегмент = цилиндр 100×100 см, балка = куб 100 см, тянется вдоль X актора). Материал: поле `Material` строки таблицы, применяется к сегментам и балке.\n- **Редактор показывает готовый вид**: `Setup` (профиль, меши, длина верёвки отвесом, размер балки, видимость) вызывается из ConstructionScript и BeginPlay. Если после правок скриптов экземпляр в уровне выглядит старым, подвинь его или перезагрузи уровень.\n- **Балка качает**: маятник вперёд/назад поперёк оси балки (плечо `Length` из таблицы = 70 см, `MaxAngle` 35°, `SwingForce`, `Damping`); тело наклоняется на угол маятника (`GetBodyPitch`), рот остаётся в точке зацепа. Боковых качаний нет. Сторона качания = ближайшая к направлению морды Фишта в момент захвата (`BeamSide`).\n- **Отпускание с ускорением**: `ComputeRelease`: скорость маятника × `ReleaseForce` + `ReleaseBoost` вперёд по горизонтальной скорости + `ReleaseUp` вверх (новое поле таблицы `ReleaseBoost`, 300 см/с для верёвки). В полёте горизонтальная скорость держится (`AirDrag` 0.3 1/с).\n- **Прыжок с верёвки на верёвку**: пауза автозахвата `RegrabCooldown` (0.6 с) действует только на последнюю верёвку/балку (`LastTarget`), остальные хватаются сразу.\n- **Тело при висении**: наклон по скорости верёвки (`LeanK`, `MaxLean` на акторе), режим движения принудительно `MOVE_None` каждый кадр.\n- `Pick` теперь блокирует канал `Interact` (трасса камеры `TraceTypeQuery3`), а `Traverse` и `Surface` игнорирует: иначе `BP_LedgeClimb` принимал балку за уступ и взбирался на неё. Минус: стены не перекрывают цель для E (проверяется только дальность и `ReachRadius`).\n- Шаблон-ловушки: `set_component_property` мешей на новых компонентах молча не работает (меши ставит `ApplyMaterial`); при пересборке функции `fresh_fn` вызывающие её узлы (например `Setup`) нужно пересобрать.\n\n## v3 (2026-10-21, поза и камера)\n- **Причина «перебирает лапами» и «ложится в горизонталь»**: `BP_ActionAnims` в своём Tick сам решает, какое действие играть, и гасил `RopeHang`; поверх шёл `ABP_Dog` с ходьбой, наклонами спины и т.п. Теперь на время висения меш играет клип `HangClip` (по умолчанию `AS_Jump_up_vert`, переменная на акторе) одиночным узлом анимации без ABP; после запуска в полёт (`ApplyLaunch`) возвращается `ABP_Dog_C` (класс прописан константой в `ApplyLaunch`: если сменишь ABP, поправь там) и `MeshRel0`. Строки `RopeHang`/`BeamHang` в `DT_ActionAnims` больше не используются.\n- **Тело продолжает линию верёвки**: наклон считается из смещения груза от подвеса по осям Фишта (`GetBodyTilt`: pitch и roll, град). Проверено данными: груз +X на 219 см даёт голову позади ног на 55 см, груз +Y на 176 см даёт голову левее ног на 26 см. Балка: pitch = угол маятника.\n- **Камера**: наклоняется только `Mesh` (`StepRot`: `Compose(MeshRel0, (Pitch, 0, Roll))`), капсула и актор остаются вертикальными (поворачивается лишь yaw), пружина камеры больше не уезжает в голову. Позицию актора по-прежнему задаёт рот = точка зацепа.\n- `LeanK`/`MaxLean` на акторе больше не используются.\n\n## v4 (камера на балке)\n- **Причина «камера схлопывается / съезжает»**: у `BP_TraverseBase` 12 скрытых сегментов `Seg*` оставались с коллизией (`set_collision_settings` на новых компонентах молча не применяется); у балки они лежали в центре актора и блокировали канал Camera, штанга камеры схлопывалась в голову, а столкновение с сегментами ещё и сдвигало капсулу. Теперь `ApplyMaterial` (из `Setup`) принудительно ставит `NoCollision` на все сегменты и `Visual`. Замер: расстояние до камеры 153 см постоянно (раньше 0), капсула неподвижна при качании и стрейфе.\n- **Балка = вытянутый цилиндр** (`BeamMesh` по умолчанию `Cylinder`, `Setup` кладёт его вдоль X актора: pitch 90, масштаб Thick × Thick × длина). У старых экземпляров в уровне значение `BeamMesh` могло остаться `Cube`: поставь `Cylinder` в Details.\n\n- **Якорь капсулы на балке (v4b)**: пока Фишт качается на балке (состояние 2), каждый кадр капсула возвращается в `HangAnchor` (позиция в момент окончания подтягивания), скорость CMC обнуляется (`StopMovementImmediately`), режим `MOVE_None` форсируется; рот удерживается на балке сдвигом меша. Защита от посторонних систем (`BP_LedgeClimb`, `BP_TurnInPlace`, `BP_DogActions` ставят скорость/режим/позицию): раньше капсула могла уплывать, меш компенсировал, камера шла за капсулой, а при прыжке Фишт выскакивал туда, где капсула. Проверено через `Move` (как IA_Move) при виде сбоку: капсула и камера неподвижны.\n\n- **Балка качается как качели (v4c)**: ввод толкает только пока Фишт движется в ту же сторону (или стоит), поэтому удержание кнопки даёт качок и возврат, а повторные нажатия в такт раскачивают дальше. У предела угла (`MaxAngle`) скорость гасится с отскоком (×-0.25), и он не «залипает» наклонённым. Регуляторы: `SwingForce` (сила толчка), `Damping`, `MaxAngle` строки `Beam_Default`.\n\n## Известное\n- Высота отпускания небольшая: `ReleaseUp` расходуется на 0.3 с восстановления; подбери `ReleaseUp`/`BlendOut` по ощущению.\n- `MaxAngle`, `AnimScale` в таблице есть, но логикой пока не читаются. Подсказка «Схватиться» (String Table) не сделана: нужен слой подсказок из `Docs/LOCALIZATION.md`.\n- Не проверено руками: вид позы зацепа и вертикальность тела (за пользователем), отпускание кнопкой геймпада, взаимодействие с `BP_LedgeClimb` рядом с уступами.\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n","date":"2026-10-22"},{"path":"Docs/DECAL_VOLUME.md","title":"BP_DecalVolume: декали","section":"Уровни","md":"# BP_DecalVolume — объём-распределитель декалей\n\nАктор `/Game/Fisht/Tools/BP_DecalVolume`. Растяни бокс на стену/потолок/комнату — актор сам ставит обычные `DecalActor`\nфиксированного размера в см (картинка не растягивается, масштаб объёма на размер декали не влияет).\n\n## Как пользоваться\n1. Перетащи `BP_DecalVolume` в уровень, масштабом (Scale) растяни бокс `Volume` так, чтобы поверхность была внутри.\n2. В Details включи/выключи записи в массиве **Entries** (флаг `bEnabled`). По умолчанию в массиве 62 записи: 8 одиночных\n   (`/Game/Materials/WallDecals/MI_Decal_01..08_*`, включены) и 54 ячейки атласов (`/Game/Materials/Decals/MI_Decal_*`, выключены).\n   У записи: `Material`, `Weight` (вес выбора), `MinSize`/`MaxSize` (сторона квадрата, см).\n3. Поставь галку **GenerateNow** (категория Buttons) — декали появятся, галка сама снимется. **ClearNow** — удалить декали этого объёма.\n   Повторный GenerateNow сначала удаляет прошлые декали этого же объёма (по тегу), дублей нет.\n   Альтернатива: у функций `Generate` / `Clear` в BP можно вручную поставить «Call In Editor» (через MCP этот флаг не ставится) — получатся настоящие кнопки.\n4. Результат — обычные декали (`DecalActor`, тег `DecalVolume` и `DecalVolume:\u003cимя объёма>`, папка Outliner `DecalVolume/\u003cимя>`), правятся руками.\n   Чтобы оставить декали насовсем, удали сам объём (декали останутся) или сними теги.\n\n## Параметры\n| Параметр | Смысл |\n|---|---|\n| `DensityPer10m2` | декалей на 10 м² поверхности (по умолчанию 3.5: одна сторона стены 50×3 м ≈ 52 шт.) |\n| `Seed` | зерно случайности (тот же Seed + то же положение = тот же результат) |\n| `MaxAngleDeg` | макс. угол между нормалью поверхности и направлением луча (по умолчанию 60°); поверхности под бóльшим углом пропускаются |\n| `ProjectionDepth` | глубина проекции декали, см (полная, по умолчанию 12) |\n| `RandomRollDeg` | случайный поворот вокруг нормали ±N° (180 = любой; 0 = «низ» картинки смотрит вниз по поверхности, нужно для потёков) |\n| `TraceWorldStatic/Dynamic/PhysicsBody` | какие типы объектов ловит трасса |\n| `RayAxisX/Y/Z` | по каким осям бокса идут лучи (оба направления каждой оси). Для одной стены оставь только ось поперёк неё |\n\n## Как работает\nЛучи идут вдоль осей бокса через весь бокс (с одной грани на противоположную). Площадь поверхности оценивается по доле попаданий\n(150 пробных лучей на направление), число декалей = плотность × площадь / 10 м². Поверхность с двух сторон (стена внутри бокса)\nполучает декали с обеих сторон. Декаль ориентируется по нормали попадания, «низ» = мировая −Z по поверхности (пол/потолок — случайно).\n\n## Устройство и ловушки\n- Логика в `Tools/DecalVolume/decal_volume.py` (читается из BP командой `py ...exec(open(...));run('gen'|'clear')`), правка скрипта действует сразу.\n- Галки работают через Construction Script, а сам спавн откладывается на тик (из construction script акторы спавнить нельзя).\n- В Python массив `Entries` читается через `export_text()` (имена полей структуры `FS_DecalEntry` с GUID-суффиксом).\n- Только редактор: в PIE/билде кнопок нет. Не запускай при работающем PIE.\n\n## Нормали декалей\nМастера M_Decal_Single и M_Decal_Atlas переведены в DBuffer Color+Normal; нормаль выводится из яркости текстуры (DDX/DDY в экранном пространстве, без нормальных текстур). Параметр материала-инстанса **NormalStrength** (по умолчанию -3; знак меняет выпуклость на вдавленность, 0 = плоско).\r\n\n## Свои наборы\nBP_DecalVolume_Empty - дочерний BP с пустым Entries. Дублируй его в Content Browser, открой Class Defaults, добавь свои записи: новые объёмы этого BP стартуют с твоим набором. Скрипт работает с любым BP, имя класса которого начинается с BP_DecalVolume.\r\n\n## Группы\nМассив **Groups** (категория Decals): строки Name + \bEnabled. У записи в Entries поле Group = имя группы. Запись участвует, если \bEnabled записи включён и её группа включена (пустая группа или группа, которой нет в списке, всегда включена). По умолчанию группы: Singles (вкл), Impacts/Oil/Rust/Scratches/Soot/Streaks (выкл). Свои группы: добавь строку в Groups и впиши то же имя в поле Group нужных записей.\nНормали: параметры инстанса NormalStrength (знак/сила, 0 = плоско) и NormalSpread (шаг выборки высоты в UV, 0.004) - нормаль считается по трём выборкам текстуры, не зависит от разрешения экрана.\r\n\n## Мастера декалей (пересобраны)\nСтарые M_Decal_Atlas / M_Decal_Single нормаль не писали (в моих правках пины текстур подключались под неверным именем 'Coordinates', верное 'UVs'; также старые узлы были мёртвыми). Теперь все 62 MI_Decal_* смотрят на новые мастера **M_Decal_Atlas_N** (Decals) и **M_Decal_Single_N** (WallDecals), построенные скриптом Tools/DecalVolume/build_decal_masters.py (можно перезапустить: пересоберёт с нуля). DBuffer Color+Normal, параметры NormalStrength (-3), NormalSpread (0.004). Затухание по углу (AngleFadeStart/Width) у Single теперь считается из производных мировой позиции (SceneTexture в DBuffer недоступен); у Atlas затухания нет. Старые мастера оставлены в проекте, на них ничего не ссылается.\r\n","date":"2026-10-25"},{"path":"Docs/LEVEL_TRAINING.md","title":"Уровень Training: скрипты и загадки","section":"Уровни","md":"# Уровень Training_01_02\n\nКарта `/Game/Fisht/Levels/Training_01_02` (копия блокинга `Training_01` + плана v11). `Training_01` не трогаем. Скрипты: `Tools/LevelGen/Training_01_02/`, запуск в редакторе: `exec(open(path, encoding='utf-8').read())` через `execute_python_code`.\n\n## ⛔ Каюта Фишта C02 (D1) — не трогать\nРешение пользователя (2026-11-09): каюту Фишта C02 с дверью D1 не менять ни при каких обстоятельствах, её потом перенесут в схрон. Никаких правок геометрии, освещения, декора, механизмов и дверей внутри и на входе. Функция `d1_cabin` в `mech_T.py` (кнопка пользователя → D1_OPEN, `BP_MechDoor` вместо скрытой `SM_Door_Single_8`) остаётся как есть: не расширять её и не добавлять в каюту ничего нового. Удалять её или нет, решает только пользователь.\n\n## Скрипты и порядок\nКаждый скрипт помечает свои акторы тегом и папкой. Перед сборкой он удаляет акторы со своим тегом, поэтому его можно перезапускать.\n\n| Скрипт | Тег / папка | Что делает | Перезапуск |\n|---|---|---|---|\n| `course_T.py` | T00_COURSE | учебный комплекс из 12 станций, пристройка | **нельзя**: пользователь удалил стены пристройки |\n| `dress_T.py` | T01/T02_DRESS | оформление зала T: рамы, свет, трубы, сетки, балки змейки, жилетная станция | можно |\n| `damage_T.py` | T03_DAMAGE | следы катастрофы: панели, мусор, декали, дым, огонь | можно (после dress_T) |\n| `walls_T.py` | T04_LIGHTFIX | материалы стен по ярусам, лампы v11 | можно |\n| `panels_T.py` | T05_PANELS | панели пользователя Wall_02/03 | **нельзя**: старых стен за панелями больше нет |\n| `floor_T.py` | T06_FLOOR | кабель-каналы с решёткой, водостоки | можно |\n| `lights_cap.py` | (без тега) | все PointLight не ярче 15 лм; бэкап `lights_cap_backup.json`, `REVERT` | можно |\n| `mech_T.py` | T08_MECH (+T08_HIDDEN у скрытых заглушек v11) | вся цепочка загадок v11 | можно (`REVERT` возвращает заглушки) |\n| `zone_V.py` | T09_ZONEV (+T09_HIDDEN) | комната V, лестница E2, V8 и ящики возврата, восточный коридор на ките пользователя | можно, после mech_T |\n| `pie_chain_test.py` | — | PIE-прогон всей цепочки, лог `Saved/LevelTraining_chain.txt` | только под замком PIE |\n\nПорядок: dress_T → damage_T → walls_T → floor_T → lights_cap → mech_T → zone_V.\n\n## Цепочка загадок (каналы BP_SignalHub `C_SignalHub`)\n| Узел | Где | Условие → канал |\n|---|---|---|\n| E2 | финиш змейки P3 | кабель в гнездо (E2_CABLE) + кнопка → TRAINER_POWER; поднимается люк G8a, решётку G8b Фишт ломает |\n| D2 / K1 | каюта тренера C15 | кнопка в коридоре (TRAINER_POWER) → D2_OPEN; внутри ключ K1 (`Key_K1`) |\n| R_E2 | низ лестницы возврата | считыватель K1 (K1_RET) + TRAINER_POWER → ворота |\n| D3 | север комнаты V | считыватель K1 (K1_D3) → кнопка → D3_OPEN |\n| V | комната жилета | кнопка под витриной → VEST_ON (заглушка, пока нет надеваемого жилета) |\n| D3b | юг комнаты V | кнопка внутри (VEST_ON) → D3B_OPEN |\n| B_E | стенд P22, сектор E | кабель в гнездо (E_CABLE) + кнопка (VEST_ON) → E_TEST |\n| D4 | гермодверь коридора | TRAINER_POWER + VEST_ON + E_TEST → кнопка → D4_OPEN, три лампы прогресса |\n| F1 → J3 / B_D5 → D5 | прачечная B4 → восточный берег S2 | предохранитель `Fuse_F1` в считыватель (F1_IN) → кнопка → D5_OPEN |\n| E5 → D6 | запад жилого коридора | кабель (E5_CABLE) + кнопка → D6_POWER; кнопка у D6 → D6_OPEN |\n| K2 + E4/J4 → B_W → W1 | каюта C32, S1 | кабель E4 (E4_CABLE) + ключ `Key_K2` (K2_OK) → кнопка → W1_OPEN |\n| D7 | выход | VEST_ON + W1_OPEN → кнопка → D7_OPEN |\n\nКлючи и предохранитель пока сделаны через `BP_Key_Test` с нужным `ItemId`. Кнопки стоят на корпусах `OverrideButtonStation` пользователя, кнопка `BP_Prop_Button_01` на лицевой стороне. Считыватели стоят на таких же корпусах с жёлтой полосой. Створки дверей — `HeavyBulkheadDoor_Leaf`.\n\n## Ловушки\n- Фокус E (`BP_InteractionFocus`) ведёт сферу R40 от камеры. Любой блокирующий меш рядом с кнопкой перехватывает луч, и кнопка не нажимается. Поэтому у корпусов станций, плит витрины и заглушек v11 (P16_Cabinet) коллизия выключена или они скрыты.\n- Нельзя перезаписывать теги актора Blueprint. Ключ и концы кабеля держат `Item.Carryable`/`Item.Key`/`Item.Wire`, без них E их не берёт.\n- Кит коридора `Corridor_01_test_01` смоделирован в метрах, ставить с масштабом 100.\n- Восточная стена зала севернее Y 34,8 м удалена пользователем, коридор отделяют только панели. Стены кита в коридоре заданы явными участками.\n\n## Ещё не сделано\n- Надеваемый жилет вместо кнопки VEST_ON; станции лечения (сейчас стоит куб-заготовка `BP_HealthStation`).\n- Прыжки Фишта (BP), отпускание балки (чат верёвок и балок).\n- Полный пеший прогон ботом по маршруту: тест телепортирует Фишта к каждому устройству.\n","date":"2026-11-09"},{"path":"Docs/FRIEND11.md","title":"Друг-11","section":"Персонажи","md":"# Друг-11 (робот-спутник и тайный антагонист)\n\nВладелец: чат «Друг-11». Поведение (полёт по уровню, диалоги, следование, скрытая угроза) делает чат «ИИ противников и компаньонов» поверх интерфейса ниже.\n\n## Где что лежит\n\n| Что | Путь |\n|---|---|\n| Исходник Tripo (не трогать) | `Blender/Frend11/Frend11_01/Frend11_01.blend` |\n| Рабочая модель, риг, клипы | `Blender/Frend11/Friend11_Form1/Friend11_Form1.blend` |\n| Скрипты сборки (перезапускаемые) | `Blender/Frend11/Friend11_Form1/tools/` |\n| Текстуры (8K цвет, маска светодиодов) | `Blender/Frend11/Friend11_Form1/textures/` |\n| FBX для импорта | `Blender/Frend11/Friend11_Form1/export/` |\n| Меш, скелет, Physics Asset, клипы, MI, ABP первой формы | `/Game/Fisht/Characters/Friend11/Form1/` |\n| Общее для всех форм: `BP_Friend11`, `E_Friend11State`, `M_Friend11`, `S_Friend11Led`, `DT_Friend11_LED`, `FX/NS_Friend11_Cushion` | `/Game/Fisht/Characters/Friend11/Shared/` |\n| Тестовый экземпляр | `Friend11_Test` в `L_JR_Preview` (смотрит на `TestFisht`) |\n\n## Модель и риг\n- Рост 1.3 м, перед модели в Blender = −Y; в UE меш повёрнут в BP на −90°, робот смотрит по +X актора.\n- Кости: `root` → `hover` (парение) → `cushion`, `body` → `neck` (поворот головы) → `head` (кивок) → `eye` (линза объектива), `antenna_tall`, `antenna_short`; служебная `fx_cushion`.\n- Привязка жёсткая: каждая часть 100% на свою кость, линза радиусом 6 см на `eye`.\n- Низ головы и верх корпуса закрыты дисками-заглушками с текстурой резины подушки (иначе видно пустое нутро Tripo).\n- Надписи на текстуре пересобраны: `tools/fix_texture.py` всегда стартует с исходного атласа Tripo; координаты надписей в нём.\n\n## Анимации и ABP (`ABP_Friend11_Form1`)\nКлипы (Blender, `tools/rig_build.py`, 30 к/с): Hover_Idle, Move_Fwd/Back/Left/Right, Talk, Surprise, Alarm, Scan, Dark_Pose, Power_Down, Power_Up.\nМашина состояний по float `State` (номер из `E_Friend11State`) и `Speed`:\nспокоен → Idle/Move; говорит → Talk; обнаружил → Surprise, затем Scan; тревога → Alarm; скрытый → Dark_Pose (ниже над полом); выключен → Power_Down, при выходе Power_Up.\nПоверх: Modify Bone `neck` (рысканье), `head` (кивок), `eye` (кивок линзы).\n\n## Взгляд (BP_Friend11)\n`LookTarget` (актор) → углы к цели относительно актора, плавно (`LookInterpSpeed`).\nРысканье ±`LookYawLimit` (110°) делает шея. Кивок в два этапа: голова в пределах `HeadPitchMin`…`HeadPitchMax` (−12…+15°), остаток до ±`EyePitchLimit` (12°) добирает глаз. Общий предел `LookPitchMin/Max` (−24…+27°). `PitchSign` = −1 (так ось кости совпадает с «вверх»). Нет цели: смотрит на игрока.\n\n## Светодиоды\nМаска `T_Friend11_Form1_LedMask` (RGBA): R глаз, G полосы головы/корпуса/воротника, B подсветка подушки, A огоньки антенн. Генератор: `tools/led_mask.py`.\nМатериал `M_Friend11` (параметры на зону): `\u003cЗона>Color`, `\u003cЗона>Intensity`, `\u003cЗона>PulseRate` (Гц), `\u003cЗона>PulseAmp`; зоны `Eye`, `Strip`, `Cushion`, `Antenna`. Ещё `ChaseAmount/Speed/Spacing` (бегущая волна по полосам), `Glitch` и `GlitchColor` (глаз мгновенно краснеет), `LampGlass` (погашенная лампа выглядит тёмным стеклом).\nСостояния: таблица `DT_Friend11_LED` (строка = имя состояния: Calm, Talk, Detect, Alarm, Hidden, Off). Меняй числа там. BP при смене `CurrentState` перечитывает строку (`RefreshLed`). `GlitchPerMinute` — сколько раз в минуту глаз «мигает красным» (тайная черта, в Calm 0.5).\nЗаполняя таблицу из Python, задавай ВСЕ поля (иначе модальное окно, CLAUDE.md §16).\n\n## Эффект подушки\n`NS_Friend11_Cushion` (компонент `CushionFX` на полу, −72 см от центра капсулы): кольцо радиусом 40 см, пыль расходится наружу и чуть вверх. Марево (преломление воздуха): материал `M_Friend11_HeatHaze` (прозрачный, Refraction = Pixel Normal Offset, нормаль из двух бегущих шумов; параметр `Strength` 0.22 — сила искажения, преломление до 1.08; каждая частица плавно появляется и гаснет по возрасту: sin(π·ParticleRelativeTime)), SpawnRate 10, частицы поднимаются. Запасной мягкий дым: `M_Friend11_Dust` (поставить материалом рендерера). Свечение под подушкой: `CushionGlow` на 12 см над полом, сразу под подушкой (выше — сама подушка отбрасывала бы тень), с тенями (иначе свет проходит сквозь стены), без квадратичного затухания (экспонента 1), радиус 420, SourceRadius 30; сила `GlowScale` 1.\n\n## Как управлять (шпаргалка)\nВыдели робота в уровне → Details, категории «Друг-11»:\n| Категория | Что крутить |\n|---|---|\n| 1 Состояние | `CurrentState` (Calm/Talk/Detect/Alarm/Hidden/Off), `GlitchPerMinute` |\n| 2 Поведение | `bAutoBehavior` (выкл = стоит и ждёт команд), `FollowDistance` (дальше — едет к Фишту, 350), `FollowStop` (где тормозит, 170), `BehaviorMin/Max` (сек между сменами, 4–9), `BehaviorDeck` (веса поведений, ниже) |\n| 3 Взгляд | `LookTarget` (пусто = игрок), пределы шеи/головы/глаза |\n| 4 Голос и звук | `bVoiceEnabled`, `ForceVoiceLanguage` (`ru`/`en`, пусто = язык озвучки игры), `VoiceVolume`, `SfxVolume`, `HoverVolume`, `bShowSubtitles`, `SubtitleTime`, `VoiceCooldown` (мин. пауза между репликами), `VoiceLinesPerGroup`, `FollowVoiceChance` |\n| 5 Движение | `TurnLean` (крен в поворотах) |\n| 6 Реакции | `bReactions`, `EnemyRadius` (12 м), `EnemyTag` (`Enemy`; плюс всегда класс `BP_SecurityRobot`), `ItemTag` (`Friend11.Inspect`: робот смотрит только на то, чему ты дал этот тег в Details → Actor → Tags), `ItemRadius` (4.5 м), `ReactTime` |\n\n**Сканер**: в состоянии Detect (сканирование, осмотр предмета) из глаза идёт голубой луч-конус (`ScanCone`, материал `M_Friend11_ScanBeam`: `BeamColor`, `BeamIntensity`) и узкий прожектор `ScanSpot` (пятно на полу двигается вместе с головой). Луч гаснет к концу (`LocalPosition` конуса), мягко входит в поверхности (`DepthFade`) и каждый кадр, пока виден, укорачивается трассой Visibility до первого препятствия (`BeamLength` 350 см) — сквозь стены не проходит. Материал луча — «сканер» (Custom HLSL `ScanPattern`): яркий контур по краям конуса (`EdgeBoost`), слабое заполнение внутри (`Fill` 0.06), бегущая по кругу продольная линия от глаза до конца с затухающим хвостом (`SweepSpeed`, `SweepWidth` — тоньше при большем), контур пересечения с поверхностями (`ContourBoost`; луч уходит за препятствие на `BeamOvershoot` 30 см, чтобы на полу/стене рисовалось кольцо, а не диск), кольца, бегущие от глаза (`RingCount`, `RingSpeed`), мерцающие огоньки по контуру (шум). Яркость `BeamIntensity` (0.06, `Fill` 0.03, прожектор `ScanSpot` 25) в материале. После выхода из Detect луч держится ещё `BeamHoldTime` (2.5 с, событие `HideBeam`).\n**Все светодиоды в цвет глаза**: `bLedOneColor` (вкл по умолчанию, категория «1 Состояние») — полосы, подушка, антенны и свечение под подушкой берут `EyeColor` строки состояния (яркость и пульсация у каждой зоны свои). Выкл — каждая зона своим цветом из таблицы.\n**Цвет луча = цвет глаза текущего состояния** из `DT_Friend11_LED` (`EyeColor` × `BeamColorBoost` 2.5): спокоен голубой, тревога красный и т.д.; меняй в таблице. Для сценариев (стелс, поиск):\n- `BeamOn` — луч включён в любом состоянии (держится, пока не `BeamOff`); `BeamOff` — выключить (если не Detect).\n- `SetBeamColor(Color)` — задать свой цвет (например жёлтый «ищет», красный «нашёл»); следующая смена состояния вернёт цвет из таблицы, поэтому вызывай после `Set CurrentState`.\n| 7 Эффекты | `GlowScale` (свечение под подушкой = цвет/яркость подушки из `DT_Friend11_LED` × это), `bSparks`, `SparkSpeed` (искры при скорости выше, 180) |\n\n**Реакции** (`React` каждые 0.5 с, пока работает — мозг на паузе): враг ближе `EnemyRadius` → тревога, стоп, «Фишт, назад!», пока враг не уйдёт; новый предмет с `ItemTag` ближе `ItemRadius` → «Обнаружил», сканирует, говорит, через `ReactTime` с возвращается к своим делам (на тот же предмет второй раз не реагирует). Поведение 7 **Lead**: уезжает на 3 м вперёд по взгляду Фишта, «показывает дорогу».\nГолова: шея приподнята на 3 см (Modify Bone `neck`, translation), кивок вниз до −8°, глаз добирает до ±16°.\n\nИз уровня/ИИ (ссылка на робота → вызов события):\n- `Say_Greet`, `Say_Idle`, `Say_Follow`, `Say_Detect`, `Say_Alarm`, `Say_Stare`, `Say_Off` — сказать случайную реплику группы (с субтитром над головой).\n- `Behave_0`…`Behave_6` — сразу включить поведение (с `bAutoBehavior` = выкл держится, пока не сменишь).\n- Записать `CurrentState` — сменятся анимация, светодиоды, звук и (с шансом) реплика.\n\n## Поведение (мозг, `Think` каждые 0.5 с)\nДалеко от цели (`FollowDistance`) → **следует** (с шансом говорит «подожди меня»). Близко → каждые `BehaviorMin…Max` с тянет случайную цифру из `BehaviorDeck`:\n| Цифра | Поведение | Что делает |\n|---|---|---|\n| 0 | Wander | облетает случайную точку в 3.8 м вокруг Фишта |\n| 1 | Orbit | смещается по дуге 75° вокруг Фишта на 2.6 м |\n| 2 | Scan | замирает, «Обнаружил» → сканирует головой |\n| 3 | Chatter | состояние Talk на 3 с, говорит реплику |\n| 4 | Stare | **тайное**: замирает, «скрытый» режим 3 с, зловещая реплика |\n| 5 | Approach | подъезжает вплотную (1.1 м) |\n| 6 | Rest | просто парит и смотрит |\nКолода по умолчанию `0000111222333455666`: сколько раз цифра в строке, столько её вес. Убрать «тайное» — удали `4`; сделать злее — допиши `444`. Колода задаётся на каждом экземпляре.\nЦель для движения — `NavTarget`: Фишт, спроецированный на NavMesh (если пёс на ящике, робот подъедет к краю). Наклоны: BlendSpace `BS_Friend11_Move` (клипы Move_Fwd/Back/Left/Right) по скорости в осях актора плюс крен по скорости поворота.\n\n## Свои фразы без Claude\n1. Открой `Blender/Frend11/Friend11_Form1/tools/voice_lines.json`, добавь группу или строку: `\"Intro\": [[\"Hello, Fisht.\", \"Привет, Фишт.\"], ...]` (en, ru). Сюжетные реплики удобно держать в своих группах (`Intro`, `Train`), каждая строка станет рядом `Intro_1`, `Intro_2`…\n2. Двойной запуск: `powershell -ExecutionPolicy Bypass -File voice_rebuild.ps1` (или `-Only Intro`). Голоса: Windows OneCore **Pavel** (ru, мужской) и **David** (en), `-Pitch 0.85` ниже/выше, `-Rate` скорость. Потом робо-фильтр `sfx_voice.py` вызывается сам.\n3. В редакторе (Output Log → Python): `exec(open(r\"E:/Unreal Projects/FishtTheBattleDog/Blender/Frend11/Friend11_Form1/tools/ue_audio.py\", encoding=\"utf-8\").read()); queue_import()`, через 5 с `setup_assets(); tables()`.\n4. Субтитры: ключ `Sub.Friend11.Intro_1` (en+ru) в `Docs/loc/strings.json`, затем `Docs/loc/sync_tables.py` (ловушки ниже).\n- **OpenAI (голос onyx)**: `voice_rebuild.ps1 -Engine openai [-Only Intro] [-Force]` (по умолчанию). Ключ — переменная окружения `OPENAI_API_KEY` (Windows: «Изменение переменных среды», затем перезапустить консоль). Модель `gpt-4o-mini-tts`, манера речи по группам в `voice_openai.py` (`STYLE`: Alarm быстрее, Stare шёпотом). Уже озвученные строки с тем же текстом не перегенерируются (`voice_raw/openai_done.json`), запросы платные. Бесплатно и офлайн: `-Engine windows`.\n- **Текст над головой**: не виден сквозь стены (проверка прямой видимости от камеры игрока каждые 0.5 с). Глобальный переключатель для меню: `BPFL_Friend11.SetFriend11WorldText(bEnabled)` (сохраняет в слот `Friend11Settings` и сразу применяет ко всем роботам), чтение для галочки в меню — `GetFriend11WorldText`. Каждый робот читает его в BeginPlay в `bShowSubtitles`.\n- Лучше качество: любой внешний TTS (OpenAI `onyx`, ElevenLabs и т.п.) или свой голос — просто положи WAV под именем `sounds/voice/ru/SW_Friend11_V_Intro_1.wav` (фильтр — `sfx_voice.py` над `voice_raw`), импортируй как в п. 3. Ключ OpenAI в системе есть; скрипта под него нет — по просьбе сделаю.\n\n## Сюжетный NPC (первая встреча, инструктаж)\nРекомендация: **один управляющий актор сцены** + готовые команды робота, без отдельных плагинов. Для линейного «встретил → поговорил → провёл → заставил потренироваться» хватает Level Blueprint (или своего `BP_IntroDirector`); Behavior Tree/StateTree нужны, когда логика ветвится. Fab-диалоговые плагины (деревья реплик с выбором) понадобятся, только если у Фишта будут ответы; сейчас это лишнее.\nПодготовка в уровне:\n1. Поставь `BP_Friend11`, в Details: `bAutoBehavior` = выкл (робот слушает только сценарий), `bReactions` = вкл/выкл по вкусу.\n2. Точки маршрута: `Target Point` (Place Actors → Basic), назови `F11_P1`, `F11_P2`… Зоны событий: `Trigger Box` (`F11_Meet`, `F11_Train1`…).\n3. Реплики сцены: группы `Intro`, `Train` в `voice_lines.json` (см. выше).\nКоманды робота (в Level Blueprint: выдели робота → правый клик «Create a Reference», от него тяни пины):\n| Что | Как |\n|---|---|\n| сказать конкретную фразу | `Set ExactRow` = `Intro_1` → вызвать `Speak` |\n| сказать случайную из группы | `Say_Greet`, `Say_Idle`… |\n| ехать в точку | `Get Controller` → `Cast To AIController` → `Move To Location` (Dest = `F11_P1` → Get Actor Location), событие готовности: `AI MoveTo` (узел с выходом On Success) |\n| смотреть на кого-то | `Set LookTarget` |\n| настроение/свет | `Set CurrentState` (Talk пока говорит, Detect = сканирует лучом, Alarm…) |\n| вернуть «свободную» жизнь | `Set bAutoBehavior` = вкл |\nПример сцены «встреча»: `F11_Meet` On Actor Begin Overlap (Other = Фишт) → `Set LookTarget` Фишт → `Set CurrentState` Talk → `ExactRow` Intro_1 → `Speak` → `Delay` 6 → `ExactRow` Intro_2 → `Speak` → `Delay` 5 → `AI MoveTo` `F11_P1` → On Success: `ExactRow` Train_1 (“Прыгни на ящик”) → `Speak` → ждать `F11_Train1` overlap → `Say` похвала → следующий шаг. Каждая реплика длится столько, сколько WAV (`Delay` бери на 0.5 с больше).\nСовет по сюжету: инструктаж лучше разбить на короткие «покажи → сделай → похвала» (2–3 реплики на навык), а тайную сторону (Stare, вспышка глаза) включать редко и только когда Фишт не смотрит прямо — так подозрение копится незаметно.\n\n## Голос и звук\n- Реплики: `tools/voice_lines.json` (28 шт., 7 групп × 4, en/ru) → `voice_tts.ps1` (Windows TTS: Zira/Irina) → `sfx_voice.py` (роботизация; Stare ниже и медленнее) → импорт `ue_audio.py`. Таблица `DT_Friend11_Voice`: строка `\u003cГруппа>_\u003cn>` → `VoiceEn`, `VoiceRu`, `SubtitleKey`. Субтитры в `ST_Subtitles` (`Sub.Friend11.*`, источник `Docs/loc/strings.json`), показ через `WBP_WorldLabel` над головой.\n- Новая реплика: строка в `voice_lines.json` + ключ в `strings.json`, перегенерировать, `ue_audio.tables()`; если в группе стало больше 4 — подними `VoiceLinesPerGroup`. Настоящую озвучку клади поверх с теми же именами `SW_Friend11_V_*`.\n- Звуки (синтез `sfx_gen.py`, заглушки): HoverLoop (гул подушки, высота/громкость от скорости), Servo, Talk, Detect, Alarm, PowerDown, PowerUp, Stare, Glitch. Таблица `DT_Friend11_StateAudio`: состояние → `EnterSound`, `VoiceGroup`, `VoiceChance`. Затухание `ATT_Friend11` (2.5 м полная громкость, до 25 м).\n\n## Интерфейс для ИИ\n- `CurrentState` (E_Friend11State) — состояние: анимация + светодиоды + звук переключаются сами.\n- `LookTarget` (Actor) — на кого смотреть и за кем следовать; пусто = игрок.\n- `bAutoBehavior` = выкл — встроенный мозг молчит, ИИ водит робота сам (AIController `MoveToLocation`, `Behave_N`, `Say_*`).\n- Перемещение: обычный Character (Walking, NavMesh). Парение даёт анимация (+15 см), капсула стоит на полу.\n\n## Вторая форма (огромный страшный робот)\nОтдельный меш со своим скелетом в `/Friend11/Form2/` (свой ABP с теми же переменными `State/Speed/NeckRotation/LookRotation/EyeRotation`), материал — экземпляр `M_Friend11` со своими текстурами и маской. Дочерний BP от `BP_Friend11` меняет меш и Anim Class; в графе Tick приведение идёт к `ABP_Friend11_Form1` — для второй формы вынести установку переменных ABP в интерфейс (TODO при её появлении).\n\n## Ловушки\n- AnimBP не пересоздавать с тем же именем в живом редакторе (CLAUDE.md §16).\n- Правила-сравнения VibeUE только для float — поэтому `State` в ABP float.\n- В окне редактора меш с ABP может не рисоваться до первого PIE; в игре всё видно.\n- Новые компоненты BP (звук, субтитр, луч) пусты на уже поставленных экземплярах (у `ScanCone` нет меша и материала → `BeamMID` = None): экземпляр удалить и поставить заново. Копии материала луча теперь создаются с явным `SourceMaterial`.\n- `Docs/loc/sync_tables.py` вернул False для части таблиц, пока ассеты `ST_*` не были загружены: перед ним `load_asset` таблиц, после — `save_asset(..., only_if_is_dirty=False)`.\n- `SelectObject` отдаёт `UObject`, пин `SetSound` его не принимает: ветка и два `SetSound`. `MoveToActor` к цели вне NavMesh молча не едет: проецируй цель (`K2_ProjectPointToNavigation`, пин `QueryExtent`).\n","date":"2026-11-02"},{"path":"Docs/FUR_GUIDE.md","title":"Как поправить шерсть Фишта","section":"Персонажи","md":"# Как поправить шерсть Фишта самому\n\nШерсть мастер-пса (`Groom`) делает не руками, а скриптом: `Tools/JRMaster/fur_gen_jr.py` (Blender) строит пряди по мешу и сохраняет их в Alembic (`.abc`), а Unreal импортирует их как Groom. Поэтому есть три уровня правки: от простого к сложному.\n\n## Уровень 1. Цвет и внешний вид без Blender (5 минут, безопасно)\nВ Unreal открой материал и поменяй параметры, пересборка шерсти не нужна:\n- `Content/Fisht/Characters/Master/Materials/MI_Fisht_Fur` (рыжая шерсть) и `MI_Fisht_FurSaddle` (чёрный чепрак): цвет `FurColor`. Параметры родителя `M_Fisht_Fur` (можно переопределить в MI): `RootDark` (тёмный корень), `TipLight` (светлый кончик), `RootGradientPow`, `SeedVariation` (разброс между прядями). Блеск задан константой Roughness в `M_Fisht_Fur`.\n- Рот, нос, окрас кожи: `M_Fisht_Coat` (параметры `TanColor`, `BlackColor`, `MouthTint`, `NoseColor`) и маска `T_JR_MouthMask` (язык, дёсны, зубы берут цвет из текстуры JR, нос тёмный). Если сквозь шерсть просвечивают светлые пятна кожи, приблизь `TanColor` к цвету шерсти. Внимание: `M_Fisht_Coat` целиком пересобирается скриптом `Tools/JRMaster/build_coat_material.py` (ручные правки графа при пересборке пропадут, значения по умолчанию меняй в скрипте); маску делает `Tools/JRMaster/mouth_mask_jr.py`.\n- Толщину и прозрачность прядей можно менять в самом ассете Groom (двойной клик на `GR_FishtJR_Fur`): `Hair Width`, `Root Scale`, `Tip Scale`.\n**Ловушка:** если у материала шерсти пропал родитель, шерсть станет белой. Родитель должен быть `M_Fisht_Fur` (материал типа Hair).\n\n## Уровень 2. Форма бороды, усов, бровей, густота (Blender, 10–15 минут)\n1. Открой `Tools/JRMaster/fur_gen_jr.py` в любом редакторе. В начале блок «ПАРАМЕТРЫ ШЕРСТИ» с комментариями по-русски (1 см в скрипте = 1,4 см в игре). Самые полезные ручки:\n   - **Длина:** `BEARD_LEN_CHEEK`, `BEARD_LEN_CHIN` (борода), `MUSTACHE_LEN` (усы), `BROW_LEN` (брови), `BODY_LEN`, `LEG_LEN`, `FACE_LEN`.\n   - **Где начинается борода:** `BEARD_X0` (линия «угол рта → подбородок», за ней бороды нет), `BEARD_STEP` (ширина «ступеньки»: меньше = резче).\n   - **Густота:** `BEARD_DENS`, `BROW_DENS`, `FACE_DENS`.\n   - **Усы:** `MUSTACHE_ANGLE` (85 = поперёк морды), `MUSTACHE_DOWN` и `MUSTACHE_DROP` (наклон и дуга вниз).\n   - **Брови:** `BROW_Z` (высота над глазом), `BROW_ZMIN` (с какой высоты растут), `BROW_UP` (торчат вверх), `BROW_R` (размер), `BROW_OUT` (внешний край к уху), `BROW_LEN`, `BROW_DENS`.\n   - **Завитки:** `CURL_R_BEARD` (радиус витка, 0 = прямые), `CURL_TURNS_BEARD` (число витков), `CLUMP_CELL_BEARD` (размер локона), `CLUMP_PULL_BEARD` (насколько пряди сходятся к оси), `FRIZZ` (лохматость).\n   - **Края и провисание:** `HEM_WAVE`, `BEARD_DROP`, `LEN_JITTER_BEARD`.\n   - **Глаза:** `EYE_ROOT_PAD`, `EYE_CUT_PAD`, `LID_LEN`, `LID_ZONE` (шерсть не растёт в яблоках, пряди, входящие в глаз, укорачиваются; большие отступы дают лысое кольцо вокруг глаза).\n2. Сгенерировать (в PowerShell, из корня проекта):\n```powershell\n& \"C:\\Program Files\\Blender Foundation\\Blender 5.1\\blender.exe\" -b \"Ref/Models/JR_export/SKM_Fisht_JR.blend\" --python Tools/JRMaster/fur_gen_jr.py -- Saved/FurGen\n```\n3. Быстро посмотреть форму без Unreal (картинки `prev_head_*.png` в `Saved/FurGen`):\n```powershell\n& \"C:\\Program Files\\Blender Foundation\\Blender 5.1\\blender.exe\" -b \"Saved/FurGen/SKM_Fisht_JR_fur.blend\" --python Tools/JRMaster/fur_preview.py -- Saved/FurGen\n```\n4. Если форма нравится, скопируй `GR_FishtJR_Fur.abc` и `GR_FishtJR_Saddle.abc` из `Saved/FurGen` в `Ref/Models/JR_export/` и импортируй в Unreal скриптами (через редактор Python): `Tools/JRMaster/ue_import_groom.py` (сначала `NAME=GR_FishtJR_Fur`, затем `NAME=GR_FishtJR_Saddle`) и обязательно `Tools/JRMaster/ue_groom_bind.py` (привязка к скелету).\n5. Кадры для проверки: в PIE на `L_JR_Preview` сразу после старта запусти `Tools/JRMaster/pie_fur_qa.py` (параметр `TAG=...`): камеры `QA_Cam_*`, мягкий свет, автосидение отключается только в PIE. Снимки появятся в `Saved/Screenshots/WindowsEditor/`.\n\n## Ловушки (проверено, ломают редактор или шерсть)\n- Alembic из Blender: импорт с поворотом (90, 0, 0) и масштабом (1, -1, 1), данные не зеркалить, корневые UV не экспортировать, иначе шерсть «взрывается» или пропадает.\n- `GroomBindingAsset.build()` из Python привязку на месте не пересобирает (пряди сходятся в точку): нужна новая привязка с новым номером (`ue_groom_bind.py` это делает).\n- Импорт очень маленького Groom (около 50 прядей) роняет редактор: пробы делай от нескольких тысяч прядей.\n- Старые `.abc` перезаписываются при каждой генерации и в git их нет: перед экспериментом сохрани копию (или тег ниже).\n- Нагрузка: около 260 тысяч прядей даёт примерно 50 FPS в простое на тестовой сцене; чем больше `BEARD_DENS`/`FACE_DENS`, тем тяжелее.\n\n## Откат и точки сохранения (git)\n- Принятая шерсть: тег `beard-final` (контент и скрипты). Промежуточные: `beard-v16`, `beard-v17-wip`.\n- Вернуть версию (редактор закрыт): `git checkout beard-final -- Content/Fisht/Characters/Master/Groom Content/Fisht/Characters/Master/Materials Content/Fisht/Characters/Master/Textures/T_JR_MouthMask.uasset Content/Fisht/Characters/Fisht/Blueprint/BP_FishtCharacter.uasset Tools/JRMaster/fur_gen_jr.py`. BP нужен обязательно: в нём ссылки на привязки, а их номер (`GB_FishtJR_*_1` / `_2`) меняется при каждой пересборке.\n- Блокнот параметров: `Docs/JR_MASTER_NOTES.md`, раздел «Как менять бороду, усы и брови».\n- Фото-заметка (2026-10-17): «лысое» веко/надбровье чинится не густотой, а ручками `LIDDOME_*`, `LIDSIDE_Y`, `BROWFUR_*`, `CLUMP_PULL_FACE` (см. JR_MASTER_NOTES, итерация «брови, веки, усы»). Превью запускай с абсолютными путями (иначе картинки уходят в `C:\\Saved`).\r\n- Ручки формы (2026-10-17): клин бороды `BEARD_TAPER`/`BEARD_TAPER_POW`; усы `MUSTACHE_LEN` 2.1, `MUSTACHE_ARC` (дуга первых 30%), `MUSTACHE_FLAT`, `MUSTACHE_FALL_W`/`_POW`, `MUSTACHE_VERT` (с этой доли строго вниз); брови `BROW_*` + `CURL_R_BROW`. Принятая версия: тег `beard-v3`.\r\n","date":"2026-10-17"},{"path":"Docs/LOCALIZATION.md","title":"Локализация и подсказки ввода","section":"Тексты и звук","md":"# Локализация и подсказки ввода — правило для всех чатов\n\nЧат-автор: «Локализация и подсказки ввода» (2026-10-20). Родной язык исходников: `en`; переводы: `ru`. Тексты игрока — `FText` из String Table, а не строки в графах. Исключение: отладочное Tab-меню (`BP_Debug*Provider`, `WBP_EngMenu`) остаётся строками.\n\n## Три языка независимы друг от друга\n| Что | Как хранится | Как получить |\n|---|---|---|\n| Интерфейс, подсказки, задания, предметы | язык движка (`SetCurrentLanguage`), пишется в `GameUserSettings.ini` | `BPFL_Loc.GetUILanguage` |\n| Субтитры | asset group `Subtitles` (тоже в `GameUserSettings.ini`) | `BPFL_Loc.GetSubtitleLanguage`, текст `BPFL_Loc.GetSubtitle(Key)` |\n| Озвучка | asset group `Voice` (классы `DialogueWave`, `SoundWave` в `DefaultGame.ini`) | `BPFL_Loc.GetVoiceLanguage` |\n\nМенять: `BPFL_Loc.SetLanguages(UI, Subtitles, Voice)` (строки `\"en\"`/`\"ru\"`, сохраняет в конфиг). Старта-восстановления кодом не нужно: движок читает конфиг сам.\nПосле смены языка тексты, уже записанные в виджет (`SetText` из `Conv_StringToText`), не обновляются: вызови у HUD `RefreshAll` (меню — пересоздай виджет).\n\n## Как добавить новый текст\n1. В `Docs/loc/strings.json` добавь ключ в нужную таблицу, обе строки: `{\"en\": \"...\", \"ru\": \"...\"}`.\n   Таблицы: `ST_UI` (меню, HUD), `ST_Hints` (подписи действий, `Interact.*`), `ST_Missions` (`Obj.*`), `ST_Items` (предметы), `ST_Keys` (подписи кнопок), `ST_Subtitles` (реплики).\n   Ключи вида `Раздел.Имя`; подстановки `{Name}` (заменяй через `Replace`).\n2. В редакторе выполни `Docs/loc/sync_tables.py` (через `execute_python_code`: `exec(open(...).read())`) — обновит ассеты `/Game/Fisht/Localization/ST_*`.\n3. В PowerShell `Tools\\loc_update.ps1` (≈2–3 мин, закрывать редактор не нужно): gather → `Content/Localization/Game/ru/Game.po` → `.locres`. Закоммить `Docs/loc`, `Content/Localization`, `Content/Fisht/Localization`.\n4. В графе: `BPFL_Loc.GetUI/GetHint/GetMission/GetItem(Key)` → `FText`. Для `string`-пинов — `To String (Text)`. В Details-панели виджета: `LOCTABLE(\"/Game/Fisht/Localization/ST_UI.ST_UI\", \"Menu.Exit\")` (через `WidgetService.set_property(..., \"Text\", ...)`). Переменная `FText` в CDO: `set_editor_property(\"Имя\", unreal.TextLibrary.text_from_string_table(table, key))`.\n\nНикогда не пиши в тексте «E», «ЛКМ», «Shift» — это подсказка по действию (ниже).\n\n## Подсказки ввода («[E] ВЗАИМОДЕЙСТВИЕ»)\nХранится действие `IA_*`, кнопку подставляет слой в `BPFL_InputGlyphs` (читает реальные привязки Enhanced Input, `QueryKeysMappedToAction`):\n- `GetKeyLabel(Action: IA_*, Device: byte, Style: string) → FText` — подпись кнопки. `Device`: 0 клавиатура/мышь, 1 геймпад. `Style`: `\"\"` Xbox, `\".PS\"` PlayStation (подписи Cross/Circle…).\n- `GetPromptText(Action, Device, Style, HintKey) → FText` — готовая «[кнопка] Подпись действия», подпись из `ST_Hints` (`Act.*`).\n- Старое `GetGlyphText(E_InputAction, E_InputDevice)` оставлено и теперь тоже берёт реальные привязки.\n- Подписи нестандартных кнопок (Shift, ЛКМ, геймпад) лежат в `ST_Keys` по имени `FKey` (нет строки — берётся имя из движка). Добавить кнопку: ключ в `ST_Keys` + строка в цепочке `GetKeyLabel` (список `rows` в истории коммита `Localization step 3`).\n- `Device` берёт у себя виджет (`WBP_HUD.Device`, `WBP_InteractionPrompt.Device`); автопереключение по последнему вводу — задача «Геймплея» (`SetDevice` из `BP_FishtCharacter`).\n- Раскладка: подписи берутся от `FKey`, а Windows присылает код клавиши по VK, поэтому при русской раскладке привязки и подписи остаются «E», «Q» (проверено по списку привязок; AZERTY/Dvorak не проверялись — буква берётся по VK, а не по физическому положению).\n\n## Реплики и озвучка\n- Субтитры: `ST_Subtitles` → две таблицы `ST_Subtitles_en/ru` (создаёт `sync_tables.py`; в gather не входят). Ключ `Sub.\u003cСцена>.\u003cИмя>`; показ `BPFL_Loc.GetSubtitle(Key)`.\n- Озвучка: файлы кладутся в `Content/L10N/\u003cculture>/…` с тем же относительным путём, что и базовый ассет (`DialogueWave` или `SoundWave`); движок выбирает по asset group `Voice`. Озвучки пока нет — структура папок `Content/L10N/en`, `Content/L10N/ru`.\n\n## Ловушки (найдено при сборке)\n- В редакторе перевод Game-таблиц не виден, пока не включено `Localization.ForceLoadGameLocalizationInEditor 1` (консоль) и язык не переключён `en` → `ru`. В игре (packaged/standalone) нужно только `CulturesToStage` (прописано).\n- `BlueprintFunctionLibrary` создавай `BlueprintFunctionLibraryFactory` (обычный `BlueprintFactory` показывает модальное «Cannot create a blueprint…» и вешает MCP). `GameInstanceSubsystem` через Blueprint не создаётся.\n- Настройки языка хранятся в asset groups, поэтому SaveGame и подсистемы не нужны. Локальные переменные функций через `build_graph variable_set` не получают пинов.\n- Перед PIE-тестом `BlueprintService` слеп: ассеты правь только при остановленном PIE.\n- Вызов `GetKeyLabel` из Python: параметр Device — `byte` (int), enum-класс у пользовательских enum из Python недоступен.\n- Диалог «Схема Blueprint ошибка компиляции» перед PIE: `BP_CharTestRoom` не компилируется (TextRender vs WidgetComponent, не мой ассет).\n\n## Перенесено / не перенесено (2026-10-20)\nПеренесено: `WBP_HUD` (подсказки клавиш, чутьё, спутники, «OBJECTIVE:», «MISSION COMPLETE»), `WBP_MainMenu`, `BP_MissionManager` (задачи), `BP_Door`, `BP_InteractionButton`, `BP_HealthStation`.\nНе перенесено: подсказки переноски и `BP_FishtCharacter`/`BP_CarryHolder`/`BP_KeyLock` (ждём чат «Переноска»); тестовые подписи пропсов (`BP_TestLabelComponent`, `BP_CharTestRoom`, `BP_Test_*`, `BP_DamagePad`, `BP_ShowcaseLabel`); `WBP_InteractionPrompt` (вызывающий код); экран выбора языка; автоопределение геймпада (PS/Xbox) и устройства по последнему вводу.\n","date":"2026-11-07"},{"path":"Docs/ENGINEERING_MENU_SPEC.md","title":"Инженерное меню (Tab)","section":"Отладка","md":"# Инженерное меню: спецификация\n\nЦель пользователя: быстро менять параметры в игре и **подключать будущие скилы и фишки без новой работы над меню**. Меню создаётся только в разработческих сборках.\n\n## Принципы\n1. **Меню не знает про конкретные системы.** Оно строится динамически из списков параметров, которые отдают сами системы (интерфейс). Новый скилл появляется в меню, как только реализует интерфейс и попадает в список.\n2. **Добавить параметр = одна строка в описании параметров системы**, без правок виджетов.\n3. **Только dev-сборки:** в Shipping/Distribution меню не создаётся.\n4. Все числа и изменённые значения можно **выгрузить в формате строк таблицы** (в лог и буфер обмена), чтобы пользователь перенёс удачные значения в `DT_*` вручную (во время игры таблицы данных не записываются).\n5. Подписи и описания по-русски, понятно пользователю.\n\n## Архитектура (Blueprint)\nПапка `/Game/Fisht/Gameplay/Debug/`:\n- `BPI_DebugTunable` (интерфейс): `GetTunables() -> Array\u003cS_Tunable>`, `SetTunable(Id, Value)`, `InvokeAction(Id)`.\n- `S_Tunable`: `Id`, `Category`, `Label`, `Description`, `Type (E_TunableType: Float, Int, Bool, Enum, Action)`, `Min`, `Max`, `Step`, `Value`, `EnumOptions`.\n- `BP_DebugMenuComponent` (на `PlayerController` или персонаже): открывает/закрывает меню, собирает провайдеров (все компоненты и акторы с интерфейсом: `VitalsComponent`, `AbilityManagerComponent`, `CatchRules`, `RespawnManager`, `GearComponent`, станции, платформы и т.д.), следит за регистрацией новых.\n- `WBP_EngMenu` + `WBP_Tunable_Float/Bool/Enum/Action`: вкладки по `Category`, элементы создаются из `S_Tunable` (слайдер, флажок, выпадающий список, кнопка).\n- `BPI_DebugTunable` реализуют существующие системы по очереди (минимально: добавить функции, логику не трогать).\n\n## Встроенные вкладки (по готовности)\n1. **Персонаж:** здоровье и выносливость (текущее/максимум), уровень (`SetLevel`), бессмертие, бесконечная выносливость, убить/вылечить.\n2. **Способности:** список из `AbilityManager` (уровень способности `SetAbilityLevel`, включена/выключена, обнулить перезарядку, множитель стоимости выносливости).\n3. **Враги и поимка:** `CatchModeOverride`, множитель урона роботов, показать/скрыть зоны зрения.\n4. **Разрушаемые и опасности:** множитель урона рывка, включить/выключить мусор, создать тестовый пропс (лёгкая решётка, тяжёлая решётка, ящик: данные в самих Blueprint, таблицы DT_Breakables больше нет) перед персонажем.\n5. **Мир:** телепорт к чекпоинтам и комнатам, замедление времени, полёт/«призрак», сброс уровня.\n6. **Снаряжение и скины:** выбрать любой `DA_GearItem` и надеть/снять (позже скины).\n7. **Отладка:** фпс/статистика, коллизия, навигация, перезагрузка HUD.\n8. **Квесты** (когда появится система): выдать, завершить, сбросить квест.\n9. **Пресеты:** сохранить/загрузить набор значений (`SG_DebugPresets`) и **«выгрузить в таблицу»** (строки для `DT_*`).\n\n## Ввод и доступ\nОткрытие: `Tab` (с 2026-11-07; раньше F1, но F1…F7 в редакторе Unreal переключают режимы вьюпорта) и комбинация на геймпаде (L3+R3). Клавиша ловится узлом `Debug Key Tab` в `BP_DebugMenuInput` (не IA/IMC: так же, как геймпадные узлы там же). `~` занят консолью движка. При открытии режим ввода «игра и UI», по флагу — пауза. Читы помечаются, чтобы не попадали в релиз (Shipping отключает меню целиком).\n\n## Этапы\n- **M1:** каркас (интерфейс, структуры, компонент, виджет с динамическими вкладками) + вкладка «Персонаж».\n- **M2:** «Способности», «Враги», «Разрушаемые и опасности».\n- **M3:** «Мир» (телепорты, время, полёт).\n- **M4:** «Снаряжение», «Отладка».\n- **M5:** пресеты и экспорт в таблицы.\nКритерий каждого этапа: компиляция, PIE-проверка (данные), коммит, короткая шпаргалка в этом файле.\n\n## Как подключить новый скилл к меню (шпаргалка)\nПути: интерфейс `Gameplay/Debug/BPI_DebugTunable`, UI в `UI/Debug`. Значения всегда `float` (Bool: 0/1, Int: целое, Action: игнорируется).\n1. В блюпринте скилла/системы: Class Settings → Interfaces → добавить `BPI_DebugTunable` (из `Gameplay/Debug`, не `...Legacy`).\n2. `GetTunables`: очистить массив-кэш, на каждый параметр один `Add` структуры `S_Tunable` (`Id`, `Category` = имя вкладки, `Label`, `Description`, `Type`, `Min/Max/Step`, `Value` = текущее). Вернуть массив.\n3. События `SetTunable(Id, Value)` и `InvokeAction(Id)`: по `Id` записать значение в переменную или вызвать функцию.\n4. Меню само найдёт компонент персонажа или актор с интерфейсом при открытии (компоненты `BP_FishtCharacter` и все акторы уровня). Менять виджеты не нужно.\nЕсли систему править нельзя, делай адаптер-компонент рядом (пример: `BP_DebugCharacterProvider` для `VitalsComponent`; добавляется на персонажа в `BP_DebugMenuComponent.BeginPlay`). Скрипты сборки адаптеров: `Tools/DebugMenu/` (`provider_lib.py`: `build_get_tunables(P, specs)`).\n\n## Запись значений в таблицы и компоненты (2026-10-15)\nКнопка «Записать в таблицы» (Tab, только редактор/PIE) выполняет `py Tools/Tunables/apply_tunables.py`: читает живые значения меню, по реестру `Tools/Tunables/registry*.json` пишет их в `DT_*` (бэкап в `Saved/Backups`, проверка, автооткат) и в дефолты компонентов (`BP_JumpTuning`, `BP_CameraTuning`, `BP_PoseComponent`, `BP_LedgeClimb`…: класс и шаблон на `BP_FishtCharacter`; пишутся только отличающиеся значения, после выхода из PIE). Отчёт «старое → новое»: поле внизу меню, `Saved/Tunables/last_apply.txt`, лог. Экспорт значений: `Saved/Tunables/export_\u003cвремя>.json`; применить сохранённый экспорт: `py \".../apply_tunables.py\" \u003cфайл>`.\nМеню: поиск (по названию, Id, вкладке), ввод числа в поле справа от ползунка, подсветка изменённых (жёлтая строка), «Сбросить вкладку/всё» (к значениям на момент первого открытия), «Изменения (diff)», «Умножить найденные» (фильтр по тексту + множитель).\n**Как добавить параметр в реестр записи (5 строк):**\n1. Параметр уже есть в провайдере (`dict(id=..., value=(\"obj\", var, member, Class_C))`): запусти `gen_registry.py` (exec в редакторе), параметр компонента попадёт в `registry_auto.json` сам.\n2. Если значение живёт в `DT_*`: добавь запись в `Tools/Tunables/registry.json`: `\"Id\": {\"type\":\"float\",\"target\":{\"kind\":\"dt\",\"table\":\"/Game/.../DT_X\",\"row\":\"Dash_{DashLevel}\",\"col\":\"Колонка\"}}` (`{Id}` в строке подставляет значение другого параметра, например уровень).\n3. Если значение только в таблице (актёры читают её при старте): добавь таблицу, строки и колонки в `TABLES` в `Tools/DebugMenu/build_tables_provider.py` и запусти `build_tables_provider()`: провайдер и `registry_tables.json` создаются сами.\n4. Руками правятся только `registry.json` и спецификации провайдеров; не писать в таблицу всю строку: скрипт берёт полный экспорт таблицы и меняет одну ячейку.\n5. Проверка: меню → изменить значение → «Записать в таблицы» → отчёт в поле внизу.\nЛовушки: во время PIE `EditorAssetLibrary`/`BlueprintService` слепы, поэтому таблицы грузятся `unreal.load_object` и сохраняются `EditorLoadingAndSavingUtils.save_packages`; `create_asset` с уже существующим именем открывает модальное окно (закрывать `SendKeys {ENTER}`).\n\n## Статус (2026-10-07: M1–M5 готовы, проверено в PIE данными; вид и мышь за пользователем)\n- Вкладки: Персонаж, Способности («Высота прыжка (множитель)» = `BP_JumpTuning.JumpHeightMultiplier` на персонаже, по умолчанию 1.5; Dash: уровень, цена, урон, обнулить перезарядку; двойного прыжка в игре нет), Враги и поимка (`CatchModeOverride`), Мир (время, полёт, призрак, телепорт к `BP_Checkpoint`, возрождение, перезагрузка уровня), Разрушаемые и опасности (создать тестовый пропс по строке `DT_Breakables`; `BP_DestructionManager` появляется во вкладке после первой поломки), Снаряжение (надеть любой `DA_Gear_*` из списка `ITEMS`), Отладка (консольные переключатели).\n- Нижняя панель: «Сохранить/Загрузить пресет» (слот `DebugPreset1`, `SG_DebugPresets`; уровни применяются раньше значений) и «Выгрузить в таблицу» (строки `Категория,Id,Значение` в лог и в поле внизу меню, копировать Ctrl+C: узла записи в буфер в Blueprint нет).\n- Адаптеры собирает `Tools/DebugMenu/` (`make_provider.py`, `build_*_provider.py`); список адаптеров и их подключение к персонажу: `build_menu_begin.py` (`ADAPTERS`). Добавить адаптер: написать `build_\u003cимя>_provider.py`, добавить класс в `ADAPTERS`, запустить `build_menu_begin()`.\n- Не сделано (нет логики в системах): множитель урона роботов, зоны зрения роботов, перезагрузка HUD, квесты. Для «Квестов» достаточно реализовать `BPI_DebugTunable` в системе квестов.\n- Ловушки: Slider.SetValue/CheckBox.SetIsChecked/ComboBox.SetSelectedIndex вызывают событие изменения: строки защищены флагом `bBusy` (иначе эхо `SetLevel` каждые 0.25 с сбрасывало здоровье). Пока PIE запущен, `BlueprintService` не видит ассеты. Перед `Export`/`SavePreset` значения обновляются `RefreshEntries`.\n- M1: готов (каркас + вкладка «Персонаж»). Проверено в PIE: меню открывается, 7 параметров, `SetTunable`/`InvokeAction` меняют `VitalsComponent`.\n- Ловушки: структуре после `rename_asset` остаётся тип `FS_Tunable` (в `add_member_variable` писать так); у self-вызова в `build_graph` класс задаётся полным путём `/Game/.../BP_X.BP_X_C`; интерфейсные функции без выходов становятся событиями (`override_function`); нельзя создавать `BlueprintFunctionLibrary` через factory из Python (зависание).\n\n## Вид меню (2026-11-07)\nМеню открывается боковой панелью справа (около 40% ширины, фон полупрозрачный, игра видна слева; область слева не перехватывает мышь). Структура WBP_EngMenu: Backdrop(прозрачный корень) > Col > Split [SplitSpacer 0.60 | Panel 0.40 > PanelCol > Title, SearchBox, Body(TabList 0.30 + ItemList 0.70), Hint, FootWrap (кнопки пресетов, сброса, diff, записи), Footer2 (множитель), ExportBox]. Имена виджетов-переменных не менялись, графы не затронуты.\n","date":"2026-11-10"},{"path":"Docs/F1_PARAMS.md","title":"Параметры Tab: пёс","section":"Отладка","md":"# Параметры Tab (инженерное меню): пёс\r\n\r\nФайл генерируется `Tools/DebugMenu/gen_f1_params_doc.py` из `build_pose_provider.py`. Под названием каждого пункта в меню серым показано то же описание.\r\nВкладки: **Мир** (присед), **Покой**, **Повороты**, **Управление**, **Занос при остановке**, **Занос при развороте**, **Поза заноса**, **Подкат**. Идентификаторы (колонка Id) менять нельзя: на них завязаны `Tools/Tunables/registry*.json` и пресеты.\r\nЗначения по умолчанию взяты из описаний (поле «По умолчанию»). Параметры способности Скольжение (цена, перезарядка, длина `Distance`, длительность `Duration`, руление, множитель прыжка) тоже во вкладке **Подкат** (id `SlideCost`, `SlideCooldownSec`, `SlideDistance` = длина на бегу, `SlideDuration`, `SlideSteer`, `SlideJumpMul`; хранятся в `DT_AbilityLevels`, строка `Slide_1`, колонки StaminaCost / Cooldown / Distance / Duration / InputWindow / JumpZMultiplier).\r\n\r\n## Мир\r\n\r\n| Id | Параметр | Что делает | Диапазон | Шаг | Где влияет |\r\n|---|---|---|---|---|---|\r\n| `CrouchSpeed` | Присед: скорость хода, см/с | Скорость, с которой пёс идёт в приседе (MaxWalkSpeed). По умолчанию 90. | 30…200 | 5 | BP_PoseComponent |\r\n| `CrouchHH` | Присед: полувысота капсулы, см | Насколько низкой становится капсула в приседе (13–15). Верх капсулы = 2·HH + 2.15 см над полом. Действует со следующего приседа. По умолчанию 14. | 10…19 | 0.5 | BP_PoseComponent |\r\n| `DropCrouch` | Присед: просадка корпуса под балкой, см | На сколько корпус опускается при проходе под низким потолком (максимум при полном «пригибе» головы). Больше = ниже пролезает. | 0…12 | 0.5 | BP_PoseComponent |\r\n| `HeadTopCrouch` | Присед: высота макушки для пригиба, см | Потолок ниже этой высоты начинает пригибать голову; выше неё пёс не пригибается. | 30…55 | 1 | BP_PoseComponent |\r\n| `DuckRngCrouch` | Присед: плавность пригиба, см | Зона, на которой голова постепенно опускается к потолку. Меньше = голова опускается резче. | 3…20 | 0.5 | BP_PoseComponent |\r\n| `FootTraceCrouch` | Присед: высота старта трассы лап, см | Откуда лапы ищут землю. Ниже = лапы не цепляют низкий потолок. | 4…25 | 1 | BP_PoseComponent |\r\n\r\n## Управление\r\n\r\n| Id | Параметр | Что делает | Диапазон | Шаг | Где влияет |\r\n|---|---|---|---|---|---|\r\n| `RunToggle` | Бег: переключатель (1) или удержание (0) | 1 = клавиша бега включает и выключает бег нажатием (выключается сама, когда пёс останавливается); 0 = бег, пока клавиша зажата. Позже эта же настройка появится в игровом меню. По умолчанию 1. | 0…1 | 1 |  |\r\n| `StrafeMode` | Взгляд по камере (боковой/задний ход): режим | 0 = выкл (пёс всегда поворачивается по движению); 1 = пока зажата правая кнопка мыши или левый триггер (тело следует за камерой, боковой и задний ход с анимациями Walk/Trot/Run L/R/B); 2 = всегда. По умолчанию 1. | 0…2 | 1 |  |\r\n| `TurnRateRun` | Поворот на ходу: скорость корпуса на бегу, °/с | Насколько быстро корпус разворачивается по движению на максимальной скорости (на малой скорости плавно растёт до обычных 360). Меньше = плавнее и шире дуга, но пёс дольше разворачивается. По умолчанию 200. | 60…720 | 10 |  |\r\n| `RotRate` | Взгляд по камере: скорость поворота корпуса, °/с | Как быстро тело догоняет камеру в режиме «взгляд по камере». По умолчанию 540. | 90…1080 | 30 |  |\r\n| `HideDist` | Камера: прятать пса, если камера ближе, см | Когда камера (из-за стены или потолка) оказывается ближе этого расстояния до пса, сам пёс скрывается, чтобы камера не показывала внутренности меша. 0 = никогда. По умолчанию 60. | 0…150 | 5 |  |\r\n| `GuardOn` | Камера: скрытие пса в тесноте, 1 вкл 0 выкл | Выключатель скрытия пса при слишком близкой камере. По умолчанию 1. | 0…1 | 1 |  |\r\n\r\n## Покой\r\n\r\n| Id | Параметр | Что делает | Диапазон | Шаг | Где влияет |\r\n|---|---|---|---|---|---|\r\n| `AutoRestOn` | Сидеть и ложиться самому: 1 вкл, 0 выкл | 0 = простаивающий пёс сам не садится, не ложится и не засыпает. По умолчанию 1. | 0…1 | 1 | BP_PoseComponent |\r\n| `AutoSitSec` | Через сколько простоя сядет, с | Время без ввода, после которого пёс сам садится. По умолчанию 10. | 2…120 | 1 | BP_PoseComponent |\r\n| `AutoLieSec` | Через сколько сидения ляжет, с | Сколько пёс сидит, прежде чем лечь. По умолчанию 25. | 2…300 | 1 | BP_PoseComponent |\r\n| `AutoSleepSec` | Через сколько лежания уснёт, с | Сколько пёс лежит, прежде чем заснуть. По умолчанию 60. | 5…600 | 5 | BP_PoseComponent |\r\n\r\n## Повороты\r\n\r\n| Id | Параметр | Что делает | Диапазон | Шаг | Где влияет |\r\n|---|---|---|---|---|---|\r\n| `Th45` | Малый поворот на месте: от угла, ° | Угол между телом и направлением ввода, с которого стоящий пёс делает шаг-поворот (Turn_L/R, ≈45°). Меньше = поворачивается на месте чаще; 180 и выше = выключено. По умолчанию 35. | 20…180 | 1 | BP_TurnInPlace |\r\n| `Th90` | Поворот на месте на 90°: от угла, ° | С какого угла стоя включается поворот на 90° (Turn_90). Держи выше порога малого поворота. По умолчанию 75. | 50…170 | 1 | BP_TurnInPlace |\r\n| `Th180` | Разворот на месте на 180°: от угла, ° | С какого угла стоящий пёс разворачивается кругом (Turn_180). По умолчанию 150. | 100…180 | 1 | BP_TurnInPlace |\r\n| `StillSpeed` | Скорость «стоит», см/с | Пока скорость ниже этой, пёс считается стоящим и поворот ввода даёт поворот на месте, а не поворот на ходу. По умолчанию 15. | 0…60 | 1 | BP_TurnInPlace |\r\n| `StepOn` | Шаги при повороте на ходу: 1 вкл 0 выкл | Когда пёс идёт медленно и поворачивает корпус (камера), лапы получают шаговый цикл вместо скольжения по полу. По умолчанию 1. | 0…1 | 1 |  |\r\n| `StepFloor` | Шаги при повороте: скорость цикла, см/с | До какой «скорости ног» поднимается шаговый цикл при быстром повороте (скорость тела от этого не меняется). Больше = чаще перебирает лапами. По умолчанию 60. | 0…150 | 5 |  |\r\n| `StepRate` | Шаги при повороте: полная сила от, °/с | Скорость поворота корпуса, с которой шаговый цикл включается полностью; ниже растёт плавно. Меньше = шаги включаются от лёгкого поворота. По умолчанию 120. | 30…360 | 10 |  |\r\n| `StepMax` | Шаги при повороте: до какой скорости, см/с | Выше этой скорости хода обычный бег/ходьба уже сами перебирают лапами, шаговый цикл не нужен. По умолчанию 160. | 40…250 | 10 |  |\r\n\r\n## Занос при остановке\r\n\r\n| Id | Параметр | Что делает | Диапазон | Шаг | Где влияет |\r\n|---|---|---|---|---|---|\r\n| `RelSkOn` | Занос при остановке: 1 вкл 0 выкл | Если на беге отпустить клавишу движения, пёс не тормозит мгновенно, а скользит в позе заноса. Если в это время нажать обратное направление, он развернётся. По умолчанию 1. | 0…1 | 1 |  |\r\n| `RelSkMin` | Занос при остановке: от скорости, см/с | Занос включается, только если до отпускания скорость была не ниже этой (бег 322, рысь 242). По умолчанию 150. | 50…330 | 10 |  |\r\n| `RelSkDelay` | Занос при остановке: задержка, с | Сколько времени клавиша дол

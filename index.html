<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта проекта — Fisht the Battle Dog</title>
<style>
:root{--bg:#12151a;--card:#1c2128;--line:#2d343d;--tx:#e8ecf1;--mut:#8b96a4;--idea:#8b96a4;--wip:#e5a63b;--built:#4aa3e8;--ver:#46c26b;--ask:#e8603c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:80px}
header{padding:14px 16px 4px}
h1{margin:0;font-size:20px}
.sub{color:var(--mut);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0c0e12;border-top:1px solid var(--line);z-index:5}
nav{overflow-x:auto}
nav a{flex:1 0 60px;text-align:center;padding:8px 1px;color:var(--mut);text-decoration:none;font-size:10.5px;white-space:nowrap}
nav a b{display:block;font-size:19px;font-weight:400}
.hs{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin:6px 0}
.hc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
.hc>summary{padding:12px;cursor:pointer;font-size:16px;list-style:none}
.hc>summary::-webkit-details-marker{display:none}
.hc>summary:after{content:"▾";float:right;color:var(--mut)}
.hc[open]>summary:after{content:"▴"}
.hb{padding:0 12px 12px;font-size:15px}
.hb h5{margin:12px 0 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.hb ol,.hb ul{margin:0;padding-left:22px}.hb li{margin:5px 0}
.hb .res{background:#16301f;border-radius:8px;padding:8px 10px}
.hb .trap{color:#f0b9a8}
.hd{font-size:12px;color:var(--mut);margin-top:10px}
.hd a,.md a,.lk{color:#7db8f0;cursor:pointer;text-decoration:underline}
.dl{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;color:var(--tx);cursor:pointer}
.dl small{color:var(--mut);display:block;font-size:12px}
.md{font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.md h1{font-size:21px}.md h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:22px}.md h3{font-size:16px}.md h4{font-size:15px}
.md code{background:#0c0e12;border-radius:4px;padding:1px 5px;font-size:13px;font-family:ui-monospace,Consolas,monospace}
.md pre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}.md pre code{padding:0;background:none}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:13px}.md td,.md th{border:1px solid var(--line);padding:5px 8px;vertical-align:top}.md th{background:var(--card)}
.md blockquote{border-left:3px solid var(--line);margin:8px 0;padding-left:12px;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;margin:4px 6px 4px 0}
.btn.pri{background:var(--built);color:#000;border-color:var(--built);font-weight:600}
.btn:disabled{opacity:.5}
.ed{width:100%;min-height:55vh;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0c0e12;color:var(--tx);font:16px/1.5 system-ui,sans-serif;resize:vertical}
.ans{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.ans .ok{display:inline-block;background:#16301f;color:#8fe0a8;border-radius:6px;padding:1px 8px;font-size:12px}
.ans textarea{width:100%;min-height:80px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0c0e12;color:var(--tx);font:16px/1.4 system-ui,sans-serif}
.ans summary{cursor:pointer;color:#7db8f0}
.msg{margin:8px 0;padding:8px 10px;border-radius:8px;font-size:14px;background:#2a2412;color:#f0d9a0}.msg.bad{background:#34171a;color:#f0b9b9}.msg.good{background:#16301f;color:#a8e8bf}
.tk{margin-top:22px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.tk input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0c0e12;color:var(--tx);font-size:16px;margin:6px 0}
.tk ol{padding-left:20px}.tk li{margin:4px 0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.kc{--rc:#8b96a4;position:relative;aspect-ratio:2/3;border-radius:14px;border:3px solid var(--rc);overflow:hidden;background:#0c0e12;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 0 12px -4px var(--rc)}
.kc .im{flex:1 1 50%;min-height:0;background:linear-gradient(160deg,#252d38,#10141a);display:flex;align-items:center;justify-content:center;font-size:54px;position:relative;overflow:hidden}
.kc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kc .ty{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.65);border-radius:6px;padding:1px 7px;font-size:11px}
.kc .gm{position:absolute;top:5px;right:5px;background:rgba(70,194,107,.9);color:#000;border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700}
.kc .bd{padding:6px 8px 8px;flex:0 0 auto}
.kc .nm{font-weight:700;font-size:14px;line-height:1.15;margin-bottom:4px}
.sb2{display:flex;align-items:center;gap:5px;font-size:11px;margin:2px 0;color:var(--mut)}
.sb2 span.l{flex:0 0 38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb2 .tr{flex:1;height:6px;border-radius:3px;background:#2a323c;overflow:hidden}.sb2 .tr i{display:block;height:100%;background:var(--rc);border-radius:3px}
.sb2 b{color:var(--tx);font-weight:600;min-width:2.2em;text-align:right}
.kfull{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:10px 12px 90px}
.kfull .in{max-width:520px;margin:0 auto}
.kfull .kc{aspect-ratio:auto;cursor:default}.kfull .kc .im{flex:none;aspect-ratio:2/3;font-size:90px}
.kfull .sb2{font-size:14px;margin:5px 0}.kfull .nm{font-size:22px}
.kfull h5{margin:14px 0 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kfull ul{margin:0;padding-left:20px}
.gal{display:flex;gap:6px;flex-wrap:wrap}.gal img{width:90px;height:90px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)}
.snd{display:block;margin:6px 0}.snd audio{width:100%}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.cmp>div{background:var(--card);border-radius:8px;padding:8px}
.cmp .df{color:#f0b9a8}
.fld{display:block;margin:10px 0 3px;font-size:13px;color:var(--mut)}
.fi{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0c0e12;color:var(--tx);font-size:16px;font-family:inherit}
.strow{display:grid;grid-template-columns:3fr 2fr 2fr 2fr auto;gap:4px;margin:4px 0}.strow .fi{padding:8px 6px;font-size:14px;min-width:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.thumbs .t{position:relative}.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.thumbs .x{position:absolute;top:-6px;right:-6px;background:#c33;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;cursor:pointer;font-size:14px}
.back{display:inline-block;margin:6px 0 10px;padding:7px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--tx);cursor:pointer;font-size:14px}
nav a.on{color:var(--tx);background:var(--card)}
nav a{position:relative}
nav .n{position:absolute;top:2px;right:4px;background:var(--ask);color:#fff;border-radius:9px;padding:0 5px;font-size:10px}
main{padding:8px 12px;max-width:900px;margin:0 auto}
section{display:none}section.on{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg)}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ask);border-radius:10px;padding:11px 12px;margin:8px 0}
.item.q{border-left-color:var(--wip)}
.item .t{font-size:16px}
.item .m{color:var(--mut);font-size:12px;margin-top:4px}
.tag{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-right:6px;background:var(--ask);color:#fff}
.item.q .tag{background:var(--wip);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sys{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:hidden}
.sys img{width:100%;border-radius:8px;margin-bottom:8px}
.sys h3{margin:0 0 6px;font-size:17px}
.st{display:inline-block;font-weight:700;font-size:15px;padding:4px 10px;border-radius:8px;color:#000}
.st.idea{background:var(--idea)}.st.wip{background:var(--wip)}.st.built{background:var(--built)}.st.verified{background:var(--ver)}
.bar{display:flex;gap:3px;margin:8px 0}.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.bar i.f.idea{background:var(--idea)}.bar i.f.wip{background:var(--wip)}.bar i.f.built{background:var(--built)}.bar i.f.verified{background:var(--ver)}
.sys p{margin:6px 0 0;font-size:14px}
.sys .m{color:var(--mut);font-size:12px;margin-top:6px}
.dec{display:flex;gap:10px;margin:0 0 12px}
.dec .d{flex:0 0 74px;color:var(--mut);font-size:12px;padding-top:2px}
.dec .b{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dec .r{color:var(--mut);font-size:13px;margin-top:5px}
.dec .r s{color:#c98}
.plan{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--mut)}
.leg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;font-size:12px;color:var(--mut)}
.wc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0}
.wc h4{margin:0 0 5px;font-size:16px}.wc p{margin:0;font-size:14px}
.wc .m{color:var(--mut);font-size:12px;margin-top:6px}
.wc .sb{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-left:6px;background:var(--line);color:var(--tx);vertical-align:middle;font-weight:400}
.wc.gap{border-left:5px solid var(--ask)}.wc.gap.missing{border-left-color:var(--wip)}
.wh{margin:14px 2px 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--mut);padding:20px;text-align:center}
</style>
</head>
<body>

</main>

<script>
const D={"waiting":[{"id":"w-muzzle","system":"combat","kind":"verdict","text":"Положение дула турели","added":"2026-11-06","ref":"Docs/VEST.md"},{"id":"w-vest-lamps","system":"training","kind":"verdict","text":"Лампы в комнате испытания жилета","added":"2026-11-06","ref":"Docs/LEVEL_TRAINING.md"},{"id":"w-floors","system":"training","kind":"verdict","text":"Полы из Floor\\Training в редакторе","added":"2026-11-06","ref":"Docs/LEVEL_TRAINING.md"},{"id":"w-mech-look","system":"mechanisms","kind":"verdict","text":"Вид кнопок и дверей по состояниям","added":"2026-11-06","ref":"Docs/MECHANISMS.md"},{"id":"w-jetpack-energy","system":"combat","kind":"question","text":"Джетпак: какая энергия и как тратится","added":"2026-11-04","ref":"Docs/COMBAT_PLAN.md"},{"id":"w-bite-button","system":"combat","kind":"question","text":"Постоянная кнопка укуса (пока F / крестовина вправо)","added":"2026-11-04","ref":"Docs/COMBAT_PLAN.md"},{"id":"w-dpad","system":"ui","kind":"question","text":"Что повесить на крестовину и стрелки (меню быстрого выбора)","added":"2026-11-04","ref":"Docs/COMBAT_PLAN.md"},{"id":"w-ship","system":"world","kind":"question","text":"Мир: станция МИР-11 или корабль «Звёздная Помощь»?","added":"2026-11-06","ref":"вкладка «Мир» → Пробелы"},{"id":"w-cause","system":"world","kind":"question","text":"Почему роботы напали: безумие или война ИИ?","added":"2026-11-06","ref":"вкладка «Мир» → Пробелы"},{"id":"w-mir11","system":"world","kind":"question","text":"Появится ли МИР-11 в игре и в каком виде?","added":"2026-11-06","ref":"вкладка «Мир» → Пробелы"},{"id":"w-timeline","system":"world","kind":"question","text":"Training идёт до катастрофы или во время?","added":"2026-11-06","ref":"вкладка «Мир» → Пробелы"},{"id":"w-weapons-why","system":"world","kind":"question","text":"Зачем собаке-спасателю оружие в сюжете?","added":"2026-11-06","ref":"вкладка «Мир» → Пробелы"},{"id":"w-death-plastic","system":"vest","kind":"question","text":"Что с пластиком, который Фишт несёт, когда погибает: остаётся на месте гибели, остаётся с ним, или выбор зависит от уровня/ситуации (вагонетка) и от чекпоинта? Нужна настройка «политика потери пластика» на уровень.","added":"2026-11-09","ref":"Docs/PROGRESSION_PLAN.md"},{"id":"w-death-respawn","system":"vest","kind":"question","text":"Что происходит после гибели Фишта: возрождение на чекпоинте (предварительно да). Как устроены чекпоинты и что сохраняется (статы, экипировка, пластик)?","added":"2026-11-09","ref":"Docs/PROGRESSION_PLAN.md"},{"id":"w-md01-rotor","system":"enemies","kind":"question","text":"Дрон MD-01: после отстрела двигателя что именно остаётся на корпусе: кольцо-кожух вокруг двигателя (часть корпуса) или крутящиеся лопасти? Если лопасти, пришлите скриншот или видео и где это было.","added":"2026-11-09","ref":"Docs/ENEMY_ROADMAP.md"},{"id":"w-recoil-numbers","system":"combat","kind":"verdict","text":"Отдача пулемёта после обнуления EmitterSide и новых чисел (сила 300, предел 12 см): сейчас заметна? Слишком сильно или мало? Подстройка: RecoilStrength и MaxRecoil у BP_LaserTurret","added":"2026-11-10","ref":"Docs/VEST.md"},{"id":"w-aimassist-1","system":"combat","kind":"verdict","text":"Помощь прицеливания, этап 1: Tab → Бой, уровни 1–4 на геймпаде и мыши. Ощутимо ли прилипание, не слишком ли тянет? Без вашей проверки второй этап (магнит пули, доводка при прицеливании) не начинаем","added":"2026-11-10","ref":"Docs/COMBAT_PLAN.md"},{"id":"w-mercury","system":"combat","kind":"verdict","text":"Пластик как капли ртути: зеркальность и оттенок, сила дыхания и парения (MI_Plastic_Combat / MI_Plastic_Upgrade)","added":"2026-11-10","ref":"Docs/COMBAT_PLAN.md"},{"id":"w-right-pouch","system":"combat","kind":"verdict","text":"Ракеты и гранаты выходят из правого подсумка; при выстреле камера не должна проваливаться (исправлена блокировка канала камеры снарядом)","added":"2026-11-10","ref":"Docs/COMBAT_PLAN.md"},{"id":"w-crosshair-ammo","system":"combat","kind":"verdict","text":"Цвет прицела по патронам: белый, оранжевый при ≤30% магазина, красный при пустом. Порог и цвета можно поменять","added":"2026-11-10","ref":"Docs/COMBAT_PLAN.md"},{"id":"w-sniff-timer","system":"vest","kind":"question","text":"Нюх: сейчас это просто переключатель без таймера. Делаем его способностью с длительностью и перезарядкой, чтобы бонус брони разведчика (+2/+4/+6 с, характеристика SniffDuration) что-то менял? Или бонус брони должен означать другое (дальность или время жизни линии следа)?","added":"2026-11-10","ref":"Docs/VEST.md"},{"id":"w-gear-verdict","system":"vest","kind":"verdict","text":"Снаряжение в игре: подсумки и пулемёт на сокетах жилета (смена жилета на тяжёлый и разведчика, снятие жилета), Tab → Снаряжение → кнопки «показать характеристики» (класс и статы), старт с полным комплектом. Всё работает и выглядит нормально?","added":"2026-11-10","ref":"Docs/VEST.md"},{"id":"w-gear-docs-check","system":"vest","kind":"verdict","text":"Инструкции GEAR_ADD_ARMOR.md и GEAR_ADD_WEAPON.md (вкладка Инструкции → Снаряжение и оружие) написаны по знанию интерфейса, не проверены. Когда будете добавлять свою броню, отметьте шаги, которые не совпали с реальными окнами Unreal и Blender (напишите в ответе, поправим)","added":"2026-11-10","ref":"Docs/GEAR_ADD_ARMOR.md"},{"id":"w-gear-models","system":"vest","kind":"question","text":"Тяжёлый жилет VestHeavy1-3 временно на модели Vest01; лёгкий и тяжёлый пулемёт без своих моделей, урона и звука (одна модель и один DA_Ammo_LMG на все три). Когда подставите свои модели и параметры (поле GunMesh, DA_Ammo)?","added":"2026-11-10","ref":"Docs/GEAR_ADD_WEAPON.md"},{"id":"w-tab-text","system":"ui","kind":"question","text":"Меню Tab не умеет выводить текст (только числа, да/нет, списки и кнопки), поэтому характеристики деталей показываются кнопкой «показать характеристики» на экране. Добавить в меню тип «Текст» (отдельная работа чата меню) или оставить как есть?","added":"2026-11-10","ref":"Docs/VEST.md"},{"id":"w-diegetics","system":"vest","kind":"question","text":"Запускать чат «Диегетика» (шкалы заполнения на левом подсумке, соплах и пушке; патроны и пластик видны на самом Фиште)? Или позже, после прохождения Training?","added":"2026-11-10","ref":"Docs/PROGRESSION_PLAN.md"},{"id":"w-commit-files","system":"perf","kind":"question","text":"В проекте около 478 не закоммиченных файлов (внешние акторы уровней, материалы стен и пола, Blender, новые пропсы). Что из этого коммитить: всё по группам или показать список сначала?","added":"2026-11-10"}],"systems":[{"id":"combat","name":"Бой","icon":"💥","status":"built","check":"не проверено глазами","note":"Пулемёт и второй слот, перекрестие, захват цели, пластик, эффекты","doc":"Docs/COMBAT_PLAN.md"},{"id":"enemies","name":"Враги","icon":"🤖","status":"wip","check":"не проверено глазами","note":"Дроны, стадии тревоги, манеры боя, разрушение. Дальше: свои модели, скелетные роботы","doc":"Docs/ENEMY_ROADMAP.md"},{"id":"vest","name":"Жилет и экипировка","icon":"🦺","status":"wip","check":"посадка не проверена","note":"Жилет, пояс, сопла, подсумки, лазерная пушка. Деталь + скин","doc":"Docs/VEST.md"},{"id":"progress","name":"Прокачка","icon":"📈","status":"idea","check":"утверждено, не начато","note":"Навыки экипировки за улучшающий пластик, схрон. После уровня Training","doc":"Docs/PROGRESSION_PLAN.md"},{"id":"mechanisms","name":"Механизмы","icon":"🔌","status":"built","check":"вид не проверен","note":"Кнопки, двери, ключ-карты, провода, сигналы","doc":"Docs/MECHANISMS.md"},{"id":"interaction","name":"Взаимодействие","icon":"🖐","status":"built","check":"не проверено","note":"Фокус по E, переноска предметов","doc":"Docs/INTERACTION.md"},{"id":"training","name":"Уровень Training","icon":"🏗","status":"wip","check":"полный прогон ботом не сделан","note":"Цепочка загадок собрана; нет надеваемого жилета, станций лечения","doc":"Docs/LEVEL_TRAINING.md"},{"id":"friend11","name":"Друг-11","icon":"🛸","status":"wip","check":"не проверено","note":"Летающий друг со скелетом","doc":"Docs/FRIEND11.md"},{"id":"anim","name":"Анимация","icon":"🐕","status":"wip","check":"не проверено глазами","note":"Мастер-пёс JR, прыжки, уступы; ждёт паки клипов лестницы","doc":"Docs/plan/anim.md"},{"id":"camera","name":"Камера","icon":"🎥","status":"wip","check":"не проверено","note":"Правая кнопка только приближает; открыто: пила на лестнице","doc":"Docs/plan/gameplay.md"},{"id":"ui","name":"Интерфейс","icon":"🖥","status":"wip","check":"геймпад не проверен","note":"HUD, подсказки, глифы, главное меню","doc":"Docs/plan/ui.md"},{"id":"localization","name":"Локализация","icon":"🌐","status":"wip","check":"не проверено","note":"Тексты через String Table, подсказки по устройству","doc":"Docs/LOCALIZATION.md"},{"id":"physics","name":"Физика и поверхности","icon":"🧱","status":"wip","check":"не проверено","note":"Шаги, следы; ждёт звуковые ассеты","doc":"Docs/SURFACES_HOWTO.md"},{"id":"props","name":"Пропсы","icon":"📦","status":"built","check":"светодиоды не проверены","note":"Blender → игра одной командой, разрушаемые","doc":"Docs/PROPS_PIPELINE.md"},{"id":"ropes","name":"Верёвки и балки","icon":"🪢","status":"wip","check":"не проверено","note":"Раскачивание, переноска","doc":"Docs/ROPE_BEAM.md"},{"id":"world","name":"Сюжет и мир","icon":"📖","status":"idea","check":"есть черновик сценария, много пробелов","note":"Завязка и два ИИ есть, финал и роли не придуманы; см. вкладку «Мир»","doc":"Ref/Сценарий.docx"},{"id":"perf","name":"Производительность","icon":"⏱","status":"idea","check":"замер устарел","note":"Нужен новый замер на мастер-псе","doc":"Docs/plan/qa.md"}],"decisions":[{"date":"2026-11-06","system":"progress","title":"Навыки — это навыки экипировки, покупаются улучшающим пластиком","replaced":"личные навыки Фишта","doc":"Docs/PROGRESSION_PLAN.md"},{"date":"2026-11-06","system":"progress","title":"Экипировка меняется в схроне","replaced":"смена в любой момент (F1 — только для отладки)","doc":"Docs/PROGRESSION_PLAN.md"},{"date":"2026-11-06","system":"vest","title":"Форма от детали, украшение от скина; скин не даёт статов","replaced":"цвет и материал внутри детали","doc":"Docs/PROGRESSION_PLAN.md"},{"date":"2026-11-06","system":"combat","title":"Двойной прыжок заменён джетпаком: второе нажатие в воздухе включает его","replaced":"двойной прыжок (оставлен выключенным, MaxAirJumps = 0)","doc":"PLAN.md §6"},{"date":"2026-11-04","system":"combat","title":"Рокет-джамп заменён джетпаком (увеличенный прыжок за энергию)","replaced":"рокет-джамп (взрыв под Фиштом)","doc":"Docs/COMBAT_PLAN.md"},{"date":"2026-11-04","system":"combat","title":"Правая кнопка только приближает камеру; тело к прицелу не доворачивается","replaced":"режим прицеливания с разворотом тела (StrafeMode)","doc":"Docs/COMBAT_PLAN.md"},{"date":"2026-11-04","system":"combat","title":"Электроника стала двумя видами пластика: боевой (боеприпасы) и улучшающий (улучшения)","replaced":"один ресурс «электроника»","doc":"Docs/COMBAT_PLAN.md"},{"date":"2026-11-04","system":"combat","title":"Укус не боевой; атаку заменяет рывок-удар с разбега","replaced":"укус как атака","doc":"Docs/COMBAT_PLAN.md"},{"date":"2026-11-04","system":"combat","title":"Оружие встроено в жилет, модульность через боеприпасы, а не стволы","replaced":"сменные стволы","doc":"Docs/COMBAT_PLAN.md"},{"date":"2026-11-09","system":"vest","title":"Броня каждого жилета своя, отдельных слотов брони нет; броня даёт процент защиты и не изнашивается, без отдельного здоровья корпуса; медицинская даёт и порог, и скорость регенерации","replaced":"4 слота брони, здоровье корпуса брони","doc":"Docs/PROGRESSION_PLAN.md"},{"date":"2026-11-09","system":"world","title":"Порода Фишта по сценарию: вельштерьер (модель пока джек-рассел)","replaced":"","doc":"Docs/PROGRESSION_PLAN.md"},{"date":"2026-11-09","system":"vest","title":"Каждая деталь снаряжения даёт статы по 3 уровням; тяжёлые детали платят шумом и штрафом ускорения","replaced":"","doc":"Docs/PROGRESSION_PLAN.md"},{"date":"2026-11-10","system":"combat","title":"Двойной прыжок убран из игры полностью; джетпак работает только при надетом поясе","replaced":"двойной прыжок (был выключен, MaxAirJumps = 0, но компонент и меню оставались)","doc":"Docs/VEST.md"}],"atlas":[],"world":{"story":[{"id":"st-premise","title":"Завязка (черновик сценария)","text":"2126 год. Орбитальная станция МИР-11: огромный медицинский комплекс с роботизированными платформами. Рядом новый модуль тренировки служебных собак для дальних космических миссий (сопровождение и спасение людей). Фишт, лучший из отобранных на Земле, прошёл подготовку и готов лететь на Марс, но события прерывают миссию.","src":"Ref/Сценарий.docx","state":"черновик"},{"id":"st-ai","title":"Конфликт двух ИИ","text":"Друг-11: не друг и не враг, хочет спасти человечество, уничтожив всех, кто разрабатывает ИИ, и все базы с ИИ (против деградации, потери работы, перенаселения). МИР-11: разрабатывает медустановки и спасает остаток людей на базе. Цели не раскрываются по ходу, финал «совсем не очевиден».","src":"Ref/Сценарий.docx","state":"черновик"},{"id":"st-art","title":"Мир в арт-направлении","text":"Космическая станция-корабль «Звёздная Помощь» (миротворческая, с медицинским и спасательным уклоном). Медицинские и транспортные роботы сошли с ума и напали на экипаж. Фишт — боевой пёс на борту.","src":"ART_DIRECTION.md","state":"черновик"},{"id":"st-mvp","title":"MVP-уровень Сектор 7","text":"Старт → коридор → след запаха → запертая дверь → вентиляция → пульт → кнопка → дверь. Есть робот-охранник, техник-компаньон, чекпоинты. По ТЗ без боя: обойти, переждать, спрятаться.","src":"ТЗ_MVP.md; PLAYTEST.md","state":"есть"},{"id":"st-training","title":"Уровень Training: тренировочная база","text":"Зал со змейкой, каюта Фишта (C02), каюта тренера (C15), комната жилета (V), прачечная, жилой коридор, выход. Загадки: кабели, ключи K1/K2, предохранитель, гермодверь D4. Есть слой «следы катастрофы»: панели, мусор, дым, огонь.","src":"Docs/LEVEL_TRAINING.md","state":"собрано"},{"id":"st-friend","title":"Друг-11 как сюжетный ход","text":"Встречает Фишта, ведёт себя как робот-помощник и консультант, ведёт инструктаж. Скрытая черта: иногда «замирает», глаз вспыхивает красным, звучат зловещие реплики. Позже возможна вторая форма: огромный страшный робот.","src":"Docs/FRIEND11.md; Docs/starters/friend11.md","state":"есть"}],"characters":[{"id":"ch-fisht","title":"Фишт","text":"Боевой пёс. Лучший кандидат на программу. В игре: джек-рассел на мастер-скелете JR, жилет с оружием и джетпаком.","src":"Ref/Сценарий.docx; Docs/JR_MASTER_NOTES.md","state":"есть"},{"id":"ch-f11","title":"Друг-11","text":"Робот-консультант на воздушной подушке, рост 1,3 м, глаз-линза, антенны. Состояния: спокоен, говорит, обнаружил, тревога, скрытый, выключен. В сценарии также ИИ дата-центра.","src":"Docs/FRIEND11.md; Ref/Сценарий.docx","state":"есть"},{"id":"ch-mir","title":"МИР-11","text":"Второй ИИ, оппонент Друга-11. Только в сценарии: ни модели, ни голоса, ни роли в уровнях.","src":"Ref/Сценарий.docx","state":"нет"},{"id":"ch-robots","title":"Враждебные роботы","text":"Белые корпуса с красными «глазами»: медицинские и грузовые (по 8 концептов). В игре: охранный робот, дроны (MD-01 и др.), робот на подушке.","src":"ART_DIRECTION.md; Docs/ENEMY_ROADMAP.md","state":"есть"},{"id":"ch-humans","title":"Люди: техник, инженер, тренер","text":"Техник (MVP) и инженер (песочница) подбираются как компаньоны; в Training есть каюта тренера и «питание тренера». Кто они и живы ли, нигде не описано.","src":"PLAN.md; Docs/plan/levels.md; Docs/LEVEL_TRAINING.md","state":"заглушка"}],"dialogues":[{"id":"dl-lines","title":"Реплики Друга-11","text":"28 реплик, 7 групп по 4, ru и en: Greet, Idle, Follow, Detect, Alarm, Stare, Off. Тайные (Stare): «Скоро.», «Ты мне доверяешь, Фишт?», «Всё идёт по плану.», «Так и должно быть.»","src":"Blender/Frend11/Friend11_Form1/tools/voice_lines.json","state":"заглушка"},{"id":"dl-scene","title":"Схема сцены знакомства","text":"Встретил → поговорил → провёл → заставил потренироваться. По 2–3 реплики на навык: покажи, сделай, похвала. Тайную сторону включать редко и когда Фишт не смотрит.","src":"Docs/FRIEND11.md","state":"черновик"},{"id":"dl-loc","title":"Языки и субтитры","text":"Интерфейс, субтитры и озвучка переключаются независимо (ru/en). Субтитры в таблице ST_Subtitles; реплики показываются над головой робота.","src":"Docs/LOCALIZATION.md","state":"есть"},{"id":"dl-quests","title":"Задания","text":"Явные задания в интерфейсе и неявные (локальные головоломки). Простые: принести ключ, части механизма, соединить провода. Отдельной системы квестов нет.","src":"Ref/Референс разнообразных находок.txt","state":"идея"}],"sound":[{"id":"sn-voice","title":"Озвучка","text":"Сейчас синтезированный голос с робо-фильтром (Windows TTS). Настоящих записей нет; структура папок под озвучку (en/ru) готова. Есть вариант платного синтеза.","src":"Docs/FRIEND11.md; Docs/LOCALIZATION.md","state":"заглушка"},{"id":"sn-sfx","title":"Звуки","text":"Друг-11, выстрелы, взрывы, шаги по поверхностям: все синтезированные заглушки. Затухание настроено, настоящие ассеты ждут.","src":"Docs/FRIEND11.md; Docs/COMBAT_PLAN.md; Docs/ENEMY_ROADMAP.md","state":"заглушка"},{"id":"sn-music","title":"Музыка и атмосфера","text":"В документах не упоминается.","src":"—","state":"нет"}],"style":[{"id":"sy-look","title":"Материалы и цвета","text":"Бело-серый потёртый металл, чёрные узлы и резина, синие и янтарные световые полосы, синий медкрест, красно-белые предупреждающие полосы. Надписи кириллицей.","src":"ART_DIRECTION.md","state":"есть"},{"id":"sy-training","title":"Training: референс уровня","text":"Бежево-серые панели с красными полосами, оранжевые светодиоды, эстакады с канатом и мостиками, интерактивные пропсы в одном стиле.","src":"Docs/starters/level_training.md","state":"есть"},{"id":"sy-enemy","title":"Враги и насилие","text":"Враги: те же белые корпуса, красные сенсоры. Насилие только над роботами: без крови, искры, дым, обломки, взрывы.","src":"ART_DIRECTION.md; Docs/COMBAT_PLAN.md","state":"есть"},{"id":"sy-led","title":"Язык света","text":"Цвет светодиода сообщает состояние: у Друга-11 спокоен голубой, тревога красный; у механизмов красный, жёлтый, зелёный, серый.","src":"Docs/FRIEND11.md; Docs/MECHANISMS.md","state":"есть"},{"id":"sy-text","title":"Правило надписей","text":"Текст в геометрии не генерируем (нейросеть путает буквы): кириллица отдельными декалями и текстурами.","src":"ART_DIRECTION.md","state":"есть"}],"gaps":[{"id":"g-ship","kind":"contradiction","title":"Станция или боевой корабль?","text":"Сценарий: орбитальная медицинская станция МИР-11. Арт-направление: миротворческий корабль с экипажем и спасательными операциями по галактике.","src":"Ref/Сценарий.docx; ART_DIRECTION.md"},{"id":"g-cause","title":"Почему роботы напали?","text":"Арт-направление: роботы «сошли с ума». Сценарий: идёт война двух ИИ. Связь между ними не описана: безумие это работа Друга-11?","src":"ART_DIRECTION.md; Ref/Сценарий.docx"},{"id":"g-breed","title":"Порода Фишта","text":"В сценарии вельштерьер. В игре риг, референс и модель — джек-рассел-терьер.","src":"Ref/Сценарий.docx; Docs/JR_MASTER_NOTES.md; Ref/Models"},{"id":"g-f11body","title":"Друг-11: дата-центр или робот 1,3 м?","text":"В сценарии это один из двух мощнейших ИИ дата-центров. В игре — летающий робот-консультант. Как связаны тело и сеть, не сказано.","src":"Ref/Сценарий.docx; Docs/FRIEND11.md"},{"id":"g-mir","title":"МИР-11 не представлен в игре","text":"Второй ИИ из сценария не имеет ни образа, ни голоса, ни места в уровнях. Игрок не узнает о его цели.","src":"Ref/Сценарий.docx"},{"id":"g-timeline","title":"Training: до катастрофы или после?","text":"Сценарий: Фишт «только что прошёл подготовку». Но в уровне Training уже есть следы катастрофы (дым, огонь, обломки), а Друг-11 проводит инструктаж.","src":"Ref/Сценарий.docx; Docs/LEVEL_TRAINING.md"},{"id":"g-weapons","title":"Зачем служебной собаке оружие?","text":"Сценарий: пёс для сопровождения и спасения. ТЗ MVP: боя нет, только скрытность. Сейчас жилет с пулемётом и ракетами: мотивация не объяснена.","src":"Ref/Сценарий.docx; ТЗ_MVP.md; Docs/COMBAT_PLAN.md"},{"id":"g-humans","title":"Где люди и кто они","text":"Техник, инженер, тренер упомянуты в уровнях, но не описаны: имена, судьба, роль в сюжете. Куда делся экипаж, не сказано.","src":"PLAN.md; Docs/LEVEL_TRAINING.md"},{"id":"g-mars","title":"Марс","text":"Первая миссия на Марс упомянута один раз как причина подготовки. Что с ней стало и вернётся ли она в сюжете, не определено.","src":"Ref/Сценарий.docx"},{"id":"g-reveal","title":"Как раскрывается Друг-11","text":"Тайная сторона есть только как случайные жуткие реплики и вспышки глаза. Момент, способ и последствия раскрытия не придуманы.","src":"Docs/FRIEND11.md"},{"id":"g-ending","title":"Финал","text":"Сценарий лишь говорит, что он «не очевиден». Не придуман. Акты, главы и порядок уровней тоже.","src":"Ref/Сценарий.docx"},{"id":"g-intro","title":"Текста сцены знакомства нет","text":"Группы реплик Intro и Train описаны как формат, но не написаны. Есть только 7 общих групп поведения.","src":"Docs/FRIEND11.md; voice_lines.json"},{"id":"g-audio","title":"Озвучка, музыка, амбиент","text":"Настоящей озвучки нет, решения о голосе и музыке не принято, музыка в планах не упоминается.","src":"Docs/LOCALIZATION.md; Docs/FRIEND11.md"},{"id":"g-quest","title":"Нет системы заданий","text":"Явные задания в интерфейсе и связь загадок с сюжетом задуманы, но в проекте их нет.","src":"Ref/Референс разнообразных находок.txt; Docs/LEVEL_TRAINING.md"}]},"story":[{"name":"01-obshchiy-syuzhet.md","text":"# Общий сюжет\n\n*Сценарий игры «Фишт: Боевой Пёс» («Fisht: The Battle Dog»). Перенесено из черновика Ref/Сценарий.docx без правок текста.*\n\n2126 год. На околоземной орбите находится космическая станция МИР-11. Это огромный медицинский комплекс, в котором ученые со всего мира изучают медицину будущего. Это технологическая база, где научные эксперименты проводятся с применением технологий. Медицинский комплекс, где лечат людей с помощью роботизированных платформ. Здесь же находятся два самых мощный дата центра с искусственным интеллектом - МИР-11 и Друг-11. Совсем недавно на базе был построен новый модуль для тренировки служебных собак,  в будущем призванных выполнять задания по сопровождению и спасению людей на дальних космических миссиях. Одной из первых собак, проходящих подготовку был призван вельштерьер Фишт. На Земле он прошел отбор и среди всех остальных конкурентов показал лучший результат. Фишт только что прошел подготовку на станции, и был готов к первой отправке на Марс, но неожиданные события прервали его эксперементальную миссию. И началась совсем другая история.\n"},{"name":"02-protivostoyanie-ii.md","text":"# Противостояние искусственного интеллекта\n\nПротивостояние искусственного интеллекта! Друг-11 машина, не друг, но и не враг, он хочет спасти все человечество, уничтожив всех, кто разрабатывает искусственный интеллект и все базы с с икуственным интеллектом. и тем самым спасти человечество от деградации, потери рабочих мест и перенаселения. Его оппонент – ИИ МИР-11, хочет спасти людей, разрабатывает медицинские установки и пытается спасти остаток людей на базе. Эти два ИИ конфликтуют друг с другом, но их цели не раскрываются во время действия. А финал истории совсем не очевиден.\n"},{"name":"03-01-kto-eto-tut-u-nas.md","text":"# 01. Кто это тут у нас?\r\n\r\n\r\nМаленькая уютная каюта космического корабля. Обычная, в которой живут техники и солдаты, ученые и инженеры, гости и те, кто связал свою жизнь с космосом и космической станцией «Мир-11». Но, если быть честным, не совсем обычная. Тут нет привычного письменного стола, кровати и холодильника с телевизором. Вместо этого - собачья лежанка, на которой разместился плед, покрытый черной и рыжей шерстью, напоминающую маленькие кусочки тонкой проволоки, плюшевая утка, кормушка для животных и такой же маленький туалет. Да, это и правда не самая обычная каюта. Это каюта Фишта - космического вельштерьера, которому судьба подготовила участь, несоизмеримую с размером его маленьких треугольных ушей и хвоста.\r\n Фишт проснулся в обычной позе - вольяжно свесив лапы с лежанки на пол. Потянувшись, попив воды, поев немного корма и отметив туалет отдельным вниманием он понял, что-то идет не по плану. Утренний распорядок (А утро на корабле совпадало с утром в Москве) был таков - его будил Андрей - тренер Фишта,  и почесав за ухом(как за своим, так и за ухом Фишта), вел его в комплекс обучения космических собак. Тренироваться там было чему. Фишта воспитывали, как универсального помощника, которого отличало от любого робота одна очень важная функция - чутье! За сотни лет еще ни одна машина не смогла научиться обладать этим чувством. Чувством повышенной тревоги, радости, опасности или верного пути, даже не смотря на то, что другой путь казался проще, а происходящие события предполагали абсолютное спокойствие. Эти умные животные, будучи норными охотниками очень трепетно относились к поставленной задаче и удивительным образом сочетали в себе качества неутомимого воина и разумного и осторожного преследователя. Небольшой размер вельштерьеров - около сорока сантиметров в холке, с лихвой компенсировался их мощью, а пропорция могли позавидовать многие другие породы собак, длинные и крепкие ноги, мощная пасть с острыми зубами, немного вытянутое тело, узкая морда, короткая проволочнообразная шерсть, и, конечно, нескончаемый запас энергии, приводящей все это в резкие и четкие движения. А задатки разума были поистине фантастическими для животного такого размера. Идеальный компаньон, обожающий своего хозяина.\r\n   Но хозяина все еще не было. Не было звуков, связанных с его появлением, запахов, вибраций. Ничего. Было только чувство тревоги. И запах… Запах гари, запах страха, запах чего-то другого. Фишт заскулил, немного посуетился и решил брать ситуацию в свои лапы. Его давно к этому готовили. Но неожиданное появление возможности проявить себя лично его немного смутило. Тем более, Фишт был первым и единственным космическим псом на станции, тестовый образец и корабль готовился к принятию основной партии собак для обучения. Тренер долго уговаривал руководство допустить собаку на борт до первого «потока». Во - первых, потому что ему хотелось уже немного протестировать комплекс, а во-вторых ему было банально скучно без Фишта. Он любил его больше всех своих подопечных.\r\n   Надо отметить, что готовили и корабль - вентиляционные шахты и люки проектировались таким образом, чтобы собаки могли перемешаться между отсеками в случае блокировки проходов и шлюзов основных коридораы станции. В некоторых местах были установлены панели, не высоко над полом, на уровне собачего носа, коснувшись которых, Фишт мог открывать некоторые двери и проходить в доступные ему помещения.\r\n   Таким образом была спроектирована и его каюта. Маленькая светящаяся кнопка с нарисованной на ней лапой приютилась слева раздвижной двери каюты. Фишт нажал кнопку и вышел в коридор. \r\n\r\n***\r\n\r\n\r\nВ коридоре северного блока было безлюдно. Слева были расположены входы в каюты, а справа находилась глухая стена, которая отделяла коридор от тренировочного комплекса. Этот маршрут Фишт проходил десятки раз, но в этот раз все было совсем не так. Обычно помещения общего пользования находились в идеальном состоянии, ибо порядок - это главное правило корабля и станции. Сейчас же здесь все было перевернуто вверх дном. Ящики с медкомплектами были разбросаны коридору, вырванные провода, перебитые решетки и дымящаяся техника напоминали о том, что совсем недавно здесь произошло что-то страшное. Об этом же напоминали и периодически включенные красные светодиоды, сигналящие о критическом состоянии систем.\r\n   Огонь и высокие завалы не давали Фишту пройти прямо, поэтому обход через вентиляционные каналы были единственным вариантом продвинуться в сторону тренировочного комплекса. Может быть Андрей там? \r\n   Что-то двигалось за стеной. Какой-то робот. Фишт не любил роботов. Вряд ли он знал, что роботы начали заменять настоящих собак в их работе, в качестве питомцев и просто спутников жизни. Иначе, он, несомненно, еще сильнее бы их не любил. Они его раздражали своим жужжанием, пиликаньем и… безжизненностью. Ходячие игрушки, которые нельзя кусать. А игрушки Фишт любил. Точнее одну игрушку. Его Утку. Утку так и звали - Утка. Фишт уже немного жалел, что не взял ее с собой, потому что не знал, вернется ли он назад. \r\n   Робот жужжал все сильнее и явно что-то делал.  Скрежет вместе с грохотом металла и пластика, говорили о том, что в тренировочном комплексе что-то происходит. Пройдя еще пару секций коридора, перепрыгивая через ящики и пролезая в вентиляционные люки, Фишт добрался до входа в зал. Но тут его ждало разочарование. Огромный манипулятор, перевозящий контейнеры с техникой пробил дверь и полностью заблокировал проходы. Фишт был в тупике. Половинка створки двери была закрыта, вторая была выбита манипулятором. Но слева можно было запрыгнуть на ящик и перелезть. За манипулятором был узкий проход в зал, но бочки с припасами преградили путь. Что же делать?\r\n  Раздумье прервал резкий звук воздушной подушки. Бочки разлетелись в стороны и перед Фиштом предстал робот - ассистент «Друг-11».\r\n - Так тааак! Кто это тут у нас?!\r\nБольше всего Друг-11 был похож на шахматную пешку на воздушной магнитной подушке. Благодаря этому он передвигался почти бесшумно. Единственный глаз на голове позволял ему сканировать пространство и связываться с устройствами по инфракрасным и оптическим портам. Незаменимый помощник. Он был прямым конкурентам системе искусственного интеллекта Мир - 11. И скорее напоминал человека на Земле, живущего в гармонии с природой планеты, но обладающего своим разумом, соизмеримым с планетарным. Друг - 11 должен был заменить всех помощников на станции и стать основным посредником между человеком и системой Мир-11, которая отвечала за обеспечение работы самой станции, управляла дронами и системами жизнеобеспечения.\r\n   - О, я не думал, что ты здесь! Как ты тут оказался?, - продолжал робот, - неужели тебя никто не заметил? Странно и… и очень здорово, что так получилось. Ты же Фишт, правда? Точно, Фишт! Тут же больше никаких собак и не было. Да, не было. Должны были прилететь, но не успели, да… Помнишь меня? Это же я - Друг! Друг - 11, но ты можешь меня звать просто Друг. А, да, ты же не можешь звать. Или звать можешь?  Или тебя могут звать?! Нас всех могут звать! \r\n  Робот явно суетился и кружился вокруг Фишта. Не давая ему пройти вперед, попутно раздвигая своим телом обломки бочек и ящиков. Сметая провода и сдвигая плиты обшивки. Но Фишт все же прошел чуть чуть вперед. \r\n  Тренировочный комплекс был совершенно новым помещением, состоящим из нескольких помещений. На первом этапе тренировали физические способности собак, в специальном зале, высотой около семи метров, расположилась полоса препятствий. Прыжки через ящики, симуляция лаза и вентиляций, уступы и балки с веревками. В конце зала находилась тренерская комната. За которой находился зал испытаний специального собачьего оборудования.\r\n  Сейчас же зал физической подготовки выглядел угнетающе, не намного отличаясь от коридора. Отбитые и обгоревшие панели, свисающие провода, и дымящаяся техника напоминали о том, что и тут произошла неприятность. \r\n - Фишт, посмотри, какой бардак происходит! Это же невозможно выносить! Да мне и нечем, ха - ха!!! -, робот-помощник и правда не обладал манипуляторами, похожими на руки, обычно он пользовался удаленным доступом, лазерными излучателями и магнитными полями для передвижения предметов. \r\n - Ты, наверное, ищешь тренера? Андрей сегодня не приходил и вообще никто не приходил. Ни одного человека. Зато роботы… - Друг медленно огляделся вокруг, сканируя пространство, - роботы, конечно, совсем не понимают, как надо себя вести. Ну оно и понятно, когда у семи нянек дитя без глазу, то у одной мамки тысячи этих детей вообще без мозгов. Одна голова на всех,- робот приговаривал, ворчал и постепенно разгребал завалы своим корпусом, с электромагнитным полем, как будто бы делая проход в груде обломков. - Устроили бардак, - продолжал он, - никогда такого не устраивали. Люди пройти не могут, я пройти не могу. Вообще никуда отсюда не могу выйти, представляешь. Сижу тут всю ночь и даже подзарядиться негде. Сколько там у меня еще заряда,- робот завис на несколько секунд, проводя самодиагностику, а потом выдал безэмоциональным голосом, - осталось двадцать два процента. Двадцать два процента…,- тут помощник уже вздохнул, - если не добраться до зарядной станции, то мне придется отключать все свои инструменты, а потом… ой, нет, даже не хочу думать об этом. Слушай, малыш, а давай - ка мы с тобой поищем Андрея, а заодно попробуем попасть в тренерский отсек, там есть зарядная станция и твои защитные жилеты, а? Давай, я тут немного еще расчищу, и ты откроешь мне дверь с обратной стороны. Там точно есть кнопка., - робот начал методично расчищать остатки завалов, пробивая проход к полосе испытаний, ворча под свой несуществующий нос и проклиная роботов, подконтрольных станции «Мир-11».\r\n -Готово!!!,- спустя некоторое время, робот закончил пробивать проход, открывая доступ к полосе препятствий. - Надеюсь тебя не зря так хвалили и ты поймешь, что делать. Попробуй дойти до следующего этапа и открыть мне дверь. \r\n   Фишт, и правда,  не раз уже проходил этот маршрут. То, что для многих собак являлось непреодолимым испытанием, для Фишта было легкой прогулкой. Понимая, что от него хотят, Фишт инстинктивно прошел полосу, состоящую из несколький стен, разной высоты, ползучего лаза и вентиляционного канала. После этого нужно было нажать кнопку в полу и часть стены сдвинулась, впуская робота в отсек. \r\n - Отлично, малыш, просто отлично! Но надо продолжать, дальше есть еще несколько этапов, мы должны пройти их до конца!\r\n"}],"game":{"generated":"2026-11-09 00:27","cards":[{"id":"game-enemy-DroneKamikaze","from_game":true,"type":"Враг","name":"Дрон-камикадзе","asset":"/Game/Fisht/Combat/Enemies/DA_Enemy_DroneKamikaze","rarit ","color":"#ffffff","desc":"Скин (только вид). Подходит деталям семейства Nozzle_Std. Скин никогда не даёт статов.","stats":[{"label":"Цветовых вариантов","value":0,"unit":"","bar":0}],"abilities":["Меняет только внешний вид"],"tags":["из игры","скин","nozzle_std"]},{"id":"game-skin-Skin_Pouch_L_Default","from_game":true,"type":"Модуль","name":"Левый подсумок, стандарт","name_en":"Left pouch, standard","asset":"/Game/Fisht/Gameplay/Gear/Skins/Skin_Pouch_L_Default","rarity":"common","rarity_note":"скины статов не дают","color":"#000000","desc":"Скин (только вид). Подходит деталям семейства Pouch_Std_L. Скин никогда не даёт статов.","stats":[{"label":"Цветовых вариантов","value":5,"unit":"","bar":0.8333333333333334}],"abilities":["Меняет только внешний вид"],"tags":["из игры","скин","pouch_std_l"]},{"id":"game-skin-Skin_Pouch_R_Default","from_game":true,"type":"Модуль","name":"Правый подсумок, стандарт","name_en":"Right pouch, standard","asset":"/Game/Fisht/Gameplay/Gear/Skins/Skin_Pouch_R_Default","rarity":"common","rarity_note":"скины статов не дают","color":"#000000","desc":"Скин (только вид). Подходит деталям семейства Pouch_Std_R. Скин никогда не даёт статов.","stats":[{"label":"Цветовых вариантов","value":5,"unit":"","bar":0.8333333333333334}],"abilities":["Меняет только внешний вид"],"tags":["из игры","скин","pouch_std_r"]},{"id":"game-skin-Skin_Vest_Heavy_Default","from_game":true,"type":"Модуль","name":"Тяжёлый жилет, стандарт","name_en":"Heavy vest, standard","asset":"/Game/Fisht/Gameplay/Gear/Skins/Skin_Vest_Heavy_Default","rarity":"common","rarity_note":"скины статов не дают","color":"#000000","desc":"Скин (только вид). Подходит деталям семейства Vest_Heavy. Скин никогда не даёт статов.","stats":[{"label":"Цветовых вариантов","value":5,"unit":"","bar":0.8333333333333334}],"abilities":["Меняет только внешний вид"],"tags":["из игры","скин","vest_heavy"]},{"id":"game-skin-Skin_Vest_Light_Default","from_game":true,"type":"Модуль","name":"Лёгкий жилет, стандарт","name_en":"Light vest, standard","asset":"/Game/Fisht/Gameplay/Gear/Skins/Skin_Vest_Light_Default","rarity":"common","rarity_note":"скины статов не дают","color":"#000000","desc":"Скин (только вид). Подходит деталям семейства Vest_Light. Скин никогда не даёт статов.","stats":[{"label":"Цветовых вариантов","value":5,"unit":"","bar":0.8333333333333334}],"abilities":["Меняет только внешний вид"],"tags":["из игры","скин","vest_light"]}]},"howto":{"sections":["Модели и пропсы","Персонажи","Враги","Снаряжение и оружие","Анимация","Уровни","Тексты и звук","Отладка","Карта проекта"],"cards":[{"id":"prop-static","section":"Модели и пропсы","title":"Добавить пропс из Tripo или Blender (статичный)","result":"Меш в Unreal с материалом и коллизией, готов поставить в уровень.","steps":["Скопируй папку Blender/Props/_TEMPLATE, назови по пропсу (Barrel_01), внутри переименуй .blend так же и открой.","Удали куб SM_NewProp. Вставь модель: File → Import → glTF 2.0 (GLB из Tripo).","N → Item → Dimensions: введи реальные размеры (можно писать 45cm). Низ на полу (Z=0), центр в нуле. Origin to 3D Cursor.","Перенеси объект в коллекцию SM_NewProp. Назови объект и коллекцию SM_Barrel_01 (имя коллекции = имя FBX).","Ctrl+A → All Transforms. Проверь UV и что материал один.","File → External Data → Unpack Resources → Write Files to Current Directory (текстуры попадут в textures/).","File → Export → Export All Collections: рядом появится SM_Barrel_01.fbx.","Unreal: создай папку /Game/Fisht/Props/\u003cКатегория>/Barrel_01/, перетащи туда FBX и картинки.","Текстуры: ORM = Masks (no sRGB); Normal = Normal Map + Flip Green Channel; маска светодиодов = Masks.","ПКМ на MI_Prop_Template → Duplicate в папку пропса (MI_Barrel_01): выбери BaseColor, Normal, ORM. В меше назначь материал и Collision → Add Box Simplified Collision."],"traps":["Серый «зеркальный» материал: ORM не Masks, sRGB включён.","Рельеф вывернут: нет Flip Green Channel у Normal.","Пропс в полу или в воздухе: низ не на Z=0.","Игрок проходит сквозь: коллизия не добавлена (UCX из FBX не подхватывается).","Правка не видна: пересохрани Blender, Export All Collections, в Unreal ПКМ → Reimport."],"src":["Docs/PROPS_PIPELINE.md","Docs/TRIPO_IMPORT_GUIDE.md",".claude/skills/tripo-prop-import/SKILL.md"],"date":"2026-10-29"},{"id":"prop-publish","section":"Модели и пропсы","title":"Опубликовать пропс одной командой (prop.ps1)","result":"Модель из .blend сама попадает в игру: меши, материал, коллизия, Blueprint BP_Prop_\u003cИмя>.","steps":["Подготовь модель в Blender по карточке «Добавить пропс». Папка и файл называются одинаково: Blender/Props/\u003cИмя>/\u003cИмя>.blend.","Открой редактор Unreal, останови PIE, убедись что нет файла Saved/PIE_LOCK.txt. Файл .blend сохрани и закрой в Blender.","Запусти из корня проекта: .\\Tools\\Props\\prop.ps1 publish Crate_01 -Type full -Physics (тип: static, full или partial; -Physics если пропс толкается; -Led для светодиодов).","Или в редакторе: меню Fisht → Опубликовать: \u003cИмя> → нужный вариант (первый раз включи меню скриптом prop_menu.py, см. документ).","Следи за Saved/PropImport/log.txt: в конце должна быть строка ГОТОВО.","Перетащи BP_Prop_\u003cИмя> в уровень (или добавь -Level и -At, тогда актор поставится сам).","Правишь модель: сохрани .blend и нажми ту же кнопку. Повтор безопасен."],"traps":["Уже созданный BP_Prop_\u003cИмя> не пересоздаётся: при смене варианта удали его в Content Browser и запусти снова.","Во время PIE импорт и правка Blueprint не работают.","Скрипт .ps1 с кириллицей только с BOM.","Части _Parts (отваливающиеся) импортируются, но механики в игре пока нет.","Убрать из игры: меню «Убрать из игры» или prop.ps1 unpublish \u003cИмя>."],"src":["Docs/PROPS_PIPELINE.md","Docs/starters/props_blender.md","Docs/FISHT_MENU.md"],"date":"2026-10-29"},{"id":"prop-breakable","section":"Модели и пропсы","title":"Добавить разрушаемый ящик или решётку","result":"Пропс ломается рывком Фишта: осколки, звук, светодиоды меняют цвет.","steps":["Нарежь модель аддоном Fisht Props в Blender: коллекции \u003cИмя>_Chunks (осколки) и, для решётки, \u003cИмя>_Parts / рама.","Проверь, что пивоты рамы и ломаемой части в одной точке.","Опубликуй командой: .\\Tools\\Props\\prop.ps1 publish \u003cИмя> -Type full (целиком) или -Type partial (рама остаётся, часть ломается).","Открой BP_Prop_\u003cИмя> в Unreal: здоровье и вид осколков правятся в Details (MaxHealth, DebrisCount и др.). Таблицы данных больше нет.","Поставь BP_Prop_\u003cИмя> в уровень и в PIE ударь рывком: часть ломается, рама цела.","Время жизни осколков: ~70% «коротких» исчезают через 1.5–3 с, ~30% «долгих» остаются на DebrisLifetime и плавно исчезают (DebrisFadeMode). Доли и времена: Class Defaults BP_DestructionManager, категория «Debris Lifetime / Время жизни осколков» (LongFraction, ShortLifeMin/Max, ShortFadeSeconds, EvictFadeSeconds)."],"traps":["Не ломается: пустой GrilleMesh или слишком большое MaxHealth.","Осколки в точке (0,0,0): у части нет меша или пивот не в нуле.","Рама и часть разлетаются при старте: коллизии пересекаются, раздвинь части в Blender.","Таблицы DT_Breakables больше нет: здоровье и осколки лежат в Blueprint пропса (breakable_row в prop.json). Навык breakable-prop-add обновлён под это 2026-11-08."],"src":["Docs/BREAKABLES_GUIDE.md","Docs/PROPS_PIPELINE.md",".claude/skills/breakable-prop-add/SKILL.md"],"date":"2026-11-09"},{"id":"prop-surface","section":"Модели и пропсы","title":"Задать пропсу поверхность, коллизию и теги","result":"Правильный звук шагов и ударов, пёс проходит или упирается, умеет лазать или нет.","steps":["Поверхность: открой материал пропса → Physics → Phys Material → выбери PM_\u003cИмя> (Metal, Wood, Cardboard, Plastic…). Не задано = как бетон.","Можно автоматом: в консоли Python PHYS_MODE=\"fix\", PHYS_ROOTS=[\"/Game/Fisht/Props/\u003cКатегория>\"] и запусти Tools/Physics/audit_surfaces.py.","Коллизия: в меше или компоненте Collision Presets: BlockAll (декор), Prop (толкается), Breakable (ломается), SurfaceOnly (проходишь насквозь), InteractableSolid (кнопка E).","Теги: выбери актор в уровне → Details → Actor → Tags → «+»: Item.Pushable, Item.Carryable, Traverse.Ledge, Traverse.NoClimb и т.д. Пиши ровно, с точкой."],"traps":["Нет звука шагов: на материале не назначен PM_\u003cПоверхность>.","Пёс лезет туда, куда не надо: поставь Traverse.NoClimb.","Звуки по поверхностям пока заглушки: нужны ассеты в Audio/Surfaces."],"src":["Docs/SURFACES_HOWTO.md","Docs/PROPS_PIPELINE.md"],"date":"2026-10-18"},{"id":"prop-led","section":"Модели и пропсы","title":"Добавить светодиоды пропсу","result":"Часть модели светится; цвет и яркость меняются в Unreal без Blender.","steps":["Автоматически: опубликуй пропс с ключом -Led, маска T_\u003cИмя>_E построится сама (R = индикатор состояния, G = горит постоянно).","Вручную: в Blender вкладка Texture Paint, создай чёрную картинку T_\u003cИмя>_E и закрась белым места свечения, сохрани в textures/.","В Unreal импортируй картинку как Masks (no sRGB). В MI_\u003cИмя> выбери её в EmissiveMask, задай LED_Color и LED_Intensity (5–20).","Не угадало маску: правь PNG руками и поставь \"led\": true в prop.json."],"traps":["Маска приблизительная, ручная правка допустима.","Вид светодиодов оценивает пользователь, проверены только значения параметров."],"src":["Docs/PROPS_PIPELINE.md"],"date":"2026-10-29"},{"id":"carry","section":"Модели и пропсы","title":"Сделать предмет переносимым (пёс берёт в зубы)","result":"Фишт подбирает предмет клавишей E и носит; ключи и провода работают с механизмами.","steps":["У актора-пропса корневой компонент с коллизией, профиль Prop.","Добавь тег актора Item.Carryable (и Item.Key, Item.Wire или Item.Quest по смыслу).","Добавь компонент BP_CarryableComponent. Для ключей и проводов впиши ItemId; при нужде MouthOffset (положение в пасти)."],"traps":["Нельзя перезаписывать теги актора Blueprint: без Item.Carryable E предмет не берёт.","Поле «переносимый» в prop.json пока не заведено: компонент добавляется вручную."],"src":["Docs/CARRY_MECHANIC.md","Docs/INTERACTION.md"],"date":"2026-11-07"},{"id":"mech","section":"Уровни","title":"Собрать кнопку, дверь и ключ-карту (механизмы)","result":"Цепочка: ключ → считыватель → кнопка → дверь; состояния красный, жёлтый, зелёный.","steps":["Один раз поставь в уровень BP_SignalHub (хаб каналов).","Поставь BP_MechButton, BP_MechDoor, BP_MechKeySlot из Content/Fisht/Gameplay/Mechanisms.","Соедини каналами: у кнопки OutChannel = имя, у двери InChannels = то же имя. У считывателя укажи RequiredItemId ключа.","Провода: BP_MechSignalBridge, укажи Socket или Cable и Channel; этот канал впиши в InChannels кнопки.","Свой вид кнопки: опубликуй пропс из Blender как интерактивный (меню Fisht → «как интерактивный»), родитель выберется сам."],"traps":["Кнопка не нажимается: рядом блокирующий меш перехватывает луч фокуса E; у корпусов станций коллизию выключают.","Нажимается только с лицевой стороны (+Y меша).","bPersist по умолчанию выключен, иначе старый сейв запускает кнопку сразу в Active.","Вид кнопок и дверей по состояниям ждёт вердикта пользователя."],"src":["Docs/MECHANISMS.md","Docs/LEVEL_TRAINING.md","Docs/INTERACTION.md"],"date":"2026-10-29"},{"id":"rope","section":"Уровни","title":"Поставить верёвку или балку","result":"Фишт цепляется зубами и раскачивается.","steps":["Перетащи BP_Rope или BP_Beam из /Game/Fisht/Gameplay/Traverse.","Верёвка: подвес в позиции актора, груз висит вниз. Балка: ось = X актора, центр в позиции актора.","Свой вид: Details → «Верёвка-балка» → «Меш и размер»: BeamMesh, BeamMeshAxis (0 = X, 1 = Y, 2 = Z), BeamHalfLength, OvThickness; для верёвки SegMesh, SegLen, OvLength.","Материал задаётся в таблице DT_RopeBeam (колонка Material)."],"traps":["У верёвки максимум 12 звеньев: для длинной увеличь SegLen.","Звено верёвки должно быть вытянуто по Z с пивотом в центре.","Зацеп только автоматический, в падении или прыжке."],"src":["Docs/ROPE_BEAM.md"],"date":"2026-10-22"},{"id":"decals","section":"Уровни","title":"Расставить декали по стене (грязь, царапины)","result":"Стена выглядит потёртой: декали ставятся автоматически по объёму.","steps":["Перетащи в уровень /Game/Fisht/Tools/BP_DecalVolume.","Растяни Scale так, чтобы стена была внутри бокса.","В Details включи нужные Entries (bEnabled), настрой DensityPer10m2 и Seed.","Для одной стены в RayAxis оставь только ось поперёк стены.","Поставь галку GenerateNow: декали появятся, галка снимется. ClearNow убирает их.","Чтобы оставить насовсем, удали сам объём: декали останутся."],"traps":["Декали-атласы: «низ» картинки это +Y декали, иначе потёки лягут боком.","Новые шейдеры декалей ~10 с показывают серые коробки, пока не скомпилируются."],"src":["Docs/DECAL_VOLUME.md","Tools/WallDecals/wall_decals.py"],"date":"2026-10-25"},{"id":"level-training","section":"Уровни","title":"Пересобрать часть уровня Training скриптом","result":"Нужная часть зала собрана заново без ручной расстановки.","steps":["В редакторе открой Training_01_02, PIE остановлен.","Выбери скрипт из таблицы в LEVEL_TRAINING.md и запусти в execute_python_code: exec(open(путь, encoding='utf-8').read()).","Порядок: dress_T, damage_T, walls_T, floor_T, lights_cap, mech_T, zone_V.","Каждый скрипт помечает акторы своим тегом и перед сборкой удаляет свои старые, поэтому его можно перезапускать."],"traps":["Нельзя перезапускать course_T.py и panels_T.py: пользователь удалил там стены.","Не копируй уровень через duplicate_asset: следующий load_level роняет редактор."],"src":["Docs/LEVEL_TRAINING.md","Docs/starters/level_training.md"],"date":"2026-11-09"},{"id":"drone","section":"Враги","title":"Добавить врага-дрона","result":"Новый тип дрона в игре: модель, детали, карточка DA_Enemy_\u003cИмя>. Blueprint не трогаем.","steps":["В Blender нос на -Y, метры, один материал. Раздели модель на объекты: Core (корпус, обязателен), Rotor_*, Engine_*, Gun_*, Skin_*, Shard_*. Начало координат каждого по таблице в ENEMY_GUIDE.","Выгрузи: blender.exe -b Мой_дрон.blend --python Tools/Combat/blender/export_drone.py -- Drone_Имя. Появится папка incoming/Drone_Имя с FBX и manifest.json.","Останови PIE. Скажи чату: «запусти add_drone для Drone_Имя, карточка DA_Enemy_Имя». Скрипт Tools/Combat/add_drone.py импортирует всё и заполнит карточку.","Открой карточку: выбери Tactic, задай здоровье, скорость, цвет лазера.","Перетащи BP_HoverBot в уровень и выбери Enemy Type = твоя карточка."],"traps":["Если в BP_HoverBot добавили компонент, стоящие в уровне экземпляры надо удалить и поставить заново.","В списках деталей один номер = одна деталь; порядок и удаление строк менять нельзя.","Кривые буквы на текстуре Tripo бывают мелкой геометрией: образец правки в md01_prepare.py."],"src":["Docs/ENEMY_GUIDE.md","Docs/ENEMY_ROADMAP.md","Docs/starters/enemy_robot.md"],"date":"2026-11-07"},{"id":"enemy-tune","section":"Враги","title":"Поменять здоровье, манеру боя и поведение врага","result":"Враг иначе ведёт себя в бою.","steps":["Открой карточку DA_Enemy_* (Content/Fisht/Combat/Enemies). Поля сгруппированы по категориям 1–9, пояснение вшито в имя поля.","Выбери Tactic: держать дистанцию, окружение, таран, камикадзе, наводчик, укрытия.","Здоровье деталей: Part Health, строка с тем же номером, что у нужной детали в Part Meshes.","На самом дроне в уровне правятся лишь Enemy Type, Respawn Delay, Lose Time, Search Time."],"traps":["Новое значение поля не меняет уже созданную карточку само: задавай явно в types() скрипта или в карточке.","Расстояния в сантиметрах, время в секундах."],"src":["Docs/ENEMY_GUIDE.md"],"date":"2026-11-07"},{"id":"enemy-tactic","section":"Враги","title":"Добавить новую манеру боя или нового робота со скелетом","result":"Новая манера доступна в выпадающем списке Tactic.","steps":["Один робот = один чат, стартер Docs/starters/enemy_robot.md. Перед работой PIE остановлен и занят замок Saved/PIE_LOCK.txt.","Новая манера: новое значение в E_EnemyTactic, своя функция и ветка в Combat через Tools/Combat/build_tactics.py. Чужие манеры не менять.","Робот со скелетом (руки, манипуляторы): сначала прочитай раздел в ENEMY_ROADMAP; компонент SkelBody под Shell, поля SkelMesh и AnimClass в карточке.","Проверка ботом: Tools/Combat/pie_tactics.py. Новые поля занеси в ENEMY_GUIDE."],"traps":["Графы BP_HoverBot собираются скриптами: правка руками пропадёт при следующей сборке.","BP_HoverBot меняет только один чат одновременно."],"src":["Docs/starters/enemy_robot.md","Docs/ENEMY_ROADMAP.md"],"date":"2026-11-05"},{"id":"gear-export","section":"Снаряжение и оружие","title":"Экспортировать новую деталь снаряжения из Blender","result":"FBX нужного типа лежит в export/, готов к импорту.","steps":["Открой Blender/Fisht/Armor/Fisht_Armor_Set_01/Fisht_Vest_Fit.blend. Перед большими правками: File → Save Copy.","Надеваемая деталь: моделируй вокруг Ref_FishtJR, привяжи к арматуре Root, один материал. Единицы сцены: 1 единица = 1 см.","Жёсткая деталь (подсумок, сопло): пивот в точке качания, в FBX лежит в нуле.","В 3D-виде нажми N → вкладка Fisht Export. Нет вкладки: Text Editor → FISHT_EXPORT.py → Run Script (Alt+P).","Нажми кнопку нужного типа. Для нового: выдели объекты, впиши имя файла и нажми «На скелет» или «Жёсткая» в блоке «Новый предмет».","Результат: файл в export/ рядом с .blend."],"traps":["НИКОГДА не экспортируй и не импортируй всю сцену: Unreal вольёт кости собаки в скелет пушки и пересохранит все клипы.","Размер SK_LaserGun_01.uasset вырос с 9 до 19 КБ: залили файл с собакой, откат git checkout HEAD -- Content/Fisht/Gameplay/Gear/LaserGun.","Имена мешей не должны совпадать с именами костей."],"src":["Docs/VEST_NEW_ITEMS.md","Docs/VEST.md"],"date":"2026-11-10"},{"id":"gear-part","section":"Снаряжение и оружие","title":"Добавить деталь жилета (жилет, ошейник, пояс с соплами)","result":"Деталь надевается в меню Tab и попадает в сборки. Классов три: Медицинский = Light, Разведчика = Medium, Тяжёлый = Heavy, по 3 уровня. Ботинок в игре нет, сопла это часть пояса. ПОЛНАЯ пошаговая инструкция для неспециалиста: Docs/GEAR_ADD_ARMOR.md (Blender, импорт, поля DA, 3 уровня, статы, проверка).","steps":["Экспортируй модель по карточке «Экспортировать деталь из Blender»: меш и арматура Root, кнопка «На скелет». Текстуры (T_\u003cИмя>_BaseColor/Normal/Roughness/Metallic.png, до 2048 px) Blender пишет сам рядом с .fbx, в том числе упакованные из Tripo. Пояс: сопла не в меше, они отдельный актор BP_JetNozzles, который уже прописан в поясе.","Импорт одной командой: поправь блок JOB в Tools/DebugMenu/gear_import_part.py (export_dir, fbx, kind Vest|Collar|Belt, при желании блок da: имя DA_Gear_..., PartId, название, класс, уровень), затем Output Log > Cmd > py \"E:/Unreal Projects/FishtTheBattleDog/Tools/DebugMenu/gear_import_part.py\" (PIE остановлен). Скрипт сам: меш на SK_Dog_Master, текстуры с верными настройками, материал с Tint, назначение на меш, для жилета сокеты Socket_PouchL/R/Gun на Spine_04 (копия с SKM_Vest_01; подгонять руками по форме), карточка DA, каталог и меню Tab. Итог в Saved/gear_import_result.txt, в конце ГОТОВО.","Проверка глазами: меш SKM_\u003cИмя> цветной, не серый. Запасной ручной вариант: Import FBX руками (Skeleton SK_Dog_Master, Import Animations и Physics Asset выкл.), в текстурах BaseColor Default+sRGB, Normal Normalmap, Roughness/Metallic Grayscale без sRGB.","Если карточку не создавали скриптом: дублируй образец (правый клик > Asset Actions > Duplicate): DA_Gear_VestScout1 / CollarScout1 / BeltScout1 (у пояса поле AttachedActorClass = BP_JetNozzles не менять). Имя обязательно DA_Gear_... внутри папки Gear. Поменяй PartId (уникальный), DisplayName (уникальное), StageIndex, GearClass, SkeletalMesh, Stats.","Уровни 2 и 3: ещё две копии, другие PartId, StageIndex 2 и 3, числа выше.","Каталог и меню Tab: остановить игру, Output Log > строка Cmd > py \"E:/Unreal Projects/FishtTheBattleDog/Tools/DebugMenu/gear_refresh_all.py\", затем Ctrl+Shift+S.","Проверка: Play, клавиша Tab, вкладка «Снаряжение», «\u003cСлот>: деталь», кнопка «\u003cСлот>: показать характеристики»; затем Output Log, поиск Error."],"traps":["Тяжёлый жилет всегда выглядит тяжёлым: другая деталь, а не скин.","У жилета нет AttachedActorClass, поэтому смена на тяжёлый убирает привязанную к нему механику.","Скрипт обновления не работает при запущенной игре (PIE).","Панель Fisht Export в старом .blend может быть без записи текстур: Text Editor > открыть Tools/Blender/fisht_export.py > Run Script.","Подсумки и пулемёт крепятся к СОКЕТАМ жилета (Socket_PouchL, Socket_PouchR, Socket_Gun): новый жилет работает и без них (запасное крепление и строка ОШИБКА ЖИЛЕТА в логе), при импорте жилета gear_import_part.py сокеты ставятся автоматически (запасной ручной вариант: py gear_add_sockets.py, раздел 10 инструкции). Нет жилета = нет подсумков и пулемёта.","Одинаковые PartId или DisplayName у двух деталей ломают выбор и загрузку сборок.","Слоты LegWraps (5) и Nozzles (6) помечены УСТАРЕЛО: не создавай детали в них; DA_Gear_Test* в каталог и меню не входят (на них ссылается BP_FishtCharacter)."],"src":["Docs/GEAR_ADD_ARMOR.md","Docs/VEST.md","Docs/VEST_NEW_ITEMS.md","Docs/PROGRESSION_PLAN.md"],"date":"2026-11-11"},{"id":"gear-skin","section":"Снаряжение и оружие","title":"Добавить скин (цвет, материал, пламя)","result":"Скин выбирается в меню Tab; статов не даёт.","steps":["Создай DA_GearSkin в Gear/Skins (по образцу Skin_*): SkinId, DisplayName, Family (как у детали).","Заполни только вид: MaterialOverride, ColorVariants (цвет идёт в параметр Tint), FlameColor, LightColor. Меш менять можно только внутри семейства.","Скин пояса несёт и вид сопл (сопла часть пояса): FlameColor и LightColor, ExtraMeshes [0] левое, [1] правое; альфа цвета 0 = значение не применять.","Запусти refresh_gear_catalog() и build_skin_provider() (Tools/DebugMenu), чтобы скин появился в Tab."],"traps":["Скин на деталь чужого семейства игнорируется.","Скин никогда не даёт статов: правило проекта."],"src":["Docs/VEST.md","Docs/PROGRESSION_PLAN.md"],"date":"2026-11-11"},{"id":"gear-loadout","section":"Снаряжение и оружие","title":"Собрать, сохранить и загрузить сборку экипировки","result":"Набор деталей, скинов и цветов одним нажатием.","steps":["Tab → вкладка «Снаряжение»: выбери деталь, скин и цвет для каждого слота (8 слотов, включая основное оружие).","Сохранить: «Сборка: сохранить в файл» или «Пресет 1–3: сохранить».","Загрузить: «Сборка: загрузить из файла» или «Пресет». Готовые сборки: Standard, Graphite, HeavyTest.","Новая готовая сборка: make_loadout(...) в Tools/DebugMenu/build_gear_catalog.py, затем build_skin_provider()."],"traps":["Старые сохранения на 7 слотов снимают пушку: надень заново.","Автозагрузки сохранённой сборки при старте нет (будет в схроне)."],"src":["Docs/VEST.md"],"date":"2026-11-11"},{"id":"gear-weapon-new","section":"Снаряжение и оружие","title":"Добавить новый пулемёт (модель, деталь, боеприпас)","result":"Новый пулемёт выбирается в Tab («Основное оружие: деталь»). ПОЛНАЯ пошаговая инструкция: Docs/GEAR_ADD_WEAPON.md.","steps":["Blender: модель на тех же костях Gun_Root, Gun_Arm1_Pitch, Gun_Arm1_Swing, Gun_Arm2, Gun_Head (арматура GunRig); экспорт: Fisht Export > «Новый предмет» > «На скелет», имя SKM_\u003cИмя>.fbx.","Unreal: импорт в Gear/LaserGun, Skeleton выбрать вручную SK_LaserGun_01, Import Animations выключено; проверить сокет Muzzle на кости Gun_Head.","Дублировать DA_Gear_LaserMG (Gear/Weapon), имя DA_Gear_...: PartId, DisplayName (уникальные), GearClass Light/Medium/Heavy, Family Gun_\u003cкласс>, GunMesh (твой меш), bUseGunProfile и GunRecoil*/GunGlow*, Stats (шум, штраф ускорения).","Боеприпас: дублировать DA_Ammo_LMG (Combat/Core): Damage, FireInterval, MagSize, FireSound; привязать в поле Ammo детали.","Остановить игру, Output Log > Cmd > py \"E:/Unreal Projects/FishtTheBattleDog/Tools/DebugMenu/gear_refresh_all.py\", Ctrl+Shift+S.","Проверка: Play, Tab, Снаряжение, «Основное оружие: деталь» (жилет должен быть надет), стрельба, Output Log (Error, Accessed None)."],"traps":["Сейчас Light/Medium/Heavy пулемёты: одна модель, один DA_Ammo_LMG, различаются только Stats; своих моделей и урона у них нет.","Другой скелет пушки: нужна отдельная турель и ABP (скажи Claude).","GunRecoilGain держать 1, выше 1,5 ствол дрожит; EmitterSide в турели должен быть 0.","Урон, звук, скорострельность лежат в DA_Ammo, а не в детали."],"src":["Docs/GEAR_ADD_WEAPON.md","Docs/GEAR_ADD_ARMOR.md","Docs/VEST.md"],"date":"2026-11-11"},{"id":"gear-weapon-pouch","section":"Снаряжение и оружие","title":"Пулемёт и подсумки: классы, цена, патронташ, скрытые характеристики","result":"Деталь пулемёта (слот 7) или подсумка (левый 2, правый 3) с классом, стадиями и ценой.","steps":["Дублируй близкую деталь: пулемёты в Gear/Weapon (DA_Gear_LaserMG = средний, _Light, _Heavy), левые подсумки в Gear/Pouches/AmmoL (3 класса × 3 стадии, стадия 1 лёгкого = DA_Gear_PouchL01), правые в Gear/Pouches/WeaponR (3 класса × 3 уровня, Light 1 = DA_Gear_PouchR01).","Задай PartId (уникальный), GearClass (Light/Medium/Heavy), для пулемёта Family Gun_\u003cкласс>, для левого подсумка StageIndex 1-3.","Левый подсумок: AmmoPlasticCapacity, CollectRadius, PullSpeed. Цена всех: NoiseLevel, AccelPenalty (%), PrintTime (с). Правый: SecondarySlots (слотов доп. оружия: Light 1, Medium 2, Heavy 3), SecondaryAmmoBonus (запас патронов, %), AllowedWeaponClasses, WeaponAnchorName. Выбор доп. оружия в Tab: «Доп. оружие 1/2/3: выбор», число выбранных не больше GetSecondarySlotCount.","RevealedStats: имена характеристик, открытых сразу; остальные показывать как ???. Открыть в игре: RevealStat(Item, Имя) на BP_FishtGearComponent (хранится в SG_GearReveal), проверить: IsStatRevealed.","refresh_gear_catalog() и build_skin_provider() (Tools/DebugMenu). Читать числа другим чатам: GetAmmoPlasticCapacity, GetCollectRadius, GetPullSpeed, GetAccelPenalty, GetNoiseLevel на BP_FishtGearComponent."],"traps":["Значения новых деталей стартовые, баланс настраивает пользователь.","Якорь доп. оружия: SceneComponent WeaponAnchor в BP_PouchModule, пока пустой.","Шум и штраф суммируются по слотам 2, 3, 7.","Переключение доп. оружия в бою (R, 1-4) пока не знает про слоты подсумка: это зона combat-core (список SecondaryAmmoList статический)."],"src":["Docs/VEST.md","Docs/PROGRESSION_PLAN.md"],"date":"2026-11-11"},{"id":"gear-stats","section":"Снаряжение и оружие","title":"Характеристики деталей: добавить стат и деталь с 3 уровнями","result":"Любая деталь (броня, пояс, ошейник, подсумок, оружие) даёт плюс или минус к статам; уровень = отдельная деталь.","steps":["Числа детали: открой DA_Gear_* и правь массив «Stats (характеристики детали...)»: строка = стат (E_GearStat) + число, минус разрешён. Не вписанный стат = 0.","Новая деталь с 3 уровнями: дублируй близкую (Gear/Vest, Belt, Collar), PartId с номером (VestMed1..3), StageIndex 1-3, свои Stats и DisplayName «Название N». Прокачка = замена детали.","Закрытые значения: «OpenStats» детали = какие статы открыты сразу, остальные показываются ???. Открыть в игре: RevealStat(Item, Stat) на BP_FishtGearComponent (файл SG_GearReveal).","Новый стат: в E_GearStat добавить значение В КОНЕЦ (EnumStructService.add_enum_value), затем геттер GetXxx() по образцу GetRegenCapBonus (вызов GetStatTotal с этим значением).","refresh_gear_catalog() и build_skin_provider() (Tools/DebugMenu). Tab «Снаряжение»: кнопка «\u003cслот>: показать характеристики» печатает статы надетой детали на экране.","Читать суммы другим чатам: GetStatTotal(Stat) или GetRegenCapBonus, GetBodyHealth, GetVisionRange, GetFootstepHearing, GetSpeedBonus, GetAccelPenalty, GetNoiseLevel, GetArmorReduction, GetStaminaBonus, GetSniffDuration (секунды, броня разведчика), GetAmmoPlasticCapacity, GetCollectRadius, GetPullSpeed."],"traps":["RegenCapBonus медицинских деталей = прибавка к порогу в п.п. (решено), RegenRateBonus = прибавка к скорости регенерации в %.","BodyHealth УСТАРЕЛ: у брони нет здоровья корпуса, не использовать.","Старые отдельные поля (ArmorReduction, NoiseLevel и т.д.) удалены, всё только в Stats.","Из Python структуру Stats задавать через copy()/import_text элемента или ObjectTools.set_properties."],"src":["Docs/GEAR_ADD_ARMOR.md","Docs/VEST.md"],"date":"2026-11-11"},{"id":"aim-assist","section":"Снаряжение и оружие","title":"Помощь прицеливания: уровни, геймпад и мышь","result":"Прицел слегка «липнет» к цели и доворачивает к ней; сила зависит от уровня и устройства.","steps":["Tab → «Бой»: «Помощь прицеливания: геймпад (0-4)» и «...: мышь (0-4)». 0 выкл, 1 слабая (только трение), 2 средняя, 3 сильная, 4 детская. Значения сохраняются сами.","Устройство определяется по последнему вводу (стик геймпада или движение мыши). Принудительно: «Помощь прицеливания: устройство» (-1 авто, 0 мышь, 1 геймпад).","Настроить уровень: открой Content/Fisht/Combat/Core/DA_AimAssist_\u003cN>_\u003cИмя>: конус и сила трения, конус и сила магнита, доворот без движения прицела (град/с), дальность.","Сбросить сохранённые уровни: удали Saved/SaveGames/PlayerSettings.sav при закрытой игре (по умолчанию геймпад 2, мышь 0)."],"traps":["На детском уровне камера сама подтягивается к ближайшей цели даже без движения стика (так задумано).","Пока это только камера; магнит пули и доводка при прицеливании будут во втором этапе."],"src":["Docs/COMBAT_PLAN.md"],"date":"2026-11-10"},{"id":"plastic-vacuum","section":"Снаряжение и оружие","title":"Пластик: сбор «пылесосом», ёмкость, сохранение","result":"Куски пластика сами летят к левому подсумку; боевой до ёмкости подсумка, улучшающий без лимита и сохраняется.","steps":["Положить кусок: перетащи BP_ResourcePickup (Content/Fisht/Combat/Pickups) в уровень, задай Resource (CombatPlastic/UpgradePlastic) и Amount. Для стрельбища RespawnDelay > 0 (вернётся на место).","Выпадение из врага: компонент BP_LootDropComponent (Resource, AmountMin/Max, Chance) на BP врага, DropNow при смерти.","Радиус, скорость и ёмкость задаёт левый подсумок (поля AmmoPlasticCapacity, CollectRadius, PullSpeed у DA_Gear_PouchL*). Без подсумка: CollectRadius, PullSpeed, CombatPlasticCap у BP_WeaponComponent.","Сколько кусков летит сразу: PullMaxFlying у BP_WeaponComponent (8). Насколько близко засчитывать: ArriveDist (40 см).","Вид «капля ртути»: в MI_Plastic_Combat / MI_Plastic_Upgrade (родитель M_Plastic_Mercury) крути Tint (оттенок), TintAmount (доля оттенка в отражении), Roughness (0 = зеркало), Glow, WobbleAmp/WobbleSpeed (деформация), HoverAmp/HoverSpeed (парение).","Улучшающий пластик копится в Saved/SaveGames/PlayerProgress.sav (SG_PlayerProgress.UpgradePlastic). Обнулить: удали этот файл при закрытой игре."],"traps":["Полный подсумок: боевой кусок остаётся лежать, это не ошибка.","Скорость полёта = PullSpeed + скорость пса, поэтому кусок догоняет и медленный подсумок.","Проверка идёт раз в 0,2 с, а не каждый кадр: кусок срывается с места с небольшой задержкой."],"src":["Docs/COMBAT_PLAN.md","Docs/PROGRESSION_PLAN.md"],"date":"2026-11-10"},{"id":"ammo","section":"Снаряжение и оружие","title":"Добавить новый боеприпас (ракета, граната и т.п.)","result":"Новый боеприпас во втором слоте, графы Blueprint не трогаем.","steps":["В Content/Fisht/Combat/Core найди близкий DA_Ammo_* (например DA_Ammo_Rocket) и дублируй в Content Browser.","Задай в копии: цену в боевом пластике, урон, скорострельность, заряд, перезарядку, снаряд, самонаведение.","Эффекты по желанию: MuzzleFX, ImpactFX, ExplodeFX, звуки, трассу. Пустой слот = нет эффекта.","Добавь копию в список SecondaryAmmoList компонента BP_WeaponComponent. Клавиши 1–4 выбирают боеприпас второго слота, R меняет по кругу."],"traps":["Подсказки у полей нет, пояснение вшито в имя поля.","Пробитие пулями пока не решено (вместе с рельсотроном).","Звуки и эффекты сейчас заглушки."],"src":["Docs/COMBAT_PLAN.md"],"date":"2026-11-10"},{"id":"weapon","section":"Снаряжение и оружие","title":"Добавить новый пулемёт или основное оружие","result":"Оружие надевается в слот «основное оружие» (слот 7) и стреляет своим боеприпасом.","steps":["Смоделируй пушку в Blender: корень в нуле, оси шарниров X, меши привязаны к костям. Экспорт пресетом Fisht_4_Rig_Mesh_Animation.","Импортируй в Unreal: Skeletal Mesh, свой скелет, клипы и ABP по образцу ABP_LaserGun.","Сделай актор по образцу BP_LaserTurret (меш, ABP, точка Muzzle).","Сделай DA_Ammo_* для выстрела (урон, звук, эффекты).","Создай DA_Gear_\u003cПушка> в Gear/Weapon: Family, AttachedActorClass = твой актор, Ammo = твой DA_Ammo.","refresh_gear_catalog() и build_skin_provider(): пушка появится в Tab, строка «Основное оружие»."],"traps":["Отдача определяется по падению магазина Slot0: без расхода патронов отдачи не будет.","Профиля пушки DA_GunProfile пока нет: звук, урон и эффекты лежат в DA_Ammo, а не в акторе.","Основное оружие меняется только в схроне (так решено), сейчас через Tab."],"src":["Docs/VEST.md","Docs/COMBAT_PLAN.md","Docs/VEST_NEW_ITEMS.md"],"date":"2026-11-11"},{"id":"anim-gun","section":"Анимация","title":"Залить анимацию из Blender (пушка или собака)","result":"Клип заменён в Unreal, ссылки в ABP сохранены.","steps":["В Blender поправь действие в Action Editor. Имя действия = имя клипа (Gun_Deploy, Gun_Retract, Gun_Idle, Gun_Stowed). Включи Fake User (щит). Длительность не меняй без предупреждения.","Панель Fisht Export: для одного клипа выбери его в поле «Одно действие», нажми «Пушка: ТОЛЬКО анимации» или «Собака: ТОЛЬКО анимации».","Unreal: ПКМ на папке Gear/LaserGun/Anims → Import → файл из export/anims_only/.","В окне импорта: Skeletal Mesh ВЫКЛ., Skeleton выбрать вручную (SK_LaserGun_01 или SK_Dog_Master), Import Animations вкл., Sample Rate 30.","Клип с тем же именем заменяется. Лишний пустой клип ...Take удали.","Выстрел: ПКМ на клипе → Create → AnimMontage, слот GunFire, потом поле FireMontage в BP_LaserTurret."],"traps":["Не включай Create Physics Asset и Import Mesh.","Риг менялся: заливай и меш кнопкой «Пушка: модель + риг + все анимации».","Пушка выше или в стороне: экспортировали руками, а не кнопкой."],"src":["Docs/VEST_NEW_ITEMS.md","Docs/VEST.md"],"date":"2026-11-10"},{"id":"fur","section":"Персонажи","title":"Поправить цвет и вид шерсти Фишта","result

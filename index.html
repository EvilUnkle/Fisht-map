жна быть отпущена, чтобы включился занос; короткий тап не считается. По умолчанию 0.02. | 0…0.3 | 0.01 |  |\r\n| `RelSkBrake` | Занос при остановке: торможение, см/с² | Меньше = дольше и дальше скользит (420: с бега около 0.55 с и 120 см; при заносе в обратную сторону торможение задаёт «Занос: торможение»). По умолчанию 420. | 150…1500 | 10 |  |\r\n| `RelSkBoost` | Занос при остановке: доля скорости, множитель | Какую часть скорости бега вернуть в начале заноса (обычное торможение клавишей уже съело часть). 1 = полностью. По умолчанию 0.95. | 0.5…1.0 | 0.05 |  |\r\n\r\n## Занос при развороте\r\n\r\n| Id | Параметр | Что делает | Диапазон | Шаг | Где влияет |\r\n|---|---|---|---|---|---|\r\n| `RevMinSpeed` | Занос: минимальная скорость, см/с | Если пёс бежит медленнее, резкая смена направления заноса не даёт (просто разворот). Меньше = занос и на медленной ходьбе. По умолчанию 80. | 20…200 | 5 | BP_TurnInPlace |\r\n| `RevAngle` | Занос: от какого угла ввода, ° | Угол между скоростью и вводом, с которого поворот считается «обратным» (занос и разворот). Больше = занос только при почти полном развороте. По умолчанию 120. | 90…175 | 1 | BP_TurnInPlace |\r\n| `SkidBrake` | Занос: торможение, см/с² | Насколько быстро пёс гасит скорость в заносе. Путь заноса = v²/(2·торможение): при 900 бег останавливается за ~55 см, рысь за ~30. Меньше = длиннее занос. По умолчанию 900. | 300…2000 | 50 | BP_TurnInPlace |\r\n| `SkidEnd` | Занос: конец при скорости ниже, доля | Занос кончается, когда скорость упала ниже этой доли начальной (0.3 = до 30%). Больше = занос короче. По умолчанию 0.3. | 0.1…0.6 | 0.05 | BP_TurnInPlace |\r\n| `TurnAccMul` | Разворот: разгон, множитель | Ускорение во время разворота после заноса относительно обычного. Меньше = пёс разворачивается почти на месте. По умолчанию 0.5. | 0.1…1.5 | 0.1 | BP_TurnInPlace |\r\n| `TurnMaxT` | Разворот: не дольше, с | Предел длительности разворота после заноса. По умолчанию 0.3. | 0.1…0.8 | 0.05 | BP_TurnInPlace |\r\n| `TurnDoneAng` | Разворот: считается законченным, ° | Когда корпус повёрнут к вводу не хуже этого угла, разворот кончается и начинается разгон. По умолчанию 25. | 5…60 | 1 | BP_TurnInPlace |\r\n| `RevRot` | Разворот: скорость поворота, °/с | Как быстро корпус поворачивается во время разворота после заноса (обычно 360). По умолчанию 720. | 360…1440 | 30 | BP_TurnInPlace |\r\n| `RevAccMul` | Разгон после разворота: множитель | Усиление ускорения в окне разгона после разворота. Больше = резче набирает скорость назад. По умолчанию 1.3. | 0.5…4.0 | 0.1 | BP_TurnInPlace |\r\n| `RevWindow` | Разгон после разворота: длительность, с | Сколько секунд держится усиленное ускорение после разворота. По умолчанию 0.45. | 0.2…1.0 | 0.05 | BP_TurnInPlace |\r\n\r\n## Поза заноса\r\n\r\n| Id | Параметр | Что делает | Диапазон | Шаг | Где влияет |\r\n|---|---|---|---|---|---|\r\n| `SkPitch` | Грудь вверх в заносе, ° | Насколько грудь задирается вверх в позе заноса (поверх самой позы заноса, которая теперь = поза скольжения Idle_5). 0 = как в позе. По умолчанию 0. | 0…25 | 1 | ABP_Dog (через BP_TurnInPlace) |\r\n| `SkDrop` | Таз вниз в заносе, JR-см | Дополнительная просадка таза в заносе (1 JR-см ≈ 1.4 см в игре). По умолчанию 0. | 0…5 | 0.1 | ABP_Dog (через BP_TurnInPlace) |\r\n| `SkSh` | Передние лапы вперёд в заносе, ° | Вынос плеч вперёд, пёс «упирается» лапами; высота лап по земле выравнивается сама. По умолчанию 0. | 0…40 | 1 | ABP_Dog (через BP_TurnInPlace) |\r\n| `SkTail` | Хвост в заносе, ° (минус = вверх) | Поворот хвоста в заносе. Минус поднимает хвост, плюс опускает. По умолчанию 0. | -50…50 | 1 | ABP_Dog (через BP_TurnInPlace) |\r\n| `SkHind` | Задние лапы в заносе, ° | Дополнительный поворот бёдер задних лап (подгиб берётся в основном из позы). По умолчанию 0. | -40…40 | 1 | ABP_Dog (через BP_TurnInPlace) |\r\n| `SkHead` | Голова в заносе, ° | Дополнительный наклон головы в заносе. По умолчанию 0. | -30…30 | 1 | ABP_Dog (через BP_TurnInPlace) |\r\n\r\n## Подкат\r\n\r\n| Id | Параметр | Что делает | Диапазон | Шаг | Где влияет |\r\n|---|---|---|---|---|---|\r\n| `SlideMin` | Подкат: от какой скорости, см/с | Присед на такой скорости и выше даёт скольжение, ниже — обычный присед (ходьба 100 = просто присел). По умолчанию 200. | 100…330 | 10 | BP_TurnInPlace |\r\n| `SlideEndSpeed` | Подкат: конец при скорости ниже, см/с | Скольжение кончается, когда скорость упала ниже; пёс остаётся в приседе. Держи рядом со скоростью хода в приседе (90), тогда конец плавный. По умолчанию 100. | 10…150 | 5 | BP_TurnInPlace |\r\n| `SlideNow` | Подкат: мин. скорость, если Shift уже отпущен, см/с | Подкат можно начать и после того, как пёс сбросил скорость (отпустил ускорение/движение), если недавно он бежал быстрее «Подкат: от какой скорости». Ниже этой скорости подката нет. По умолчанию 90. | 30…200 | 5 | BP_TurnInPlace |\r\n| `SlideBoost` | Подкат: доля прежней скорости, множитель | Подкат стартует со скоростью не ниже этой доли от последней скорости бега (чтобы подкат после отпускания Shift не терял разгон). 0 = только текущая скорость. По умолчанию 0.9. | 0…1 | 0.05 | BP_TurnInPlace |\r\n| `SlideJumpZ` | Прыжок из подката: сила, см/с | Вертикальная скорость прыжка из скольжения (умножается на множитель способности). По умолчанию 380. | 150…700 | 10 | BP_TurnInPlace |\r\n| `SlideSlopeK` | Подкат: влияние склона, см/с² | Насколько склон меняет торможение: вверх скольжение короче, вниз длиннее. 0 = склон не влияет. По умолчанию 600. | 0…1200 | 50 | BP_TurnInPlace |\r\n| `SlideDebugOn` | Подкат: метка на экране, 1 вкл 0 выкл | При старте и конце скольжения пишет на экране и в лог «SLIDE start/end v=…» (скорость). Отладка; можно выключить. | 0…1 | 1 | BP_TurnInPlace |\r\n","date":"2026-11-07"},{"path":"Docs/Hub/README.md","title":"Карта проекта: как дописать запись","section":"Карта проекта","md":"# Карта проекта: как дописать запись\n\nСтраница: https://evilunkle.github.io/Fisht-map/ (открыта всем, у кого есть ссылка, вход не нужен). Репозиторий `EvilUnkle/Fisht-map` публичный. Пользователь разрешил выкладывать всё, включая сюжет (2026-11-06). Паролей, ключей и личных данных здесь быть не должно.\nЗапасная приватная копия: https://claude.ai/artifact/8mJuGMaRtj7UJixHPke68K (slug `3edfba7c-023c-4340-b4ed-188de73c3d14`).\nИсточник правды: JSON в этой папке. Страница из них собирается. Руками HTML не правь.\n\n## Файлы\n| Файл | Раздел | Запись |\n|---|---|---|\n| `waiting.json` | Ждёт вас | `{\"id\":\"w-...\",\"system\":\"\u003cid системы>\",\"kind\":\"verdict\"\\|\"question\",\"text\":\"коротко\",\"added\":\"ГГГГ-ММ-ДД\",\"ref\":\"Docs/...\"}` |\n| `systems.json` | Системы | `{\"id\",\"name\",\"icon\",\"status\",\"check\",\"note\",\"doc\",\"image\"?}` |\n| `decisions.json` | Решения | `{\"date\":\"ГГГГ-ММ-ДД\",\"system\":\"\u003cid>\",\"title\":\"что решили\",\"replaced\":\"что отменило\",\"doc\":\"Docs/...\"}` |\n| `world.json` | Мир | блоки `story`, `characters`, `dialogues`, `sound`, `style`: `{\"id\",\"title\",\"text\",\"src\",\"state\"}`; `gaps`: `{\"id\",\"kind\":\"contradiction\"\\|\"missing\"\\|\"logic\",\"title\",\"text\",\"src\"}` |\n| `howto.json` | Инструкции | карточки «как добавить…» (написаны ВРУЧНУЮ) и список полных документов, см. ниже |\n| `atlas.json` | Атлас | запланирован, пока пусто |\n\n## Сценарий и ответы пользователя (пишутся на сайте)\nСайт статический, поэтому запись идёт в репозиторий `EvilUnkle/Fisht-map` через GitHub API: пользователь один раз на устройстве вводит свой fine-grained токен (только репозиторий `Fisht-map`, Contents: Read and write); токен лежит в `localStorage` браузера, в коде и коммитах его нет. Без токена страница только для чтения.\n- **Сценарий:** главы в `story/NN-имя.md` репозитория сайта (первая строка `# Название`). Вкладка «Сценарий»: чтение, «✏ Редактировать» (текст + превью, черновик в `localStorage`), «＋ Новая глава». Если файл на сайте изменился, пока его правили, запись отклоняется (sha), ничего не затирается.\n- **Ответы:** в «Ждёт вас» под каждым пунктом поле «Ответить». Ответ коммитится в `answers/\u003cid>.json` (`id`, `question`, `system`, `asked`, `answered_at`, `answer`). Пока пункт висит в `waiting.json`, он помечен «ответ получен, ждёт обработки».\n- **Копия в проекте (координатор, перед `deploy.ps1`):**\n  `powershell -NoProfile -ExecutionPolicy Bypass -File Tools/ProjectMap/pull_story.ps1` забирает `story/` в `Docs/story/` (оттуда копия вшивается в страницу как запасная); закоммить `Docs/story/`.\n  `powershell -NoProfile -ExecutionPolicy Bypass -File Tools/ProjectMap/pull_answers.ps1` забирает `answers/` в `Docs/Hub/answers/` и печатает новые ответы. После обработки удали вопрос из `waiting.json` и сделай `deploy.ps1`.\n- `deploy.ps1` сначала делает `git pull --rebase` в клоне сайта и меняет только `index.html`: `story/` и `answers/` он не перезаписывает.\n- Правка сценария чатами: только через `Docs/story/` → коммит в проекте → скопировать в клон сайта; но источник правды сценария теперь сайт, поэтому сначала `pull_story.ps1`.\n\n## Что пользователь пишет на сайте: где это читать чатам\nЗаметки, сценарий, ответы и свои карточки пользователя лежат в **`Docs/Hub/user/`** (зеркало репозитория сайта): `story/` (главы сценария), `answers/` (ответы на вопросы, `\u003cid>.json`), `cards/` (карточки `\u003cid>.json` и `cards/media/\u003cid>/…`), плюс любые папки, которые появятся на сайте позже. Чаты читают это как обычные файлы и **не правят**: источник правды сайт.\nОбновляет зеркало координатор одной командой (она же печатает новое, изменённое и удалённое с датой):\n`powershell -NoProfile -ExecutionPolicy Bypass -File Tools/ProjectMap/pull_all.ps1`\nЗапускать перед `deploy.ps1` (из `Docs/Hub/user/story` берётся запасная копия сценария для страницы) и коммитить `Docs/Hub/user/`. Файлы, удалённые на сайте, из зеркала убираются (история в git остаётся). `pull_story.ps1` и `pull_answers.ps1` остались как частные варианты.\n\n## Картотека (карточки персонажей, врагов, оружия, брони, модулей, звуков, мест)\n- **Свои карточки** пишет пользователь на сайте (тот же токен): `cards/\u003cid>.json` и `cards/media/\u003cid>/…` в репозитории `Fisht-map`. Картинки ужимаются в браузере до 1600 px и ~400 КБ, звуки до 2 МБ (mp3, ogg, wav, m4a). Сохранение проверяет sha, черновик лежит в `localStorage`, удаление с подтверждением. Из проекта их не правим.\n- **Карточки «из игры»** (только чтение, зелёная пометка): `Docs/Hub/game_cards.json`, его создаёт `Tools/ProjectMap/export_game_cards.py` из открытого редактора (только чтение ассетов): `DA_EnemyType`, `DA_Ammo_*`, `DA_GearItem`, `DA_GearSkin`. Подписи статов берутся из русских пояснений в именах полей (`combat_names.py`, `gear_names.py`).\n  **Когда перезапускать экспорт:** после изменения этих DA или добавления нового врага, боеприпаса, детали или скина. Запуск (PIE остановлен, нет `Saved/PIE_LOCK.txt`, `auto_save=false`): `exec(open(r\"E:/Unreal Projects/FishtTheBattleDog/Tools/ProjectMap/export_game_cards.py\", encoding=\"utf-8-sig\").read())`, потом `deploy.ps1` и коммит `game_cards.json`.\n- Русские названия новых ассетов добавляй в словари `ENEMY_NAMES`, `AMMO_NAMES`, `GEAR_RU`, `SKIN_RU` в скрипте экспорта (в ассетах `DisplayName` английский).\n- Своя карточка может ссылаться на игровую (`link` = id вида `game-enemy-DroneLight`): страница покажет «задумано» и «в игре сейчас» рядом, расхождения помечаются `≠`.\n- Редкость игровых карточек условная (по здоровью или урону в секунду), миниатюр ассетов нет (значок типа).\n- Лимиты: без токена чтение списка идёт через GitHub API (60 запросов/ч с одного IP), тела файлов с raw; с токеном лимит 5000/ч. Картинки и звуки отдаются с сайта (Pages обновляется за 1–2 минуты, до тех пор берутся с raw).\n\n## Вкладка «Инструкции» (чтобы не устаревала)\n- **Полные документы** (`docs` в `howto.json`) вшиваются в страницу прямо из `.md` при каждой сборке: изменил `.md` и пересобрал, страница обновилась сама. Дата «обновлён» берётся из git.\n- **Карточки** (`cards`) пишутся вручную как короткая выжимка: `id`, `section`, `title`, `result`, `steps[]`, `traps[]`, `src[]` (первый путь даёт дату «источник обновлён»). Сборка проверяет раздел, наличие файлов `src` и отсутствие секретов в тексте.\n- **ПРАВИЛО:** чат, который изменил порядок добавления чего-либо (пропс, враг, деталь, оружие, анимация, меню), обновляет свой `.md` и соответствующую карточку в `howto.json`, затем пересобирает страницу. Нового документа нет в списке: допиши его в `docs`.\n- Не клади в `.md`, которые попадают на страницу, пароли, ключи, токены и личные пути: страница публичная, сборка остановится, если увидит похожее.\n\n`status` системы: `idea` (идея), `wip` (в работе), `built` (собрано), `verified` (проверено пользователем).\n**`verified` ставит только пользователь своим словом.** Проверка по данным из PIE = `built`. Не уверен: в `check` пиши «не проверено».\n`system` в записях должен совпадать с `id` из `systems.json` (новую систему сначала добавь туда).\n\n## Правила для чата\n1. Закончил шаг и нужен вердикт или ответ: допиши строку в `waiting.json`. Пользователь ответил: **удали** строку.\n2. Пользователь принял решение: допиши в `decisions.json`, в `replaced` что оно отменило.\n3. Сменился статус твоей системы: поправь `status` и `check` в `systems.json`.\n4. Текст короткий (до ~12 слов), подробности по ссылке `doc`/`ref`.\n5. Коммить только `Docs/Hub/*`.\n\n## Сборка и публикация\n```\nnode Tools/ProjectMap/build.js\n```\nПроверяет JSON (статусы, ссылки на системы, даты) и пишет `Tools/ProjectMap/out/index.html`.\nОсновная публикация: `powershell -NoProfile -ExecutionPolicy Bypass -File Tools/ProjectMap/deploy.ps1`, собирает и отправляет на GitHub Pages (клон `E:\\Unreal Projects\\Fisht-map`, запрет индексации, почта автора noreply). Страница обновляется за 1–2 минуты.\nПриватная копия (необязательно, инструмент `mcp__claude-artifacts__publish_files`, загрузить через ToolSearch):\n1. `get_artifact` со slug выше, взять `version`.\n2. `publish_files` с `slug`, `base_version`=эта версия, `files=[{\"as\":\"index.html\",\"path\":\"E:\\\\Unreal Projects\\\\FishtTheBattleDog\\\\Tools\\\\ProjectMap\\\\out\\\\index.html\"}]`. `title`/`icon` не указывать.\nЕсли `read` не `owner`, добавить `shared_live` с этим значением. Ссылка не меняется.\n\nКартинка системы: положи png/jpg в `Docs/Hub/img/` (до ~150 КБ, иначе страница тяжёлая) и впиши в `image` путь от корня репозитория, например `\"Docs/Hub/img/combat.jpg\"`; сборщик вшьёт её в страницу.\n\n## Ограничения\nСтраница статична: кнопок «готово» нет, вердикт пользователь говорит чату, чат удаляет строку.\n","date":"2026-11-09"},{"path":"Tools/BlueprintCleanup/README_method.md","title":"Порядок в Blueprint: метод","section":"Отладка","md":"# Наведение порядка в Blueprint: метод (чат «Жилет», 2026-11-07)\nРезультат: Tick/BeginPlay разнесены на функции с русскими комментариями, переменные в нумерованных категориях, имена «English (описание)». Примеры: `BP_LaserTurret`, `BP_PouchModule`, `BP_JetNozzles` (Content/Fisht/Gameplay/Gear). Логику НЕ менять, только раскладывать.\n\n## 1. Функции из Tick/BeginPlay\nСкрипт: `Tools/BlueprintCleanup/bp_split.py` (класс `Splitter`, закоммичен; docstring вверху = пример вызова). Выгружает граф через `BlueprintService.get_graph_definition` (формат совместим с `build_graph`) и собирает функции программно.\n1. Работать в редакторе без PIE, ассет сохранён и закоммичен (откат = `git checkout`/`revert`).\n2. `dump_graph(BP, \"x.json\")`; `Splitter(BP, \"x.json\")`; `chain(\"ReceiveTick\")` даёт линейную цепочку exec-узлов. Распечатайте её (индекс, тип, переменная) и выберите границы между блоками Set (обычно по смыслу: углы, отдача, выходы...). Цепочка обязана быть линейной, ветвления (Branch) оставляйте внутри одного куска или как «охранник» (`guard_last`, например IsValid компонента).\n3. `make_function(имя, комментарий, кусок_цепочки, \"ReceiveTick\")`: берёт exec-узлы куска + все чистые (pure) узлы выше по входам (дублируются в каждой функции, где нужны: порядок вычислений как в оригинале), `DeltaSeconds` события превращает в параметр функции. Ссылки узлов заменяются на `n\u003cчисло>` (в именах ссылок с точкой build_graph ломается).\n4. Сверка: в `make_function` после сборки `assert` на равенство числа узлов, связей и значений по умолчанию (`len(nodes)+1` из-за entry; комментарий добавляется после сверки, иначе счёт сбивается). Скрипт кидает исключение при любой ошибке/предупреждении build_graph.\n5. `compile_blueprint` ОБЯЗАТЕЛЬНО до пересборки EventGraph, иначе вызов новой функции «не найден в классе».\n6. `rebuild_event_graph([(функция, есть_ли_DeltaSeconds), ...], begin_fn=..., guard_last=...)`: удаляет всё кроме событий, оставляет цепочки прочих событий (интерфейсные) и «охранника», добавляет вызовы функций подряд. Параметр DeltaSeconds проверяйте через `get_function_parameters`.\n7. Имена: `Tick1_Deploy` ... `Tick9_...` (порядок в списке функций), `InitXxx` для BeginPlay. Комментарий вокруг узлов: `add_comment_around_nodes`.\n8. Проверка: компиляция 0 ошибок + PIE: старт `LevelEditorSubsystem.editor_request_begin_play()`, затем ОТДЕЛЬНЫМИ вызовами читать переменные актёра (`time.sleep` внутри Python морозит игру). Во время PIE `BlueprintService` ничего не видит: сначала `editor_request_end_play()`.\n\n## 2. Категории\n`unreal.BlueprintEditorLibrary.set_blueprint_variable_category(bp_asset, имя_переменной_целиком, \"N Название\")`. Нумерация в начале даёт порядок: 1 то, что правят (оружие/настройка), 2.. группы, предпоследняя «Выходы для ABP (не трогать)», последняя «Служебное (не трогать)». Группируйте по префиксу имени/смыслу; сначала проверяйте исключения (например `RecoilOut` попало в «Отдачу» вместо «Выходов»: проверять `endswith(\"Out\")` раньше префиксов). Подсказки (tooltip) через MCP поставить нельзя, поэтому описание кладём в имя (п. 3).\n\n## 3. Имена «English (описание по-русски)»\nПеременные BP: `add_member_variable(bp, \"Name (описание)\", тип)`, затем `BlueprintEditorLibrary.replace_variable_references(старое, новое)` / перепривязка узлов, компиляция, удаление старой `remove_member_variable`. Кириллица, скобки, запятые в имени работают; точку в имени НЕ ставить (ломает ссылки `узел.пин` в build_graph). `get/set_editor_property` принимает полное имя.\nПоля DataAsset (риск падения!): таблица `Tools/DebugMenu/gear_names.py` (`GEAR_FIELDS`, `fn(класс, поле)`). Порядок строго такой:\n1) сохранить значения всех экземпляров в JSON; 2) добавить НОВЫЕ поля с русским именем; 3) перепривязать узлы графов, где поля читаются; 4) перезапустить редактор; 5) перенести значения из JSON; 6) в следующем сеансе удалить старые поля. Этапами с перезапуском между ними.\nДля перечислений: значения enum восстанавливать через `type(a.get_editor_property(...))`.\n\n## 4. Ловушки\n- Пины-классы: выгрузка графа ТЕРЯЕТ значения по умолчанию у пинов с классом/объектом (`GetComponentByClass.ComponentClass`, возможно SetStaticMesh-литералы). После сборки впишите `S.set_node_pin_value(bp, граф, node_id, \"ComponentClass\", \"/Game/...BP_X.BP_X_C\")`. Симптом, когда забыли: Tick «молчит», компонент None (так пропала анимация пушки).\n- Функции не видны классу до компиляции (п.1.5).\n- `build_graph`: ссылки узлов с точкой в имени (из имён переменных вроде «макс. скорость») режутся по первой точке: переименовать в алиасы `n\u003cчисло>`. Разбор `узел.пин` в своём коде делать по самому длинному совпавшему префиксу-ссылке.\n- Файл скрипта, записанный PowerShell `Set-Content -Encoding UTF8`, получает BOM: читать `utf-8-sig`. `String.Replace` с 3 аргументами в PS 5.1 не существует.\n- Откат ассетов из git при открытом редакторе: файл блокируется (`unable to unlink`). Закройте вкладку ассета (`AssetEditorSubsystem.close_all_editors_for_asset`), снова `git checkout`, затем `EditorLoadingAndSavingUtils.reload_packages(пакеты, ReloadPackagesInteractionMode.ASSUME_POSITIVE)`. Не откатывайте ABP, если пользователь успел править его в редакторе (потеряются его подключения клипов).\n- Импорт «всей сцены» FBX вливает кости в скелет и пересохраняет все клипы: после такого откат `SK_*` и анимаций из git.\n- Падение Python (PYTHON_EDITOR_CRASH) при удалении полей класса DataAsset с загруженными экземплярами: см. п.3; перезапуск редактора отвязанно (CLAUDE.md §16), несохранённое теряется, поэтому сохраняйте и коммитьте после каждого шага.\n- `remove_function_graph` возвращает None даже при успехе: проверяйте по `list_graphs`.\n- Чистые узлы пересчитываются в точке использования: при разрезе порядок Set-узлов не менять, иначе значения сдвинутся на кадр.\n- Interface-события без выходов приходят как Event-узлы; вызов интерфейса из графа: Cast To BPI_..., затем функция.\n\n## 5. Что оставлять английским\nБез русского пояснения в имени: выходы и входы, которые читает ДРУГОЙ Blueprint или AnimBP (`*Out`, `Deployed`, `bUseRecoilIn` у турели; переменные `BP_FishtGearComponent`, вызываемые из провайдеров и меню F1). Переименование ломает ссылки в чужих графах. Описание таких переменных держите в категории и в `Docs/*.md`.\n","date":"2026-11-07"}]},"generated":"2026-11-10 21:27"};

 if(a==="k-sdel"){kcollect();const i=+b.dataset.i;if(b.dataset.n)KE.newSounds.splice(i,1);else KE.card.sounds.splice(i,1);kedPaint();return}

async function shrink(file){const url=URL.createObjectURL(file);
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej("Не удалось прочитать картинку «"+file.name+"». Подойдут JPEG, PNG, WebP.");i.src=url});
 const M=1600,s=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
 let q=0.85,b;do{b=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));q-=0.1}while(b&&b.size>KMAXIMG&&q>0.4);
 if(!b)throw "Браузер не смог сжать картинку.";
 const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(",")[1]);f.readAsDataURL(b)});
 return {b64,url:URL.createObjectURL(b),size:b.size}}

   const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(f)});
   KE.newSounds.push({name:f.name.replace(/\.[^.]+$/,""),ext,b64})}

 try{if(!sha)sha=await ghSha("cards/"+id+".json");const r=await ghDel("cards/"+id+".json",sha,"Card deleted: "+id);if(!r.ok){if(e)e.innerHTML=msgBox(errText(r.status),"bad");return}}
 catch(x){if(e)e.innerHTML=msgBox(errText(typeof x==="number"?x:0),"bad");return}
 await kcleanup(id,[]);KS.user=KS.user.filter(x=>x.id!==id);kgrid();location.hash="cards"}
document.getElementById("gen").textContent=D.generated;
const tabs=[["wait","🙋","Ждёт вас",D.waiting.length],["sys","🧩","Системы"],["dec","📜","Решения"],["story","📝","Сценарий"],["cards","🃏","Картотека"],["howto","🛠","Инструкции"],["world","📖","Мир"]];
document.getElementById("nav").innerHTML=tabs.map(t=>`<a href="#${t[0]}" data-t="${t[0]}"><b>${t[1]}</b>${t[2]}${t[3]?`<span class="n">${t[3]}</span>`:""}</a>`).join("");
function show(){const h=(location.hash||"#wait").slice(1);const k=tabs.some(t=>t[0]===h)?h:(/^(doc|card)-/.test(h)?"howto":(/^kt-/.test(h)?"cards":"wait"));if(k==="howto")rh(h);if(k==="story")sv();if(k==="cards")kv(h);else kclose();
 document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="s-"+k));
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t===k));window.scrollTo(0,0)}
addEventListener("hashchange",show);show();
function chips(el,items,cur,cb){el.innerHTML=items.map(i=>`<button class="chip${i[0]===cur?" on":""}" data-v="${esc(i[0])}">${esc(i[1])}</button>`).join("");
 el.onclick=e=>{const b=e.target.closest(".chip");if(b)cb(b.dataset.v)}}
function sysFilter(list){const ids=[...new Set(list.map(x=>x.system))];return [["","Все"],...ids.map(i=>[i,sysName[i]||i])]}
let wf="";function rw(){chips(document.getElementById("wf"),sysFilter(D.waiting),wf,v=>{wf=v;rw()});
 const l=D.waiting.filter(x=>!wf||x.system===wf);
 document.getElementById("wl").innerHTML=l.length?l.map(x=>`<div class="item ${x.kind==="question"?"q":""}"><div class="t"><span class="tag">${x.kind==="question"?"вопрос":"вердикт"}</span>${esc(x.text)}</div><div class="m">${esc(sysName[x.system]||x.system)} · ${esc(x.added)}${x.ref?" · "+esc(x.ref):""}</div>${ansBlock(x)}</div>`).join(""):`<div class="empty">Пусто 🎉</div>`}rw();tkFill();loadAnswers();
document.getElementById("leg").innerHTML=SO.map(k=>`<span class="st ${k}" style="font-size:12px;padding:2px 8px">${ST[k]}</span>`).join("");
document.getElementById("sg").innerHTML=D.systems.map(s=>{const n=SO.indexOf(s.status);
 return `<div class="sys">${s.image?`<img src="${esc(s.image)}" alt="">`:""}<h3>${esc(s.icon)} ${esc(s.name)}</h3><span class="st ${esc(s.status)}">${ST[s.status]||esc(s.status)}</span><div class="bar">${SO.map((k,i)=>`<i class="${i<=n?"f "+s.status:""}"></i>`).join("")}</div><p>${esc(s.note)}</p><div class="m">${esc(s.check||"не проверено")}</div></div>`}).join("");
const WB=[["story","Сюжет"],["characters","Персонажи"],["dialogues","Диалоги"],["sound","Звук"],["style","Стиль"],["gaps","Пробелы"]];
const GK={contradiction:"противоречие",missing:"не придумано",logic:"логика"};
let mf="";function rm(){const W=D.world;
 chips(document.getElementById("mf"),[["","Все"],...WB.map(b=>[b[0],b[1]+" "+((W[b[0]]||[]).length)])],mf,v=>{mf=v;rm()});
 const sel=WB.filter(b=>!mf||b[0]===mf);
 document.getElementById("ml").innerHTML=sel.map(b=>{const l=W[b[0]]||[];
  return `<div class="wh">${b[1]}</div>`+(l.length?l.map(x=>b[0]==="gaps"?`<div class="wc gap ${esc(x.kind)}"><h4><span class="tag" style="${x.kind==="missing"?"background:var(--wip);color:#000":""}">${esc(GK[x.kind]||x.kind)}</span>${esc(x.title)}</h4><p>${esc(x.text)}</p><div class="m">${esc(x.src)}</div></div>`:`<div class="wc"><h4>${esc(x.title)}${x.state?`<span class="sb">${esc(x.state)}</span>`:""}</h4><p>${esc(x.text)}</p><div class="m">${esc(x.src)}</div></div>`).join(""):`<div class="empty">Пока пусто</div>`)}).join("")}rm();
let df="";function rd(){chips(document.getElementById("df"),sysFilter(D.decisions),df,v=>{df=v;rd()});
 const l=D.decisions.filter(x=>!df||x.system===df).sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById("dl").innerHTML=l.map(x=>`<div class="dec"><div class="d">${esc(x.date)}</div><div class="b"><div>${esc(x.title)}</div>${x.replaced?`<div class="r">отменило: <s>${esc(x.replaced)}</s></div>`:""}<div class="r">${esc(sysName[x.system]||x.system)}${x.doc?" · "+esc(x.doc):""}</div></div></div>`).join("")}rd();

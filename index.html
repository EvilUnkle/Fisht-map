":"Шерсть другого цвета без пересборки.","steps":["Открой материал Content/Fisht/Characters/Master/Materials/MI_Fisht_Fur (рыжая) или MI_Fisht_FurSaddle (чёрный чепрак).","Поменяй FurColor. Дополнительно: RootDark, TipLight, SeedVariation.","Толщина прядей: двойной клик на GR_FishtJR_Fur, поля Hair Width, Root Scale, Tip Scale.","Форма бороды, усов, бровей: Tools/JRMaster/fur_gen_jr.py (блок «ПАРАМЕТРЫ ШЕРСТИ»), потом генерация в Blender и импорт скриптами. Подробности в документе."],"traps":["Родитель материала шерсти должен быть M_Fisht_Fur (тип Hair), иначе шерсть станет белой.","Не запускай fur_gen_jr.py без копии: он перезапишет шерсть.","Откат: тег beard-final."],"src":["Docs/FUR_GUIDE.md"],"date":"2026-10-17"},{"id":"f11-lines","section":"Персонажи","title":"Добавить реплику Друга-11 и озвучить","result":"Робот говорит новую фразу с субтитром над головой.","steps":["Открой Blender/Frend11/Friend11_Form1/tools/voice_lines.json. Добавь строку в группу или создай группу: \"Intro\": [[\"Hello, Fisht.\", \"Привет, Фишт.\"]] (английский, русский).","Запусти powershell -ExecutionPolicy Bypass -File voice_rebuild.ps1 (или -Only Intro). Голоса: Pavel (ru), David (en), робо-фильтр накладывается сам.","В редакторе в Output Log (Python): запусти ue_audio.py и queue_import(); через 5 секунд setup_assets(); tables().","Субтитры: ключ Sub.Friend11.\u003cГруппа>_\u003cn> с en и ru в Docs/loc/strings.json, затем sync_tables.py.","Если в группе больше 4 фраз, подними VoiceLinesPerGroup у робота."],"traps":["Новые компоненты Blueprint пусты у уже стоящих экземпляров: удали и поставь робота заново.","Таблицы заполняй ВСЕМИ полями, иначе окно «Сообщение» повесит редактор.","Реальную озвучку клади с теми же именами SW_Friend11_V_*."],"src":["Docs/FRIEND11.md","Docs/LOCALIZATION.md"],"date":"2026-11-02"},{"id":"f11-scene","section":"Персонажи","title":"Собрать сцену с Другом-11 (встреча, инструктаж)","result":"Робот встречает Фишта, говорит, ведёт по точкам.","steps":["Поставь BP_Friend11; bAutoBehavior = выкл (слушает только сценарий).","Расставь Target Point F11_P1, F11_P2… и Trigger Box F11_Meet, F11_Train1…","В Level Blueprint создай ссылку на робота и собери цепочку: триггер → Set LookTarget → Set CurrentState Talk → Set ExactRow → Speak → Delay → AI MoveTo точка.","Каждую реплику жди чуть дольше её длины (Delay = длина WAV + 0,5 с)."],"traps":["Тайную сторону (Stare, вспышка глаза) включай редко и когда Фишт не смотрит.","MoveToActor к цели вне NavMesh молча не едет: проецируй цель на NavMesh."],"src":["Docs/FRIEND11.md"],"date":"2026-11-02"},{"id":"loc-text","section":"Тексты и звук","title":"Добавить текст для игрока (локализация)","result":"Текст переводится ru/en и подставляет кнопку по устройству.","steps":["В Docs/loc/strings.json добавь ключ в нужную таблицу с обеими строками {\"en\": \"...\", \"ru\": \"...\"}.","В редакторе выполни Docs/loc/sync_tables.py (через execute_python_code).","В PowerShell запусти Tools\\loc_update.ps1 (2–3 минуты, редактор не закрывай).","В графе бери текст: BPFL_Loc.GetUI / GetHint / GetMission / GetItem по ключу.","Подсказки с кнопкой: храни действие IA_*, а не слово «E»."],"traps":["Никогда не пиши в тексте «E», «ЛКМ», «Shift».","После смены языка уже записанные в виджет тексты не обновятся: вызови RefreshAll.","В редакторе перевод не виден без Localization.ForceLoadGameLocalizationInEditor 1."],"src":["Docs/LOCALIZATION.md"],"date":"2026-11-07"},{"id":"tab-param","section":"Отладка","title":"Добавить параметр в меню Tab","result":"Ползунок параметра появился в инженерном меню.","steps":["В Blueprint системы: Class Settings → Interfaces → добавь BPI_DebugTunable (из Gameplay/Debug).","В GetTunables на каждый параметр один Add структуры S_Tunable: Id, Category (вкладка), Label, Type, Min/Max/Step, Value.","В событиях SetTunable(Id, Value) и InvokeAction(Id) по Id запиши значение или вызови функцию.","Меню само найдёт компонент или актор при открытии. Править виджеты не нужно.","Нельзя править систему: сделай адаптер-компонент рядом, образец BP_DebugCharacterProvider; скрипты в Tools/DebugMenu."],"traps":["Значения всегда float (Bool = 0/1).","Во время PIE BlueprintService слеп."],"src":["Docs/ENGINEERING_MENU_SPEC.md","Docs/F1_PARAMS.md"],"date":"2026-11-10"},{"id":"tab-save","section":"Отладка","title":"Записать настроенные в Tab значения насовсем","result":"Значения, подобранные в игре, записаны в таблицы и дефолты компонентов.","steps":["Настрой значения в Tab (изменённые подсвечиваются жёлтым).","Нажми «Записать в таблицы». Выполнится Tools/Tunables/apply_tunables.py: бэкап в Saved/Backups, проверка, автооткат.","Отчёт «старое → новое» внизу меню и в Saved/Tunables/last_apply.txt.","Новый параметр в реестре: если он в провайдере, запусти gen_registry.py; если в DT_*, добавь запись в Tools/Tunables/registry.json."],"traps":["Не пиши в таблицу всю строку: скрипт меняет одну ячейку.","create_asset с существующим именем открывает модальное окно (закрыть Enter).","gen_registry.py падает на BOM в build_camera_tuning.py."],"src":["Docs/ENGINEERING_MENU_SPEC.md"],"date":"2026-11-10"},{"id":"kt-add","section":"Карта проекта","title":"Как добавить карточку в Картотеку","result":"Своя карточка (персонаж, враг, оружие, броня, модуль, звук, место) видна всем на сайте.","steps":["Один раз на устройстве введи токен GitHub (внизу вкладки «Картотека», там же инструкция). Без токена карточки только читаются.","Открой вкладку «Картотека» и нажми «＋ Карточка».","Выбери тип: набор статов подставится сам. Впиши название, редкость (цвет рамки), способности по строке, описание, теги.","Нажми «Выберите файл» у портрета: можно сделать фото камерой или взять из галереи. Картинка сама ужмётся до 1600 px и ~300 КБ.","Свои статы: «＋ Свой стат» (название, значение, единица, максимум для полоски).","Галерея референсов и звуки (mp3, ogg, wav, m4a, до 2 МБ каждый) добавляются так же.","Чтобы сравнить задуманное с игрой, выбери «Связь с карточкой из игры»: в карточке появятся «Задумано» и «В игре сейчас». Или открой карточку из игры и нажми «＋ Своя карточка по этой».","Нажми «Сохранить». Править и удалять: открой карточку, кнопки «✏ Редактировать» и «🗑 Удалить»."],"traps":["Звук тяжелее 2 МБ не загрузится: сожми его (mp3 128 кбит/с).","Сохранение отклонено «файл изменён»: кто-то правил её с другого устройства. Нажми ⟳, перенеси правки из черновика.","Новая картинка на сайте может появиться через 1–2 минуты (обновляется Pages).","Карточки «из игры» править нельзя: они берутся из данных проекта экспортом."],"src":["Docs/Hub/README.md","Tools/ProjectMap/export_game_cards.py"],"date":"2026-11-09"},{"id":"kt-export","section":"Карта проекта","title":"Обновить карточки «из игры» (после изменения DA)","result":"Карточки врагов, оружия, брони и скинов на сайте совпадают с данными проекта.","steps":["Открой редактор Unreal, PIE остановлен, нет файла Saved/PIE_LOCK.txt.","Выполни в Python редактора (execute_python_code с auto_save=false): exec(open(r\"E:/Unreal Projects/FishtTheBattleDog/Tools/ProjectMap/export_game_cards.py\", encoding=\"utf-8-sig\").read()).","Скрипт только читает ассеты и пишет Docs/Hub/game_cards.json. В конце напечатает число карточек.","Запусти Tools/ProjectMap/deploy.ps1 (сборка и выкладка), закоммить game_cards.json."],"traps":["Запускай после изменения DA_EnemyType, DA_Ammo_*, DA_GearItem, DA_GearSkin или после добавления нового.","Новый враг, боеприпас или деталь получат английское или техническое имя, пока не добавишь русское в словари ENEMY_NAMES, AMMO_NAMES, GEAR_RU, SKIN_RU в скрипте.","Редкость у карточек из игры считается условно (по здоровью или урону в секунду), это не игровая величина.","Картинок-миниатюр ассетов нет: вместо них значок типа."],"src":["Tools/ProjectMap/export_game_cards.py","Docs/Hub/README.md"],"date":"2026-11-09"},{"id":"bp-cleanup","section":"Отладка","title":"Навести порядок в Blueprint (функции, категории, имена)","result":"Tick разнесён по функциям, переменные в нумерованных категориях, имена с русским пояснением.","steps":["Редактор без PIE, ассет сохранён и закоммичен (откат = git checkout).","Tools/BlueprintCleanup/bp_split.py: выгрузи граф, найди цепочку Tick, выбери границы блоков, собери функции make_function.","ОБЯЗАТЕЛЬНО compile_blueprint до пересборки EventGraph, иначе функции «не найдены».","rebuild_event_graph подставит вызовы функций подряд.","Категории: set_blueprint_variable_category(..., \"N Название\").","Проверка: 0 ошибок компиляции и PIE, значения читать отдельными вызовами."],"traps":["Выгрузка графа теряет значения пинов-классов: впиши их заново set_node_pin_value, иначе Tick «молчит».","Поля DataAsset переименовывать только этапами с перезапуском редактора: иначе Python падает.","Имена, которые читает чужой Blueprint или AnimBP, оставляй английскими."],"src":["Tools/BlueprintCleanup/README_method.md"],"date":"2026-11-07"}],"docs":[{"path":"Docs/VEST_NEW_ITEMS.md","title":"Blender → игра: детали и анимации","section":"Снаряжение и оружие","md":"# Blender -> игра: экспорт предметов и анимаций (подробно)\n\nРабочий файл: `Blender/Fisht/Armor/Fisht_Armor_Set_01/Fisht_Vest_Fit.blend`. Результат экспорта всегда падает в `export/` рядом с файлом.\nПеред большими правками: Файл > Сохранить копию.\n\n## 0. Главное правило (из-за него был сбой)\n**Никогда не экспортируйте и не импортируйте «всю сцену».** `export/Fisht_Vest_Fit.fbx` (вся сцена с собакой) в Unreal не заливать: Unreal вливает кости собаки в скелет пушки `SK_LaserGun_01` и пересохраняет все клипы. Для каждого типа деталей есть своя кнопка, ниже.\n\n## 1. Панель Fisht Export (основной способ)\nОткройте файл `.blend`. В 3D-виде нажмите **N**, вкладка **Fisht Export**. Если вкладки нет (Blender не разрешил автозапуск скриптов): Text Editor > текст `FISHT_EXPORT.py` > Run Script (Alt+P). Копия скрипта лежит в `Tools/Blender/fisht_export.py`.\n\nОдна кнопка на вариант. Скрипт сам: показывает скрытые объекты, выделяет нужные, ставит жёсткие детали и пушку в ноль, экспортирует с правильными настройками, возвращает всё на место (положение, скрытость, выделение).\n\n| Кнопка | Файл в `export/` | Что в нём | Импорт в Unreal |\n|---|---|---|---|\n| Пушка: модель + риг + все анимации | `SKM_LaserGun_01.fbx` | GunRig + 4 меша + все Action | Skeletal Mesh вкл. (первый раз) или выкл.; Skeleton `SK_LaserGun_01`; Import Animations вкл. |\n| Пушка: ТОЛЬКО анимации | `export/anims_only/SKM_LaserGun_01.fbx` | GunRig без мешей, все Action (или одно, см. ниже) | Skeletal Mesh ВЫКЛ.; Skeleton `SK_LaserGun_01`; Import Animations вкл.; папка `Gear/LaserGun/Anims` |\n| Жилет / Ошейник / Пояс-кольцо | `SKM_Vest_01.fbx`, `SKM_Collar_01.fbx`, `SKM_JetpackBelt_01.fbx` | Root (скелет собаки) + меш, без анимации | Skeletal Mesh вкл.; Skeleton `SK_Dog_Master`; Import Animations выкл. |\n| Подсумки L/R, сопла L/R | `SM_Pouch_*_01.fbx`, `SM_JetNozzle_*_01.fbx` | один жёсткий меш в нуле | Static Mesh |\n| Собака: ТОЛЬКО анимации | `Dog_Anims.fbx` | скелет Root, все Action | Skeletal Mesh ВЫКЛ.; Skeleton `SK_Dog_Master`; Sample Rate 30 |\n\n**Одна анимация вместо всех.** В верхней части панели поле «Одно действие»: выберите из списка, например `Gun_Stowed`, и нажмите «Пушка: ТОЛЬКО анимации» (или «Собака: ТОЛЬКО анимации»). В файл попадёт один клип. Очистите поле, чтобы снова экспортировать все. Файл пушки всегда называется `SKM_LaserGun_01.fbx` (лежит в `export/anims_only/`), поэтому клип в Unreal получает прежнее имя (`SKM_LaserGun_01GunRig_Gun_Stowed`) и заменяет старый, ссылки в ABP остаются. Если Unreal создаст лишний пустой клип `...Take`, удалите его.\n\nНиже панели блок «Новый предмет: выделенное»: выделите объекты, впишите имя файла (`SKM_Имя_01.fbx` или `SM_Имя_01.fbx`), нажмите «На скелет» (меш на скелет собаки: выделите Root и меш), «Жёсткая» (деталь, будет поставлена в ноль) или «Анимации» (выделенная арматура).\n\nГалка «Тест: писать во временную папку» экспортирует в `%TEMP%\\fisht_export_test`, не трогая `export/` (для проверки). Выключайте перед настоящим экспортом.\n\nНовый постоянный предмет: допишите строку в таблицу `ITEMS` в начале скрипта (имена объектов, тип, файл), обновите копию в `Tools/Blender/`.\n\n## 2. Пресеты окна Файл > Экспорт > FBX (если экспортируете руками)\nУстановлены в вашем Blender 5.1 (копии в `Tools/Blender/presets/`; если Blender переустановят, скопируйте их в `%APPDATA%\\Blender Foundation\\Blender\\5.1\\scripts\\presets\\operator\\export_scene.fbx`). В окне экспорта вверху выпадающий список пресетов:\n- `Fisht_1_Skinned_Armor`: арматура + меш, без анимации (жилет, ошейник, пояс).\n- `Fisht_2_Rigid_Mesh`: только меш (подсумок, сопла).\n- `Fisht_3_Animation_Only`: только арматура, запекание всех Action.\n- `Fisht_4_Rig_Mesh_Animation`: риг + меш + анимации (новое оружие).\nПресеты ставят оси Y/Z, масштаб FBX_SCALE_ALL, без Leaf Bones, Armature = Root. Выделение и положение объектов они НЕ делают: включена галка «Только выделенное», нужные объекты выделите сами, а жёсткую деталь и пушку поставьте в ноль. Поэтому кнопки панели надёжнее.\n\n## 3. Что нужно знать перед моделированием\n- Единицы сцены: 1 единица = 1 см (масштаб 0.01).\n- **Надеваемая деталь**: моделируйте вокруг `Ref_FishtJR`, привяжите к арматуре `Root` (Armature Deform with Automatic Weights или перенос весов с жилета), проверьте сгиб в позе. Один материал на деталь. Текстуры PNG: `T_\u003cИмя>01_BaseColor/Normal/Roughness/Metallic`.\n- **Жёсткая деталь**: пивот (Origin) в точке, вокруг которой деталь качается (верх у крепления). Место на теле задаёт Blueprint (`PivotRel` у подсумка, `Hinge` у сопл), в FBX деталь лежит в нуле.\n- **Пара L/R**: два меша, семейства скинов `\u003cИмя>_L` и `\u003cИмя>_R`.\n- **Пушка**: в сцене одна, стоит на собаке (GunRig в 3.4846, 0.0008, 37.198), анимируйте её прямо там. Кнопки пушки сами ставят её в ноль на время экспорта и возвращают.\n- **Новое оружие со своим ригом**: корень в нуле, оси шарнира X у рычагов (сгиб в одной плоскости), меши привязаны к костям. Экспорт пресетом 4, остальное (Blueprint, ABP, слот выстрела) делает Claude.\n\n## 4. Анимации пошагово\nУсловие: риг не менялся (те же имена костей, иерархия и поза покоя). Если менялся, заливайте и меш (кнопка «Пушка: модель + риг + все анимации»).\n1. В Blender: Action Editor, поправьте нужное действие. Имена действий = имена клипов в игре: `Gun_Deploy` (28 кадров), `Gun_Retract` (24), `Gun_Idle`, `Gun_Stowed`. Длительность не меняйте без предупреждения. Действие должно иметь «щит» (Fake User), иначе несохранённое пропадёт.\n2. Кнопка «Пушка: ТОЛЬКО анимации» (или «Собака: ТОЛЬКО анимации»); если нужен один клип, сначала выберите его в поле «Одно действие».\n3. Unreal: Content Browser > ПКМ на папке `Gear/LaserGun/Anims` > Import > файл из `export/`. В окне импорта: Skeletal Mesh ВЫКЛ., **Skeleton выбрать вручную** (`SK_LaserGun_01` для пушки, `SK_Dog_Master` для собаки), Import Animations вкл., Sample Rate 30. Не включайте «Create Physics Asset» и не ставьте «Import Mesh».\n4. Клип с тем же именем заменяется, ссылки в ABP остаются. Имя клипа в Unreal = `\u003cимя файла без .fbx>` + `\u003cArmatureName>_\u003cAction>` (например `SKM_LaserGun_01GunRig_Gun_Stowed`). Файл пушки в `anims_only/` назван так же, как полный, поэтому имена совпадают и клипы заменяются. Если что-то пошло не так, попросите Claude: «залей анимацию из файла X на скелет Y».\n5. Выстрел: ПКМ на клипе > Create > Create AnimMontage, слот `GunFire`, затем поле «FireMontage» в `BP_LaserTurret`. Процедурная отдача накладывается сверху (`bUseRecoil` в `ABP_LaserGun`).\n\n## 5. Как понять, что что-то пошло не так\n- Размер скелета `SK_LaserGun_01.uasset` вырос с ~9 КБ до ~19 КБ, появились лишние кости: залили файл с собакой. Откат: `git checkout HEAD -- Content/Fisht/Gameplay/Gear/LaserGun`, удалить лишний ассет, перезагрузить пакеты (или попросите Claude).\n- Экспорт пустой (несколько КБ): объект скрыт или переименован. Кнопки панели покажут ошибку с именем объекта.\n- Пушка в игре выше или в стороне: экспортировали вручную, не через кнопку (смещение запеклось).\n- Вся пушка в Unreal в другом масштабе: отличаются настройки экспорта, пользуйтесь кнопками.\n\n## 6. Что сказать Claude, когда всё готово\n- Новый предмет: что экспортировали (кнопку или имя файла), слот (жилет, ошейник, подсумок л/п, пояс (сопла входят в пояс), пушка), нужен ли скин и сколько цветов.\n- Анимация: имена действий, скелет (пушка или собака), куда подключить.\nClaude сам импортирует, заведёт деталь, скин, каталог и строки меню Tab.\n","date":"2026-11-10"},{"path":"Docs/VEST.md","title":"Жилет Фишта: устройство и модули","section":"Снаряжение и оружие","md":"# Жилет Фишта: как устроено и как добавить модуль (2026-11-06)\n\nИсточник правды по моделям: Blender-файлы в `Blender/Fisht/Armor/Fisht_Armor_Set_01/` (рабочий `Fisht_Vest_Fit.blend`) и `Blender/Characters/Fisht/` (`Fisht_Body_01.blend`, `Fisht_Fur_01.blend`). Экспорт FBX/текстуры: `.../Fisht_Armor_Set_01/export/`. Скрипты для работы не нужны: правки идут в Blender руками, импорт обычным Import в UE.\n\n## Два вида модулей\n1. **Скиннутые на скелет Фишта** (жилет, ошейник, пояс-джетпак, ботинки). Меш на скелете `SK_Dog_Master`, Leader Pose от `CharacterMesh0`. Данные: `DA_Gear_*` (поле `SkeletalMesh`, слот, `FurMaskRegion`). Надевает `BP_FishtGearComponent.EquipItem`.\n2. **Механизмы с собственной анимацией или физикой** (лазерная пушка, подсумки). Это отдельный `Actor`, который жилет спавнит сам: в `DA_GearItem` поле **`AttachedActorClass`**. `FinishEquip` создаёт актор, цепляет к кости `Spine_04` меша персонажа с обратным смещением её референс-позы (поэтому координаты в Blender = координаты в UE), хранит ссылку (`TurretActor`, `PouchLActor`, `PouchRActor` по слотам 0/2/3), а `ClearSlot` уничтожает при снятии. Для актора нужен триггер: в `DA` задать `StaticMesh` (любой, масштаб `AttachOffset` ~0, см. `DA_Gear_PouchL01`), иначе `EquipItem` до `FinishEquip` не дойдёт.\n\n## Как добавить новый скиннутый модуль\n1. В `Fisht_Vest_Fit.blend` расположи меш на собаке, скинни: перенос весов с `SKM_Fisht_JR`, оставь только нужные кости (у жилета только `Spine_*`/`neck`, ноги не тянут), максимум 4 кости на вершину, нормализуй.\n2. Единицы файла сантиметры (иначе в UE будет ×100). Экспорт: выдели `Root` + мешы, FBX (Y forward, Z up, Apply Scale `FBX_SCALE_ALL`, без leaf bones, без анимации).\n3. Импорт в UE на скелет `SK_Dog_Master` (skeleton указывать явно), создать материал (4 текстуры, режимы сжатия по CLAUDE.md §7), `DA_Gear_\u003cимя>` (слот, `SkeletalMesh`, `AttachBone`, `FurMaskRegion`).\n4. Добавить в Tab (`BP_DebugGearProvider`, вкладка «Снаряжение»): переменная `ItemN` и вызов `EquipItem`.\n\n## Лазерная пушка (`/Game/Fisht/Gameplay/Gear/LaserGun`)\n- Меш `SKM_LaserGun_01`, свой скелет `SK_LaserGun_01`: `Gun_Root` (вращение вокруг своей оси, основание под углом), `Gun_Arm1_Pitch` (вперёд-назад), `Gun_Arm1_Swing` (вбок), `Gun_Arm2`, `Gun_Head` (шарниры по X). Сокет `Muzzle` на `Gun_Head` (линза).\n- Клипы (30 к/с): `AN_LaserGun_Stowed/Deploy/Retract/Idle`. `ABP_LaserGun`: автомат Stowed, Deploy, Idle, Retract (переменная `bWantDeployed`), потом `Transform (Modify) Bone` в пространстве кости по `RootRot`, `Arm2Rot`, `HeadRot` с `AimAlpha`.\n- `BP_LaserTurret`: пока `Slot0` оружия зажат (`bHeld`), выдвигается, 3 с после выстрела складывается. Прицеливание обратной связью: `FindLookAtRotation(Muzzle → Aim.AimLocation)`, ошибка по yaw крутит корень (знак `Kroot`=+1), по pitch делится между `Gun_Arm2` и `Gun_Head` (`HeadShare`=0.6, знаки `Khead`/`Karm`=−1: положительный Roll опускает ствол). Шаг ограничен `MaxRate`, dt зажат до 0.033 (иначе при низком fps цикл раскачивается), аимится только после 1 с с начала раскладки, нижний угол ствола `ElevMin`=−35°.\n- Пределы (из Blender, источник правды пользователь): корень без предела, `Arm1_Pitch` и `Arm1_Swing` ±180, `Arm2` −256…+42, `Head` ±120. В Blender заданы блокировками и Limit Rotation, в UE отдельно: `Arm2Min/Arm2Max/HeadLimit` в `BP_LaserTurret`.\n- Стрельба: `BP_WeaponComponent.GetMuzzle(Slot 0)` берёт `TurretMuzzleLoc` (пишет туррель каждый тик, `bTurretMuzzle`). Старая заглушка-ствол скрывается в `BeginPlay` туррели.\n- Известно: сложенная поза проходит сквозь жилет и пояс (так задумано пользователем), стрелять во время сложенной позы нельзя.\n\n### Пушка: настройки (Class Defaults `BP_LaserTurret`)\n- `bDeployOnAim`: выдвигаться при прицеливании (ПКМ, читает `BP_CarryHolder.bAiming`). Снять галочку: пушка выдвигается только когда зажат огонь.\n- `IdleDelay`: сколько секунд пушка остаётся раскрытой после огня/прицела (6 с).\n- `Gain`, `MaxRate`, `AimDeadzone`: скорость и «тряска» наведения (мёртвая зона в градусах).\n- `EmitterSide`, `EmitterDrop`, `SideDir`: излучатель обходит линию прицела вбок (см), опускается вниз (см), `SideDir` = −1 сторона противоположная прицелу, +1 по ходу прицела. Реализовано Two Bone IK в `ABP_LaserGun` (цель считает `BP_LaserTurret`, переменная `IKOffsetOut`), включается по `AimAlpha`.\n\n### Процедурная отдача и частота стрельбы\n- `BP_LaserTurret` считает выстрелы по падению `Slot0.Mag` (кадр за кадром). Каждый выстрел даёт импульс пружине вдоль ствола назад. Параметры (Class Defaults): `RecoilStrength` (сила толчка, 80), `RecoilK` (жёсткость, 900), `RecoilC` (затухание, 30), `MaxRecoil` (предел сдвига, см, 4), `RecoilRefInterval` (0.25 с: на частоте выше 1/0.25 = 4 выстр./с толчок на каждый выстрел уменьшается до 30%, так что при скорострельности отдача превращается в мелкую дрожь, а не в «улёт»).\n- Выходы туррели для ABP: `RecoilOut` (вектор сдвига, пространство компонента), `FireRateOut` (выстрелов в секунду, сглаженная).\n- В `ABP_LaserGun`: переменные `IKRecoil` и `FireRate` обновляются из туррели. Отдача сдвигает не штангу, а голову: вектор `IKRecoil` (назад вдоль ствола, в пространстве кости головы) прибавляется к цели Two Bone IK (`IKOffset + IKRecoil * bUseRecoil`), поэтому штанга изгибается за головой. Включается одной булевой переменной ABP **`bUseRecoil`** (Class Defaults ABP).\n- Слот под клип выстрела: в AnimGraph между автоматом `Main` и переходом в Component Space стоит узел `Slot 'GunFire'`. Чтобы проиграть клип выстрела поверх (лопасти, затвор и т.п.), импортируй клип на `SK_LaserGun_01`, создай Anim Montage со слотом `GunFire` и вызывай `Play Montage` на `GunMesh` из `BP_LaserTurret` по выстрелу (или добавь клип прямо в состояние автомата). Пока клипа нет, слот пропускает позу автомата без изменений. Для пушки без процедурной отдачи снять галочку, анимация пушки остаётся своей.\n- `FireRate` в ABP можно подать на Play Rate клипа вращения лопастей и т.п. (например `Play Rate = FireRate / 10`): при улучшении скорострельности лопасти ускоряются сами.\n- Ограничение: выстрелы определяются по расходу магазина `Slot0`. Если у оружия патроны не расходуются, отдачи не будет (тогда надо подписаться на `OnFire`).\n\n### Ограничения изгиба штанги\nTwo Bone IK не знает пределов шарниров, поэтому в `BP_LaserTurret` его влияние гасится по наклону прицела: `IKPitchLo`/`IKPitchHi` (градусы взгляда: ниже `Lo` IK выключен, выше `Hi` включён на полную силу; сейчас −50 и −15). Результат `IKAlphaOut` идёт в Alpha узла IK. Когда смотришь круто вниз, излучатель возвращается в нейтраль, штанга не выгибается во все стороны. Настоящие пределы по каждой оси для IK задать нельзя (нужен Control Rig с лимитами или аналитический расчёт углов шарниров); это отдельная задача.\n\n### Хук выстрела и монтаж\n`BP_LaserTurret.FireMontage` (Class Defaults или на экземпляре): если задан, на каждый выстрел вызывается `Montage_Play` на анимации `GunMesh`. Монтаж должен использовать слот `GunFire` и скелет `SK_LaserGun_01`. Пусто: ничего не происходит.\n\n### Анимации пушки: как менять и добавлять\n- Клипы: `Gun_Stowed` (поза сложена, один кадр, = последний кадр Retract), `Gun_Deploy`, `Gun_Retract`, `Gun_Idle`. Их читает автомат `Main` в `ABP_LaserGun`.\n- Изменить складывание: правь действие `Gun_Retract` в `Fisht_Vest_Fit.blend`, последний кадр должен совпадать с `Gun_Stowed` (иначе будет скачок). Экспорт: выдели `GunRig` и `GunMesh_*`, FBX (Y forward, Z up, `FBX_SCALE_ALL`, без leaf bones, Bake Animation, All Actions) в `export/SKM_LaserGun_01.fbx`. В UE: правый клик по клипу `AN_LaserGun_*` → Reimport (если имя действия то же), либо Import в `Anims` с skeleton `SK_LaserGun_01`, custom sample rate 30.\n- Новый клип: добавь действие в Blender, экспортируй, импортируй, затем в `ABP_LaserGun` создай состояние (Sequence Player) и переходы в автомате `Main`.\n- Скорость складывания: Rate Scale у Sequence Player в состоянии `Retract`, длительность перехода в правиле перехода.\n- Анимация выстрела: клипа пока нет. Делается так: клип выстрела (отдача) импортируется на тот же скелет, в ABP добавляется слот `Additive` + `Play Slot Animation` из `BP_LaserTurret` по сигналу `OnFire` у `BP_WeaponComponent`, либо отдельное состояние `Fire` в автомате.\n- Другая пушка: новый актор по образцу `BP_LaserTurret` со своим мешем, скелетом и ABP; в `DA_GearItem.AttachedActorClass` указывается новый класс. Анимации стрельбы считаются отдельно для каждой пушки.\n\n## Подсумки (`/Game/Fisht/Gameplay/Gear/Pouches`)\n- `SM_Pouch_L_01`, `SM_Pouch_R_01` со своей точкой вращения (верх, внутренняя грань). `BP_PouchModule` (+ `_L`, `_R` с `MeshAsset` и `PivotRel`): пружинный маятник по ускорению Фишта вдоль его направления, поворот только вокруг Y, предел ±15°, внутренняя грань на оси, в тело не заходит. Параметры `K`, `C`, `AccelGain`, `MaxAngle`.\n- Внимание: `PivotRel` в UE-координатах (y отражён относительно Blender).\n\n### Как настроить болтание подсумков (без костей и без физдвижка)\nКостей нет: каждый подсумок это отдельный Static Mesh на сцен-компоненте `Hinge` (шарнир), который вращается кодом в Tick. Два BP (`BP_PouchModule_L/R`) нужны только чтобы задать меш и точку шарнира; логика одна, в родителе `BP_PouchModule`. Модель: пружинный маятник вокруг оси Y, `θ'' = −K·θ − C·ω − AccelGain·(ускорение Фишта вдоль его направления)`, угол жёстко зажат в ±`MaxAngle`. Как крутить (Class Defaults `BP_PouchModule`):\n- `AccelGain`: насколько сильно рывок разгона/торможения отбрасывает подсумок. Больше значит сильнее болтаются в беге и прыжке (после прыжка торможение при приземлении тоже даёт качок).\n- `K`: жёсткость возврата в нейтраль. Меньше значит дольше качается и лениво возвращается.\n- `C`: затухание. Меньше значит больше колебаний; больше значит быстро замирает.\n- `MaxAngle`: предел угла (сейчас 15°). Не даёт зайти в тело, так как нейтраль и ось на внутренней грани.\n- Точка шарнира и положение: `PivotRel` в `BP_PouchModule_L/R` (UE-координаты, y зеркален Blender).\nВертикаль: параметр `UpGain` добавляет в маятник вертикальную скорость Фишта (`velocity · ActorUpVector`). Больше значит сильнее подсумки отгибаются в прыжке и падении («лопухи»). Знак меняет направление (если отгибаются не туда, поставь отрицательный). 0 выключает. Задан в `BP_PouchModule_L/R` (в родителе значение дублируется).\n\n### Аналитические суставы пушки (вместо Two Bone IK, 2026-11-06)\nTwo Bone IK убран из `ABP_LaserGun`. `BP_LaserTurret` каждый кадр берёт позиции костей `Gun_Arm1_Swing`/`Gun_Arm2`/`Gun_Head`, строит плоскость руки (ось шарнира = X кости `Gun_Arm2`) и решает 2-звенник (демпфированный якобиан) для сдвига излучателя (бок/низ + отдача). Углы идут в аддитивные Modify Bone: плечо `Gun_Arm1_Pitch` (`ShoulderRot`), боковой поворот `Gun_Arm1_Swing` (`SwingRot`, ось Z), локоть `Gun_Arm2` и голова (через `Arm2RotOut`/`HeadRotOut`; голова компенсирует сумму плеча и локтя, направление ствола сохраняется).\n- Пределы по суставам (градусы, Class Defaults турели): `IKYawMax` 25, `IKShoulderMax` 12, `IKElbowMax` 25, `IKHeadMax` 35. `IKDamp` - демпфирование у вытянутой руки. `EmitterSide` теперь 5 (пушка мелкая, звенья ~10 см в мире).\n- Знаки поворотов (`SignShoulder/Elbow/Head` = -1, `SignYaw` = +1) подобраны замером по костям; если на другом риге ось окажется зеркальной, меняйте знак.\n- Отдача включается bool `bUseRecoil` в ABP (он передаётся в турель как `bUseRecoilIn`).\n- Нет настоящего ограничения «вне плоскости»: излучатель сдвигается вбок только поворотом `Swing` в пределах `IKYawMax`.\n\n### Подсумки как «книга»\nКроме качания вперёд-назад (Pitch) у шарнира подсумка есть второй пружинный контур по X (Roll): низ створки открывается наружу относительно верхней внутренней грани. Привод - вертикальное ускорение тела (`RollGain`): падение (свободное падение ≈ -980) раскрывает створку, прыжок вверх и приземление прижимают (до `-MinRoll`), при беге вертикальная тряска даёт открытие-закрытие. Направление «наружу» считается в рантайме по положению шарнира относительно тела, поэтому одинаково для `_L` и `_R`. Параметры `RollK` 90, `RollC` 9, `RollGain` 1.0, `MaxRoll` 25°, `MinRoll` 3°, `RollCouple` 0 (связь со скоростью Pitch) на `BP_PouchModule` и детях `_L/_R`. Модель кинематическая (пружина с жёсткими пределами), без физ-тел. Замер в PIE при прыжке: падение даёт ±25° (зеркально для L/R), прижатие ±3°.\n\n### Сопла джетпак-пояса (`/Game/Fisht/Gameplay/Gear/Belt`)\nДва сопла вынесены из скиннутого пояса в отдельные жёсткие меши `SM_JetNozzle_L/R_01` (пивот в верхней точке цилиндра, в месте крепления кронштейна). Пояс `SKM_JetpackBelt_01` теперь только кольцо (831 вершина). `DA_Gear_JetpackBelt01.AttachedActorClass` = `BP_JetNozzles`; `BP_FishtGearComponent` хранит его в `BeltActor` и уничтожает при снятии (ClearSlot, слот 4).\n- `BP_JetNozzles`: у каждого сопла `Hinge` (шарнир), `Nozzle` (меш), `Flame` (конус с материалом `M_JetFlame`, аддитивный), `Light` (точечный свет). Координаты шарниров = координаты пояса в Blender (X, -Y, Z) + (0.19, 0.21, 0) (поправка кадра крепления на `Spine_04`).\n- Тяга берётся из `BP_JetpackComponent.bActive` персонажа (читаем, не меняем). `ThrustS` плавно набирает и гасит тягу (скорость 9), пламя вытягивается по Z, интенсивность света масштабируется, добавляется мерцание.\n- Процедурный вектор тяги: сопла наклоняются против скорости персонажа (`TiltMax` 10°, `VelRef` 600 см/с) и расходятся наружу при тяге (`SplayMax` 4°). Гасит это всё сглаживание.\n- Настройки в Class Defaults: `TiltMax`, `VelRef`, `SplayMax`, `FlameLen` (0.09, масштаб конуса по Z при полной тяге), `FlameWidth` (0.03), `LightMax` (3000).\n- Раскачка на беге (2026-11-07): к целевому наклону добавлено синусное качание вперёд-назад, зависящее от скорости: `GaitSway (раскачка на беге вперёд-назад, град)` 8 и `GaitFreq (темп раскачки на полной скорости, Гц)` 3. Угол спружины ограничен ±1.6 x `TiltMax`. Если `SwayK` и `SwayC` сделать очень малыми, возможен резонанс с темпом бега (раскачка вырастает): поднимите `SwayC` или измените `GaitFreq`.\n- Служебные переменные (состояние) переименованы с пометкой «служебное: …», в `BP_JetNozzles`, `BP_PouchModule` (его `MeshAsset (меш подсумка)`, `PivotRel (положение шарнира подсумка относительно жилета)` настраиваются) и во внутренних переменных `BP_LaserTurret`. Выходные переменные турели, которые читает `ABP_LaserGun` (`*Out`, `Deployed`, `bUseRecoilIn`), и переменные `BP_FishtGearComponent` оставлены английскими, на них ссылаются другие Blueprint.\n- Цветовые варианты (2026-11-07): стандартные скины жилетов, ошейника, ботинок, пояса и подсумков получили 5 вариантов `Tint`: 0 без оттенка, 1 графит, 2 песок, 3 олива, 4 ржавчина. Выбор в Tab: «\u003cслот>: цвет (вариант)».\n- Качание сопл (2026-11-07): наклон идёт через недодемпфированную пружину (раскачка с перелётом и затуханием), а не простое сглаживание. `SwayK (жёсткость качания сопл)` 120 и `SwayC (затухание качания сопл)` 6: меньше `SwayC` значит дольше и сильнее качаются, больше `SwayK` значит чаще. Размах задаёт `TiltMax`. В PIE при рывке на 600 см/с сопло делает перелёт, возвращается и затухает за ~1,5 с (2-3 колебания).\n- Blender: объекты `SM_JetNozzle_L/R` лежат в `Fisht_Vest_Fit.blend` (позиция = пивот). Если правите пояс, пересоберите кольцо и экспортируйте заново: на пояс `Jetpack_Belt` и `Root` нужен снятый `hide`.\n\n### Включение джетпака как двойной прыжок (2026-11-06)\nВ `BP_JetpackComponent` (боевой чат) добавлен `bArmed`: `SetHeld(Value)` выставляет `bArmed = IsFalling AND Value`, то есть пояс «взводится» только нажатием, которое началось уже в воздухе. Прыжок с земли с удержанием кнопки пояс не включает. В `TickJet` условие `bActive` получило ещё один `AND bArmed` (рядом с `bHeld`); остальное не менялось (`HeldTime >= JetHoldDelay`, `IsFalling`, топливо, `JetOn`). Проверено в PIE: нажатие в воздухе даёт `bActive = True`, нажатие на земле с отрывом от земли при удержании не включает.\n\n### Part / Skin / Loadout, шаг 1 (2026-11-06; решения: `Docs/PROGRESSION_PLAN.md`)\nПравило: форма от детали, украшение от скина. Скин никогда не даёт статов.\n- **Part = `DA_GearItem`** (не переименован). Новые поля: `PartId`, `Family`, `TierVisual` (необязательно), `DefaultSkin`, статы-заготовки `ArmorReduction`, `StaminaBonus`, `PlasticCapacity` (пока 0, баланс позже). Поля `MaterialOverride` и `ColorVariants` перенесены в скин и удалены из детали (в DA они нигде не были заполнены).\n- **Skin = `DA_GearSkin`** (`Gear/Skins/Skin_*`): `SkinId`, `DisplayName`, `Family`, `SkeletalMesh`/`StaticMesh` (меняют меш только внутри семейства), `ExtraMeshes` (для сопл: [0] левое, [1] правое), `MaterialOverride`, `ColorVariants` (цвет в параметр `Tint`), `FlameColor`, `LightColor`, `UnlockId` (заготовка под открытие скинов). Скин надевается только на деталь со своим `Family`, иначе игнорируется (`ResolveSkin` берёт `DefaultSkin`).\n- **Семейства:** `Vest_Light` (Vest01, TestVest), `Vest_Heavy` (TestVestHeavy), `Collar_Std`, `Boots_Std`, `Belt_Jetpack`, `Pouch_Std_L`/`Pouch_Std_R`, `Nozzle_Std`. Тяжёлый жилет всегда выглядит тяжёлым: другая деталь, а не скин.\n- **Сопла стали отдельной деталью и слотом `Nozzles` (6).** `DA_Gear_JetNozzles01` (Family `Nozzle_Std`, `AttachedActorClass` = `BP_JetNozzles`), пояс `DA_Gear_JetpackBelt01` теперь только кольцо. Поэтому пояс и сопла выбираются и красятся независимо. `SlotCount` = 7, `BeltActor` в `BP_FishtGearComponent` хранит актор сопл (слот 6).\n- **Применение скина:** `BP_FishtGearComponent.FinishEquip` вызывает `ResolveSkin(Item)` (скин слота из `EquippedSkins`, иначе `DefaultSkin`), применяет меш, материал и `Tint` к компоненту, затем вызывает интерфейс `BPI_GearSkinnable.ApplySkin(Skin, VariantIndex)` у заспавненного актора. Реализуют интерфейс: `BP_JetNozzles` (`DoApplySkin`: меши сопл, материал, цвет пламени через MID, цвет света) и `BP_PouchModule` (меш, материал). Остальные акторы (`BP_LaserTurret`) интерфейс пока не реализуют, это не ошибка.\n- **Смена скина на ходу:** `GearComponent.SetSkin(SlotIndex, Skin, VariantIndex)`: проверяет семейство, сохраняет скин в `EquippedSkins` и переэкипирует слот. Меню Tab для выбора пока нет (шаг 2).\n- **Материалы** `M_JetpackBelt_01`, `M_Vest_01`, `M_Boots_01`, `M_Collar_01`, `M_PouchL/R_01`, `M_LaserGun_01` получили параметр `Tint` (белый по умолчанию, внешний вид не меняется). `M_JetFlame` получил параметр `FlameColor`.\n- **Готовые скины:** по одному стандартному на семейство, плюс `Skin_Belt_Graphite` (графитовый пояс) и `Skin_Nozzle_BlueFlame` (синее пламя). Проверено в PIE: скин сопл и скин пояса применились, скин сопл на слот пояса отвергнут по семейству.\n- **Автоэкипировка** теперь надевает и сопла (`Item7` в `BP_DebugGearProvider`).\n- Если в `EquipItem` у детали нет меша (только `AttachedActorClass`, как у сопл), `FinishEquip` вызывается без компонента: код скина и материала в этом случае пропускается.\n\n### Part / Skin / Loadout, шаг 2: меню Tab (2026-11-06)\nВкладка «Снаряжение» получила для каждого из 7 слотов (жилет, ошейник, подсумки, пояс, ботинки, сопла) три пункта: «деталь» (выпадающий список деталей слота, «Нет» = снять), «скин» (скины семейств деталей слота, «По умолчанию» = снять выбранный скин) и «цвет (вариант)» (индекс `ColorVariants` скина, параметр `Tint`). Реализует адаптер `BP_DebugSkinProvider` (`Gameplay/Debug`), он создаётся компонентом при `BeginPlay` у `BP_DebugGearProvider` и вызывает на `BP_FishtGearComponent` функции `EquipItem`, `UnequipSlot`, `SetSkin`, `ClearSkin` (снять скин и переэкипировать), `SetVariant` (сменить цветовой вариант).\n- Списки в меню статичны: после добавления новой детали (`DA_Gear_*`) или скина (`Skin_*`) перезапустите `Tools/DebugMenu/build_skin_provider.py` (exec после `dm_lib.py`, `provider_lib.py`, `make_provider.py` в одном пространстве имён, затем `build_skin_provider()`).\n- Проверено в PIE вызовом `SetTunable` у адаптера: скин пояса и сопл применяются, деталь жилета меняется (тяжёлый жилет убирает пушку: у него нет `AttachedActorClass`).\n- Вид меню (виджеты вкладки) смотрит пользователь.\n\n### Part / Skin / Loadout, шаг 3: сборки и сохранение (2026-11-06)\n- **Формат сборки** (одинаков в файле и в ассете): три массива по 7 слотов (порядок: Vest, Collar, PouchLeft, PouchRight, Backpack, LegWraps, Nozzles): `PartIds` (имя детали, `None` = слот пуст), `SkinIds` (имя выбранного скина, `None` = скин по умолчанию), `Cols` (индекс цветового варианта).\n- **Файл экипировки:** `SG_GearLoadout` (SaveGame, образец `BP_MechSave`), слот по умолчанию `GearLoadout`, пресеты `GearLoadout_1..3` (папка `Saved/SaveGames`). Общего сохранения игры нет, это отдельный файл.\n- **Готовые наборы:** `DA_Loadout` (`Gear/Loadouts/DA_Loadout_*`): `Standard`, `Graphite` (графитовый пояс и синее пламя), `HeavyTest` (тяжёлый жилет).\n- **Каталог:** `DA_GearCatalog_Main` (жёсткие ссылки, чтобы ассеты попали в сборку) хранит все `DA_Gear_*` по `PartId` и `Skin_*` по `SkinId`. После добавления новой детали или скина запустите `refresh_gear_catalog()` из `Tools/DebugMenu/build_gear_catalog.py` (там же `make_loadout(...)` для новых `DA_Loadout_*`), затем `build_skin_provider()` для меню Tab.\n- **Функции `BP_FishtGearComponent`:** `SaveLoadoutTo(SlotName)`, `LoadLoadoutFrom(SlotName)`, `ApplyLoadoutAsset(DA_Loadout)`, внутренние `ApplyBuffer`, `FindPart`, `FindSkin`, `PartIdAt`, `SkinIdAt`; `CurVariants` хранит текущий цветовой вариант каждого слота.\n- **Tab, вкладка «Снаряжение»:** «Сборка: сохранить в файл / загрузить из файла», «Пресет 1-3: сохранить / загрузить», «Готовая сборка: ...» для каждого `DA_Loadout`.\n- Автозагрузки сохранённой сборки при старте нет (смена экипировки будет в схроне; отладочная автоэкипировка Tab по-прежнему надевает стандартный полный комплект).\n- Проверено в PIE: готовая сборка применяется; сохранение создаёт `GearLoadout.sav`; после смены сборок загрузка восстанавливает жилет `Vest01`, графитовый пояс и сопла с синим пламенем.\n\n### Имена параметров с русским пояснением (2026-11-06)\nВсплывающие подсказки у переменных через MCP задать нельзя, поэтому пояснение вшито в имя: «`RollK (жёсткость раскрытия створки)`». Технический идентификатор стоит до скобки. Так названы все настраиваемые параметры `BP_LaserTurret`, `ABP_LaserGun` (`bUseRecoil`), `BP_PouchModule` (дочерние `_L/_R` наследуют) и `BP_JetNozzles`; значения и ссылки в графах сохранены. То же сделано для полей data-asset (`DA_GearItem`, `DA_GearSkin`, `DA_Loadout`, `DA_GearCatalog`, `SG_GearLoadout`): «`Family (семейство детали, определяет подходящие скины)`». Данные в 26 готовых ассетах и узлы в графах перенесены, проверено регрессией в PIE (экипировка, скины, готовые сборки, сохранение и загрузка). Для скриптов: `get_editor_property(\"RollK (жёсткость раскрытия створки)\")` принимает точное имя целиком; таблица имён полей лежит в `Tools/DebugMenu/gear_names.py` (`fn(\"DA_GearItem\", \"PartId\")` даёт полное имя), её используют `build_gear_catalog.py` и `build_skin_provider.py`. Разовый скрипт `build_gear_loadout.py` удалён (графы уже собраны в Blueprint). Ловушка: удаление старых полей у data-asset-классов с загруженными экземплярами в одной сессии роняло Python; безопаснее добавить новые поля, перепривязать графы, перезапустить редактор и только потом удалять старые, предварительно сохранив значения экземпляров в файл.\n\n### Автоэкипировка\n`BP_DebugGearProvider`: на BeginPlay через 1 с запускается ветка «полный комплект» (та же, что кнопка Tab), так что при каждом старте PIE комплект надет.\n\n## Задел на будущее\n- Уши Фишта: тот же подход (пружинный маятник на кости) или Physics Asset/AnimDynamics на ушных костях в `ABP`; требует доработки физической модели Фишта.\n\n## Ловушки\n- `Fisht_Vest_Fit.blend`: единицы см; имена мешей не должны совпадать с именами костей (иначе кости получат суффикс `1`). Не запускать `fur_gen_jr.py`: он затрёт ручную шерсть (`Fisht_Fur_01.blend`).\n- Шерсть через жилет ещё не маскируется; решение отложено (см. заметки в `side-session-notes`).\n- Жилет и `BP_FishtCharacter`: привязки Groom (`GB_FishtJR_*_N`) прописаны в `BP_FishtCharacter`; после реимпорта шерсти скрипт привязки правит этот BP.\n- Тест в PIE по python: между вызовами игра не тикает, для динамики регистрируй `register_slate_post_tick_callback`.\n\n## BP_LaserTurret: структура (2026-11-07)\nПеременные разложены по категориям (1 Оружие, 2 Наведение, 3 Излучатель, 4 Отдача, 5 Расчёт руки, 6 Выходы для ABP, 7 Служебное). Граф разделён на функции с комментариями: `InitFindComponents` (BeginPlay) и `Tick1_Deploy` ... `Tick9_SolveArm` (вызываются из Tick по порядку, пока есть компонент оружия). Разбивка сделана автоматически из прежнего графа (число узлов/связей совпадает), логика не менялась. Звук выстрела, урон, эффекты и скорострельность лежат НЕ здесь, а в `DA_Ammo_*` (Content/Fisht/Combat/Core). Для другой пушки нужны: свой `DA_Ammo_*`, свои клипы и `FireMontage`. Профиль-ассет для всего этого (DA_GunProfile) пока не сделан.\r\n\n## Остальные Blueprint снаряжения: функции и категории (2026-11-07)\nТак же, как у `BP_LaserTurret`, Tick разнесён на функции с русскими комментариями и переменные разложены по категориям: `BP_PouchModule` (`InitMesh`, `Tick1_PitchSpring` ... `Tick4_ApplyRotation`), `BP_JetNozzles` (`InitFindJetpack`, `Tick1_Thrust` ... `Tick4_ApplyRight`), `BP_FishtGearComponent` (функции были, добавлены категории). Разбивка автоматическая (число узлов и связей совпадает). Ловушка: выгрузка графа теряет значения по умолчанию у пинов-классов (`GetComponentByClass.ComponentClass`), их надо вписывать вручную через `set_node_pin_value`; перед пересборкой EventGraph функции нужно скомпилировать, иначе вызов функции не находится. Клип Stowed пушки теперь новый (1 кадр), старый удалён.\r\n\n**Ловушка (2026-11-07):** после rename_asset или удаления клипа плеер в состоянии AnimBP остаётся с пустым ассетом. ABP не компилируется («Плеер последовательностей ссылается на неизвестный ресурс») и не обновляется в игре, пушка не гнётся. После любых правок клипов проверяй compile_blueprint(ABP) и при необходимости AnimGraphService.set_sequence_player_asset.\r\n\n## Свечение лазерной пушки (2026-11-07)\nВ M_LaserGun_01 эмиссия выделяется из BaseColor: оранжевые светящиеся элементы текстуры (кольца, лампы, полосы, линза) находятся маской saturate((R - B - 0.45) * 4), цвет = BaseColor * маска * GlowStrength * GlowColor. BP_LaserTurret.Tick10_Glow создаёт MID на GunMesh и задаёт GlowStrength: GlowStowed (в сложенном виде, 0.4) -> GlowDeployed (в боевом, 1.6) по AimAlphaOut плюс GlowFire (3.0) * темп стрельбы/10. Поля в категории «1 Оружие». Если подсвечивается лишнее, меняй константы 0.45 и 4.0 в материале.\r\n\n## Звук джетпака (2026-11-07, заглушки)\nBP_JetNozzles.Tick5_Sound: цикл полёта (SpawnSoundAttached на HingeL, громкость = ThrustS * VolLoop, тон 0.8-1.25 по ThrustS), SndStart/SndStop по фронтам тяги (порог 0.05), сигнал SndEmpty каждые EmptyPeriod с, пока Jet.bArmed и Jet.bHeld и JetFuel \u003c= 0.02. Поля в категории «5 Звук». Звуки в Content/Fisht/Gameplay/Gear/Belt/Audio (SW_JetStart/Loop/Stop/Empty) синтезированы Tools/JetpackAudio/make_jet_sounds.py; настоящие wav просто назначить в этих полях.\r\n\n## Оружие как деталь: слот основного оружия (2026-11-08)\n- Решено: каждое оружие в своём слоте, к жилету не привязано; основное меняется только в схроне. Слот: `E_GearSlot` значение 7 `PrimaryWeapon (основное оружие)` (в Python `NEW_ENUMERATOR7`), добавлен в конец, старые значения не сдвинуты.\n- Деталь пушки: `/Game/Fisht/Gameplay/Gear/Weapon/DA_Gear_LaserMG` (`PartId` = `LaserMG01`, `Family` = `LaserMG`, скинов пока нет). `AttachedActorClass` = `BP_LaserTurret`, `Ammo` = `DA_Ammo_LMG`. У `DA_Gear_Vest01` пушка и `Ammo` убраны, жилет теперь только жилет. Место пушки не изменилось: `FinishEquip` крепит актор к `Spine_04` с прежним смещением на любом жилете.\n- Поле `DA_GearItem`: `Ammo (боеприпас основного оружия, только для пушки)`, тип `DA_Ammo`. Диспетчер `OnGearChanged(Slot, Item)` на `BP_FishtGearComponent`: `FinishEquip` (Item = деталь) и `UnequipSlot` (Item пуст), через них идут меню Tab, лоадаут, загрузка сохранения.\n- Слот в коде: `FinishEquip` (`TurretActor` для слота 7), `ClearSlot` (уничтожение турели для слота 7), `ApplyBuffer`, `SaveLoadoutTo` (восьмой блок), размеры массивов 8, `SlotCount` = 8. Старые сохранения и лоадауты на 7 слотов при загрузке снимут пушку (слот 7 пустой): надеть заново в схроне. `DA_Loadout_*` дополнены `LaserMG01` восьмым элементом.\n- Имена полей `PartIds (…)` у `DA_Loadout`/`SG_GearLoadout` перечисляют только 7 слотов: восьмой — основное оружие (не переименовывал, переименование полей DA ломает ссылки).\n- Меню Tab, вкладка «Снаряжение»: строка «Основное оружие: деталь/скин/цвет» (`build_skin_provider.py`, 8 слотов). Каталог: `refresh_gear_catalog()` подхватывает `LaserMG01`.\n- Проверено в PIE (скриптом, глазами нет): сборка `DA_Loadout_Standard` надевает 8 деталей и турель стоит на теле; смена жилета на `TestVestHeavy` — турель осталась; снятие слота 7 — турель уничтожена, `AmmoPrimary` = `DA_Ammo_LMG`; повторное надевание — турель создана; `SaveLoadoutTo`/`LoadLoadoutFrom` восстановили 8 деталей с пушкой. Подмена `AmmoPrimary` на другой `Ammo` проверкой не охвачена (у обеих `LMG`), это на стороне «Боя».\n## Основной комплект при появлении (2026-11-08)\n- `BP_FishtGearComponent.BeginPlay` после `OwnerMesh` вызывает `EquipOnStart`: сначала `ApplyLoadoutAsset(DefaultLoadout)` (поле `DefaultLoadout (сборка по умолчанию, если нет сохранения)`, по умолчанию `DA_Loadout_Standard` с пушкой `LaserMG01`), затем `LoadLoadoutFrom(\"GearLoadout\")`: если сохранённая сборка игрока есть, она перекрывает стандартную, иначе ничего не меняется. Без задержки: `AmmoPrimary` и турель готовы с первого кадра.\n- Старое сохранение на 7 слотов: `LoadLoadoutFrom` дописывает в 8-й слот `LaserMG01`, если в сохранении меньше 8 элементов (пушку это не снимает). Новое сохранение без пушки (8 элементов, слот пустой) пушку не вернёт.\n- Респаун телепортирует того же персонажа (`BP_RespawnManagerComponent`), снаряжение остаётся; новый персонаж появляется при загрузке уровня и получает комплект через `BeginPlay`.\n- Отладочный `BP_DebugGearProvider` больше не надевает тестовый комплект через 1 с: связь `Delay` с цепочкой `EquipItem` разорвана (узлы-сироты остались в графе). Пробные детали надевать вручную в Tab.\n- Ловушка: узел `DoesSaveGameExist` + `Branch` в новой функции `EquipOnStart` не сработал (ветка `else` не выполнялась, причина не найдена), поэтому логика без ветвления.\n- Проверено в PIE: старт — 8 деталей и турель с первого кадра; сохранение на 7 слотов (жилет `TestVestHeavy`) — загружается с жилетом из сохранения и с пушкой. Смену уровня и смерть не гонял: респаун — телепорт того же актёра, проверен по графу.\r\n\n- **Гонка турели при старте (2026-11-09):** турель спавнится на `BeginPlay` раньше, чем `WeaponComponent` создаёт `BarrelComp`/`BaseComp`, и `InitFindComponents` читал `None` (окно «Accessed None»). Скрытие встроенного ствола и основания вынесено из `InitFindComponents` в `Tick0_HideBuiltIn`: каждый кадр проверяет `IsValid` обоих и скрывает один раз (флаг `BuiltInHidden`, категория 7). Правки `BP_WeaponComponent` не нужны.\r\n\n\n## Слоты оружия и подсумки: данные (2026-11-09, шаг 1)\nРешения: `Docs/PROGRESSION_PLAN.md` («Слоты оружия и подсумки»). Основное оружие = пулемёт (слот 7), правый подсумок (слот 3) = дополнительное оружие, левый подсумок (слот 2) = патронташ и сборщик пластика. Графики и логики печати и сбора пока нет, только данные и API.\n- **Новые поля `DA_GearItem`** (имена «English (пояснение)», в Python `fn(\"DA_GearItem\",\"...\")`): `GearClass` (Light/Medium/Heavy), `StageIndex` (стадия 1-3), `AmmoPlasticCapacity`, `CollectRadius` (см), `PullSpeed` (см/с), `NoiseLevel` (0-10), `AccelPenalty` (% к набору скорости, скорость не режется), `PrintTime` (с), `AllowedWeaponClasses` (массив имён, для правого подсумка), `RevealedStats` (массив имён открытых характеристик), `WeaponAnchorName` (имя якоря, по умолчанию `WeaponAnchor`).\n- **Пулемёты** (`Gear/Weapon`): `DA_Gear_LaserMG` стал **средним** (`PartId` прежний `LaserMG01`, `Family` `Gun_Medium`, шум 5, штраф 10); `DA_Gear_LaserMG_Light` (`LaserMG_Light01`, `Gun_Light`, шум 3, штраф 5) и `DA_Gear_LaserMG_Heavy` (`LaserMG_Heavy01`, `Gun_Heavy`, шум 8, штраф 20). Лёгкий и тяжёлый пока копии среднего (тот же актор и `DA_Ammo_LMG`), отличаются только ценой; нужны модели и боевые числа. Скинов у семейств `Gun_*` нет.\n- **Левые подсумки** (по 3 стадии прокачки = 3 отдельных детали, формат выбран вместо таблицы: сохранение и сборки уже хранят `PartId`, прокачка = замена детали): `Gear/Pouches/DA_Gear_PouchL01` (= лёгкий, стадия 1), `Gear/Pouches/AmmoL/DA_Gear_PouchL_\u003cКласс>_\u003cN>` (`PartId` `PouchL_Light2` ... `PouchL_Heavy3`). `Family` у всех прежнее `Pouch_Std_L` (общий скин, меш пока куб, актор `BP_PouchModule_L`). Ёмкость / радиус / скорость: лёгкий 100,150,200 / 150,200,250 / 300,400,500; средний 200,300,400 / 250,325,400 / 400,500,600; тяжёлый 350,500,700 / 350,450,550 / 500,600,700. Шум: лёгкий 1, средний 3, тяжёлый 6 (+0,5 за стадию); штраф: 3 / 8 / 15 %.\n- **Правый подсумок** `DA_Gear_PouchR01`: `GearClass` Light, `AllowedWeaponClasses` = [Light], `PrintTime` 2, шум 1, штраф 3, `WeaponAnchorName` `WeaponAnchor`. В `BP_PouchModule` добавлен пустой `SceneComponent` **`WeaponAnchor`** (под `ModRoot`, наследуют `_L` и `_R`): сюда потом цепляется печатающееся оружие (`AttachedActorClass` детали-оружия уже есть). Логики нет.\n- **Скрытые характеристики:** строки видны всегда, закрытое значение UI показывает «???». Имена характеристик: `AmmoPlasticCapacity`, `CollectRadius`, `PullSpeed`, `NoiseLevel`, `AccelPenalty`, `PrintTime`. Открыты сразу те, что в `RevealedStats` детали (стартовые `PouchL01`, `PouchR01`, `LaserMG01` открыты все, новые закрыты). Открытое в игре хранится в отдельном файле `SG_GearReveal` (слот `GearReveal`, массив `Opened` из строк `PartId.Имя`). Функции на `BP_FishtGearComponent`: `IsStatRevealed(Item, StatName) -> Revealed`, `RevealStat(Item, StatName)`. UI позже.\n- **API для других чатов (`BP_FishtGearComponent`, без аргументов, возвращают float `Value`):** `GetAmmoPlasticCapacity()`, `GetCollectRadius()`, `GetPullSpeed()` (читают деталь левого подсумка, слот 2; без подсумка 0), `GetNoiseLevel()` и `GetAccelPenalty()` (сумма по слотам 2, 3, 7). Служебные: `StatNoise(Slot)`, `StatAccel(Slot)`, `StatPrintTime(Slot)`. Обновление при смене экипировки: диспетчер `OnGearChanged(Slot, Item)` (уже есть); числа не кешируются, функции читают текущую деталь.\n- Проверено в PIE (скриптом, глазами нет): стартовый комплект даёт 100 / 150 / 300 / шум 7 / штраф 16; после `DA_Gear_PouchL_Heavy_3` 700 / 550 / 700 / 13 / 28; `RevealStat` + `IsStatRevealed` работают и берут открытое из `RevealedStats` детали; `None` даёт false. Ошибок «Accessed None» в логе нет. Файл `GearReveal.sav` после теста удалён.\n- Каталог и меню Tab пересобраны (`refresh_gear_catalog()`, `build_skin_provider()`), 23 детали. `BOM` в Tools/DebugMenu/*.py: открывать как `utf-8-sig`.\r\n\n\n## Характеристики всех деталей (2026-11-09, шаг 2)\nРешение: `Docs/PROGRESSION_PLAN.md` («Статы всех деталей»). Статы добавляют или вычитают ВСЕ детали (броня, пояс, ботинки, ошейник, подсумки, оружие), у каждой три уровня, уровень = отдельная деталь (`PartId` с номером, `StageIndex` 1-3, прокачка = замена детали, как у подсумков).\n- **Данные:** enum `E_GearStat` (`Gear/E_GearStat`, значения только добавлять в конец: 0 `RegenCapBonus` порог авторегенерации п.п., 1 `BodyHealth`, 2 `VisionRange` %, 3 `FootstepHearing` %, 4 `SpeedBonus` %, 5 `AccelPenalty` % (плюс хуже), 6 `NoiseLevel` (плюс громче), 7 `ArmorReduction` %, 8 `StaminaBonus`, 9 `AmmoPlasticCapacity`, 10 `CollectRadius`, 11 `PullSpeed`, 12 `PlasticCapacity`), структура `S_GearStat` {Stat, Value}, на `DA_GearItem` массив `Stats (характеристики детали: прибавка или штраф, отрицательные можно)`, `OpenStats` (открытые сразу, массив `E_GearStat`), `Rarity` (редкость).\n- **Старые поля** (`ArmorReduction`, `StaminaBonus`, `PlasticCapacity`, `AmmoPlasticCapacity`, `CollectRadius`, `PullSpeed`, `NoiseLevel`, `AccelPenalty`, `RevealedStats`) УСТАРЕЛИ: значения перенесены в `Stats` у всех 25 существующих деталей, в графах не используются, не заполнять. Удалить после перезапуска редактора по слову координатора (ловушка миграции). Переименовать в имени не стал: безопасное переименование поля DA = то же «добавить новые, перевесить, перезапуск, удалить старые». `PrintTime`, `AllowedWeaponClasses`, `WeaponAnchorName`, `StageIndex`, `GearClass` остаются обычными полями.\n- **Геттеры `BP_FishtGearComponent`** (без аргументов, float): `GetStatTotal(Stat)` (сумма по всем надетым деталям, основа), `GetRegenCapBonus`, `GetBodyHealth`, `GetVisionRange`, `GetFootstepHearing`, `GetSpeedBonus`, `GetAccelPenalty`, `GetNoiseLevel`, `GetArmorReduction`, `GetStaminaBonus`, `GetAmmoPlasticCapacity`, `GetCollectRadius`, `GetPullSpeed`. Старые имена работают, но теперь считают сумму по всем слотам (раньше ёмкость/радиус/скорость читал только левый подсумок, шум и штраф слоты 2, 3, 7). Служебные: `ItemStat(Item, Stat)`, `StatPrintTime(Slot)`. Читать при смене экипировки по `OnGearChanged`. `RegenCapBonus` читает «Бой» (компонент здоровья не тронут).\n- **Скрытые значения:** `IsStatRevealed(Item, Stat)` (стат в `OpenStats` детали или открыт в файле `SG_GearReveal`, ключ `PartId.\u003cномер стата>`) и `RevealStat(Item, Stat)` теперь принимают enum, а не имя (старые функции с именами заменены). `DescribeStats(Item) -> Text`: строки «имя стата: значение» или «???».\n- **Tab, «Снаряжение»:** по каждому из 8 слотов кнопка «\u003cслот>: показать характеристики» (`ShowSlotStats(SlotIndex)`), печатает на экране `DescribeStats` надетой детали (12 с). Текстовых строк меню не поддерживает (типы Float/Int/Bool/Enum/Action), поэтому не отдельные строки; для настоящих строк нужен тип «Text» у меню (чужой ассет).\n- **Образцы деталей** (стартовые числа, правит пользователь; `OpenStats` пусты, значения «???» кроме стартовых `PouchL01`, `PouchR01`, `LaserMG01`; модели временные, копии существующих): `Gear/Vest`: `VestMed1-3` (медицинская, Family `Vest_Light`; `RegenCapBonus` +15/+20/+25 ВРЕМЕННО: не подтверждено, прибавка это или новый потолок, `BodyHealth` 20/30/40 без логики, броня 5/7/9), `VestHeavy1-3` (Family `Vest_Heavy`, броня 20-32, здоровье 50-90, штраф ускорения 12→8, шум +3, скорость −5→−3), `VestScout1-3` (скорость +5..9, штраф ускорения −5..−9, шум −2..−4, зрение и слух +10..20 %, броня 3-5), `VestFlight1` (заглушка, один уровень). `Belt/BeltMed1-3`, `Boots/BootsMed1-3`, `Collar/CollarMed1-3` (медицинские, `RegenCapBonus` небольшой, ВРЕМЕННО). Подсумки и пулемёты перенесены со старых полей. Всего в каталоге 42 детали.\n- Проверено в PIE (скриптом, глазами нет): старт 100/150/300 шум 7 штраф 16; `VestMed1`: регенерация 15, здоровье 20, броня 5; `VestHeavy3`: шум 9, штраф 24, броня 32, скорость −3; `BeltMed3`: регенерация 10; `DescribeStats` даёт открытые числа и «???». НЕ проверено: `RevealStat` с enum (из Python вызвать нельзя), запись `SG_GearReveal` и показ строк в самом Tab.\r\n\n### Броня и здоровье (2026-11-09, решение пользователя)\n- `E_GearStat` +1 значение в конец: 13 `RegenRateBonus` (прибавка к скорости авторегенерации, %); геттер `GetRegenRateBonus()`. `BodyHealth` (1) УСТАРЕЛ: у брони нет отдельного здоровья корпуса, значение enum не удалено, у всех деталей обнулено, `GetBodyHealth()` всегда 0, не использовать.\n- Защита = `ArmorReduction` (% снижения урона), у каждого жилета свои числа, отдельных слотов брони нет. Медицинская 3/4/5, разведчика 8/11/14, тяжёлая 20/26/32 (по уровням растёт), лётная заглушка 3.\n- Медицинская броня: `RegenCapBonus` +15/+20/+25 п.п. (уже не временное), `RegenRateBonus` +10/+20/+30 %. Медицинские пояс, ботинки, ошейник дают небольшой `RegenCapBonus`. Поля «Урон выстрела» и «Выстрелов в очереди» из карточки пользователя не переносились.\n- Для «Боя»: `GetRegenCapBonus()`, `GetRegenRateBonus()`, `GetArmorReduction()` на `BP_FishtGearComponent` (суммы по всем слотам).\r\n\n### Старые поля удалены (2026-11-09)\nИз `DA_GearItem` удалены `ArmorReduction`, `StaminaBonus`, `PlasticCapacity`, `AmmoPlasticCapacity`, `CollectRadius`, `PullSpeed`, `NoiseLevel`, `AccelPenalty`, `RevealedStats` (после перезапуска редактора). Значения до удаления сохранены в `Tools/DebugMenu/gear_old_fields_backup.json`. Все характеристики теперь только в массиве `Stats`, открытость в `OpenStats`. `DA_GearItem`, `BP_FishtGearComponent`, `BP_DebugGearProvider`, `BP_DebugSkinProvider`, `BP_LaserTurret`, `BP_PouchModule` скомпилированы, массивы `Stats` у деталей и каталог (42 детали) на месте. Геттеры в PIE после удаления не гонял (PIE запрещён до слова координатора).\r\n\n### Классы брони и нюх (2026-11-09)\n- Типы брони = классы (`GearClass` у жилетов, все уровни): Медицинская `Light`, Разведчика `Medium`, Тяжёлая `Heavy`; `Vest01`/`TestVest` `Light`, `TestVestHeavy` `Heavy`. Лётная заглушка `VestFlight1`: класс `Light` ВРЕМЕННО (отдельный тип, помечено в описании). `DescribeStats` (кнопка «показать характеристики» в Tab) начинает вывод строкой «Класс: …».\n- `E_GearStat` 14 `SniffDuration` (прибавка к длительности линии нюха, секунды), геттер `GetSniffDuration()`. Броня разведчика `VestScout1-3`: +2/+4/+6 с, у остальных 0.\n- Нюх в проекте: режим `bScentMode` на `BP_FishtCharacter` (кнопка `IA_ScentMode`, `ApplyScentVisibility`), следы `Gameplay/Scent` (`BP_ScentTrail.SetScentVisible`, `BP_ScentComponent`, `E_ScentType`). Длительности у способности пока нет (переключатель без таймера), единицы выбраны секунды. Читать `GetSniffDuration()` на `BP_FishtGearComponent` (`GearComponent` персонажа) должен владелец нюха (чат геймплея и способностей), способность не менялась.\r\n\n### Сокеты жилета (2026-11-10, решение пользователя)\n- Подсумки (слоты 2, 3) и пулемёт (7) крепятся к сокетам ЖИЛЕТА, не к костям Фишта: `Socket_PouchL`, `Socket_PouchR`, `Socket_Gun` на скелетном меше жилета (кость `Spine_04`; стартовое положение = прежнее крепление, вид не изменился). Сокеты созданы на `SKM_Vest_01`; на новых мешах: `Tools/DebugMenu/gear_add_sockets.py` (копирует положение с образца) или руками в Skeletal Mesh Editor, см. `Docs/GEAR_ADD_ARMOR.md` раздел 10.\n- `BP_FishtGearComponent`: `GetVest()` (компонент жилета, `SpawnedComps[0]`), `CanSpawnForSlot(Slot)` (для слотов 2, 3, 7 нужен жилет), `PlaceOnVest(Slot, Actor)` (после спавна цепляет к сокету `SocketNameForSlot`; нет сокета: `PrintWarning` «ОШИБКА ЖИЛЕТА …» в лог и запасное крепление к `Spine_04` с прежним смещением), `RefreshAttachments`/`RefreshSlot` (после надевания жилета создаёт отложенные подсумки и турель), `DestroyVestGear` (при снятии или смене жилета уничтожает турель и подсумки и вызывает `OnGearChanged(слот, None)` для 7, 2, 3; сами детали остаются в `EquippedItems`), `HasSecondaryWeapon()` (есть ли правый подсумок: `IsValid(PouchRActor)`).\n- Правила: нет жилета = нет подсумков и пулемёта; нет правого подсумка = нет дополнительного оружия. `AmmoPrimary` без жилета не подделывается (читает «Бой»). Жилет без `SkeletalMesh` (только `StaticMesh`) сокетов не имеет: запасное крепление. `AttachBone` у деталей слотов 2, 3, 7 больше не используется.\n- Смена жилета пересоздаёт турель и подсумки (не переприкрепляет). Физика «болтается» не менялась: пружинный маятник `BP_PouchModule` лежит поверх корня актора, корень теперь на сокете. В `BP_PouchModule` по-прежнему пустой `WeaponAnchor` под допоружие.\n- `VestHeavy1-3` получили `SkeletalMesh` = `SKM_Vest_01` (временно) и потеряли тестовый `StaticMesh` Cylinder: иначе у тяжёлых жилетов не было бы сокетов.\n- Проверено в PIE (скриптом, глазами нет): старт — турель и подсумки на сокетах `Socket_Gun/PouchL/PouchR` компонента жилета; снятие жилета — актёров нет, `HasSecondaryWeapon` false, детали в слотах остаются; возврат жилета — всё восстановлено; смена на `VestHeavy1`/`VestScout2` — на сокетах; без правого подсумка `HasSecondaryWeapon` false; жилет без сокетов — запасное крепление `Spine_04` и строки «ОШИБКА ЖИЛЕТА». В логе нет Accessed None.\r\n\n### Отдача пулемёта (2026-11-10)\n`BP_LaserTurret`, категория «4 Отдача»: `RecoilStrength` 300 (было 80), `RecoilRefInterval` 0.1 (было 0.25), `RecoilK` 900, `RecoilC` 30, `MaxRecoil` 6 (без изменений). Проверено в PIE очередью ~2,5 с (запись `RecoilX` каждый кадр редактора, кадры редки, ~35 мс): на каждом выстреле смещение доходит до потолка 6 см и до следующего выстрела возвращается к ~0,2 см, между выстрелами не накапливается и не уезжает; после конца очереди за 2 кадра 0 (дребезга нет, минус ~-0,05 см). Так что потолок достигается на каждом выстреле, но возврат полный. Как это выглядит и не слишком ли резко, смотрит пользователь; если резко: уменьшить `RecoilStrength` (150-200) или `MaxRecoil`, если мало заметно: поднять `MaxRecoil`.\r\n\n### Отдача пулемёта: диагностика (2026-11-10)\n- **Цепочка отдачи в данных:** `Tick5_RecoilSpring` (пружина `RecoilX`) → `Tick8_IKBlend` (`IKRecoilOut` = вектор вдоль выбранного направления × (−`RecoilX`) × `RecoilGain`) → `Tick9_SolveArm` (сумма с целью IK, аналитическое решение суставов, `bUseRecoilIn`) → `RootRotOut`/`Arm2RotOut`/`HeadRotOut` → `ABP_LaserGun`. В `ABP_LaserGun` отдача не читается напрямую (`RecoilOffset`/`IKRecoil` там старые неиспользуемые переменные), она доходит до меша только через повороты суставов. `bUseRecoil` в Class Defaults `ABP_LaserGun` = true, в экземпляре в PIE true, `bUseRecoilIn` на турели true.\n- **Сокет жилета и камера не мешают:** вычисления идут в пространстве актора турели и сокетов `GunMesh`, смена родителя на `Socket_Gun` их не затрагивает; `AttachOffset` у `DA_Gear_LaserMG*` нулевой, `AttachBone` не используется (крепление по сокету). Камера над плечом отдачу не прячет (замер по сокету `Muzzle` в PIE, не по скрину).\n- **Что было не так:** (1) пружина `RecoilK` 900 возвращала `RecoilX` за 1 кадр: толчок существовал один кадр. (2) Направление отдачи считалось в сторону курсора (`AimLocation`), поэтому отдача сильно зависела от положения прицела (по просьбе пользователя убрано). (3) Решатель суставов съедает ~60% смещения (пределы суставов, демпфирование): `RecoilX` 4 см даёт ~1-2 см смещения дула. Усиление множителем (поле `RecoilGain`, категория «4 Отдача») выше ~1,5 даёт дрожь дула кадр через кадр (±6 см при 2,5; при 1,6 заметная), поэтому `RecoilGain` = 1,0.\n- **Что сделано:** направление отдачи теперь вдоль ствола (вперёд по сокету `Muzzle`), а не к курсору, отдача от положения прицела не зависит. Числа: `RecoilStrength` 300, `RecoilK` 400, `RecoilC` 22, `RecoilRefInterval` 0.1, `MaxRecoil` 12, `RecoilGain` 1.0. В очереди `RecoilX` колеблется 4,6..10 (держится отодвинутым с пульсацией), после очереди возвращается за ~0,3 с, дрожи нет (замер дула в PIE по кадрам при `slomo 0.1`). Как это выглядит, смотрит пользователь: мягче — меньше `RecoilStrength`, резче — больше `RecoilStrength` и `MaxRecoil`, но не `RecoilGain`.\n- **Осиротевшие узлы в `Tick8_IKBlend`** (`GetSocketLocation Gun_Root` → `GetDirectionUnitVector`) остались от пробы, на результат не влияют.\n\n## Наш пулемёт: что где лежит и как делать новое (2026-11-10)\n**Файлы:**\n- `Content/Fisht/Gameplay/Gear/LaserGun/`: `BP_LaserTurret` (актор пушки: логика наведения, отдача, свечение, `GunMesh`), `ABP_LaserGun` (анимация: стойка, сгибы рычагов), `SKM_LaserGun_01` + скелет `SK_LaserGun_01` (5 костей: `Gun_Root`, `Gun_Arm1_Pitch`, `Gun_Arm1_Swing`, `Gun_Arm2`, `Gun_Head`, сокет `Muzzle`), клипы в `Anims/`, материал `M_LaserGun_01`.\n- `Content/Fisht/Gameplay/Gear/Weapon/`: детали `DA_Gear_LaserMG` (средний), `_Light`, `_Heavy`: данные (слот 7, `PartId`, `Family`, `GearClass`, `AttachedActorClass` = `BP_LaserTurret`, `Ammo` = `DA_Ammo_LMG`, `Stats`, цена). Урон, звук выстрела, скорострельность: `DA_Ammo_*` в `Content/Fisht/Combat/Core` («Бой»).\n- **Спокойно менять:** поля Class Defaults `BP_LaserTurret` (категории 1-5: оружие, наведение, излучатель, отдача, расчёт руки), поля DA-деталей (`Stats`, `DisplayName`, `GearClass` и т.д.), `DA_Ammo_*`. **Не трогать:** категорию «6 Выходы для ABP», «7 Служебное состояние», граф `ABP_LaserGun`, имена костей и сокет `Muzzle` в скелете (ломают ABP и расчёт руки), `SK_LaserGun_01` (не импортировать целую сцену `.blend`, см. `Docs/VEST_NEW_ITEMS.md`).\n- **Что реально сейчас:** `DA_Gear_LaserMG_Light` и `_Heavy` — копии `DA_Gear_LaserMG` на ту же турель `BP_LaserTurret` и тот же `DA_Ammo_LMG`; различаются только `Stats` (цена: шум, штраф ускорения). Меша, анимаций, отдачи и звука отдельных у них нет. Параметры турели (отдача и т.п.) лежат в Class Defaults одного `BP_LaserTurret`, из `DA_GearItem` не читаются, `DA_GearItem.SkeletalMesh` для пушки не используется.\n- **Рекомендация:** ОДИН базовый `BP_LaserTurret`, всё различающееся читать из данных; новый Blueprint только если другой скелет или ригг (другое число/имена костей: нужны свой `ABP` и расчёт руки). Для пулемётов на том же риге (другая модель, цвет, отдача) достаточно данных.\n- **План доработки (если нужно, не сделан):** (1) в `DA_GearItem` для оружия добавить `GunMesh` (скиннутый меш на тот же скелет `SK_LaserGun_01`) и блок «Профиль»: `RecoilStrength/K/C/Max`, `GlowStowed/Deployed/Fire`, `FireMontage`, при желании `GunOffset`; (2) в `FinishEquip` после спавна турели передать деталь (`ApplyPart(Item)` на `BP_LaserTurret`) и там подменить меш `GunMesh` и скопировать параметры в переменные турели (пустое поле = значения из Class Defaults); (3) звук и урон остаются в `DA_Ammo_*` (поле `Ammo` детали); (4) вид: скины по семейству `Gun_Light/Medium/Heavy`. Тогда новый пулемёт на том же риге = новый `SKM` + `DA_Gear_*`, без нового Blueprint.\r\n- **Тряска пушки при близкой точке прицела (2026-11-10, жалоба пользователя: «трясёт в некоторых положениях, камера со смещением от капсулы»):** точка прицела строится от камеры, а камера над плечом смещена от капсулы, поэтому при близкой цели (стена, пол рядом) направление дуло-цель сильно меняется от кадра к кадру, и решатель руки раскачивается. Добавлено: `Tick0b_SafeAim` (в цепочке тиков после `Tick0_HideBuiltIn`) считает `SafeAimLoc`: если точка прицела ближе `MinAimDistance` (400 см, категория «2 Наведение») от кости `Gun_Root`, она отодвигается по тому же направлению на 400 см; все расчёты руки и отдачи (`Tick2..Tick5`, `Tick8`, `Tick9`) читают `SafeAimLoc` вместо `AimLocation`. Выстрел идёт в настоящую точку прицела (компонент оружия «Боя» не менялся). Проверено в PIE: при дальней цели `SafeAimLoc` = `AimLocation`; при искусственном `MinAimDistance` 20000 точка отодвигается ровно на это расстояние, направление совпадает (dot 1,0). Саму тряску на близкой цели не воспроизводил (не удалось поставить прицел вплотную), эффект проверяет пользователь; если трясёт и дальше: поднять `MinAimDistance` (600-1000) или сообщить, в каком положении.\r\n\n### Параметры пулемёта из данных детали + EmitterSide (2026-11-10)\n- **EmitterSide.** Настоящая причина «нет отдачи» нашёл пользователь: боковое смещение пулемёта `EmitterSide` конфликтовало с отдачей. После смещения камеры над плечом пулемёт не пересекает прицел, смещать вбок не нужно. Переменная `BP_LaserTurret` переименована в «`EmitterSide (боковое смещение пулемёта, см; после смещения камеры над плечом должно быть 0)`», значение по умолчанию 0 (категория «3 Излучатель»), в `DA` такого поля нет. Логика в графе от ненулевого значения не зависит: `EmitterSide` используется только в `Tick4_EmitterSide` (множитель вектора `IKOffsetOut`; `SideDir/SideSign` лишь выбирают сторону для этого множителя), `IKOffsetOut` читает `Tick9_SolveArm`: при 0 смещение нулевое. Правило: когда пользователь называет конкретный параметр, сначала проверять именно его.\n- **Отдача после EmitterSide = 0.** Числа `RecoilStrength` 300, `RecoilK` 400, `RecoilC` 22, `RecoilRefInterval` 0.1, `MaxRecoil` 12, `RecoilGain` 1.0 остаются. Замер очереди в PIE: `RecoilX` работает пилой 1..10,9 (толчок на каждом выстреле и спад между), смещение дула по кадрам ±2 см на толчок. Усиления сверх этого не добавлял; `SafeAimLoc` оставлен (не мешает). Если на глаз перебор — уменьшить `RecoilStrength` до 150-200.\n- **Профиль пулемёта в `DA_GearItem`** (поля «Gun…»): `GunMesh` (меш на скелет `SK_LaserGun_01`, пусто = меш турели), `bUseGunProfile` (включить применение профиля), `GunRecoilStrength/K/C/RefInterval`, `GunMaxRecoil`, `GunRecoilGain`, `GunGlowStowed/Deployed/Fire`, `GunFireMontage` (пусто = монтаж турели). `BP_LaserTurret.ApplyPart(Item)`: меняет меш `GunMesh` (если задан) и, если `bUseGunProfile` включён, копирует значения профиля в переменные турели (отдача, свечение, монтаж). `BP_FishtGearComponent.FinishEquip` вызывает `ApplyPart` после спавна и крепления к сокету (для не-турелей приведение не проходит и ничего не происходит). Звук и урон остаются в `DA_Ammo_*` (поле `Ammo`). `DA_Gear_LaserMG`, `_Light`, `_Heavy`: `bUseGunProfile` включён, значения профиля равны прежним значениям турели (без потерь); `GunMesh` пуст.\n- **Новый пулемёт на том же риге:** дублировать `DA_Gear_LaserMG*`, указать `GunMesh` (импорт на `SK_LaserGun_01` по `Docs/VEST_NEW_ITEMS.md`) и числа профиля. Новый Blueprint нужен только при другом скелете или ригге.\n- Значения по умолчанию в Class Defaults `BP_LaserTurret` остаются запасными (для турели без детали или с выключенным профилем), поэтому старых полей для удаления нет и перезапуск редактора не нужен.\n- Проверено в PIE: старт — турель с профилем 300/6/12; детали `Heavy` с тестовыми значениями (150/2/8) — турель применила; возврат на `Medium` — снова 300/6/12; крепление к `Socket_Gun`, меш по умолчанию. Тестовые значения в памяти возвращены, не сохранялись.\r\n\n### Три класса пулемёта: как есть сейчас (2026-11-10)\n`DA_Gear_LaserMG_Light` / `DA_Gear_LaserMG` (средний, `LaserMG01`) / `DA_Gear_LaserMG_Heavy`: ОДНА модель (`SKM_LaserGun_01`, `GunMesh` пуст), ОДИН боеприпас `DA_Ammo_LMG` (урон 8, пауза 0,1 с, заряд 30, дальность 6000, слышимость 1800), ОДИН профиль отдачи и свечения (300/400/22/0,1/12, gain 1,0, свечение 0,6/1,6/6). Различаются только `Stats`: шум 3/5/8 и штраф ускорения 5/10/20 % и `Family`/`GearClass`. Подробная инструкция по новому пулемёту: `Docs/GEAR_ADD_WEAPON.md`.\r\n\n\n## Чистка снаряжения (2026-11-10): без ботинок, сопла в поясе, три класса\n\nЭта запись **отменяет** более ранние разделы про ботинки, отдельный слот сопл и «Vest01».\n- **Ботинки убраны полностью.** Удалены `DA_Gear_Boots01`, `BootsMed1-3` и скин `Skin_Boots_Std_Default`. Слот `LegWraps` (индекс 5) в `E_GearSlot` помечен УСТАРЕЛО (индексы не сдвигались). Модель `SKM_Boots_01`, материал и текстуры остались в проекте, но не используются. В Tab нет строк про ботинки.\n- **Сопла = часть пояса.** Удалена деталь `DA_Gear_JetNozzles01` и скины `Skin_Nozzle_*`. Слот `Nozzles` (индекс 6) помечен УСТАРЕЛО. Во все пояса (`DA_Gear_Belt*`, слот `Backpack` 4) вписан `AttachedActorClass` = `BP_JetNozzles`. В `BP_FishtGearComponent` в `FinishEquip` и `ClearSlot` проверка `слот == 6` заменена на `слот == 4`: актор сопл спавнится вместе с поясом, хранится в `BeltActor`, уничтожается при снятии или смене пояса. Вид сопл (`FlameColor`, `LightColor`, `ExtraMeshes`) берётся из скина пояса (`BP_JetNozzles.DoApplySkin` не проверяет семейство); цвет с альфой 0 не применяется. Скины пояса: `Skin_Belt_Default`, `Skin_Belt_Graphite` (оранжевое пламя), новый `Skin_Belt_BlueFlame` (синее). Проверено в PIE: сопла спавнятся с `BeltScout1`, смена на `BeltHeavy2` заменяет актор (один экземпляр), снятие уничтожает, скин применяется (`MID_M_JetFlame`).\n- **Три класса, по 3 уровня:** Медицинский = `Light`, Разведчика = `Medium`, Тяжёлый = `Heavy`. Броня `VestMed1-3`, `VestScout1-3`, `VestHeavy1-3`; ошейник `CollarMed1-3`, `CollarScout1-3`, `CollarHeavy1-3`; пояс `BeltMed1-3`, `BeltScout1-3`, `BeltHeavy1-3`. Прежняя броня `Vest01` = «Броня разведчика 1» (`VestScout1`), стандартный ошейник и пояс = разведчик ур.1. Удалены `Vest01`, `VestFlight1` (заглушка), `Collar01`, `JetpackBelt01`.\n- **Заготовки (числа временные, пользователь поправит).** Модели у всех классов пока общие (`SKM_Vest_01`, `SKM_Collar_01`, `SKM_JetpackBelt_01`). Ошейник разведчика ур.1/2/3: `VisionRange` +6/+9/+12, `FootstepHearing` +8/+12/+16. Тяжёлый ошейник: `ArmorReduction` +3/+5/+7, `FootstepHearing` −3/−3/−2. Пояс разведчика: `SpeedBonus` +3/+5/+7, `StaminaBonus` +6/+9/+12. Тяжёлый пояс: `StaminaBonus` +10/+14/+18, `ArmorReduction` +2/+3/+4, `AccelPenalty` +5/+5/+4, `NoiseLevel` +2.\n- **Тестовые `DA_Gear_Test*`** (Vest, VestHeavy, Collar, PouchL, PouchR) не удалены: на них ссылается `BP_FishtCharacter`. Из каталога `DA_GearCatalog_Main` и из меню Tab они исключены (фильтр в `Tools/DebugMenu/build_gear_catalog.py` и `build_skin_provider.py`).\n- **Меню Tab.** В `build_skin_provider.py` слоты 5 и 6 пропускаются (`DEPRECATED_SLOTS`). В старом `BP_DebugGearProvider` убраны пункты «Надеть: Ботинки» и «ПОЛНЫЙ КОМПЛЕКТ», остальные указывают на `CollarScout1`, `BeltScout1`, `VestScout1`.\n- **Сборки** `DA_Loadout_*`: массивы по 8 слотов сохранены, в позициях 5 и 6 стоит `None`, жилет `VestScout1`, ошейник `CollarScout1`, пояс `BeltScout1`. Старые сохранения с `Boots01` или `JetNozzles01` при загрузке просто пропускают эти слоты.\n\n## Джетпак только с поясом и правые подсумки по классам (2026-11-10)\n\n**Джетпак.** Тягу включает `BP_JetpackComponent.TickJet` (раньше только `JetOn > 0`, топливо, удержание). Теперь в `TickJet` добавлено условие «пояс надет»: функция `UpdateBeltOk` (новая, в начале `TickJet`) спрашивает у `BP_FishtGearComponent` функцию `HasBelt` (новая, `IsValid(BeltActor)`) и пишет результат в `bBeltOk`; `bActive` = прежнее условие И `bBeltOk`. Нет пояса: нет тяги, нет топливного расхода, а сопла (актор `BP_JetNozzles`) уничтожены вместе с поясом. Тронуты: `BP_JetpackComponent` (зона combat-core, правка минимальная), `BP_FishtGearComponent`. `BP_FishtCharacter` не трогался. Двойной прыжок это отдельная способность и от пояса не зависит (если нужно связать, сказать).\n\n**Правые подсумки (слот `PouchRight`, 3).** Три класса по 3 уровня, детали `DA_Gear_PouchR01` (Light 1), `Pouches/WeaponR/DA_Gear_PouchR_\u003cLight|Medium|Heavy>_\u003cN>` (PartId `PouchR_Light2`, `PouchR_Medium1`, ...). Модель и скин общие (`Pouch_Std_R`), заготовки.\n- Класс = число слотов дополнительного оружия: Light 1 (без выбора), Medium 2, Heavy 3. Новые статы в `E_GearStat` (в конец, индексы целы): **15 `SecondarySlots`**, **16 `SecondaryAmmoBonus`** (прибавка к запасу патронов доп. оружия, %). Геттеры в `BP_FishtGearComponent`: `GetSecondarySlotCount` (int; 0 без правого подсумка и без жилета), `GetSecondaryAmmoBonus`.\n- Числа-заготовки (слоты / запас % / шум / штраф разгона % / печать с): Light 1-3: 1/0/1/3/2.0, 1/25/1/3/1.6, 1/50/2/4/1.2. Medium 1-3: 2/20/3/6/3.0, 2/45/3/6/2.5, 2/70/4/7/2.0. Heavy 1-3: 3/40/6/12/4.5, 3/70/7/12/4.0, 3/100/8/14/3.5. Логика: уровень = больше патронов и быстрее печать; Heavy вмещает больше, но шумит, замедляет разгон и печатается дольше; Light быстрый и тихий. Открыты сразу шум и штраф разгона, остальные ???.\n- `AllowedWeaponClasses`: Light `[Light]`, Medium `[Light, Medium]`, Heavy `[Light, Medium, Heavy]`.\n- **Выбор доп. оружия в Tab:** вкладка «Снаряжение», «Доп. оружие 1/2/3: выбор» (Нет, Ракета, Самонаводящаяся ракета, Граната, Рейлган). Выбор пишет `BP_FishtGearComponent.SetSecondaryChoice(Index, Ammo)`, массив `SecondaryChoices`. Слот с номером `>= GetSecondarySlotCount` отклоняется сообщением на экране (проверено в PIE: у Heavy 3 принято, 4-е отклонено).\n- **Как выбирается доп. оружие сейчас (зона combat-core):** `BP_WeaponComponent` держит статический список `SecondaryAmmoList` (Rocket, RocketHoming, Grenade, Railgun), индекс `SecondaryIndex`; `CycleSecondary` (R) листает по кругу, `SelectSecondary` (клавиши 1-4) выбирает по номеру, `Slot1` хранит текущий заряд, `MagStore` магазины. Число слотов подсумка на это не влияет. Что нужно от combat-core: строить `SecondaryAmmoList` из `SecondaryChoices` (первые `GetSecondarySlotCount` непустых), при пустом подсумке отключать второй слот, ограничить `SelectSecondary` и `CycleSecondary` этой длиной (Light = 1 без переключения), запас патронов умножать на `1 + GetSecondaryAmmoBonus/100`, пересобирать список по `OnGearChanged`.\n\n**Переключение доп. оружия по слотам подсумка (2026-11-10, правка вместо запроса к combat-core).** Существующее переключение (R: `CycleSecondary`, 1-4: `SelectSecondary`) работает по списку `BP_WeaponComponent.SecondaryAmmoList` и пропускает всё, что за его длиной. Теперь этот список собирает `BP_FishtGearComponent.SyncSecondaryList`: берёт первые `GetSecondarySlotCount` непустых из `SecondaryChoices` (по умолчанию Rocket, RocketHoming, Grenade, Railgun), записывает в `SecondaryAmmoList`, ставит `SecondaryIndex` = 0 и вешает на второй слот первое оружие с полным магазином (`Slot1.SwapAmmo`). Вызывается из `SetSecondaryChoice` (Tab), `RefreshAttachments` (после экипировки) и `UnequipSlot`. Результат в PIE: Light 1 оружие (R не переключает), Medium 2, Heavy 3 (R ходит по кругу по ним), без подсумка список пуст, выбор в Tab (например Railgun первым) попадает в список. Ограничение: `MagStore` (магазины по индексам) при пересборке не пересчитывается, смена подсумка даёт полный магазин нового первого оружия. Тронуты `BP_FishtGearComponent` (новые `SyncSecondaryList`, `ScratchAmmoList`, правки концов `RefreshAttachments`, `UnequipSlot`, `SetSecondaryChoice`) и данные по умолчанию; `BP_WeaponComponent` не менялся (только пишется его `SecondaryAmmoList` и `SecondaryIndex` снаружи).\n\n## Двойной прыжок убран из игры (2026-11-10, решение пользователя)\n\nДвойной прыжок удалён полностью (раньше был выключен: `MaxAirJumps = 0`, второе нажатие в воздухе включало джетпак). Что удалено:\n- `BP_FishtCharacter`: компонент `DoubleJumpAbility`, переменная `IsDoubleJump`, диспетчер `OnDoubleJump` (и его граф), событие `OnAbilityStarted` компонента, вызовы `TryActivate`, `ResetAirJumps`, `MarkLeftGround` и событие `OnMovementModeChanged` (служило только им). Развилка прыжка осталась: на земле `Jump`, в воздухе ничего (джетпак включается отдельно, через `BP_JetpackComponent.SetHeld`).\n- `DT_AbilityLevels`: строки `DoubleJump_1`, `DoubleJump_2` (колонки не менялись, в таблице остались Dash_1-3, Slide_1, Bite_1).\n- `DA_Ability_DoubleJump` удалён.\n- Tab: пункты «Двойной прыжок: ...» вкладок «Способности» и «Способности: параметры» (`BP_DebugAbilityProvider`, `BP_DebugAbilityParamsProvider` перестроены из `Tools/DebugMenu/build_ability_provider.py` и `build_params_providers.py`, переменная `Jump` убрана).\n- `Tools/Tunables/registry*.json`, `tunables_meta.json`: ключи `DoubleJump*`.\n- Не удалён ассет `BP_Ability_DoubleJump`: на него ещё ссылается уровень `L_JR_Preview` (остаток переопределения компонента в экземпляре персонажа); после пересохранения уровня его можно удалить. Анимационных ассетов двойного прыжка в проекте нет (`AS_DoubleJump` не импортирован; в ABP логика `Relaunch` при скачке `vz` общая и осталась, она реагирует на любой подброс, в том числе на тягу джетпака).\nПроверено в PIE: обычный прыжок работает, джетпак с поясом тянет и расходует топливо, без пояса при полном топливе не тянет, в логе ошибок нет.\n\n## Медицинский набор: реальные карточки (2026-11-11)\n\n`DA_Gear_VestMed1` и `DA_Gear_CollarMed1` (класс Light, уровень 1) теперь на настоящих моделях: жилет `SKM_Med_Armor_01` (Blender `Vest_Med_01`), о

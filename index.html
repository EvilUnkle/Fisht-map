шейник `SKM_Med_Collar_01` (`Collar_Med_01`), оба на общем материале `M_Med_Armor_01` (одна атлас-текстура Tripo, 2048 px, без дубля текстур). До этого карточки были заготовками на общих моделях `SKM_Vest_01` и `SKM_Collar_01` (они остались у Scout/Heavy). PartId, названия и Stats не менялись (Vest: RegenCapBonus 15, ArmorReduction 3, RegenRateBonus 10; Collar: RegenCapBonus 5, VisionRange 3, FootstepHearing 5): числа остаются заготовками, правит пользователь. Ошейник экспортирован кнопкой экспорта без текстур (`fisht_export.py`, текстуры уже есть у жилета) и импортирован `gear_import_part.py` с параметром `material`. На меш жилета добавлены сокеты `Socket_PouchL/R/Gun` (`gear_add_sockets.py`, положение скопировано с `SKM_Vest_01`: подогнать под форму жилета в Skeletal Mesh Editor). Проверено в PIE: оба надеваются, у обоих `MID_M_Med_Armor_01`, подсумок и пушка прицепились.\n\n**Сокеты при импорте (2026-11-11).** gear_import_part.py для kind=Vest сам вызывает \u0007dd_vest_sockets() из gear_add_sockets.py (общая функция, файл по-прежнему запускается и отдельно). Положения скопированы с SKM_Vest_01 (Spine_04); на SKM_Med_Armor_01 проверено в PIE: подсумки L/R и пулемёт прикреплены к Socket_PouchL/R/Gun медицинского жилета, строк ОШИБКА ЖИЛЕТА нет (размеры жилетов отличаются менее чем на 0.7 см, коррекция по bounding box не понадобилась).","date":"2026-11-11"},{"path":"Docs/COMBAT_PLAN.md","title":"Боевая система: план и контракты","section":"Снаряжение и оружие","md":"# Боевая система Фишта: план и контракты (2026-11-04)\n\nРешения пользователя (источник истины, менять только с ним):\n\n- **Оружие** встроено в жилет: «мини-3D-принтер боеприпасов». Модульность = разные боеприпасы, а не разные стволы. Боеприпас стоит ресурса «боевой пластик» (подбирается в мире, нужна система сбора; бывшая «электроника», см. уточнения ниже). Базовое оружие лазерно-огнестрельное, лёгкий пулемёт; модификации: больше заряд, больше урон, дольше пауза/перезарядка. Другие боеприпасы: ракеты (есть с самонаведением), гранаты, пучок. **Можно стрелять параллельно**: основной огонь + второй слот (ракета/граната) одновременно.\n- **Прицел:** перекрестие в центре экрана, управляется камерой, независим от бега. Стрелять можно всегда, без правой кнопки. Правая кнопка только приближает (дополнительное прицеливание, позже возможен режим захвата целей). Тело, голова и торс к прицелу НЕ доворачиваются: пользователь просил отключить эту функцию, слоя в ABP нет. Режим `StrafeMode` по умолчанию 0. Опциональное автонаведение: конус + мягкий доворот точки попадания, камеру не дёргаем, цель подсвечивается, по умолчанию выключено. У части боеприпасов своё самонаведение.\n- **Укус:** не боевой. Рывок-удар с разбега (dash) заменяет атаку. Укус позже превратится в «схватить/тащить» (кэрриблы уже есть; добивание за провода робота отложено).\n- **Джетпак-прыжок (вместо рокет-джампа, уточнение 2026-11-04):** имелся в виду не взрыв под Фиштом, а увеличенный двойной прыжок вроде джетпака (сам двойной прыжок убран из игры 2026-11-10): позволяет немного долететь куда-нибудь и тратит энергию. Какую энергию и как именно, пользователь ещё думает; вернуться к этому отдельным шагом.\n- **Где оружие на теле (уточнение 2026-11-04):** всё стреляет из жилета. Пулемёт выдвигается над жилетом и поворачивается к прицелу (турель), ракеты вылетают из жилета слева и справа. Сейчас заглушка: `BP_WeaponComponent` (`MountBone` = `Spine_04`, `TurretHeight`, `BarrelLength`, `RocketSide`, `RocketHeight`, модель в `TurretAsset`/`BaseAsset`).\n- **Турель, будущая модель (пользователь, 2026-11-04, отдельная задача вместе с подгонкой жилета):** пулемёт выходит из самого жилета, а не из спины, и прячется в режиме ожидания (опция). Составная деталь из примерно трёх костей: одна сам пулемёт, две сгибают его в разные стороны, чтобы при стрельбе вперёд он анимированно огибал морду Фишта, вытягиваясь. Жилет открыт в Blender, к Фишту ещё не подогнан: понадобится выгрузить модель Фишта в Blender.\n- **Кнопки (уточнение 2026-11-04):** левая + правый триггер: основной огонь; правая + правый бампер: второй слот; средняя + левый триггер: прицеливание (поменяно 2026-11-07); перезарядка R / нажатие правого стика; боеприпас второго оружия: колесо мыши вверх/вниз (по кругу), крестовина влево; бег на геймпаде переключается нажатием левого стика (`IA_RunToggle`, на клавиатуре Shift как в `RunToggle`); присед на B; рывок временно на левом бампере (пользователь про бампер не решил); клавиши 1-4 выбирают боеприпас второго слота, смена по кругу осталась на R и крестовине влево; укус временно на крестовине вправо (F). Остальную крестовину и взаимодействие пользователь решит позже.\n- **Захват цели (решение 2026-11-04):** короткое нажатие прицеливания = захват для самонаводящихся ракет, камеру не держит. Длинное = небольшой зум и камера держит цель, можно бегать вокруг; отпустил = камера свободна. На гранаты и пулемёт захват не действует. Если цели нет, удержание даёт только зум.\n- **Ресурсы (два вида пластика):** боевой пластик идёт на печать боеприпасов, улучшающий пластик пойдёт на улучшения. Лежат на уровнях и в тайниках, выпадают из врагов, немного из пропсов. Базовый пулемёт тратит боевой пластик дёшево (за магазин); при нуле медленная бесплатная печать, чтобы игрок не остался без оружия.\n- **Статы брони:** снижение урона, выносливость, ёмкость пластика.\n- **Здоровье Фишта:** здоровье + смерть. Щит с регенерацией позже. Отрываемых модулей брони нет. Жилет модульный: модули добавляют статы (расширяет `E_GearSlot`/`DA_GearItem`/`BP_FishtGearComponent`).\n- **Стелс:** простой, с задатком на рост: конус зрения + шум шагов + тревога + преследование. Без света/тени и укрытий. Враги летающие и наземные; поведение меняется на ходу (перепрограммирование).\n- **Враги, версия 1:** дрон (летающий) и наземный робот на воздушной подушке; оба простые, без сложных анимаций (можно взять модель из FAB или уже скачанную в проекте). `BP_SecurityRobot` остаётся как есть.\n- **Разрушение врагов:** оболочка + модули, у каждой детали своё здоровье, отлетает обломком и меняет поведение (после дронов).\n- **Насилие:** роботы, без крови; искры, дым, обломки, взрывы. (Предположение координатора, пользователь не возражал.)\n- Готовое из FAB целиком не брать; звуки/эффекты/декали попаданий можно. Использовать движок: AIPerception (стелс), Chaos (разрушения), Niagara.\n\n## Контракты (создаёт чат «Бой: ядро», остальные на них опираются)\n\n1. `BPI_Damageable`: `ApplyDamage(Amount, DamageType, Instigator, HitLocation, HitDir)`, `GetHealth`, `IsDead`. Реализуют Фишт, враги, разрушаемые пропсы.\n2. `E_DamageType`: Bullet, Laser, Explosion, Dash, Electric (расширяемо).\n3. `AimPoint`: компонент/функция в камере-стороне: мировая точка и направление прицела от луча камеры. Читают оружие и автонаведение.\n4. `DA_Ammo` (DataAsset): тип, цена в боевом пластике, урон, скорострельность, заряд, перезарядка, снаряд, самонаведение, слот (основной/вторичный).\n5. `BP_WeaponComponent` на Фиште: два независимых слота огня, расход боевого пластика, события `OnFire/OnHit/OnAmmoChanged`.\n6. `E_Resource` (CombatPlastic, UpgradePlastic), `BP_ResourcePickup` + счётчик в HUD (владелец UI подключает).\n7. `E_Alert` (Calm, Suspicious, Alert, Chase) и событие `OnPlayerSpotted/OnNoiseHeard` для стелса.\n\n## Зоны и чаты\n\n| Чат | Модель | Владеет | Когда |\n|---|---|---|---|\n| Бой: ядро | Opus 5.5 (разрешено пользователем 2026-11-04) | `/Game/Fisht/Combat`, контракты 1–7, оружие, снаряды, ресурсы, джетпак-прыжок, dash-удар | сейчас |\n| Камера | как есть | правая кнопка: только приближение, без разворота тела; `StrafeMode` по умолчанию 0 | после контракта `AimPoint` |\n| Броня и модули жилета | Sonnet | `DA_GearItem` статы, слоты | после ядра |\n| Стелс и обнаружение | Sonnet | перцепция, `E_Alert`, шум шагов (с чатом «ИИ») | после ядра |\n| Враги: дрон и робот на подушке | Sonnet | `/Game/Fisht/Combat/Enemies`, ИИ вместе с чатом «ИИ противников» | после ядра |\n| Разрушаемые враги | Sonnet | модули/детали, обломки | после дронов |\n| UI боя | существующий UI-чат | здоровье, электроника, слоты оружия | по запросу ядра |\n\nПравила: PLAN.md §3, чужие Blueprint (`BP_FishtCharacter`, `ABP_*`, камера) только минимальными правками через владельца. Коммит после шага. Визуальные вердикты за пользователем.\n\n## Состояние ядра (2026-11-04)\n\nСделано в `/Game/Fisht/Combat`, скрипты сборки `Tools/Combat/` (повторный запуск безопасен):\n- `Core`: `E_DamageType`, `E_Alert`, `E_Resource`, `E_AmmoKind`, `E_WeaponSlot`, `BPI_Damageable`, `BPI_AlertListener`, `BPFL_Combat.DealDamage` (цель без интерфейса получает движковый Apply Damage), `DA_Ammo`, `DA_Ammo_LMG`, `BP_AimComponent`.\n- `Weapon`: `BP_WeaponComponent` (в BeginPlay сам создаёт `BP_AimComponent`, два `BP_FireSlot`, перекрестие), функции `StartFire(Slot)`, `StopFire(Slot)`, `SetAmmo(Slot, DA)`, `AddPlastic(Resource, Amount)`, `TryConsumePlastic(Amount)`; диспетчеры `OnFire`, `OnHit`, `OnAmmoChanged(Slot, Mag, MagSize, bPrinting)`, `OnPlasticChanged(Resource, Amount, Capacity)`. Магазин печатается сам при нуле.\n- `Input`: `IA_FirePrimary`, `IA_FireSecondary` (пока без клавиш). `UI/WBP_Crosshair` (временное). `Test/BP_CombatDummy`, три манекена в `L_JR_Preview` (x=760, y=-500/-300/-100).\n\nПодключено (разрешение координатора 2026-11-04): `BP_FishtCharacter` (компонент `WeaponComponent`, события `IA_FirePrimary/Secondary`, `BPI_Damageable` с пересылкой в `VitalsComponent`), `IMC_Default` (огонь: левая/правый триггер; второй слот: правая/правый бампер, прицел: средняя/левый триггер; укус: F/крестовина вправо), `BP_Ability_Dash` (`DealDamage(Dash)`, переменные `RunUpMinMult` 0.5, `RunUpFullSpeed` 300: множитель считается в начале рывка; цели с `BPI_Breakable` получают полный урон, чтобы рывок с места ломал решётки как раньше).\n\nПластик (`Pickups/`): `BP_ResourcePickup` (`Resource`, `Amount`; подбор касанием капсулы, при полной ёмкости боевой лежит, пока не появится место), `BP_LootDropComponent` (`Resource`, `AmountMin/Max`, `Chance`; вызвать `DropNow(Location)` при гибели или поломке). Враг получает компонент и зовёт `DropNow`; пропсам нужно то же в `BP_BreakableGrate` по `OnPropBroken` через владельца пропсов. Тайник = обычные `BP_ResourcePickup`, спрятанные на уровне. Числа на экране временно в `WBP_Crosshair` (магазин, боевой/ёмкость, улучшающий), `WBP_HUD` подключит UI по `OnAmmoChanged`/`OnPlasticChanged`. Ловушка: профиль `OverlapOnlyPawn` в проекте блокирует `Visibility`, а расставленные экземпляры берут коллизию из сохранения: после смены отклика в конструкторе их надо пересоздать.\n\nСнаряды: `Weapon/BP_ProjectileBase` (`Launch`, `Explode`), `DA_Ammo_Rocket`, `DA_Ammo_RocketHoming`, `DA_Ammo_Grenade`; второй слот, список `SecondaryAmmoList`, смена `CycleSecondary` на R и крестовине влево (`IA_CycleSecondary`), у каждого боеприпаса свой магазин, прерванная печать возвращает пластик. Взрыв: штатный `BP_ExplosiveComponent` с профилем из `DA_Ammo.ExplosionProfile` (пока `Pressure` и `Fuel`, свои строки в `DT_ExplosionProfiles` позже через владельца пропсов). **Контракт для врагов:** урон взрыва приходит движковым `AnyDamage`, поэтому актор с `BPI_Damageable` пересылает `ReceiveAnyDamage` в `ApplyDamage(Explosion)`, образец `BP_CombatDummy`. Взрыв ранит и Фишта по обычному затуханию. Регресс `Tools/Combat/pie_*.py`, бот запускается через `exec(код, {})`, цель для стрельбы сразу после телепорта устарела на кадр.\n\nЛовушки: `map_key`/`unmap_key` из Python не помечают `IMC` изменённым и `save_asset` молча ничего не пишет: нужен `imc.modify()` и `save_asset(path, only_if_is_dirty=False)`. Скрипты `execute_python_code` делят глобальное пространство имён, чужой забытый колбэк начинает вызывать твои `log`/`st`: бота запускай через `exec(код, {})`. Типы enum в `add_member_variable`/`add_function_parameter` задаются коротким именем (`E_DamageType`), путь не принимается. В `build_graph` нет `call_delegate`/второго `function_result`: `add_call_delegate_node` заранее, id идёт в связи; два выхода через временную переменную. Выход узла `Set` брать нельзя, нужен свежий getter. `add_function_parameter` на функции может дать второй `execute` на узле возврата, лечит `refresh_node`. **`set_editor_property` на компоненте в PIE пересобирает актор, и компоненты, добавленные на лету, становятся `TRASH_*`:** в тестах менять состояние только вызовом функций (`call_method`).\n\nСтрельбище в `L_JR_Preview`: рубеж x=1900, манекены с числом здоровья на 2200/2700/3400, табло `BP_RangeBoard` (y≈760), пластик с возвратом за 5 с (`RespawnDelay`) у рубежа. HUD: панель в `WBP_Crosshair`. F1 вкладка «Бой» (`BP_DebugCombatProvider`): автонаведение, турель, джетпак. Рельсотрон: `DA_Ammo_Railgun` (пока мощный хитскан из турели, пробития нет). Новый боеприпас = новый `DA_Ammo_*` + строка в `SecondaryAmmoList`, графы не трогаем: основа кастомизации. Джетпак: `BP_JetpackComponent`, своя энергия `JetFuel`, `JetOn` = будущий модуль жилета.\n\nЛовушки: объектные и классовые пины через `pin_defaults` в `build_graph` молча не пишутся (`WidgetType`, `InputAction`, `DA_Ammo`): только `set_node_pin_value`, иначе HUD не создаётся и ошибки нет. `create_node_by_key` для уже существующего `IA_*` возвращает тот же узел, а новая связь с `Started` молча рвёт старую (так сломал прыжок и починил). `ref` в `build_graph` без учёта регистра (`gt` и `gT` конфликтуют). `QueryKeysMappedToAction` в первый кадр пуст: подсказки в `[None]`, читать с паузой; старый `[None] SCENT MODE` в `WBP_HUD` из этой же причины, передать UI. `import_table_from_csv_string` на незагруженной таблице даёт False: сначала `load_asset`.\n\nЗахват и зум (`Tools/Combat/build_lock.py`, тест `pie_lock.py`): `BP_WeaponComponent.AimPressed/AimReleased` (порог `AimHoldTime`), `TapLock`, `ZoomOn`, `UpdateLock`, `UpdateHold`, `FindTarget(Cone, MaxRange)` (проверяет видимость каждой цели отдельно), `LockTarget`, `bCamLock`, `MarkActor` для метки HUD. Дуга при удержании: `UpdateHold` добавляет ввод к цели по ошибке радиуса (`HoldRadius`, `ArcGain`, `ArcOn`), бег вперёд-назад меняет радиус. Захват снимается, если цель скрыта дольше `LockLoseTime` (2 с). Без захвата ракета берёт цель у перекрестия в момент выстрела (`ResolveShotTarget`). Зум: `BP_CameraTuning.SetZoom`, множитель FOV `ZoomFovMult` 0.8, настройки в F1 «Бой». Ловушки: метод интерфейса с `const` в `build_graph` чистый и принимает только ссылку на интерфейс: сначала `cast` на `BPI_*_C`, пин `AsBPI Damageable`. `SPAWN K2Node_EnhancedInputAction|IA_X` работает только через `create_node_by_key`, не `spawner_key` в `build_graph`. После `build_projectile.weapon()` снова запускать `build_lock.weapon()`. `RunToggle` в `BP_TurnInPlace` сейчас 0 (удержание), поэтому переключение на стике сделано отдельным действием.\n\nЭффекты (`Tools/Combat/build_fx.py`, тест `pie_fx.py`): слоты в `DA_Ammo`, пустой = нет эффекта: `MuzzleFX`, `ImpactFX`, `ImpactDecal`/`DecalSize`, `TrailFX`, `ExplodeFX`/`ExplodeFXScale`, `FireSound`, `ImpactSound`, `TraceColor`, `TraceWidth`, `TraceSpeed` (0 = луч), `TraceLength`, `TraceFade`. Пока всё быстрые заглушки (пользователь: потом посмотрим), звуки синтезированы (`Tools/Combat/sfx`). `FX/BP_Tracer` рисует трассу и вспышку у дула, штатная `NS_MuzzleFlash` не годится: заливает Фишта светом и бросает гильзы. `BP_ExplosiveComponent.SpawnFx` рисует отладочную сферу, если у профиля пуст `Effects`: снаряд ставит `bQuietFx`. Обратная связь: `BPFL_Combat.ReportHit(Target, Amount, Location, Source)` = число урона и метка у перекрестия (`HitConfirm`). `DealDamage` зовёт его сам, для `AnyDamage` враг зовёт сам, образец `BP_CombatDummy`. Перезапуск `build_lock.weapon()` не трогает эффекты; порядок после пересборки Shoot в шапке `build_fx.py`.\n\nПервый враг: `Enemies/BP_HoverBot` (`Tools/Combat/build_enemy.py`, тест `pie_bot.py`), два экземпляра `Combat_Bot1-2` на стрельбище. Blueprint без Behavior Tree и без NavMesh: идёт прямо к точке, препятствия не обходит. `State`: 0 патруль, 1 поиск, 2 бой, глаз зелёный/жёлтый/красный. Настройки на экземпляре: `ViewDist`, `ViewAngle`, `PreferredDist`, `ShotDamage`, `Accuracy`, `BurstSize`, `BurstGap`, `BurstPause`, `LoseTime`, `SearchTime`, `PatrolRadius`, `RespawnDelay`. Ловушка: случайный дубль `ref` в `build_graph` без учёта регистра (`sb`/`sB`) не останавливает сборку, граф остаётся недособранным, а компиляция проходит: смотри `success` каждого графа.\n\nТипы врагов: `BP_HoverBot` = общий класс, тип = `Enemies/DA_EnemyType` в поле `EnemyType` экземпляра: `DA_Enemy_Hover`, `DA_Enemy_DroneTank` (модель `Enemies/Drones/MedCargo`, импорт `Tools/Combat/import_drone.py`), `DA_Enemy_DroneLight`. Поля: здоровье, скорость, зрение, дистанция, очередь, `bFlying`, `HoverHeight`, `PatrolHeight`, `StrafeAmount`, `Wobble`, размер капсулы, `Model` и смещения `ModelOffset`, `GunOffset`, `EyeOffset`. Перед ними дрон не обходит препятствия и не имеет разрушения: один меш Tripo, отрыв деталей требует разделения в Blender. Ловушка: `import_asset_tasks` крутит тики внутри себя, колбэк входит повторно: нужен флаг занятости.\n\nРазрушение (`Tools/Combat/build_enemy_parts.py`, разрез `Tools/Combat/blender/split_drone.py`, импорт `import_drone.start_parts`, тест `pie_parts.py`): детали = `DA_EnemyType.PartMeshes/PartHealth/PartRole` (0 обшивка, 1 двигатель, 2 орудие), с общим началом координат. Модель режется по областям в `REGIONS` скрипта, детали и осколки пишутся в `incoming/\u003cИмя>/parts`, копия `Drone_MedCargo_Parts.blend`, исходник не меняется. Попадание снимает здоровье с ближайшей детали в `PartReach` и всегда с корпуса. Двигатель: скорость и высота падают, крен; `EngineLimit` двигателей = смерть. Орудие: не стреляет, идёт на таран. `bCrash`: падает со штопором и взрывается на земле, `CrashDamage` по радиусу. Осколки `DeathShards` × `ShardScale`, актор `FX/BP_EnemyDebris`. Новый дрон: подобрать `REGIONS`, разрезать, заполнить массивы в `types()`.\n\nСледы по поверхностям (`Tools/Combat/build_impacts.py`, тест `pie_surf.py`): `FX/Impacts/DA_Impact_\u003cПоверхность>` (декали, размер, эффект, звук), `DA_ImpactSet_Default` (имена + профили) в `DA_Ammo.ImpactSet`, `BPFL_Combat.PlayImpact` (определяет поверхность как `BP_SurfaceFeedback`: трасса Surface, `PM_\u003cИмя>`). Цели с `BPI_Damageable` = Metal без декали. Мишени `Range_Surf*` на стрельбище (x=2500). Важно: материал без `Phys Material` даёт `Default`.\n\nМанеры боя (`Tools/Combat/build_tactics.py`, тест `pie_tactics.py`, инструкция для пользователя `Docs/ENEMY_GUIDE.md`): `DA_EnemyType.Tactic` (`E_EnemyTactic`): Hold, Surround, Ram, Kamikaze, Cover. `Combat` выбирает манеру, потеря орудия включает Ram. Объезд препятствий `CalcSteer`: прямая свободна = прямо; преграда = следующая точка пути по NavMesh от пола под собой, полёт на своей высоте; нет пути = вбок и вверх. Трассы объезда по каналу Camera (`TraceTypeQuery2`), иначе дроны мешают друг другу капсулами, у них `Visibility` = Block. `Slots`: номер среди своих в бою, раз в секунду. `AlertGroup`: `GroupRadius`. `Lean`: наклон корпуса от скорости. Арена за стеной x=4000, четыре отсека с проёмами, `arena()`, бот-экземпляры `place()`. Танк остался на стрельбище. Новые манеры = значение в enum, ветка в `Combat`. Ловушки: PowerShell `R` = Invoke-History, `Rp` = Remove-ItemProperty, не называть так свои функции; `LastSeen` не редактируется на экземпляре, в тестах вызывать функции; узел функции с параметром `Scale` без значения = 0, движения нет и ошибки тоже.\n\nШаблон дрона (`Docs/ENEMY_GUIDE.md`): объекты `Core`, `Rotor_*`, `Engine_*`, `Gun_*`, `Skin_*`, `Shard_*` в Blender, начало координат = ось; `Tools/Combat/blender/export_drone.py` пишет FBX и `manifest.json`, `Tools/Combat/add_drone.py` импортирует и заполняет карточку. Скелет дронам не нужен: `PartPivot`, `PartSpin`, `SpinRotors`, `GunPart`, `AimGun`. Сканер: `bScanner`, `ScanTick`, `ScanDir` = направление зрения в `Sense`, конус берёт материал `M_Friend11_ScanBeam`. Лазер из карточки `Trace*`. Первый дрон MD-01: `Blender/Characters/Drones/Drone_MD-01/Drone_MD-01_Game.blend`, исходник пользователя не меняется, `Enemies/Drones/MD01`, карточка `DA_Enemy_DroneLight`. Ловушка: `SetActorScale3D` заменяет масштаб виджета 0.16, а виджет односторонний с лицом на +X.\n\nОбнаружение со сканером: `Notice` копит `Aware` по расстоянию (`NearDist`, `AlertNearTime`, `AlertFarTime`), `SuspectAt` = State 1 (оранжевый, смотрит на `LastSeen`), 1 = бой, `Forget` спадает. Патруль: `PatrolPace`, `PatrolPause`, `PatrolTurn`. Новое значение поля в уже созданном `DA_EnemyType` не меняет карточки: задавать явно в `types()`. Образец поведения для дальнейшей работы, по словам пользователя: ARC Raiders, брать только идеи поведения.\n\nСтадии (2026-11-05): белый патруль, жёлтый `SuspectAt` (стоит `InspectTime`, водит лучом), оранжевый с миганием `WarnAt`, красный: сигнал и замирание `ReactTime` (`ReactEnd`, `SetState`), затем манера. `AimTime`: стоит и целится перед очередью (`bAiming`, `MoveK`). Наводчик: `Tactic` 5, `Spotter`, `CallEvery`, сам не стреляет. Конец луча должен лежать на полу: высота патруля / sin(`ScanPitch`) не больше `ScanLen`, иначе дрон не видит Фишта. Камера MD-01 идёт за лучом (`AimGun`, `ScanYaw`). Затухание звука на ассетах: `FX/Audio/SA_Cb_World` (3 + 30 м), `SA_Cb_Blast` (8 + 60 м), новый звук указывать `Attenuation Settings`.\n\nШум: контракт `BPI_AlertListener.OnNoiseHeard`, `BPFL_Combat.MakeNoise(Location, Radius)` рассылает всем с интерфейсом. Шаги: `CalcNoise` от скорости Фишта (`NoiseStill`, `NoiseSneak` до 100 см/с, 1 при 242, `NoiseRun` при 322) умножает `HearDist`, нужна прямая видимость. Разовый шум: `DA_Ammo.NoiseRadius` в `Shoot` после `OnFire`, взрыв снаряда 3000, взрыв врага 2500; `HearNoise` режет радиус вдвое за стеной, ограничивает тревогу `WarnAt`: бой только глазами. Сплайс в `Shoot` и `BP_ProjectileBase.Explode` делает `build_tactics.noise()`: после пересборки оружия запускать снова.\n\nШум рывка 1000 (`BP_Ability_Dash.OnActivate`), приземления 700 и 1500 (`BP_SurfaceFeedback.PlaySurfaceEvent`, Kind 3 и 4). Шаги: система чата физики `BP_SurfaceFeedback`, заглушки `Tools/Physics/build_step_sounds.py` в `/Game/Fisht/Audio/Surfaces`, затухание `SA_Step`, `DT_Surfaces`. В проекте и в шаблоне TPS 5.8 звуков шагов нет.\n\nДальнейшая работа над врагами: `Docs/ENEMY_ROADMAP.md`, каждый робот в своём чате, стартер `Docs/starters/enemy_robot.md`. Справочник полей карточки: `Docs/ENEMY_GUIDE.md`. Громкость шагов зависит от скорости: `BP_SurfaceFeedback.StepTick`.\n\nОтложено (пользователь 2026-11-04): система пробития: какую толщину пробивает, какие материалы (стекло, дерево) и что разрушает. Решить вместе с рельсотроном.\n\n## Сделано 2026-11-08 (HUD, взрывы, шум, пушка-деталь)\n- Метки у края экрана: `BPFL_Combat.EdgePos(PC, World, Margin)` → Pos, Angle, bOff. Рамка захвата `LockMark` (+ стрелка `LockArrow`) в `WBP_Crosshair`; метки тревоги дронов `WBP_ThreatMark` из `BP_HoverBot.ThreatMark` (жёлтая: поиск/насторожен, оранжевая: `Aware >= WarnAt`, красная: бой; дальше 60 м не видна). Скрипт `Tools/Combat/build_edge.py`.\n- Полоска HP (`HpLabel`) у дронов и манекенов: экранная, ×0.33, над верхом модели (`Body`/`ModelMesh`), прячется за стеной (луч Camera), `FaceLabel`, `Tools/Combat/build_hplabel.py`. Мировой виджет на этих BP в 5.8 не рисовался.\n- Взрыв снаряда: `DA_Ammo.ExplodeSound` (заглушка `SW_Cb_Boom`), `ExplodeDecal`/`ExplodeDecalSize` (копоть из атласа `04_Soot`: ракеты ячейка 2, граната 9) на поверхности попадания; `Tools/Combat/build_boom.py`.\n- Попадание пули шумит для врагов: `DA_Ammo.ImpactNoiseRadius` (LMG 1200, рельсотрон 1800), `MakeNoise` в `PlayShot`. Не сделано: шум пролетевшей мимо пули.\n- Декали гаснут на гранях вдоль проекции: параметры `AngleFadeStart`/`AngleFadeSharp` в мастерах декалей, `Tools/Combat/decal_angle_fade.py`.\n- Пушка = деталь снаряжения: `GearComponent.OnGearChanged` → `WeaponComponent.ApplyGearAmmo`: `DA_GearItem.Ammo` детали идёт в основной слот (заряд сначала), снятие → `BaseAmmo` (стартовая `AmmoPrimary`). Слот `E_GearSlot` 7 `PrimaryWeapon`, деталь `Gear/Weapon/DA_Gear_LaserMG`. Новый пулемёт = копия `DA_Ammo_LMG` + деталь с полем `Ammo`. Прокачка оружия (чат «Прокачка») = множители к полям `DA_Ammo` в `ApplyGearAmmo`. Скрипт `Tools/Combat/build_gearammo.py`.\n\n## Сделано 2026-11-09 (пылесос пластика к левому подсумку)\n- Касание больше не подбирает. `BP_WeaponComponent.ScanPlastic` по таймеру 0,2 с (не Tick): все `BP_ResourcePickup` в `CollectRadius` тянутся к левому подсумку (`GetPullPoint` = `PouchLActor` у `BP_FishtGearComponent`, без подсумка = пёс). Не больше `PullMaxFlying` (8) кусков одновременно.\n- Боевой тянется, только пока `CombatPlastic` + летящий боевой \u003c `CombatPlasticCap`; полный подсумок = кусок лежит. Долетел и влезло не всё = остаток лежит на месте. Улучшающий тянется всегда, счёт `UpgradePlastic` пишется в `SG_PlayerProgress` (слот `PlayerProgress`, `/Game/Fisht/Gameplay/Progress`) при каждом изменении и читается при старте (`LoadProgress`). Схрон потом подцепит этот же сейв.\n- Ёмкость, радиус и скорость берутся из левого подсумка (`RefreshPouch`: `GetAmmoPlasticCapacity`, `GetCollectRadius`, `GetPullSpeed`; 0 = подсумка нет, тогда стартовые значения оружия). Вызов при `OnGearChanged`, после подписки и через 1,5 с после старта (стартовая экипировка проходит до подписки). Лишний пластик при уменьшении ёмкости не сжигается.\n- Кусок лежит без тика: `RotatingMovement` убран, вращение в материале (`M_Plastic_Pickup`, WPO, параметр `SpinTurnsPerSec`). Тик включается только на время полёта (`StartPull`/`FlyStep`), скорость = `PullSpeed` + скорость пса (иначе медленный подсумок не догонит).\n- Возрождающиеся куски стрельбища (`RespawnDelay`) после полёта возвращаются на место (`PullFrom`). Скрипт `Tools/Combat/build_vacuum.py`. Старые `TryGive`/`Retry` в пикапе больше не вызываются.\n- Старт экипировки: `CatchUpGear` (после Bind и через 1,5 с) проходит все 8 слотов `GetEquipped` → `ApplyGearAmmo`, затем `RefreshPouch`: подписчик сам догоняет экипировку, прошедшую до подписки (пушка-деталь с чужим `Ammo` работает со старта).\n- Вид пластика «капелька ртути»: сфера ×0,16 (меш и масштаб ставит Construction Script, чтобы обновились и стоящие в уровне), `M_Plastic_Mercury`: металл-зеркало, доля оттенка, свечение; деформация и парение через WPO (вершинный шейдер, без тика), флаг ISM включён. Параметры в инстансах `MI_Plastic_Combat`/`MI_Plastic_Upgrade` (имена с пояснением): `Tint`, `TintAmount`, `Roughness`, `Glow`, `WobbleAmp`/`WobbleSpeed`/`WobbleScale`, `HoverAmp`/`HoverSpeed`. Вытягивания в полёте нет. Скрипт `Tools/Combat/build_mercury.py`; `M_Plastic_Pickup` больше не используется (удалить после перезапуска редактора: в живом редакторе не удаляется).\n\n## Вторичное оружие только справа (2026-11-10)\n- Слот 1 (ракеты/гранаты) вылетает всегда из правого подсумка: `ReadPouchPoint` берёт мировую позицию `PouchMesh` у `PouchRActor` (`BP_FishtGearComponent`), результат в `bPouchOk`/`PouchLoc`; `GetMuzzle` слота 1 = `bPouchOk ? PouchLoc : запасная точка справа от Фишта` (`RocketSide` вправо). Чередования нет (множитель `AltSign` в `Shoot` = 1). Скрипт `Tools/Combat/build_rightmuzzle.py`.\n- Нет правого подсумка = нет вторичного оружия (решение пользователя): `StartFire(1)` и `Shoot(1)` сначала зовут `ReadPouchPoint`; `bPouchOk = false` → короткое сообщение на экран «Нет правого подсумка...» (PrintString, только в разработке), `bHeld` не ставится, выстрела нет, ошибок в логе нет. Запасная ветка «бок жилета» в `GetMuzzle` осталась недостижимой. Скрипт `Tools/Combat/build_pouchgate.py`.\n- Нет жилета = нет пушки: `StartFire(0)` и `Shoot(0)` молча выходят, если `TurretActor` у `BP_FishtGearComponent` не валиден (`gun_gate` в `build_pouchgate.py`). Проверено в PIE: актор пушки и подсумков уничтожены → оба слота не стреляют, магазин не тратится, `ScanPlastic`, `AssistFind`, `RefreshPouch`, `CatchUpGear` вызваны без «Accessed None».\n- `WeaponAnchor` у подсумков «Жилета» стоит в центре актора (на 10 см левее правого подсумка и на 40 см ниже его меша), поэтому не использован; для печатающегося оружия его надо будет сдвинуть к подсумку.\n\n## Информативный прицел (2026-11-09)\n- `WBP_Crosshair.AmmoTint` (первым в Tick): перекрестие (`Up`/`Down`/`Left`/`Right`) по магазину пулемёта: обычный цвет → «мало» (магазин ≤ `LowAmmoPct` %, 30) → «пусто» (0 или печать). Цвета и порог: переменные виджета в категории «Прицел: патроны». Скрипт `Tools/Combat/build_ammotint.py`.\n- Помощь прицеливания, этап 1 (2026-11-09): уровни 0 выкл / 1 слабая / 2 средняя / 3 сильная / 4 детская = карточки `Core/DA_AimAssist_*` (массив `AssistProfiles` в оружии, номер = уровень; поля с пояснением: конус и сила трения, конус и сила магнита, доворот без движения, дальность). `AssistLevelPad` (2) и `AssistLevelMouse` (0) отдельно, устройство по последнему вводу (стики геймпада / движение мыши), `AssistDeviceMode` -1 авто / 0 мышь / 1 геймпад. Всё три — ручки Tab «Бой», уровни сохраняются в `SG_PlayerSettings` (слот `PlayerSettings`) при изменении. Камера: `AssistTick` каждый кадр сравнивает поворот с прошлым кадром; (а) трение гасит поворот игрока у цели, (б) магнит добавляет доворот к цели. Цель: `AssistFind` раз в 0,1 с (захват `LockTarget`, иначе `FindTarget`). `BP_FishtCharacter` не тронут, старый `AutoAim` (доворот точки попадания) и `TapLock` не тронуты. Скрипт `Tools/Combat/build_assist.py`. Этап 2 (после проверки пользователем): магнит пули, доводка при прицеливании.\n- Ловушка: пины типа FKey (`GetInputAnalogKeyState.Key`) через `build_graph` записываются как `(`: задавать `set_node_pin_value(..., '(KeyName=\"Gamepad_RightX\")')`.\n- План (не сделано): помощь прицеливания по уровням (Выкл/Слабая/Средняя/Сильная/Детская, отдельно геймпад и мышь; слои: трение, магнит, магнит пули, доводка при прицеливании; карточка `DA_AimAssist`, сохранение в `SG_PlayerSettings`), вибрация геймпада при выстреле и уроне (на потом).\n\n## Открытые вопросы к пользователю\n- Крестообразное меню на стрелках: на клавиатуре стрелки заняты `IA_Move`, на геймпаде крестовина занята (вверх компаньон, вниз сидеть, вправо укус, влево смена). Пользователь: «с крестовиной ещё потом разберёмся».\n- Рывок остаётся на левом бампере (пользователь согласен). Раскладку он будет пробовать сам позже через отдельное меню управления с переназначением клавиш, по стандартам: отдельная задача.\n- Джетпак-прыжок: какая энергия и как тратится?\n- Постоянная кнопка укуса (пока крестовина вправо / F).\n- Сколько слотов брони на старте (предложение: 4, как у тестовых предметов; решает чат брони).\n\n- 2026-11-10: нет жилета/левого подсумка = нет сбора пластика: RefreshPouch больше не подставляет стартовые CollectRadius/ёмкость/скорость при нулях от геттеров Жилета (Select B = 0), ScanPlastic ничего не тянет. Касание (TryGive) не вызывается нигде.\r\n\n- 2026-11-10 доп. оружие по правому подсумку (Light 1 / Medium 2 / Heavy 3): список SecondaryAmmoList собирает чат «Жилет» (BP_FishtGearComponent.SyncSecondaryList из SecondaryChoices, GetSecondarySlotCount); R/колесо/1-4 ограничены длиной списка (Light: переключение ничего не делает; без подсумка список пуст, стрельба слотом 1 закрыта). Моя часть: запас патронов x(1 + GetSecondaryAmmoBonus/100): BP_FireSlot.MagMult + чистая EffMagP (Init/FinishPrint/Notify/Reload), BP_WeaponComponent.ApplySecondaryBonus (CatchUpGear, OnGearChanged, опрос в ScanPlastic каждые 0.2 с, т.к. выбор в Tab OnGearChanged не шлёт). Скрипт Tools/Combat/build_secondary.py. В PIE: Light (count 1): Cycle/Select ничего не меняют, EffMagP слота 0 = 30, слота 1 = 4; проверка бонуса != 0 не делалась (бонус в тесте 0).\r\n\n- 2026-11-10 доп. оружие, продолжение: (а) магазины слота 1 запоминаются по оружию (BP_FireSlot.StoreAmmo/StoreMag, SwapAmmo слота 1 пишет старое и подставляет запомненное), а не по индексу MagStore: смена подсумка/выбора (SyncSecondaryList шлёт полный NewMag) не даёт бесплатный магазин ранее виденному оружию; новое оружие приходит с полным магазином, как и в начале игры; (б) ReadPouchPoint: пустой SecondaryAmmoList = bPouchOk false, StartFire/Shoot слота 1 закрыты (в PIE: список из 1 -- bHeld true, пустой -- false). MagStore остался только для R/колеса/1-4. Проверено в PIE: выстрелил ракетами до 0, сменил на гранату и обратно -- ракета 0, не 4.\r\n","date":"2026-11-10"},{"path":"Docs/ENEMY_GUIDE.md","title":"Как добавить дрона или робота","section":"Враги","md":"# Как добавить своего дрона или робота\n\n## Как это устроено\n\nВсе враги в игре это один Blueprint, `BP_HoverBot`. Чем враг отличается, записано в отдельной карточке типа, ассете `DA_Enemy_\u003cИмя>`:\nмодель, здоровье, скорость, манера боя, детали для разрушения.\n\n| Что видно | Что это |\n|---|---|\n| `Combat_BotTank`, `Combat_BotLight1` в уровне | экземпляры `BP_HoverBot` с разными `Enemy Type`. Имена просто подписи |\n| `Content/Fisht/Combat/Enemies/DA_Enemy_*` | карточки типов |\n| `Content/Fisht/Combat/Enemies/Drones/\u003cИмя>` | модели и текстуры дрона |\n\nПоэтому новый дрон = модель + новая карточка. Blueprint трогать не нужно.\n\nСейчас есть карточки: `DA_Enemy_DroneTank`, `DA_Enemy_DroneLight`, `DA_Enemy_DroneRam`, `DA_Enemy_DroneKamikaze`, `DA_Enemy_Hover`.\n\n## Шаблон дрона: большие, малые, любые\n\nТак сделан MD-01. Подходит любому летающему дрону: крутятся винты, камера или орудие наводится на цель, детали отваливаются.\n\n**1. Blender.** Нос на -Y, масштаб в метрах, один материал (BaseColor, Normal, Roughness, Metallic). Раздели модель на объекты и назови их по шаблону:\n\n| Имя объекта | Что это | Начало координат объекта |\n|---|---|---|\n| `Core` | корпус, обязателен | в точке 0,0,0 |\n| `Rotor_*` | винт: крутится, потеря = медленнее, крен, дым из пустого кольца | на оси вращения, ось Z смотрит вверх |\n| `Engine_*` | двигатель без вращения, потеря как у винта | центр детали |\n| `Gun_*` | камера или орудие: наводится вверх-вниз, лазер идёт из него, потеря = таран | ось качания |\n| `Skin_*` | обшивка, антенна, ручка: просто отваливается | центр детали |\n| `Shard_*` | осколки смерти, необязательны, начало в 0,0,0 | |\n\nДетали можно не делать: хватит одного `Core`, тогда дрон просто взрывается.\n\n**2. Выгрузка.** В терминале (файл не меняется):\n\n```bash\n\"C:\\Program Files\\Blender Foundation\\Blender 5.1\\blender.exe\" -b Мой_дрон.blend --python \"Tools/Combat/blender/export_drone.py\" -- Drone_Имя\n```\n\nПоявится папка `incoming/Drone_Имя` с FBX, текстурами и `manifest.json`.\n\n**3. Unreal.** PIE остановлен. Запуск в чате: «запусти add_drone для Drone_Имя, карточка DA_Enemy_Имя». Скрипт `Tools/Combat/add_drone.py` импортирует всё в `Enemies/Drones/Имя`, создаёт материал и заполняет карточку: модель, капсулу, детали, оси, скорость винтов.\n\nНовая карточка копируется с `DA_Enemy_DroneLight`. Поведение, здоровье и скорость остаются от неё.\n\n**4. Настрой и поставь.** Открой карточку и выбери `Tactic`, задай здоровье, скорость, цвет лазера. Перетащи `BP_HoverBot` в уровень и выбери `Enemy Type`.\n\nБольшой дрон: подними `Max Health`, сделай `B Crash` включённым и задай `Crash Damage`. Малый: меньше здоровья, больше скорости.\n\n**Ловушка:** если в `BP_HoverBot` добавили новый компонент, стоящие в уровне экземпляры надо удалить и поставить заново.\n\n**Текстура Tripo.** Кривые буквы часто оказываются мелкими кусками геометрии, образец правки в `Tools/Combat/blender/md01_prepare.py` и `md01_texture.py`.\n\n## Манеры боя\n\nПоле `Tactic`, выпадающий список. В арене за стрельбищем у каждой манеры свой отсек, вход через проём в стене.\n\n| Манера | Что делает | Настройки |\n|---|---|---|\n| Держать дистанцию | стоит на `Preferred Dist`, ходит вбок, стреляет очередями | `Strafe Amount` |\n| Окружение | каждый занимает свою точку в мире на кольце вокруг цели, висит на ней и перелетает на новую. Кольцо не едет за целью | `Preferred Dist` радиус, `Surround Hold` сколько висит, `Orbit Speed` сдвиг угла |\n| Таран | подлетает, мигает глазом, рвётся по прямой, после удара висит беззащитный | `Ram Dist`, `Ram Speed`, `Ram Damage`, `Ram Windup`, `Ram Stun`, `Ram Knock` |\n| Камикадзе | делает случайно от 0 до `Feint Max` обманных манёвров вокруг цели, потом летит в упор, взводится, мигает, взрывается. Сбитый тоже взрывается и задевает своих | `Feint Max`, `Feint Radius`, `Arm Dist`, `Arm Time`, `Crash Damage`, `Crash Radius` |\n| Наводчик | сам не стреляет, держится подальше и каждые `Call Every` секунд зовёт всех в `Group Radius`. Сбивать первым | `Preferred Dist`, `Group Radius`, `Call Every` |\n| Укрытия | стреляет, потом уходит за препятствие и выходит снова. Попадание по нему торопит уход | `Expose Time`, `Hide Time`, `Cover Radius` |\n\nПотеря орудия включает таран у всех, кроме камикадзе.\n\n## Поля карточки: справочник\n\nПодсказки при наведении в Unreal вписать нельзя, поэтому пояснение вшито в имя поля: «`MaxHealth (здоровье корпуса)`» (с 2026-11-07, таблица имён и категорий `Tools/Combat/combat_names.py`, скрипты берут имя через `fe()`/`fa()`). Категории в карточке: 1 Основное, 2 Стрельба, 3 Зрение и слух, 4 Манера боя, 5 Разрушение, 6 Модель, 7 Тонкая настройка, 9 Служебное. Справочник ниже по английскому идентификатору. Открой карточку `DA_Enemy_*`, поля разложены по этим категориям. Расстояния в сантиметрах (100 = 1 м), время в секундах, углы в градусах.\n\nНа самом дроне в уровне настраиваются только четыре поля: `Enemy Type` (какая карточка), `Respawn Delay` (через сколько секунд возродиться, 0 = никогда), `Lose Time` (сколько ищет глазами, прежде чем выйти из боя), `Search Time` (сколько длится поиск). Всё остальное живёт в карточке.\n\n### Что такое строки «Индекс»\n\nЭто элементы списка. Часть полей у дрона не одно значение, а список: по строке на каждую деталь. **Один и тот же номер индекса во всех списках = одна и та же деталь.** Списков пять: `Part Meshes`, `Part Health`, `Part Role`, `Part Pivot`, `Part Spin`. Пример, MD-01:\n\n| Индекс | Part Meshes (модель) | Part Health (здоровье) | Part Role (роль) | Part Pivot (ось) | Part Spin (вращение) |\n|---|---|---|---|---|---|\n| 0 | камера | 36 | 2 орудие | центр шара | 0 |\n| 1 | винт левый | 30 | 1 двигатель | ось винта | 1800 |\n| 2 | винт правый | 30 | 1 двигатель | ось винта | -1800 |\n| 3 | антенна | 15 | 0 обшивка | центр детали | 0 |\n| 4 | ручка | 15 | 0 обшивка | центр детали | 0 |\n| 5 | ручка | 15 | 0 обшивка | центр детали | 0 |\n\nХочешь сделать винт прочнее: найди его номер в `Part Meshes` и поменяй строку с тем же номером в `Part Health`. Менять порядок и удалять строки в одном списке нельзя: детали перепутаются. Эти списки заполняет `add_drone.py`, руками обычно трогают только `Part Health`. `Death Shards` тоже список, но независимый: просто осколки, номера ни с чем не связаны.\n\n### 1 Модель\n\n| Поле | Что это |\n|---|---|\n| `Model` | модель корпуса |\n| `Model Offset` | сдвиг модели внутри капсулы, чтобы центр совпал |\n| `Model Yaw` | поворот модели. Нос на -Y в Blender = -90 |\n| `Shell Scale` | общий масштаб. С настоящей моделью 1, меньше только у заглушек из примитивов |\n| `Cap Radius`, `Cap Half` | радиус и половина высоты капсулы: столкновения и попадания пуль |\n| `Gun Offset` | откуда летят выстрелы, если у дрона нет наводимого орудия |\n| `Eye Offset` | где светится глаз, если нет наводимого орудия |\n\n### 2 Основное\n\n| Поле | Что это |\n|---|---|\n| `Max Health` | здоровье корпуса |\n| `Move Speed` | скорость в бою, см/с |\n| `B Flying` | летает (вкл) или ходит по полу (выкл) |\n| `Hover Height` | на какой высоте над целью держится в бою |\n| `Patrol Radius` | как далеко патрулирует от точки старта |\n| `Patrol Height` | разброс высоты в патруле |\n| `Patrol Pace` | доля скорости в патруле, 0.3 = 30% от `Move Speed` |\n| `Patrol Pause` | сколько стоит в каждой точке патруля |\n| `Patrol Turn` | как быстро разворачивается на стоянке, градусов в секунду |\n| `Wobble` | дрожание полёта, 0 ровно |\n| `Lean Amount` | наклон корпуса при разгоне |\n| `Strafe Amount` | сила хода вбок в манере «Держать дистанцию» |\n\n### 3 Зрение и слух\n\n| Поле | Что это |\n|---|---|\n| `View Dist` | дальность в бою: на каком расстоянии держит уже найденную цель |\n| `View Angle` | половина ширины конуса зрения |\n| `Group Radius` | кого будит, подняв тревогу. 0 = никого |\n| `B Scanner` | есть ли видимый луч. Выкл = смотрит носом, замечает сразу |\n| `Hear Dist` | чутьё на шаги при обычной ходьбе, в любую сторону, нужна прямая видимость |\n| `Noise Still`, `Noise Sneak`, `Noise Run` | множители `Hear Dist`: Фишт стоит, крадётся, бежит. Ходьба всегда 1 |\n| `Scan Len` | длина луча и дальность зрения вне боя |\n| `Scan Glow` | яркость луча |\n| `Scan Sweep` | на сколько градусов луч ходит в стороны |\n| `Scan Rate` | скорость этого движения |\n| `Scan Pitch` | наклон луча вниз, отрицательное число. Конец луча должен доставать до пола, иначе дрон не видит Фишта |\n| `Near Dist` | ближе этого замечает почти сразу |\n| `Alert Near Time` | за сколько секунд поднимает тревогу на `Near Dist` |\n| `Alert Far Time` | то же на конце луча |\n| `Forget Time` | за сколько секунд тревога спадает, когда цели нет |\n| `Suspect At` | порог жёлтой стадии, доля тревоги от 0 до 1 |\n| `Warn At` | порог оранжевой стадии |\n| `Inspect Time` | сколько стоит и смотрит, прежде чем лететь проверять |\n\n### 4 Манера боя\n\n| Поле | Что это |\n|---|---|\n| `Tactic` | манера боя, выпадающий список |\n| `Preferred Dist` | рабочая дистанция до цели. В окружении это радиус кольца |\n| `React Time` | сколько замирает, заметив цель, перед атакой |\n| `Orbit Speed` | окружение: на сколько сдвигается кольцо за секунду |\n| `Surround Hold` | окружение: сколько висит на точке |\n| `Feint Max`, `Feint Radius` | камикадзе: сколько манёвров максимум и как далеко от цели |\n| `Arm Dist`, `Arm Time` | камикадзе: где взводится и через сколько секунд взрыв |\n| `Ram Dist` | таран: с какого расстояния начинает |\n| `Ram Speed`, `Ram Damage`, `Ram Knock` | таран: скорость, урон, сила отброса Фишта |\n| `Ram Windup`, `Ram Stun` | таран: сколько мигает перед рывком, сколько беззащитен после |\n| `Expose Time`, `Hide Time` | укрытия: сколько стреляет и сколько прячется |\n| `Cover Radius` | укрытия: как далеко ищет укрытие |\n| `Call Every` | наводчик: как часто зовёт соседей |\n\n### 5 Стрельба\n\n| Поле | Что это |\n|---|---|\n| `Shot Damage` | урон одного выстрела |\n| `Accuracy` | шанс попасть, от 0 до 1 |\n| `Burst Size` | выстрелов в очереди |\n| `Burst Gap` | пауза между выстрелами в очереди |\n| `Burst Pause` | пауза между очередями |\n| `Aim Time` | сколько стоит и целится перед очередью, 0 = не целится |\n| `Gun Reach` | от оси орудия до дула |\n| `Trace Color` | цвет выстрела |\n| `Trace Speed` | скорость трассы. 0 = сплошной лазер |\n| `Trace Width`, `Trace Len`, `Trace Fade` | толщина, длина, время затухания трассы |\n\n### 6 Разрушение\n\n| Поле | Что это |\n|---|---|\n| `Part Meshes` | список: модели деталей |\n| `Part Health` | список: здоровье каждой детали |\n| `Part Role` | список: роль. 0 обшивка, 1 двигатель, 2 орудие |\n| `Part Pivot` | список: ось детали. Заполняет скрипт |\n| `Part Spin` | список: скорость вращения, градусов в секунду. Знак = направление, 0 = не крутится |\n| `Part Reach` | как далеко от попадания искать деталь |\n| `Engine Limit` | сколько двигателей можно потерять до гибели |\n| `Engine FX`, `Engine FX Scale` | выхлоп из низа двигателя и его размер. Пусто = без выхлопа |\n| `B Crash` | вкл = падает штопором и взрывается на земле, выкл = взрыв на месте |\n| `Crash Damage`, `Crash Radius` | урон взрыва при гибели и его радиус, 0 = без урона |\n| `Death Shards` | список: осколки при гибели |\n| `Shard Scale`, `Shard Power` | размер осколков и сила разлёта |\n| `Death FX Scale` | размер взрыва |\n\n### Карточка боеприпаса\n\n`DA_Ammo.Noise Radius`: на сколько слышно выстрел. Остальные поля в `Docs/COMBAT_PLAN.md`.\n\n## Сканер: куда смотрит враг\n\nПоле `B Scanner`. Из линзы идёт конус длиной `Scan Len`. Вне боя враг видит цель только внутри него, стена режет конус.\n\nОбнаружение идёт стадиями, пока цель в луче копится тревога. Ближе `Near Dist` она заполняется за `Alert Near Time`, на конце луча за `Alert Far Time`:\n\n1. Белый: патруль.\n2. Жёлтый, порог `Suspect At`: дрон останавливается и водит лучом по точке. Потерял цель: ждёт `Inspect Time`, потом подлетает проверить.\n3. Оранжевый с миганием, порог `Warn At`: сейчас поднимет тревогу.\n4. Красный: сигнал соседям в `Group Radius`, замирает на `React Time` с миганием, потом атакует.\n\nПеред каждой очередью дрон стоит и целится `Aim Time`, луч мигает: в этот момент его проще сбить. Цель вышла из луча: тревога спадает за `Forget Time`.\n\n| Поле | Смысл |\n|---|---|\n| `Scan Len`, `View Angle` | длина луча, половина его ширины в градусах |\n| `Near Dist` | ближе этого заметит почти сразу |\n| `Hear Dist` | ближнее чутьё: в этом радиусе чует цель с любой стороны, если нет стены, чуть медленнее, чем в луче |\n| `Alert Near Time`, `Alert Far Time` | за сколько секунд замечает вблизи и на конце луча |\n| `Suspect At`, `Forget Time` | порог настороженности от 0 до 1, время забывания |\n| `Scan Glow` | яркость |\n| `Scan Pitch`, `Scan Sweep`, `Scan Rate` | наклон вниз, размах в стороны, скорость |\n\nШум. Шаги: радиус чутья `Hear Dist` умножается на громкость Фишта: стоит `Noise Still`, крадётся или присел `Noise Sneak`, идёт 1, бежит `Noise Run`. Через стену шагов не слышно.\n\nВыстрелы и взрывы: `DA_Ammo.Noise Radius`, стена режет радиус вдвое. Враг настораживается, смотрит на источник и летит проверять, но бой начинает, только когда увидит цель сам. Новый источник шума: вызвать `BPFL_Combat.Make Noise`. Услышит любой враг с интерфейсом `BPI_AlertListener`.\n\nПатруль: `Patrol Pace` доля скорости, `Patrol Pause` сколько секунд стоит в точке, `Patrol Turn` как быстро разворачивается на месте.\n\n## Анимация\n\nАнимационный Blueprint дронам не нужен, скелет тоже. Винты, камера, покачивание, наклон и штопор делает код. Детали остаются обычными моделями, поэтому легко отваливаются.\n\nСкелет понадобится только для складных лап и сложных манипуляторов.\n\n## Где враг ищет дорогу\n\nВ уровне нужен NavMesh: `Nav Mesh Bounds Volume`, у `RecastNavMesh` поле `Runtime Generation` = `Dynamic`. Без него враг обходит препятствия только простым уходом вбок и вверх.\n","date":"2026-11-07"},{"path":"Docs/ENEMY_ROADMAP.md","title":"Враги: что готово и что дальше","section":"Враги","md":"# Враги: что готово и что дальше (2026-11-05)\n\nИнструкция по добавлению дрона и справочник всех полей: `Docs/ENEMY_GUIDE.md`. Контракты боя: `Docs/COMBAT_PLAN.md`.\n\n## Что готово\n\nОбщий враг `BP_HoverBot`, всё настраивается карточкой `DA_Enemy_*`:\n- зрение лучом, стадии белый, жёлтый, оранжевый, красный, чутьё, шум шагов, выстрелов, взрывов, рывка, приземления;\n- манеры: дистанция, окружение, таран, камикадзе, укрытия (только простые), наводчик;\n- объезд препятствий по NavMesh, патруль с остановками, паузы реакции и прицеливания;\n- разрушение по деталям, винты, наводимая камера, выхлоп, дым, осколки;\n- шаблон дрона: `export_drone.py` + `add_drone.py`. Первый дрон MD-01.\n\n## Как работать дальше\n\nКаждый новый робот в отдельном чате, стартер `Docs/starters/enemy_robot.md`.\n\nПравила, чтобы чаты не мешали друг другу:\n1. **Летающий дрон без новой механики** не трогает Blueprint: только модель и карточка.\n2. **Новая общая механика** идёт через `Tools/Combat/build_*.py`. Графы `BP_HoverBot` пересобираются скриптами: правка руками в графе пропадёт при следующей сборке.\n3. Менять `BP_HoverBot` одновременно может только один чат. В двух чатах подряд, не параллельно: занимать `Saved/PIE_LOCK.txt`.\n4. Поведение, которое нужно одному роботу, добавляется как новое значение `E_EnemyTactic` и своя функция, а не правкой чужой манеры.\n\n## Летающие роботы со скелетом\n\nРуки, манипуляторы, складные части и другая анимация у летающего робота. Отдельный класс не нужен: полёт, зрение, шум, стадии, манеры и объезд остаются в `BP_HoverBot`, меняется только внешний вид. Первый такой робот делает общую часть, дальше она работает через карточку:\n\n1. В `BP_HoverBot` компонент `SkelBody` (`SkeletalMeshComponent`) под `Shell`, в карточке поля `SkelMesh` и `AnimClass`. Пусто = обычный дрон, как сейчас.\n2. AnimBP читает из владельца `State`, `Aware`, `bAiming`, `RamPhase`, `GunPitch`, скорость. Отсюда позы: патруль, настороженность, прицеливание, удар.\n3. Наведение: на кость через Look At или Modify Bone в AnimBP, вместо поворота детали `AimGun`. Луч и выстрел берутся из сокета кости: добавить в карточку имя сокета.\n4. Винты и прочее вращение: либо кости в AnimBP, либо по-прежнему отдельные детали с `Part Spin`, прикреплённые к сокетам.\n5. Разрушение: `HideBoneByName` на кости и обломок отдельным мешем. Контракт `PartRole` тот же, в карточке вместо `Part Meshes` список имён костей.\n6. Смерть: как сейчас, осколки, либо физика Physics Asset.\n\nМодель в Blender: корпус и руки одним мешем на скелете, плюс отдельные меши обломков для отрываемых частей. `export_drone.py` рассчитан на статичные детали, для скелета нужен свой шаг экспорта, импорт как Skeletal Mesh.\n\nЛовушки анимации: `Docs/ue_reference/TRAPS_BY_DOMAIN.md`, раздел «Анимация». Образец скелетного летающего робота в проекте: Друг-11, `Docs/FRIEND11.md`.\n\n## Ходячие роботы\n\nПока не планируются. Если появятся: `bFlying` выкл и NavMesh уже работают, нужны поворот на месте и работа ног, остальное как у скелетного летающего. Враг вне `BP_HoverBot` тоже может участвовать: реализовать `BPI_Damageable` и `BPI_AlertListener`.\n\n`BP_SecurityRobot` остаётся как есть, его можно перевести на эту систему отдельной задачей.\n\n## Отложено\n\n| Что | Заметка |\n|---|---|\n| Система укрытий | пользователь: позже. Сейчас только простой поиск точки за препятствием |\n| Настоящие звуки | выстрелы, попадания, шаги, сигналы: заглушки. Шаги в `/Game/Fisht/Audio/Surfaces`, остальное `Combat/FX/Audio` |\n| Свечение светодиодов MD-01 | нарисованы текстурой, нужна маска и emissive |\n| Модели | средний дрон, камикадзе, таран, наводчик пока без своей модели или на MD-01 |\n| Поворот башни танка | модель есть, оси нет |\n| Рисунок луча | пользователь проработает отдельно, материал общий с Другом-11 |\n| Индикатор шума на экране | сейчас громкость видна только по реакции дронов |\n| Опасность наводчика | радиус 26 м будит всю арену, подобрать под уровни |\n| Пробитие пулями | решить вместе с рельсотроном |\n| Расстановка на уровнях | арена в `L_JR_Preview` только для проверки |\n| Производительность | на 11 дронах не мерили |\n\n## Известно\n\n- `Combat_BotTank` в `L_JR_Preview` стоит на y=5212, над пустотой. Если это не сделано намеренно, вернуть на (3600, -100).\n- После пересборки оружия запускать `build_tactics.noise()`.\n- Высота патруля и наклон луча связаны: конец луча должен доставать до пола.\n","date":"2026-11-05"},{"path":"Docs/starters/enemy_robot.md","title":"Стартер чата робота","section":"Враги","md":"# Стартер чата робота\n\nЧат одного робота. Имя, модель, манера боя: \u003cвписать>.\n\nПрочитай: `CLAUDE.md`, `PLAN.md` §3, `Docs/ENEMY_ROADMAP.md`, `Docs/ENEMY_GUIDE.md`, раздел врагов в `Docs/COMBAT_PLAN.md`.\n\nПорядок:\n1. Летающий статичный: шаблон Blender + `Tools/Combat/blender/export_drone.py` + `Tools/Combat/add_drone.py`, настройка карточки. Blueprint не трогай.\n2. Новая манера: значение в `E_EnemyTactic`, своя функция и ветка в `Combat`, через `Tools/Combat/build_tactics.py`. Чужие манеры не меняй.\n3. Летающий со скелетом (руки, манипуляторы, анимация): сначала раздел «Летающие роботы со скелетом» в `Docs/ENEMY_ROADMAP.md`. Новый класс не создавай, общая часть добавляется в `BP_HoverBot` один раз.\n\nПравила: графы `BP_HoverBot` собираются скриптами, руками не правь. Перед сборкой PIE остановлен и занят `Saved/PIE_LOCK.txt`. Проверяй ботом `Tools/Combat/pie_tactics.py`. Вид и звук оценивает пользователь. Коммить только свои файлы. Новые поля записывай в справочник `Docs/ENEMY_GUIDE.md`.\n","date":"2026-11-05"},{"path":"Docs/PROPS_PIPELINE.md","title":"Как добавить свой пропс","section":"Модели и пропсы","md":"# Как добавить свой пропс в игру (Blender → Unreal, только мышью)\n\nОдин пропс = одна папка `Blender/Props/\u003cИмя>/`: модель `.blend`, текстуры, FBX. Скрипты запускать не нужно.\nИсходим из того, что у тебя уже есть модель в Blender (из Tripo или своя).\n\n## Какая у тебя категория?\n| № | Что это | Примеры | Что с ним происходит |\n|---|---|---|---|\n| 1 | Не разрушается | стена, стол, бочка-декор, лежанка | стоит; можно сделать физичным (толкается, падает) |\n| 2 | Разрушается целиком | ящик, бочка, ваза | ломается на осколки; может быть физичным |\n| 3 | Разрушается частично | вент. решётка, дверь с окном, тележка с ящиком | рама остаётся, часть ломается; рама и часть могут быть физичными |\n\nОбщая часть (части А, Б и В: модель, импорт, слои) нужна всем. Потом иди в свою категорию.\n\n---\n## Часть А. Подготовка модели в Blender (все категории)\n1. Скопируй папку `Blender/Props/_TEMPLATE` рядом, назови по пропсу (`Barrel_01`). Внутри переименуй `_TEMPLATE.blend` в `Barrel_01.blend`, открой.\n2. Удали куб `SM_NewProp` (клик в Outliner → клавиша X). Вставь модель: File → Import → glTF 2.0 (GLB из Tripo).\n3. Размер и положение: клавиша N → вкладка Item → Dimensions (введи реальные размеры, 1 единица = 1 метр, в поле можно писать `45cm`). Низ модели на полу (Z=0), центр по X и Y в нуле. Курсор в ноль: Shift+C; затем Object → Set Origin → **Origin to 3D Cursor**.\n4. Перетащи модель в коллекцию `SM_NewProp` (в Outliner). Объект назови `SM_Barrel_01`. Саму **коллекцию** тоже переименуй в `SM_Barrel_01` (двойной клик). Имя коллекции = имя FBX.\n5. Ctrl+A → **All Transforms** (масштаб 1, поворот 0). Проверь: UV-развёртка есть, материал один.\n6. Текстуры: File → External Data → Unpack Resources → Write Files to Current Directory. Файлы появятся в `textures/`.\n7. Светодиоды (по желанию): см. раздел «Светодиоды» внизу.\n8. Для категорий 2 и 3 сделай ещё шаги из своей категории (разделение на части, осколки). Для категории 1 этого не нужно.\n9. File → Export → **Export All Collections**. Рядом с `.blend` появится `SM_Barrel_01.fbx`.\n\n## Часть Б. Импорт в Unreal и материал (все категории)\n1. В Content Browser создай папку `/Game/Fisht/Props/\u003cКатегория>/Barrel_01/` (ПКМ → New Folder).\n2. Перетащи туда `SM_Barrel_01.fbx` и картинки из `textures/`. В окне импорта жми Import.\n3. Настрой текстуры (двойной клик по каждой, потом Save):\n   - **ORM** (в Tripo `ORM_…`): Compression Settings = **Masks (no sRGB)**, галочку sRGB сними.\n   - **Normal** (в Tripo `NormalGL_…`): включи **Flip Green Channel**; Compression Settings = Normal Map.\n   - Маска светодиодов (если есть): тоже **Masks (no sRGB)**.\n4. Материал: ПКМ на `/Game/Fisht/Props/_Template/MI_Prop_Template` → **Duplicate**, перетащи копию в папку пропса, назови `MI_Barrel_01`. Двойной клик: в **Texture Parameter Values** включи галочки у `BaseColor`, `Normal`, `ORM` и выбери свои картинки (стрелка у поля). Save.\n   Заготовки: `MI_Prop_Template` (обычный), `MI_Prop_LED` (светодиоды включены), `MI_Prop_Glow` (сильное свечение, голубое).\n5. Двойной клик по `SM_Barrel_01` (откроется редактор меша): в **Material Slots** выбери `MI_Barrel_01`. Меню **Collision** → **Add Box Simplified Collision** (или **Auto Convex Collision** для сложной формы). Save. Для категорий 2–3 то же сделай со всеми частями и осколками.\n\n## Часть В. Слои проекта: профиль коллизии, поверхность, теги (все категории)\nВ проекте три независимых слоя (подробно: `Docs/PHYSICS_DESIGN.md`). Для каждого пропса задай все три.\n\n**1. Профиль коллизии** («кто с кем сталкивается»). Выбирается в Details → **Collision → Collision Presets**:\n| Профиль | Когда |\n|---|---|\n| **BlockAll** (по умолчанию) | неподвижный декор, стены, мебель |\n| **Prop** | физичные предметы: толкаются, падают (категория 1Б, рама/пропс с физикой) |\n| **Breakable** | то, что ломается (рывок, укус, робот целятся по нему): ломаемая часть/пропс |\n| **SurfaceOnly** | декор без блока для пса (плакаты, трубы под потолком): пёс проходит, звук поверхности есть |\n| **InteractableSolid** | предметы под кнопку «E» (двери, панели) |\nОсколки (`BP_DebrisPiece`) профиль получают сами. В готовых заготовках `BP_Prop_*` профили уже выставлены: часть, которая ломается, `Breakable`; рама с физикой `Prop`. Для статичного меша (категория 1) профиль ставишь сам в Static Mesh Editor или в уровне.\n\n**2. Поверхность** («из чего сделано»: звук шагов, трение, звук удара). Назначается на **материал**, не на меш: открой `MI_Barrel_01` → найди блок **Physical Material** → поставь галочку **Override Phys Material** (если есть) → в **Phys Material** выбери `PM_\u003cПоверхность>` из `/Game/Fisht/Physics/Materials`. Имена: Concrete, Metal, MetalGrate, Wood, Glass, Tile, Carpet, Water, Dirt, Plastic, Cardboard, Rubber, Fabric, Gravel, Foam, Electronics. Не знаешь, что выбрать: Metal для ящиков и тележек, Wood для деревянного, Cardboard для коробок, Plastic для пластика. Если у меша несколько материалов, у каждого своя поверхность.\n\n**3. Теги** («что с этим можно делать»). Выбери объект в уровне → Details → **Actor → Tags** → кнопка **+** → впиши текст ровно так:\n| Тег | Что значит |\n|---|---|\n| `Item.Pushable` | можно толкать (физичным заготовкам `BP_Prop_*Physics` уже стоит) |\n| `Item.Carryable` | пёс может нести в зубах |\n| `Traverse.Ledge` / `Traverse.Stairs` / `Traverse.Rope` / `Traverse.Beam` | на него можно залезать (уступ, лестница, верёвка, балка) |\n| `Traverse.NoClimb` | на него **нельзя** залезать (перила, стекло, острые вещи) |\n| `Breakable.Light` / `Breakable.Heavy` / `Breakable.Set` | вес ломаемого: лёгкое (картон), тяжёлое (металл), набор (стеллаж с вещами); влияет на звук и эффект поломки |\n| `Phys.Scentable` | у предмета есть запах, пёс его чует |\n| `Zone.*` (Water, Slippery, Sticky, Updraft, Conveyor, BouncePad, Hazard.Electric/Steam/Fire, Stealth, Noise, Wind, KillReset) | **не для обычных пропсов**: так помечаются объёмы-зоны в уровне (скользко, вода, ветер), это делает «Уровни и миссии» |\nТеги ставь на актор (то, что стоит в уровне). Если надо на отдельную часть: выбери компонент в списке слева в Details → **Component Tags**.\n\n---\n## Категория 1. Не разрушается\n**1А. Просто стоит.** Перетащи `SM_Barrel_01` из Content Browser в уровень. Клавиша **End** ставит его на пол. Готово.\n\n**1Б. Физичный (толкается, падает).**\n1. Перетащи `SM_Barrel_01` в уровень, выдели его.\n2. Details → **Transform → Mobility = Movable** (пока Static, физика серая).\n3. Details → раздел **Physics**: включи **Simulate Physics**; **Mass (kg)** по таблице ниже; **Linear Damping** = 1; **Angular Damping** = 2.\n4. Details → **Collision → Collision Presets = Prop** (профиль проекта для физичных предметов). Details → **Actor → Tags** → **+** → `Item.Pushable`.\n5. Поверхность и теги: часть В (поверхность через `PM_…` на материале).\n6. Play, толкни пса в пропс. Не двигается: уменьши Mass. Улетает от касания: увеличь Mass или Damping.\n\n| Вес | Mass, кг |\n|---|---|\n| мяч, миска | 1–3 |\n| коробка, ведро | 5–20 |\n| бочка | 30–60 |\n| тяжёлый ящик, тележка | 80–120 (пёс толкает до ~150) |\n\n---\n## Категория 2. Разрушается целиком (ящик, бочка)\nНужно: сам пропс `SM_Barrel_01` и осколки `SM_Barrel_01_Chunk_01…12`.\n\n**В Blender**\n1. Один раз поставь аддон: Edit → Preferences → Get Extensions → стрелка вниз справа сверху → **Install from Disk** → `Blender/Props/fisht_props.zip` → включи «Fisht Props».\n2. Выдели `SM_Barrel_01`, клавиша N → вкладка **Fisht** → **Осколков** = 12 → **Нарезать на осколки**. Появится коллекция `SM_Barrel_01_Chunks`. Не нравится: поменяй «Вариант», нажми снова.\n3. **Export All Collections**: получатся `SM_Barrel_01.fbx` и `SM_Barrel_01_Chunks.fbx`.\n\n**В Unreal**\n1. Импорт обоих FBX (Часть Б). Из `SM_Barrel_01_Chunks.fbx` получится 12 отдельных ассетов-осколков. Всем: материал `MI_Barrel_01` и коллизия Box.\n2. Создай дочерний Blueprint от `/Game/Fisht/Props/_Template/BP_Prop_Breakable` (ПКМ → Create Child Blueprint Class), назови `BP_Prop_Barrel_01`. Все данные пишутся в его переменные (Class Defaults); таблицы `DT_Breakables` больше нет.\n3. В Class Defaults `BP_Prop_Barrel_01` задай:\n   - `GrilleMesh` = `SM_Barrel_01` (то, что ломается); `FrameMesh` оставь **None**.\n   - `ChunkMeshes`: кнопка **+** двенадцать раз, в каждый выбери осколок.\n   - `MaxHealth` (здоровье, 30–60), `ArmorThreshold` (0), `DebrisLifetime` (6), `DebrisImpulse` (сила разлёта).\n   - Остальное оставь как есть. Save.\n4. Перетащи `BP_Prop_Barrel_01` в уровень. Готово (**Prop Type Row** оставь `None`). Проверка: Play, рывок ломает его.\n\n**Физичный разрушаемый.** Вместо `BP_Prop_Breakable` ставь `BP_Prop_BreakablePhysics`. В Details выбери в списке компонентов (вверху панели) **PropPhysics**: `GrilleSimulate` = включено, `GrilleMass` = вес (по таблице выше), `FrameSimulate` = **выключено** (рамы нет), `LinearDamping`/`AngularDamping` = 1/2. Ломается и толкается.\n\n---\n## Категория 3. Разрушается частично (решётка, тележка с ящиком)\nНужно: цельная рама `SM_Grid_Frame`, ломаемая часть `SM_Grid_Part`, осколки `SM_Grid_Part_Chunk_01…`.\n\n**В Blender**\n1. Разделить модель: Edit Mode (Tab) → выдели ломаемую часть (L над деталью, Shift+клик — добавить) → **P → Selection**. Получатся два объекта. Переименуй в `SM_Grid_Frame` и `SM_Grid_Part`.\n2. Оба объекта должны иметь **Origin в (0,0,0)** (курсор Shift+C, выдели оба → Object → Set Origin → Origin to 3D Cursor). Это важно: тогда в Unreal части совпадут.\n3. Оба положи в **одну** коллекцию `SM_Grid`. Ctrl+A → All Transforms у обоих.\n4. Осколки: выдели `SM_Grid_Part` → вкладка **Fisht** → **Нарезать на осколки**.\n5. **Export All Collections** (получится `SM_Grid.fbx` с двумя частями и `SM_Grid_Part_Chunks.fbx`).\n\n**В Unreal**\n1. Импорт обоих FBX; получатся `SM_Grid_Frame`, `SM_Grid_Part` и осколки. Материал `MI_Grid` на все, коллизия:\n   - у `SM_Grid_Part`: **Add Box**;\n   - у рамы **не закрывай проход**: Collision → Add Box Simplified подходит только для сплошной рамы. Для рамы с проёмом убери автоколлизию (Collision → Remove Collision) и добавь несколько боксов вокруг проёма вручную (Collision → Add Box Simplified Collision, затем сдвинь/растяни бокс в Details меша). Ширина прохода для собаки: не меньше 40 см.\n2. Дочерний Blueprint от `BP_Prop_Partial`, назови `BP_Prop_Grid`. В Class Defaults задай `FrameMesh` = `SM_Grid_Frame`, `GrilleMesh` = `SM_Grid_Part`, `ChunkMeshes` (осколки), `MaxHealth`. Светодиоды рамы: `LedColorOk` (цвет целого), `LedColorBroken` (цвет сломанного), `LedBlendSeconds`.\n3. В уровень: `BP_Prop_Grid`.\n\n**Физичная частично разрушаемая** (тележка с ящиком): `BP_Prop_PartialPhysics`. В компоненте **PropPhysics**: `FrameSimulate` включено, `FrameMass` 100 (тяжёлая рама), `GrilleSimulate` включено, `GrilleMass` 40 (лёгкая часть, сваливается). Коллизии рамы и части **не должны пересекаться** (ящик лежит на рамке, а не внутри). Низ рамы на Z=0. Образец: `BP_Cargo_01`.\n\n---\n## Контракт светодиодов (версия 2)\nОдна картинка-маска `T_\u003cИмя>_E.png` управляет двумя видами лампочек. Версия контракта: **2**; старые пропсы (версия 1) работают как раньше.\n\n**Каналы маски** (белое на чёрном, в Blender красится цветом нужного канала):\n| Канал | Что это | Как красить |\n|---|---|---|\n| **R** (красный) | **индикатор состояния**: цвет плавно меняется по здоровью с первого же удара (целый зелёный, чем меньше здоровья тем ближе к красному, сломан красный), после первого удара пульсирует | красный `(1,0,0)` |\n| **G** (зелёный) | **горит постоянно**: свой цвет и яркость, на урон не реагирует и не пульсирует | зелёный `(0,1,0)` |\n| B (синий) | резерв, не использовать | |\nЛампочка, которая должна быть и индикатором, и постоянной, красится жёлтым `(1,1,0)`. Как рисовать: Blender, вкладка Texture Paint, чёрная картинка, кисть нужного цвета (при красном R, при зелёном G), файл положить в `textures/T_\u003cИмя>_E.png`, в `prop.json` поставить `\"led\"` (блок ниже).\n\n**Параметры материала** (имена менять нельзя, их знают Blueprint и скрипты):\n| Параметр | Для чего | По умолчанию |\n|---|---|---|\n| `LED_Color`, `LED_Intensity` | цвет и яркость индикатора (цвет по здоровью ставит Blueprint, `LedColorOk` в `LedColorBroken`) | оранжевый, 8 |\n| `LED_Color2`, `LED_Intensity2` | цвет и яркость постоянных лампочек | оранжевый, **0** (выключено) |\n| `LED_PulseRate`, `LED_PulseAmp`, `LED_PulseMode` | частота (Гц), глубина (0 нет пульса, 1 до нуля) и вид пульса (0 синус, 1 меандр) | 0, 0, 0 |\nПульсация считается в материале по времени (без тика на каждый пропс). Blueprint только задаёт частоту и глубину по здоровью. Старые маски с серым RGB не зажигают постоянные лампочки, пока `LED_Intensity2` равна 0.\n\n**Пульсация индикатора.** Пока объект целый и здоровье полное, индикатор горит ровно. После первого удара включается пульс: чем меньше здоровья, тем чаще (частота от `LedPulseMinHz` при ~100% до `LedPulseMaxHz` при ~0%). После поломки пульс гаснет, остаётся цвет «сломан». Настройки лежат в Blueprint `BP_BreakableGrate` (можно менять у конкретного пропса в Details, раздел переменных): `LedPulseMinHz` 1, `LedPulseMaxHz` 6, `LedPulseAmp` 0.6, `LedPulseMode` 0 (синус) или 1 (меандр). Считает функция `UpdateLedPulse`, она вызывается после каждого урона.\n\n**Кто за что отвечает (все в Blueprint `BP_BreakableGrate`, наследуются всеми `BP_Prop_*`, `BP_Cargo_01` и т.д.; Details → категории «LED / Светодиоды» и «LED Pulse / Пульс светодиодов»; полная таблица всех параметров: `Docs/BREAKABLES_GUIDE.md` §9).** Независимые параметры:\n| Параметр | Отвечает за | Диапазон / по умолчанию |\n|---|---|---|\n| `LedBlendSeconds` | **только** скорость перехода цвета `LedColorOk` → `LedColorBroken` (за сколько секунд цвет пройдёт путь 0→1) | 0.2–20, по умолчанию 2 |\n| `LedFlashSeconds` | **только** длительность быстрой вспышки яркости после поломки (программная, в `UpdateLed`; частота ~3 Гц, глубина 45%) | 0–30 с, по умолчанию 4.5 (0 = без вспышки) |\n| `LedPulseMinHz`, `LedPulseMaxHz` | частота пульса по здоровью, пока объект цел, но уже ударен | 0–10, по умолчанию 1 и 6 |\n| `LedPulseAmp` | глубина пульса (0 нет, 1 до нуля) | 0–1, по умолчанию 0.6 |\n| `LedPulseMode` | 0 синус, 1 меандр | 0 |\nРаньше окно вспышки считалось как `LedBlendSeconds + 2.5`, поэтому «длиннее мигание» растягивало и смену цвета (и наоборот). Теперь окно = `LedFlashSeconds`; значение 4.5 повторяет прежнюю картину при `LedBlendSeconds` = 2. Если когда-то ставили `LedBlendSeconds` = 15 ради долгого мигания: верни 2, а длительность задай в `LedFlashSeconds` (было 15 + 2.5 = 17.5).\n\n**Манифест в `prop.json`** (старое `\"led\": true` по-прежнему работает):\n```\n\"led\": {\n  \"version\": 2,\n  \"status\":    {\"enabled\": true,  \"channel\": \"R\"},                                  // можно добавить \"color\": [r,g,b], \"intensity\": 8\n  \"always_on\": {\"enabled\": true,  \"channel\": \"G\", \"color\": [0.1, 0.6, 1.0], \"intensity\": 12},\n  \"pulse\":     {\"enabled\": true}                                                    // false: индикатор никогда не пульсирует\n}\n```\n`prop.ps1 publish` читает его и ставит параметры в `MI_\u003cИмя>` (`LED_Color2`, `LED_Intensity2` и т.д.). Флаг `-Led` (в меню пункт «+ Светодиоды») строит ОБЕ маски сам: по тону BaseColor зелёные лампочки идут в **R (индикатор)**, янтарные и синие в **G (постоянные)**; в `prop.json` пишется блок `led` с цветом постоянных (преобладающий тон). Красный пластик, ржавчина и наклейки отбрасываются (остаются компактные яркие пятна). Группы тонов меняются в `prop.json`: `\"led_auto\": {\"status\": [\"green\"], \"always_on\": [\"amber\",\"blue\"]}` (доступны amber, green, blue). В логе строка «индикаторов (R) N, постоянных (G) M»; если N или M равны 0, будет `PROBLEM:` с подсказкой. Маска приблизительная: лишнее стирай, недостающее дорисуй в `textures/T_\u003cИмя>_E.png` (R и G) и запускай публикацию без `-Led` (маска не перестраивается, параметры из `prop.json` применяются).\n\n**Если контракт изменится** (поднялась версия): `.\\Tools\\Props\\prop.ps1 ledrebuild` пересобирает мастер-материал `M_Prop_Master` и материалы всех пропсов со светодиодами одним проходом. `MI_*` при этом не пересоздаются, настройки в них остаются. `publish` старого пропса сам пересобирает его материал, если версия отстаёт (строка «пересобран по контракту светодиодов» в логе).\n## Светодиоды (кратко)\n- **Что это:** белое пятно на чёрной картинке = светится. Цвет и яркость меняются в Unreal без Blender.\n- **Нарисовать маску в Blender:** выбери модель → вкладка **Texture Paint** → создай картинку (кнопка + в Texture Slots, Base Color → **Image**, чёрная, имя `T_Barrel_01_E`, размер как у остальных текстур) → кистью с белым цветом закрась лампочки → Image → Save As в `textures/`.\n- **В Unreal:** импортируй картинку, **Masks (no sRGB)**. В `MI_Barrel_01` выбери её в `EmissiveMask`, поставь `LED_Intensity` (5–20) и цвет `LED_Color`. Заготовки: `MI_Prop_LED` (оранжевый, 8) и `MI_Prop_Glow` (голубой, 25).\n- **Меняются при разрушении** у категории 3 (рама) и у целиком разрушаемых (решётка-цель `GrilleComp`): цвет плавно идёт от `LedColorOk` к `LedColorBroken` по здоровью с первого удара, задаётся переменными Blueprint (зелёный → красный, как у вентиляции). У категории 1 цвет постоянный.\n\n---\n## Типичные ошибки\n- **Серый или «зеркальный» материал:** ORM не Masks (sRGB включён). Часть Б, п. 3.\n- **Рельеф вывернут:** у Normal нет Flip Green Channel.\n- **Проп в полу или в воздухе:** низ модели не на Z=0, или у разрушаемого/частичного `SizeZ` в Blueprint не 0.\n- **Огромный/крошечный:** не тот размер в Dimensions, не применён масштаб (Ctrl+A).\n- **FBX не появился:** коллекция не называется `SM_…`, скрыта, или нет пункта Export All Collections.\n- **Игрок проходит сквозь:** нет коллизии. UCX из FBX в Unreal 5.8 не подхватывается, коллизия ставится в редакторе меша.\n- **Правка модели не видна:** в Blender пересохрани и Export All Collections; в Unreal ПКМ по ассету → Reimport. С текстурой так же.\n- **Не ломается:** в Blueprint пустой `GrilleMesh`; `MaxHealth` слишком большое для рывка.\n- **Осколки появились в центре мира (0,0,0):** у части нет мешa в `GrilleMesh` или пивот не в (0,0,0).\n- **Рама и часть разлетаются при старте (физика):** их коллизии пересекаются; раздвинь части в Blender.\n- **Прозрачные осколки изнутри:** в материале включи Two Sided (в `M_Prop_Master` уже включён).\n- **Пёс не двигает физичный пропс:** Mass больше ~150, пропс стоит в полу, или Collision Preset не Prop.\n- **Нет звука шагов/удара по пропсу:** на материале не назначен PM_\u003cПоверхность> (часть В, п. 2).\n- **Пёс лезет туда, куда не надо (или не лезет):** тег Traverse.NoClimb / Traverse.Ledge (часть В, п. 3). Теги пиши ровно, с точкой и заглавными.\n\n## Папки\n```\nBlender/Props/\u003cИмя>/   \u003cИмя>.blend, textures/, FBX рядом\nBlender/Props/_TEMPLATE/   шаблон; fisht_props.zip — аддон Blender\nContent/Fisht/Props/\u003cКатегория>/\u003cИмя>/   SM_, MI_, T_ в Unreal\nContent/Fisht/Props/_Template/   M_Prop_Master, MI_Prop_*, AC_PropPhysics, BP_Prop_*\n```\n`Blender/` пока не в git (большие файлы): архивируй вручную или реши, коммитить ли.\n\n## Быстрый путь: одна команда или одна кнопка (Blender → игра, без Claude)\nПорезанный аддоном Fisht Props пропс (`\u003cИмя>`, коллекции `\u003cИмя>_Chunks`, `\u003cИмя>_Parts`) доводится до игры сам. Папка пропса: `Blender/Props/\u003cИмя>/\u003cИмя>.blend` или `Blender/Props/\u003cКатегория>/\u003cИмя>/\u003cИмя>.blend` (категория = имя внешней папки, иначе Misc). Файл и папка называются одинаково.\n\n**Условия:** редактор открыт, PIE остановлен, нет `Saved/PIE_LOCK.txt`, Blender закрыт для этого файла или сохранён (читается файл на диске).\n\n**Варианты** (все три категории, каждая с физикой и без; выбранное запоминается в `prop.json`, дальше можно без флагов):\n| Что | Команда | Что получится |\n|---|---|---|\n| 1. Статичный | `-Type static` | `BP_Prop_\u003cИмя>` от StaticMeshActor с мешем; строки в таблице нет |\n| 1б. Статичный физичный | `-Type static -Physics` | то же + Simulate Physics, профиль `Prop`, 30 кг, тег `Item.Pushable` |\n| 2. Разрушаемый целиком | `-Type full` | строка из `Template_Full`, осколки, `BP_Prop_\u003cИмя>` от `BP_Prop_Breakable` |\n| 2б. то же физичный | `-Type full -Physics` | родитель `BP_Prop_BreakablePhysics` (массы из шаблона, правятся в самом BP, компонент PropPhysics) |\n| 3. Частично | `-Type partial` | строка из `Template_Partial`, рама + часть, родитель `BP_Prop_Partial` |\n| 3б. то же физичный | `-Type partial -Physics` | родитель `BP_Prop_PartialPhysics` |\n**Светодиоды:** `-Led` строит две маски `T_\u003cИмя>_E.png` по BaseColor (R индикатор, G постоянные, подробности в «Контракте светодиодов»), включает `led` в `prop.json`, пересобирает `M_\u003cИмя>` на месте, создаёт `MI_\u003cИмя>` (параметры `LED_Color`, `LED_Intensity`) и назначает его всем мешам. Не угадало: нарисуй маску вручную (раздел «Светодиоды»), положи в `textures/` и запусти с `-Led`-независимо: достаточно `\"led\": true` в `prop.json`. В логе строка «маска светодиодов: пятен N».\n\nБез `-Type` вариант выбирается по составу модели: есть `_Frame` — частично, есть осколки — целиком, иначе статичный. `-NoPhysics` выключает физику. Уже созданный `BP_Prop_\u003cИмя>` не пересоздаётся: при смене варианта удали его в Content Browser и запусти снова (команда предупредит `ВНИМАНИЕ`).\n\n**Команда** (PowerShell, из корня проекта):\n```\n.\\Tools\\Props\\prop.ps1 publish Crate_01 -Type full -Physics\n```\n**Кнопка:** в редакторе меню **Fisht → Опубликовать: Crate_01 →** один из семи вариантов (шесть из таблицы и «как задано в prop.json»; меню включается один раз за сессию: `exec(open(r\"E:\\Unreal Projects\\FishtTheBattleDog\\Tools\\Props\\prop_menu.py\", encoding=\"utf-8-sig\").read())`; постоянно: Project Settings → Plugins → Python → Startup Scripts, путь к `prop_menu.py`). Новый пропс появляется в списке после пункта «Обновить список».\n\n**Что происходит** (прогресс: `Saved/PropImport/log.txt`, строка `ГОТОВО` в конце):\n1. Headless Blender: имена приводятся к `SM_\u003cИмя>`, `SM_\u003cИмя>_Chunk_NN`, `SM_\u003cИмя>_Part_NN` (если в файле имена аддона без `SM_`, основа имён заменяется именем папки); нет `prop.json` создаётся (`-Category X` задаёт категорию); нет `textures/T_\u003cИмя>_BC/N/ORM.png` достаются из материала (Tripo JPG → PNG, ORM собирается из roughness и metallic); скрытые коллекции осколков включаются на время экспорта; FBX + `manifest.json` + `collision.json`.\n2. Unreal: текстуры (правильные сжатия), материал `M_\u003cИмя>` (один раз, дальше не трогается), меши, коллизия Box, поверхность из `prop.json`.\n3. **Данные пропса (здоровье, меши, осколки, светодиоды) пишутся прямо в Blueprint `BP_Prop_\u003cИмя>`** (переменные `MaxHealth`, `GrilleMesh`, `ChunkMeshes`, `LedColorOk` и др.), `Prop Type Row` = None; таблиц нет: удалил папку, и ушло всё. Правь значения в Details самого Blueprint или конкретного экземпляра в уровне. Постоянные значения для повторных публикаций: `prop.json` `\"breakable_row\": {\"MaxHealth\": 45, \"DebrisImpulse\": 600}`; тип вручную: `\"breakable\": \"full\" | \"partial\" | \"static\"`. `GrilleMesh`, `FrameMesh`, `ChunkMeshes`, `SizeY`, `Depth` берутся из мешей и обновляются при каждой публикации, остальное не трогается.\n4. Blueprint `BP_Prop_\u003cИмя>` в папке пропса: дочерний от `BP_Prop_Breakable`/`BP_Prop_Partial` (+Physics) с данными. Просто перетащи его в уровень. Уже существующий Blueprint не пересоздаётся, обновляются только меши и размеры.\n5. Актор в уровне (только если указан уровень, он должен быть уже открыт в редакторе; уровни сам не открываю): `.\\Tools\\Props\\prop.ps1 publish Crate_01 -Level /Game/Fisht/Levels/L_Sandbox -At \"0 0 100\"`. Ставится `BP_Prop_\u003cИмя>` с меткой `Prop_\u003cИмя>`; повтор обновляет этот же актор. Теги: `\"tags\": [\"Breakable.Light\"]` в `prop.json`. Уровень после этого сохраняется.\n\n**Новые поля пропса (2026-10-20): звук, падение, взрыв.** Все в `breakable_row` файла `prop.json` и в Details; без них у пропса безопасные значения от `BP_BreakableGrate` (взрыва нет, звука нет, падение малое). Пример:\n```\n\"breakable_row\": {\"BreakSoundTag\": \"glass\", \"DebrisSoundTag\": \"wood\", \"DebrisSoundDelay\": 0.3,\n                  \"bFallDamage\": true, \"FallDamageMinHeight\": 150, \"FallDamagePerMeter\": 4, \"FallDamageMax\": 15, \"FallDamageTypeMult\": 1.5,\n                  \"ExplosionProfile\": \"Fuel\", \"ExplosionScale\": 1.0}\n```\nЧто делает импорт: `prop_ue_import.py` (`ROW2VAR`, `_apply_row`) пишет эти переменные в Blueprint пропса; шаблоны `_Template/BP_Prop_*` менять не пришлось (поля наследуются от `BP_BreakableGrate`); добавленные ассеты: `/Game/Fisht/Props/_Sound/DT_PropSounds`, `_Explosion/DT_ExplosionProfiles`, `BP_ExplosiveComponent` (создаётся в рантайме, в Blueprint пропса не вшивается). Типы: теги и профиль — строка (Name), `bFallDamage` — true/false. Значения и таблицы: `Docs/BREAKABLES_GUIDE.md` §11. Тест 2026-10-20: пропс `PropTest_Dummy` (куб + 4 осколка + рама) опубликован во всех шести вариантах (static, static+физика, full, full+физика, partial, partial+физика): родители `StaticMeshActor` / `BP_Prop_Breakable(+Physics)` / `BP_Prop_Partial(+Physics)`, новые поля из `breakable_row` попали в Blueprint, повторная публикация не сломалась; пропс убран (`unpublish`).\n\n**Убрать пропс из игры:** в меню Fisht → Опубликовать: \u003cИмя> → «Убрать из игры» (спросит подтверждение) или `.\\Tools\\Props\\prop.ps1 unpublish Crate_01` (`-Force`, если на папку ссылаются уровни). Проверяются ссылки на ассеты пропса (уровни, чужие Blueprint) и удаляется папка ассетов; `Blender/Props/\u003cИмя>` остаётся. Папку можно удалять и руками: таблиц, которые держали бы ссылки, больше нет.\n\n**Повторный запуск безопасен:** меши, не изменившиеся по геометрии, не переимпортируются (реимпорт идёт в те же ассеты); строка таблицы и актор не дублируются. Правишь модель в Blender, сохраняешь, жмёшь ту же кнопку.\n\n**Проверка после публикации:** поставь `BP_Prop_\u003cИмя>` в уровень (или `-Level`); Play, рывок ломает (`Docs/BREAKABLES_GUIDE.md`). Как выглядит, решаешь ты.\n\n## Интерактивные пропсы (кнопка и др., тип `interactive`)\nКонтракт со стороны механизмов: `Docs/MECHANISMS.md`. В `prop.json` блок `\"interactive\": {\"type\": \"button|door|key_reader\", \"cap\": \"\u003cИмя>_Cap\", \"ring_slot\": \"\u003cИмя>_Ring\", \"travel_cm\": 0.8}`; в меню Fisht пункт «как интерактивный…», в командной строке `PROP_TYPE='interactive'` (блок можно передать глобалом `PROP_INTERACTIVE`). Что делает публикация:\n- `BP_Prop_\u003cИмя>` создаётся ДОЧЕРНИМ от `BP_MechButton` / `BP_MechDoor` / `BP_MechKeySlot` (папка Mechanisms); данных разрушения нет.\n- Формы: в меню Fisht «как интерактивный…» пять пунктов: `button` (кнопка с анимацией), `touch` (сенсорная: без подвижной части, цвет меняется на светящемся слоте), `lever`, `switch`, `door`, `key_reader`. `cap` (подвижная часть, объект `\u003cИмя>_Cap`) необязателен: без него `CapMesh` пуст. `ring_slot` может быть именем слота, списком или шаблоном со звёздочкой (`\u003cИмя>_Ring*`): все совпавшие слоты получают один материал `M_\u003cИмя>_Ring`. Родитель `lever` и `switch`: `BP_MechLever` / `BP_MechSwitch`, пока их нет — `BP_MechButton` (с предупреждением в логе; когда «Механизмы» их создадут, подхватятся сами).\n- Для `button`: `ButtonMesh` = `SM_\u003cИмя>`, `CapMesh` = `SM_\u003cИмя>_Cap` с нулевым смещением (FBX-импорт запекает положение объекта в вершины, колпачок уже стоит на месте; `loc_cm` в manifest только справка), `CapTravel` = `travel_cm`.\n- Слот `ring_slot` получает `M_\u003cИмя>_Ring` (копия `M_\u003cИмя>` с текстурами + эмиссия по параметрам `LED_*`, яркость по умолчанию 0), остальные слоты — `M_\u003cИмя>`. Несколько материалов у корпуса для интерактивного не считается проблемой.\n- Колпачок распознаётся по суффиксу `_Cap` (kind `cap` в manifest). Выбор обычного варианта (static/full/partial) снимает блок `interactive`. `door`/`

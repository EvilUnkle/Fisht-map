key_reader`: создаётся только Blueprint нужного родителя, меши не подставляются.\n- Масштаб берётся из Blender как есть (в образце `Button_01` корпус 100×50×94 см вместо заявленных 10 см: правится в .blend).\n\n## Где хранятся данные разрушаемых пропсов\n- **Всё в Blueprint.** `BP_BreakableGrate` (родитель решёток, ящиков и всех `BP_Prop_*`) читает значения из своих переменных, они редактируются на экземпляре в уровне (Details). Так настроены и вентрешётки: `BP_BreakableGrate` (лёгкая), `BP_BreakableGrateHeavy` (тяжёлая), `BP_BreakableCrate`, шаблоны `BP_Prop_*`, `BP_Cargo_01`.\n- **Таблицы `DT_Breakables` больше нет** (удалена вместе с режимом `\"data\": \"table\"`; архив значений: `Docs/archive/DT_Breakables_archive.json`, последняя версия ассета в git до удаления). Поле `PropTypeRow` в `BP_BreakableGrate` осталось для совместимости со старыми уровнями и ни на что не влияет.\n\n## В другом проекте\nИнструмент не привязан к этому проекту: пути и имена шаблонов лежат в `Tools/Props/props_config.json`.\n1. Скопируй в тот проект папку `Tools/Props/` (скрипты, `blender_addon/`) и создай `Blender/Props/`. Папка проекта определяется сама (из редактора и от места `prop.ps1`).\n2. Отредактируй `props_config.json`: `ue_root` (куда класть ассеты), `props_dir`, `blender_exe` (если Blender не в `C:\\Program Files\\Blender Foundation\\Blender 5.1`), `mcp_url` (порт MCP редактора), `physics_profile`/`static_profile`/`pushable_tag` (профили коллизии и тег под проект).\n3. В редакторе нужен включённый MCP-сервер с `execute_python_code` (плагин Python Editor Script Plugin, в Unreal 5.8 родной MCP + VibeUE) и тот же набор плагинов, что здесь; `prop.ps1 publish` говорит с редактором по HTTP.\n4. **Статичные варианты (1, 1б) работают без чего-либо ещё.** Разрушаемые (2, 3) требуют систему разрушения как в Fisht: Blueprint-шаблоны `BP_Prop_Breakable/Partial(+Physics)` (с родителем `BP_BreakableGrate`) в `template_dir`. Таблицы данных не нужны.\n5. Меню в редакторе: `prop_menu.py` запускать там же (Startup Scripts).\nТребуется Python 3 (встроенный в Blender достаточно) и Blender 4.2+/5.x; в этом проекте проверено на Blender 5.1 и Unreal 5.8.\n\n## Где без Claude пока не обойтись\n1. **Отваливающиеся части** (`\u003cИмя>_Parts` из аддона): импортируются как меши `SM_\u003cИмя>_Part_NN`, но механики в игре нет (в `BP_BreakableGrate` под них нет переменных). Открытый вопрос к владельцу разрушаемых BP.\n2. Новая логика (звук, искры, мигание светодиодов, особая реакция на удар) и правки общих Blueprint (`BP_BreakableGrate/Crate`).\n3. Рама с проёмом точной формы: по умолчанию меши получают Box, для рамы с проёмом в `prop.json` задай `\"collision\": {\"SM_\u003cИмя>_Frame\": \"ucx\"}` и нарисуй `UCX_SM_\u003cИмя>_Frame_NN` в Blender, либо поправь вручную в редакторе меша.\n4. Физичные варианты (`BP_Prop_*Physics`, массы), теги `Item.*`/`Traverse.*` для пропсов без `-Level`: руками по части В.\n5. Первичная подготовка модели: размер (1 ед. = 1 м), пивот внизу по центру, `Ctrl+A`, UV, один материал, нарезка аддоном. Команда проверяет и пишет `PROBLEM:` в консоль, но геометрию не чинит.\n\n","date":"2026-10-29"},{"path":"Docs/BREAKABLES_GUIDE.md","title":"Разрушаемые объекты","section":"Модели и пропсы","md":"# Как добавить свой разрушаемый объект (вентрешётки, ящики и т.п.)\n\nВсё построено на **данных внутри Blueprint**: класс `BP_BreakableGrate` (родитель решёток, ящиков и всех `BP_Prop_*`) читает свои переменные. Таблицы `DT_Breakables` больше нет (удалена, архив строк: `Docs/archive/DT_Breakables_archive.json`). Подробности механики: `Docs/CHARACTER_SYSTEMS_SPEC.md`; автоматический путь Blender → игра: `Docs/PROPS_PIPELINE.md`.\n\n## 0. Как это устроено\n- Класс `BP_BreakableGrate` и дочерние `BP_BreakableGrateHeavy`, `BP_BreakableCrate`, шаблоны `BP_Prop_*` (папка `Content/Fisht/Gameplay/Character/World/` и `Content/Fisht/Props/_Template/`). Здоровье, размеры, меши, обломки и светодиоды лежат в переменных Blueprint; на каждом экземпляре в уровне их можно поменять в Details (поле видно у переменной, изменённое выделено).\n- Урон приходит обычным `AnyDamage` (рывок, враги, платформы урона, твои тесты). Здоровье ≤ 0 → пропс ломается. Интерфейс `BPI_Breakable` (`OnBroken`) нужен рывку, чтобы он «видел», что объект ломается.\n- При поломке: объект разваливается на **обломки** (`BP_DebrisPiece`, физика, живут `DebrisLifetime` секунд, общий бюджет `DebrisBudget` в `BP_DestructionManager`), коллизия ломаемой части отключается. Стадии: при здоровье ≤50% и ≤25% объект темнеет и перекашивается.\n- Для **вентрешёток**: рама (`FrameMesh`) остаётся навсегда, ломается только внутренняя решётка (`GrilleMesh`), проход открывается, светодиоды рамы меняют цвет зелёный → красный.\n\n## 1. Самое простое: новый тип ящика/заграждения (без Blender)\n1. Создай дочерний Blueprint от `BP_BreakableCrate` (Content Browser → ПКМ по `BP_BreakableCrate` → Create Child Blueprint Class).\n2. Открой его, выбери корень (Class Defaults) и задай переменные: `MaxHealth` (здоровье), `ArmorThreshold` (урон ниже порога вообще не повреждает), `ResistToDash` (множитель урона от рывка, 1 = как есть), `SizeY`, `SizeZ`, `Depth` (размеры, см), `BreakStyle` (`Vanish` исчезает; `Debris` обломки), для `Debris`: `DebrisCount` (0 = по геометрии, >0 щепки в объёме), `DebrisSize`, `DebrisImpulse`, `DebrisLifetime`, `DebrisTint`; `DebugColor`, `Stage1Darken`/`Stage2Darken`, `Stage1Shift`/`Stage2Shift`.\n3. `Prop Type Row` оставь `None`.\n4. Перетащи Blueprint в уровень. Проверка: Play, рывком (`B`) или Tab → вкладка «Разрушаемые и опасности» → кнопки «Создать ... перед персонажем».\n\n## 2. Свой вид: меш вместо кубиков\n| Переменная | Что это |\n|---|---|\n| `FrameMesh` | постоянная часть (рама, каркас), остаётся после поломки, коллизия по ней |\n| `GrilleMesh` | ломаемая часть (решётка, створка, стекло), при поломке исчезает и даёт обломки |\n| `ChunkMeshes` | массив готовых обломков (`SM_..._Chunk_01…N`). Если пустой, обломки = кубики |\n| `OpeningBottomZ` | высота низа проёма (для решёток, см) |\n| `LedColorOk`, `LedColorBroken`, `LedBlendSeconds` | цвета светодиодов (целый → сломан, плавно по здоровью) и время перехода |\n| `LedFlashSeconds` | длительность вспышки яркости после поломки (0–30 с, по умолчанию 4.5). `LedBlendSeconds` на неё НЕ влияет, и наоборот |\n| `LedPulseMinHz`, `LedPulseMaxHz`, `LedPulseAmp`, `LedPulseMode` | пульс индикатора после первого удара (см. «Контракт светодиодов» в `Docs/PROPS_PIPELINE.md`) |\n\nЕсли `GrilleMesh` пустой, объект собирается процедурно из рамы и прутьев (`FrameT`, `BarCount`, `BarT`).\n\n## 3. Как сделать меши для своего объекта (Tripo → Blender → Unreal)\nАвтоматически: `.\\Tools\\Props\\prop.ps1 publish \u003cИмя>` или меню Fisht в редакторе (Blender export, импорт, материал, коллизия, Blueprint `BP_Prop_\u003cИмя>` с данными). Порядок и варианты: `Docs/PROPS_PIPELINE.md`. Вручную:\n1. Нужны части отдельно: `SM_\u003cИмя>_Frame` (рама) и `SM_\u003cИмя>` (ломаемая часть); осколки `SM_\u003cИмя>_Chunk_01…N`. Аддон Fisht Props режет на осколки (`Docs/PROPS_PIPELINE.md`).\n2. Пивот рамы и решётки в одной точке (центр рамы). Масштаб в см.\n3. Импорт в `/Game/Fisht/Props/\u003cКатегория>/\u003cИмя>/`; коллизия простая (боксы): FBX-`UCX_` не импортируется, коллизия из Python (`KBoxElem`). Для рамы вентиляции: 4 бокса вокруг проёма (проход открыт!), для решётки: 1 бокс.\n4. Материалы: контракт светодиодов (`LED_Color`, `LED_Intensity`, …), сжатие текстур по `CLAUDE.md` §7.\n5. Создай дочерний Blueprint (п.1) и впиши в `FrameMesh`, `GrilleMesh`, `ChunkMeshes`. Construct Script соберёт всё сам, объект виден в редакторе без PIE.\n6. **Проход Фишта через проём:** капсула собаки 28×39 см (в приседе ниже), вентиляционный проём в проекте 73×67 см. Не делай рамой проём меньше.\n\n## 4. Свои эффекты (звук, дым, искры, миссия)\nУ пропса три события (диспетчеры), к ним привязывай что угодно в дочернем Blueprint:\n- `OnDamaged(Damage, HealthNow, HitLocation, HitDirection)` при каждом уроне;\n- `OnStageChanged(NewStage)` при 50% и 25% здоровья;\n- `OnPropBroken(BreakLocation, BreakDirection)` при поломке.\n\n## 5. Свой актор без наследования от решётки\nДобавь в свой Blueprint интерфейс `BPI_Breakable` (Class Settings → Interfaces) и реализуй `OnBroken(Instigator)`. Рывок сам вызывает его у актёров с интерфейсом. Здоровье и обломки считаешь сам (можно переиспользовать `BP_DebrisPiece` и `BP_DestructionManager`).\n\n## 6. Настройка на лету (Tab)\nTab → вкладка «Разрушаемые и опасности»: множитель урона рывка, включить/выключить мусор, бюджет и импульс обломков, кнопки создания тестовых решёток и ящика перед персонажем. Значения самих пропсов меняются в Blueprint или на экземпляре в уровне.\n\n## 7. Ловушки\n- Если в Blueprint после размещения в уровне добавили новый компонент, у уже стоящих экземпляров он пуст: удали их и поставь заново (`CLAUDE.md` §16).\n- Материалы для `InstancedStaticMeshComponent` (кубики и прутья) должны иметь флаг «Used with Instanced Static Meshes», иначе клетчатый материал (`M_TestColor` уже имеет его).\n- `TextRender` не рисует кириллицу: подписи делай через `WBP_WorldLabel` в `WidgetComponent`.\n- Старый `PropTypeRow` на экземпляре в уровне больше ни на что не влияет (переменная осталась для совместимости, значение любое).\n- Рывок решётку пока не всегда ломает у старта `L_Sandbox` (известная проблема, у обычного ящика ломается): проверь `MaxHealth`, `ArmorThreshold` против урона рывка по уровню (`DT_AbilityLevels`, `Damage`).\n- Не удаляй `BP_CharTestRoom` через Python (роняет редактор): только вручную в Content Browser.\n- Восстановить старую таблицу `DT_Breakables`: файл в git (последняя версия до удаления: коммит удаления минус один), значения строк: `Docs/archive/DT_Breakables_archive.json`.\n\n## 9. Таблица параметров / Parameter table (RU / EN)\nВсе параметры лежат в `BP_BreakableGrate` (наследуют решётки, ящики, `BP_Prop_*`, `BP_Cargo_01`) и меняются на экземпляре в Details; в Details они сгруппированы по категориям «EN / RU». Значения по умолчанию: решётка лёгкая / тяжёлая / ящик (`BP_BreakableCrate`).\nAll parameters live in `BP_BreakableGrate` (inherited by grates, crates, `BP_Prop_*`, `BP_Cargo_01`) and are editable per instance in Details, grouped into «EN / RU» categories. Defaults: light grate / heavy grate / crate.\n\n**Health / Здоровье**\n| Параметр | Смысл RU / Meaning EN | Диапазон | По умолчанию |\n|---|---|---|---|\n| `MaxHealth` | здоровье пропса; ≤0 = поломка / hit points, ≤0 breaks it | 1–500 | 20 / 45 / 30 |\n| `ArmorThreshold` | урон ниже порога игнорируется / damage below this is ignored | 0–100 | 0 / 20 / 0 |\n| `ResistToDash` | множитель урона от рывка (1 = как есть, 0.5 = вдвое меньше) / dash damage multiplier | 0–2 | 1 |\n\n**Sound / Звук**\n| Параметр | Смысл | Диапазон | По умолчанию |\n|---|---|---|---|\n| `SoundTag` | общий тег звука (запасной для `BreakSoundTag`/`DebrisSoundTag`, строка `DT_PropSounds`), подробнее §11 / fallback sound tag | имя | grate_light / grate_heavy / crate |\n| `BreakSoundTag`, `DebrisSoundTag`, `DebrisSoundDelay` | звук слома, звук разлёта осколков (None = `SoundTag`), задержка второго, §11 / break & debris sound rows | имя, имя, с | None, None, 0.12 |\n\n**Size and Build / Размер и сборка** (процедурная сборка, если нет мешей / procedural geometry when no meshes are set)\n| Параметр | Смысл | Диапазон | По умолчанию |\n|---|---|---|---|\n| `SizeY`, `SizeZ`, `Depth` | ширина, высота, толщина, см / width, height, depth, cm | 5–400 | 120×120×8 / 120×120×10 / 80×80×80 |\n| `FrameT` | толщина рамы, см / frame thickness | 0–30 | 8 / 10 / 0 |\n| `BarCount`, `BarT` | число и толщина прутьев / bar count & thickness | 0–20, 1–15 | 4, 4 / 7, 6 / 0 |\n| `OpeningBottomZ` | высота низа проёма, см / opening bottom height | -100–100 | -60 / -60 / 0 |\n\n**Meshes / Меши**\n| Параметр | Смысл | Тип | По умолчанию |\n|---|---|---|---|\n| `FrameMesh` | постоянная часть (рама), остаётся / permanent part, stays | StaticMesh | None |\n| `GrilleMesh` | ломаемая часть, при поломке исчезает и даёт осколки / breakable part | StaticMesh | None |\n| `ChunkMeshes` | готовые осколки; пусто = кубики / chunk meshes; empty = cubes | массив | пусто |\n\n**Debris / Осколки**\n| Параметр | Смысл | Диапазон | По умолчанию |\n|---|---|---|---|\n| `BreakStyle` | `Vanish` просто исчезает, `Debris` обломки / vanish or debris | enum | Debris |\n| `DebrisCount` | сколько щепок в объёме (0 = по геометрии) / splinter count (0 = by geometry) | 0–40 | 0 / 0 / 9 |\n| `DebrisSize` | размер щепки, см / splinter size | 2–40 | 8 / 10 / 18 |\n| `DebrisImpulse` | сила разлёта, см/с / scatter impulse | 0–1500 | 450 / 380 / 420 |\n| `DebrisLifetime` | сколько секунд осколок лежит ДО начала исчезновения / seconds a piece lies BEFORE fading starts | 0.5–60 | 6 / 7 / 6 |\n| `DebrisTint` | цвет кубиков-осколков / cube debris color | цвет | белый |\n\n**Debris Fade / Исчезновение осколков** (§10)\n| Параметр | Смысл | Диапазон | По умолчанию |\n|---|---|---|---|\n| `DebrisFadeMode` | вариант исчезновения / fade variant | enum E_DebrisFadeMode | Shrink |\n| `DebrisFadeSeconds` | длительность исчезновения, с (Instant и SparkPop игнорируют) / fade duration | 0.1–10 | 0.8 |\n| `DebrisEdgeColor` | цвет кромки горения (Burn) / burn edge color | цвет | оранжевый (1, 0.35, 0.05) |\n| `DebrisEdgeIntensity` | яркость кромки (Burn) / burn edge brightness | 0–50 | 12 |\n| `DebrisEdgeWidth` | ширина кромки, доля шума (Burn) / edge width | 0.02–0.5 | 0.12 |\n| `bDebrisParticles` | искры Niagara у горящих осколков (Burn, SparkPop) / sparks | вкл/выкл | **выкл** |\n| `DebrisMaxFxPieces` | сколько осколков ЭТОГО пропса могут получить частицы / max FX pieces of this prop | 0–20 | 6 |\n| `DebrisFadeMaterial` | материал-растворение для Burn/Dissolve/Fade (копия материала пропса с растворением); пусто = общий `M_Debris_Fade` (цвет без текстуры) / fade material | материал | None (Barrel_01, Crate_02 заданы) |\n\n**Damage Stages / Стадии повреждения**\n| Параметр | Смысл | Диапазон | По умолчанию |\n|---|---|---|---|\n| `DebugColor` | цвет процедурной геометрии / procedural geometry color | цвет | по типу |\n| `Stage1Darken`, `Stage2Darken` | затемнение при ≤50% и ≤25% здоровья (1 = без) / darkening at 50% & 25% | 0–1 | 0.75, 0.5 |\n| `Stage1Shift`, `Stage2Shift` | перекос прутьев на стадиях, град / bar skew per stage | 0–10 | 1,3 / 1,2 / 0,0 |\n\n**LED / Светодиоды** и **LED Pulse / Пульс светодиодов** (подробно: `Docs/PROPS_PIPELINE.md`, «Контракт светодиодов»)\n| Параметр | Смысл | Диапазон | По умолчанию |\n|---|---|---|---|\n| `LedColorOk` / `LedColorBroken` | цвет индикатора целого / сломанного / indicator color intact / broken | цвет | зелёный / красный |\n| `LedBlendSeconds` | только скорость перехода цвета, с / color blend time | 0.2–20 | 2 |\n| `LedFlashSeconds` | длительность вспышки после поломки, с (0 = нет) / break flash duration | 0–30 | 4.5 |\n| `LedPulseMinHz`, `LedPulseMaxHz` | частота пульса при ~100% и ~0% здоровья, Гц / pulse rate | 0–10 | 1, 6 |\n| `LedPulseAmp` | глубина пульса (0 нет, 1 до нуля) / pulse depth | 0–1 | 0.6 |\n| `LedPulseMode` | 0 синус, 1 меандр / 0 sine, 1 square | 0 или 1 | 0 |\n\n**Прочее / Other.** `PropTypeRow` (Legacy / Устаревшее): ни на что не влияет. Категория «Internal / Служебное»: рабочие переменные, не трогать / working variables, do not edit.\n**Physics / Физика** (компонент `PropPhysics`, `AC_PropPhysics` в физичных шаблонах): `FrameSimulate`/`GrilleSimulate` (симуляция вкл, нет), `FrameMass`/`GrilleMass` кг (100/40), `LinearDamping`/`AngularDamping` (1.5/3), `FrameProfile`/`GrilleProfile` (профиль коллизии, `Breakable` у решётки).\n**Limits / Лимиты** (`BP_DestructionManager`, общий на уровень, правится в Tab или в его Class Defaults): `DebrisBudget` (150, макс. осколков в мире; при превышении старейшие не удаляются мгновенно, а запускают быстрое затухание `EvictFadeSeconds`), `ImpulseMultiplier` (1), `bDebrisEnabled` (вкл), `MaxFxPieces` (12, макс. осколков с частицами одновременно на весь мир).\n**Debris Lifetime / Время жизни осколков** (`BP_DestructionManager`, Class Defaults, имена вида «English (пояснение)»): `LongFraction` (0.3, доля «долгих» осколков 0–1), `ShortLifeMin`/`ShortLifeMax` (1.5/3 с, жизнь «коротких» до начала затухания), `ShortFadeSeconds` (0.4 с, затухание коротких, всегда Shrink), `EvictFadeSeconds` (0.3 с, быстрое затухание вытесненных по бюджету). Долгие живут `DebrisLifetime` и исчезают как задано в §10.\n\n> **Подсказки (Tooltip) в Details.** Категории двуязычные (сделано). Текст подсказок при наведении программно через MCP/Python в этой сборке выставить нельзя (у `BlueprintService` нет setter'а Description, в Python не видны `NewVariables`). Смысл параметров лежит в этой таблице; если нужны hover-подсказки, их вписывают руками в My Blueprint → переменная → Description (формат «RU: ... / EN: ...», текст берётся из столбцов «Смысл»). / Hover tooltips cannot be set via MCP/Python in this build (no Description setter); categories are bilingual, meanings are in this table; paste them into Variable → Description manually if needed.\n\n## 10. Исчезновение осколков / Debris fade modes\n**Короткие и долгие (2026-11-09).** При поломке менеджер для каждого осколка решает случайно (`ChooseLong`): с вероятностью `LongFraction` (~30%) осколок «долгий», вероятность растёт для крупных (вес по объёму `Size`, относительно среднего в этой поломке, 0.3…3×; у кусков-мешей `Size` одинаков, там выбор чисто случайный). Короткие (~70%) разлетаются и через `ShortLifeMin..ShortLifeMax` с быстро (`ShortFadeSeconds`) уменьшаются, без частиц. Долгие остаются на `DebrisLifetime` и исчезают режимом `DebrisFadeMode`. Перебор бюджета: самый старый осколок получает `ForceFade(EvictFadeSeconds)` (быстрый Shrink, если ещё не затухал) и выходит из счёта; мгновенного Destroy нет. Все пути удаления осколка вызывают `Unregister` (в Destroyed тоже), мёртвые головы массива `Pieces` вычищаются проверкой `IsValid` в цикле. Раньше `Unregister` вызывался с пустым пином `Piece`, и мёртвые ссылки копились (сотни «Ошибок схемы»).\nОсколок живёт `DebrisLifetime` с, затем `DebrisFadeSeconds` с исчезает выбранным способом (`DebrisFadeMode`), потом удаляется. Параметры задаются на пропсе (Details → «Debris Fade / Исчезновение осколков»); пропс при поломке передаёт их менеджеру `BP_DestructionManager` (`SetFadeParams`), менеджер раздаёт осколкам (`SetFade`). Старые пропсы и все шаблоны имеют `Shrink` по умолчанию: поведение прежнее, материал не нужен.\n| Режим / Mode | Что видно / What you see | Материал |\n|---|---|---|\n| `Shrink` | уменьшается до нуля (как раньше) / shrinks | не нужен |\n| `Burn` | растворяется по шумовой маске, горящая оранжевая кромка (`DebrisEdgeColor/Intensity/Width`), обугливание / burns away with glowing edge | `DebrisFadeMaterial` (иначе общий, без текстуры) |\n| `Dissolve` | то же без огня / same without fire | то же |\n| `Fade` | рассеивание точками (dither, на пикселях экрана) / dithered fade | то же |\n| `Sink` | проваливается сквозь пол на 35 см, коллизия и физика выключаются / sinks through floor | не нужен |\n| `Blink` | мигает всё чаще, затем исчезает / blinks faster and faster | не нужен |\n| `SparkPop` | короткая вспышка (0.15 с, быстрое горение) и исчезновение; с `bDebrisParticles` ещё искры / quick flash pop | как Burn |\n| `Instant` | исчезает сразу по таймеру / vanishes right after lifetime | не нужен |\n**Материалы растворения.** Универсальный `Content/Fisht/Props/_Fade/M_Debris_Fade` (Masked, параметры `DissolveAmount`, `EdgeColor`, `EdgeIntensity`, `EdgeWidth`, `CharAmount`, `DissolveStyle`, `NoiseScale`, цвет `Base Color`). Для пропса с текстурами нужна копия его материала с узлами растворения: в редакторе `exec(open(r\"E:\\Unreal Projects\\FishtTheBattleDog\\Tools\\Props\\fade\\fade_material.py\", encoding=\"utf-8-sig\").read())`, затем `make_variant(\"/Game/.../M_Имя\")` (создаст `_Fade/M_Имя_Fade`, исходник не трогается); при необходимости материал-инстанс с теми же параметрами (`MI_..._Fade`) и впишите его в `DebrisFadeMaterial` пропса. Готово для `Barrel_01`, `Crate_02`. Для вентрешёток и `Cargo_01` пока общий материал (осколки получают однотонный цвет `DebrisTint`/`DebugColor`).\n**Производительность / Performance.** Растворение считает материал, на CPU только один параметр на осколок за тик. Частицы Niagara ограничены двумя лимитами: `DebrisMaxFxPieces` (на пропс) и `MaxFxPieces` (на мир). Замер в PIE (L_Sandbox): 5–12 осколков, 30–40 fps, лимит работает (5 осколков, частицы у 2, счётчик возвращается в 0). Тени: Masked-материал отбрасывает тень по маске.\n**Известные ограничения / Known issues.** (1) Искры Niagara (`NS_DebrisSparks`, копия шаблона `DirectionalBurst`) пока сырые: длинные белые ленты, цвет и размер шаблона правятся плохо; по умолчанию выключены (`bDebrisParticles`). (2) Режимы `Blink` и `Sink` не проверялись глазами крупным планом. (3) Контрольные кадры: `Saved/FadeTest/sheet_ALL_modes.png` (8 режимов), `sheet_Burn_v2.png`, `sheet_Dissolve.png`.\n\n## 11. Звук, урон от падения, взрывы, диагностика (2026-10-20)\nВсё в `BP_BreakableGrate` (Details, наследуется шаблонами и `BP_Prop_*`); значения по умолчанию безопасны: взрыва нет, звука нет (нет файлов), падение даёт малый урон. Скрипты сборки: `Tools/Props/build_prop_sounds.py`, `build_fall_damage.py`, `build_explosives.py`. Импорт из Blender знает эти поля (`prop.json` → `breakable_row`, см. `Docs/PROPS_PIPELINE.md`).\n\n**Sound / Звук** (`DT_PropSounds`, `/Game/Fisht/Props/_Sound`)\n| Параметр | Смысл | По умолчанию |\n|---|---|---|\n| `SoundTag` | общий тег (запасной для двух ниже) / fallback tag | grate_light / grate_heavy / crate |\n| `BreakSoundTag` | строка таблицы для звука слома; `None` = взять `SoundTag` / break sound row; None = SoundTag | None |\n| `DebrisSoundTag` | строка для звука разлёта осколков; `None` = `SoundTag` / debris sound row | None |\n| `DebrisSoundDelay` | задержка звука осколков после слома, с / debris sound delay | 0.12 |\nТаблица `DT_PropSounds`: имя строки = тег; колонки `BreakSound`, `DebrisSound` (SoundBase), `BreakVolume`, `DebrisVolume`, `PitchMin`, `PitchMax` (случайная высота), `Notes`. Заготовки без звуков: `grate_light`, `grate_heavy`, `crate`, `barrel_metal`, `wood`, `metal`, `glass`, `cardboard`, `electronics`. Звуки приходят от пользователя: открыть `DT_PropSounds`, вписать SoundWave/Cue в нужную строку. Нет строки или звук `None`: тишина, ошибок нет (проверено). Новый тег = новая строка таблицы. Проигрывание: `DoBreak` → `OnBreakSound` → `PlayPropSound(0)`, через `DebrisSoundDelay` → `PlayDebrisSoundNow` → `PlayPropSound(1)`.\n\n**Fall Damage / Урон от падения** (физичные пропсы; статичные не затрагиваются)\n| Параметр | Смысл | По умолчанию |\n|---|---|---|\n| `bFallDamage` | включить / enable | вкл |\n| `FallDamageMinHeight` | высота падения, ниже которой урона нет, см / threshold height | 150 |\n| `FallDamagePerMeter` | урон за каждый метр СВЕРХ порога / damage per metre above threshold | 4 |\n| `FallDamageMax` | максимум за одно падение / cap | 15 |\n| `FallDamageTypeMult` | множитель «по типу» (хрупкое 1.5, прочное 0.5) / per-type multiplier | 1 |\n| `FallDetectSpeed` | вертикальная скорость, с которой падение считается падением, см/с / fall detect speed | 100 |\n| `bFallImpactDamage` | падающий пропс бьёт тех, на кого упал / falling prop damages what it hits | вкл |\n| `FallImpactDamagePerKJ` | урон другим за каждый кДж энергии удара / damage per kJ | 6 |\n| `FallImpactMinKJ` | ниже этой энергии (кДж) другим урона нет / min energy | 0.3 |\n| `FallImpactMax` | максимум урона другим за удар / cap | 25 |\nУрон ДРУГИМ: энергия `E = m·v²/2` (m — масса тела пропса в кг из физики, v — максимальная скорость падения, м/с), `урон = E[кДж] × FallImpactDamagePerKJ`, не выше `FallImpactMax`; радиальный урон вокруг пропса (радиус = размер пропса + 15 см), сам пропс исключён. Пример: ящик 40 кг при 5 м/с = 0,5 кДж → 3 урона. Падение 40 кг со скоростью 10 м/с = 2 кДж → 12. Максимумы (`FallDamageMax` — самому пропсу, `FallImpactMax` — другим) правятся в Details на каждом экземпляре. Скорость падения ограничена демпфированием тела (`LinearDamping`), у шаблонов ~5 м/с. Формула самому пропсу: `урон = (высота − порог)/100 × урон_за_метр × множитель`, не выше максимума; высота = от самой высокой точки падения до остановки (высота и скорость связаны: 150 см ≈ 5,4 м/с). Урон идёт обычным `AnyDamage` самому пропсу (учитывает `ArmorThreshold`, `ResistToDash`). Проверено в PIE: подъём ящика на 250 см → −3,6 HP, на 600 см → −15 (максимум). Тики: `FallTick` после `UpdateLed`, статичный пропс выходит сразу.\n\n**Debris Trails / Следы осколков** (Niagara-след за летящим осколком; в проекте до 2026-10-20 его не было, были только искры горения)\n| Параметр | Смысл | По умолчанию |\n|---|---|---|\n| `DebrisTrails` | МАССИВ систем Niagara; каждому осколку (до лимита) назначается случайная из них; пусто = без следов / array of Niagara systems, random per piece | пусто |\n| `DebrisTrailMax` | сколько осколков ЭТОГО пропса получат след / max trailed pieces | 8 |\nСлед крепится к осколку (`SpawnSystemAttached`). Когда осколок начинает исчезать (`BeginFade`), след переводится в `Deactivate`: новые частицы не рождаются, летящие затухают по времени жизни частиц в самой системе Niagara (чтобы гасло плавно, задайте у частиц Scale/Color Over Life или длинный fade ленты). Осколок с `Burn/Dissolve/Fade` теперь по умолчанию получает материал растворения от материала САМОГО пропса: при публикации `prop_ue_import` создаёт `/Game/Fisht/Props/_Fade/M_\u003cИмя>_Fade` и вписывает в `DebrisFadeMaterial` (без него растворение шло по общему однотонному материалу и выглядело как «резкое исчезновение»). В `prop.json`: `\"breakable_row\": {\"DebrisTrails\": [\"/Game/.../NS_Trail_A\", \"/Game/.../NS_Trail_B\"], \"DebrisTrailMax\": 6}`. Лимит на весь мир отдельно не вводился; если следов много, ограничьте `DebrisTrailMax`. Проверено: 2 тестовые системы, 5 из 8 осколков получили след при `DebrisTrailMax` 5.\n\n**Explosion / Взрыв** (`DT_ExplosionProfiles`, `/Game/Fisht/Props/_Explosion`; компонент `BP_ExplosiveComponent`)\n| Параметр | Смысл | По умолчанию |\n|---|---|---|\n| `ExplosionProfile` | имя строки профиля (`Fuel`, `Extinguisher`, `InertGas`, `Pressure`); `None` = пропс не взрывается / profile row, None = no explosion | None |\n| `ExplosionScale` | множитель радиуса, урона, импульса, огня / scale | 1 |\nПрофиль (строка таблицы): `Radius`, `Damage`, `MinDamage` (с затуханием по радиусу, внутренняя четверть радиуса — полный), `Impulse` (радиальный импульс, убывает линейно), `FuseDelay` (задержка после слома), `FireDps`/`FireSeconds`/`FireRadius` (горение/заражение раз в 0,5 с в радиусе взрыва), `DebugColor`, `Notes` и три МАССИВА вариантов (при каждом взрыве берётся случайный элемент):\n- `Effects` — системы Niagara (`EffectScale` — их масштаб). Пока массив пуст, рисуется цветная сфера-заглушка (`DrawDebugSphere`, не в шиппинге).\n- `Sounds` — звуки взрыва (`SoundVolume`). Пусто = тишина.\n- `Decals` — материалы-следы (Deferred Decal), падают на пол под взрывом: нагар, белое пятно огнетушителя, зелёная жижа и т. д. Параметры: `DecalSizeMin`/`DecalSizeMax` (размер см, случайный в диапазоне, умножается на `ExplosionScale`), `DecalLifetime` (сколько секунд живёт до затухания), `DecalFadeSeconds` (длительность затухания). Случайный поворот; на стены не ставится (только вниз). Пусто = без следа.\nЗаготовки профилей: Fuel (бочка с горючим: 35 урона, 350 см, огонь 8/с 4 с, нагар), Extinguisher (хлопок: 10, 250 см, белое пятно), InertGas (3, мягкий толчок, без следа), Pressure (баллон: 30, 400 см, нагар), Radioactive (4 урона + заражение 3/с 8 с в 250 см, зелёное пятно). Заглушки материалов следов: `/Game/Fisht/Props/_Explosion/Decals/` (`M_ExplosionDecal` + `MI_Decal_Scorch/White/Green`, меняйте цвет в инстансе). Как наполнять: открыть `DT_ExplosionProfiles`, у нужной строки добавить элементы в массивы (кнопка +), выбрать ассеты. Скрипт `build_table()` существующие значения не затирает. Новый вид взрыва = новая строка (дублируйте существующую и переименуйте). Как работает: `DoBreak` → `ExplodeOnBreak`: если профиль не `None`, в рантайме создаётся компонент (SCS шаблона не меняется, старые экземпляры не пустеют), центр взрыва = центр `GrilleComp`; радиальный урон ломает соседние пропсы, у которых тоже есть профиль, и они взрываются следом (цепная реакция). Ограничение: радиальный урон берёт только динамические каналы (Breakable/Prop/Pawn); пропсы с `WorldStatic` (старый `BP_Cargo_01`) его не получают (см. ISSUES отчёта).\n\n**Диагностика: кто бьёт соседей.** Осколки `BP_DebrisPiece` урон НЕ наносят (в их графе нет `ApplyDamage`), толкают только физикой; проверено в PIE (ящик ломается, сосед в 70 см, 30/30 HP через 10 с). Источник — рывок `BP_Ability_Dash`: `Multi Sphere Trace` радиусом 90 см (`DT_AbilityLevels.Radius`) вдоль линии рывка 12–14 м; `HitTarget` для каждого актора с `BPI_Breakable` вызывает `OnBroken` (сразу ломает, без учёта здоровья) и ещё `ApplyDamage`. Всё в 90 см от траектории ломается. Исправление применено 2026-10-20: `DT_AbilityLevels.Radius` для `Dash_1..3` уменьшен с 90 до 45 см (по решению пользователя). Колонка `Radius` рывка влияет и на всё прочее, что рывок задевает (враги, техник), не только на пропсы. Если ломать надо не мгновенно, а по здоровью, заменить `OnBroken` на `ApplyDamage` в `BP_Ability_Dash.HitTarget` (не сделано).\n\n**Tab → «Разрушаемые и опасности» → «Сломать ближайший пропс перед персонажем (без рывка)».** Ищет целые `BP_BreakableGrate` (и дочерние) в 6 м от точки в 150 см перед Фиштом, ломает ближайший (`OnBroken`). Нужен для проверки звука, осколков, взрывов без рывка.\n\n## 8. Чек-лист нового разрушаемого объекта\n1. Меши (рама, решётка, обломки) → 2. коллизия (рама открыта, решётка блок) → 3. материал со светодиодами → 4. Blueprint с данными (`prop.ps1 publish` делает сам) → 5. актор в уровне → 6. проверка рывком в PIE и Tab → 7. эффекты на `OnPropBroken` → 8. коммит (`Content/Fisht/Props/\u003cКатегория>/`).","date":"2026-11-09"},{"path":"Docs/TRIPO_IMPORT_GUIDE.md","title":"Импорт из Tripo","section":"Модели и пропсы","md":"# Как отдать модель из Tripo в проект (шпаргалка)\n\nПоток: **Tripo (GLB) → Blender (чистка, FBX) → Unreal (импорт скриптом, материал, коллизия)**. Геометрию в Unreal не правим.\n\n## 1. Что сделать вам\n1. Сгенерируйте модель в Tripo (сайт или API). Вход: чистый референс ОДНОГО предмета, нейтральный фон, без надписей. Параметры: максимальное качество, текстура HD, PBR.\n2. Скачайте **GLB** и положите в `E:\\Unreal Projects\\Battle_Fisht_Ref\\work\\incoming\\\u003cимя_предмета>\\` (одна папка на предмет). Если правили в Blender сами: сохраните `.blend` туда же.\n3. Напишите задание одним сообщением (шаблон ниже) в чат «Пропсы» или любому чату, где включён скилл `tripo-prop-import`.\n\n## 2. Шаблон задания\n```\nПредмет: \u003cимя>              (SM_\u003cИмя>)\nКатегория: \u003cпапка>          (/Game/Fisht/Props/\u003cКатегория>/)\nРазмер в см: \u003cД × Ш × В>    (реальные размеры в игре)\nФайл: \u003cпуть к GLB или .blend>\nЛомается: да/нет            (части: рама/створка/решётка и т.п.)\nКоллизия: box / convex / нет\nПивот: низ по центру / центр / своя ось\nОсобенности: светодиоды (эмиссия), надпись-декаль, двойной материал и т.п.\n```\n\n## 3. Что делает чат (скилл `tripo-prop-import`)\n1. Blender: импорт, масштаб в см, пивот, ориентация (+X вперёд), удаление мусора и дублей, упрощение сетки (мелкие ~5–15k, крупные ~30–50k треугольников), при необходимости разделение на части, одна PBR-материалка (BaseColor / Normal / ORM / Emissive).\n2. Экспорт FBX в папку предмета, `SOURCE.txt` (источник, дата, параметры, кредиты, лицензия).\n3. Unreal: импорт по одному ассету за вызов (отложенно, иначе падает), сжатие текстур (BaseColor sRGB, Normal TC_NORMALMAP, ORM TC_MASKS), материал, коллизия через `body_setup`, Nanite для статики, имена `SM_/T_/M_`.\n4. Короткий отчёт ≤10 строк + кадр для вашего вердикта.\n\n## 4. Что повышает качество\n- Чистый референс одного предмета, мультивью (спереди, сбоку, сзади), без текста.\n- Не просить мелкие детали: их проще сделать декалью, текстурой или вручную.\n- Если на сайте Tripo результат лучше, чем через API, берите с сайта.\n- Один тестовый предмет, затем партия: тратим кредиты осознанно (`ASSETS.md`).\n\n## 5. Ловушки (из практики)\n- Tripo возвращает «пустотелую коробку» с решёткой с обеих сторон: нужная половина берётся разрезом.\n- FBX `UCX_` коллизии не импортируются: коллизия ставится из Python (`KBoxElem` в `body_setup.agg_geom`).\n- Не использовать `python` из Store: запускать Blender-питон (`...\\Blender 5.1\\5.1\\python\\bin\\python.exe`).\n- Тяжёлые операции в Unreal (импорт FBX/GLB, GeometryScript) только отложенно и по одному ассету за вызов.\n- Один ассет и одна проверка за сообщение; решение по виду всегда за вами.\n","date":"2026-10-15"},{"path":"Docs/starters/props_blender.md","title":"Пропсы: Blender → игра (стартер)","section":"Модели и пропсы","md":"# Старт: «Пропсы: Blender → игра» (обновлено 2026-10-20, сессия «publish»)\n\nЗона: `Blender/Props/\u003cИмя>/`, `Tools/Props/`, `/Game/Fisht/Props`, `BP_BreakableGrate*` и дочерние, контракт светодиодов, меню Fisht в редакторе. Не трогать: анимацию, ABP, `BP_FishtCharacter`, уровни (`L_Sandbox` сохраняет только «Уровни и миссии»). Тексты для человека: `Docs/PROPS_PIPELINE.md` (быстрый путь, контракт светодиодов, «В другом проекте»), `Docs/BREAKABLES_GUIDE.md`.\n\n## Как работает сейчас\n- **Одна команда или кнопка:** `.\\Tools\\Props\\prop.ps1 publish \u003cИмя> [-Type static|full|partial] [-Physics] [-Led]`, меню **Fisht → Опубликовать: \u003cИмя>** (создаёт `Content/Python/init_unreal.py` при старте редактора, сам код `Tools/Props/prop_menu.py`). Blender export (headless) → импорт в открытый редактор по MCP (текстуры, `M_\u003cИмя>`, меши, коллизия) → Blueprint `BP_Prop_\u003cИмя>` с данными. Повтор безопасен. `unpublish \u003cИмя>` (меню: «Убрать из игры»), `ledrebuild`.\n- **Шесть вариантов:** статичный / разрушаемый целиком / частично × физика. Выбор запоминается в `prop.json` (`breakable`, `physics`).\n- **Данные пропса в Blueprint**, таблицы нет: `DT_Breakables` УДАЛЕНА (коммит 7b1998a, архив строк `Docs/archive/DT_Breakables_archive.json`). `BP_BreakableGrate.LoadRow`: Health = MaxHealth, BuildGeometry; значения берутся из переменных Blueprint (instance-editable). Решётки Light/Heavy, ящик, Cargo_01, Barrel_01, Crate_02 перенесены. `PropTypeRow` осталось в BP для совместимости, ни на что не влияет.\n- **Контракт светодиодов v2:** маска `T_\u003cИмя>_E`: R = индикатор состояния (цвет по здоровью от `LedColorOk` к `LedColorBroken`, пульс после первого удара: `LedPulseMinHz/MaxHz/Amp/Mode`), G = горит постоянно. Параметры материала `LED_Color/Intensity`, `LED_Color2/Intensity2`, `LED_PulseRate/Amp/Mode`. `-Led` строит обе маски сам (зелёные в R, янтарные и синие в G, `prop.json led_auto` меняет группы), маска приблизительная, ручная правка PNG допустима. Мастер `M_Prop_Master` и материалы пропсов пересобираются `prop.ps1 ledrebuild`.\n- **Конфиг для другого проекта:** `Tools/Props/props_config.json`.\n\n## Доработки 2026-10-20 (чат «Доработка пропсов»)\nЗвук слома/осколков (`BreakSoundTag`, `DebrisSoundTag`, `DT_PropSounds`), урон от падения (`FallTick`), взрывы (`ExplosionProfile`, `BP_ExplosiveComponent`, `DT_ExplosionProfiles`), F1-кнопка «Сломать ближайший пропс». Описание и параметры: `Docs/BREAKABLES_GUIDE.md` §11; импорт: `Docs/PROPS_PIPELINE.md` («Новые поля пропса»). Сборка: `Tools/Props/build_prop_sounds.py`, `build_fall_damage.py`, `build_explosives.py`, `Tools/DebugMenu/build_break_nearest.py`. Урон соседям при поломке даёт рывок (радиус 90 см), не осколки (диагноз в §11). Ловушки: `time.sleep` в PIE блокирует игровой поток (замер в двух вызовах), BlueprintService слеп при PIE, `AddComponentByClass` ставит компонент в корень актора (физичный пропс уезжает от корня: ставить `SetWorldLocation`), ApplyRadialDamage не видит WorldStatic.\n\n## Открытые вопросы\n1. **Отваливающиеся части** (`\u003cимя>_Parts` из аддона Blender) импортируются как меши `SM_\u003cИмя>_Part_NN`, механики в игре нет. Нужна механика (отдельное решение пользователя).\n2. `Blender/` (≈213 МБ) и `Content/Fisht/Props/Barrels`, `Crates` пользователь не решил коммитить; в git их нет.\n3. `Tools/Tunables/gen_registry.py` падает на BOM в `build_camera_tuning.py` (чужой файл); `tunables_meta.json` правился вручную.\n4. Вид светодиодов (пульс, цвета, маски Crate_02 и Barrel_01) и подписи тестовой комнаты: вердикт за пользователем, программно проверены только значения параметров.\n5. `Content/Fisht/Props/_Template/BP_Prop_BreakablePhysics.uasset` в рабочей папке отличается побайтово из-за моих правок шаблона (значения прежние).\n\n## Ловушки (проверено)\n- **PIE слепит реестр ассетов:** импорт и правка BP только при остановленном PIE, замок `Saved/PIE_LOCK.txt`; импорт по одному шагу за тик. Эмуляция клика по окну редактора система блокирует: окно «Схема Blueprint ошибка компиляции» (BP с ошибкой при старте PIE) придётся закрывать пользователю.\n- **Состояние импорта `Saved/PropImport/\u003cИмя>.json`** хранит хэши; удалённые руками ассеты скрипт теперь переимпортирует сам, материал без текстур пересобирает на месте.\n- **Управляющие переменные `PROP_*` одноразовые:** пространство имён `execute_python_code` живёт между вызовами, старые значения портили запуск.\n- **Компонент PropPhysics шаблонов `BP_Prop_*Physics` общий:** запись через дочерний BP портит родителя (так была испорчена масса 40 → 77, восстановлено). Массы физичных вариантов правятся руками в Blueprint пропса.\n- **Tripo-меш** слипается в один кусок, дыры закрывать выпуклым многоугольником; FBX `UCX_` UE не импортирует, коллизия из `collision.json` через `KBoxElem`.\n- **PowerShell 5.1:** `.ps1` с кириллицей только с BOM; `2>&1` на `blender.exe` ломает `ErrorActionPreference=Stop`; экспорт с `| Select -First N` обрывает скрипт.\n- Блендер-сессия пользователя (MCP) может держать несохранённую сцену: работать headless (`blender.exe -b`).\n- Общие ловушки: `CLAUDE.md` §16 (PIE, `Start-Process` для редактора, `duplicate_asset` уровня, неполная строка DataTable вешает редактор, `BP_CharTestRoom` через Python не удалять).\n","date":"2026-10-20"},{"path":"Docs/FISHT_MENU.md","title":"Меню Fisht в редакторе","section":"Модели и пропсы","md":"# Меню Fisht в редакторе (владелец: чат «Меню Fisht»)\n\nФайл: `Tools/Props/prop_menu.py`, автозапуск `Content/Python/init_unreal.py`. Меню охватывает всю папку `Blender/`.\n\n## Структура\n- Верхняя подпапка `Blender/\u003cКатегория>` = подменю (Props, Building…). Вложенные папки = группы. Папки на `_` пропускаются.\n- Проект = папка `\u003cИмя>`, в которой лежит `\u003cИмя>.blend` (как раньше для пропсов).\n- В подписи группы счётчики: ● опубликовано, ◐ устарело, ○ не опубликовано. Внутри группы сначала то, что требует действия.\n\n## Статус (по файлам, редактор не нужен)\n| Значок | Условие |\n|---|---|\n| ○ | нет `.uasset` в `Content/\u003cue_path>` |\n| ● | папка ассетов есть |\n| ◐ | `\u003cИмя>.blend` новее `export/manifest.json` (его пересоздаёт каждая публикация) |\n`ue_path` берётся из `prop.json`, иначе: `Props/\u003cКат>/\u003cИмя>` → `/Game/Fisht/Props/\u003cКат>/\u003cИмя>`; остальное → `/Game/Fisht/\u003cпапки от Blender/>/\u003cИмя>` (например `Building/Walls/Wall_01`).\n\n## Действия\n- Не опубликован: «Опубликовать: как задано в prop.json», «Опубликовать как…» (6 вариантов), «+ светодиоды».\n- Опубликован/устарел: то же с подписью «Пересобрать заново (republish)» + «Удалить (unpublish)» (с подтверждением, ссылки из уровней проверяются).\n- **Светодиоды** это тоже публикация: пункт сам строит маски `T_\u003cИмя>_E` и включает `led` в `prop.json`; нажимать его нужно **вместо** обычной публикации, один раз (или когда надо перестроить маски). Дальше обычные пункты светодиоды сохраняют (`led` уже в `prop.json`).\n- **«Как задано в prop.json»**: публикация без выбора варианта, берётся последний выбранный (запоминается в `prop.json`: `breakable`, `physics`), а если не выбирали, вариант определяется по составу модели (есть `_Frame` → частично, есть осколки → целиком, иначе статичный).\n\n## Светодиоды в один клик\nВ «Опубликовать как… + светодиоды» те же 6 вариантов, но с созданием масок `T_\u003cИмя>_E`: тип и физика запоминаются в `prop.json`, маски строятся в той же публикации.\n\n## Наборы материалов (`Blender/Materials`)\nНабор = папка с `manifest.json` (обычно `Blender/Materials/\u003cНабор>/\u003cНабор>/`). Пункт «Создать/Обновить материалы из набора» запускает `Tools/Props/material_set_import.py`:\nимпорт недостающих или более новых текстур (BaseColor, Normal_DX, ORM; сжатие по README набора), затем инстансы `MI_…` от мастера (для модульной панели, где несколько BaseColor).\n- **Мастер-материал.** Нет мастера: скрипт строит triplanar-мастер сам (`Tools/MaterialTools/build_triplanar_master.py`, плитка = `footprint_m` из `manifest.json` в см) вместе со смещением на каждый актор через Custom Primitive Data. Где искать поля: выбери **StaticMeshComponent** (не актор) → Details → Rendering → Custom Primitive Data, Element 0/1/2 (X/Y/Z в см по осям меша). Существующий мастер не пересобирается (пол и стена собраны вручную). Для декалей мастера строятся отдельно (`M_Decal_Atlas`, `M_Decal_Single`, с затуханием по углу).\n- Опционально в `fisht_material.json`: `base_param` (имя параметра цвета; по умолчанию `BaseColor`, у стены `Wall_BaseColor`).\n- Меню: в каждой группе подгруппы «К публикации» (○, ◐) и «Опубликовано» (●). Проекты со своим конвейером (`CUSTOM`, сейчас Duck) скрыты.\n- Не подключено: `EmissiveMask` потолка (карта светодиодов/свечения) пока не используется мастером.\n- Куда класть и как называется мастер: необязательный `fisht_material.json` рядом с `manifest.json` (`ue_dir`, `master`, `instance_prefix`, `base_param`, `kind`); без него `ue_dir = /Game/Materials/\u003cИмя папки>`, `master = M_\u003cИмя папки>`.\n- Статус: ○ нет мастера, ● есть, ◐ `manifest.json` новее мастера.\n- Удаления нет намеренно: delete + повторное создание материала роняет редактор (CLAUDE.md, ловушка из чата материалов). Удаляй руками в Content Browser.\n- Карта светодиодов для материалов: ещё не сделана (ждёт описания от пользователя).\n- **Плоская папка без `manifest.json`** (генератор отдаёт `material.json` + `BaseColor.png`, `Normal_DX.png`, `ORM.png`, `Height.png`, опционально `Emissive.png`, `Opacity.png`): тоже набор. Меню находит её по `material.json` + файл `*BaseColor.png` (имена карт берутся из `files` в `material.json`, поддержан и префикс `T_\u003cНабор>_`). Оттенки `base_color_variants` (Warm/Neutral/Cool) импортируются как текстуры, а для пола создаются инстансы `MI_\u003cНабор>_\u003cОттенок>` с подменой параметра `BaseColor` (основной BaseColor остаётся в мастере). Перед импортом `_stage()` складывает карты жёсткими ссылками в `Saved/PropImport/mset/\u003cИмя>/\u003cИмя>_\u003cКарта>.png` и пишет туда `manifest.json` (`footprint_m` = `tile_m` из `material.json`); исходные файлы не трогаются. Дальше как обычный пол: triplanar-мастер `M_\u003cИмя>`, параметры `NormalStrength`, `UseParallax`, `ParallaxHeight`. Статус сравнивает `material.json` с мастером.\n- **Декали набора:** `Decals/*.png` (RGBA) импортируются вторым проходом как отдельные декали (как `PNG/*.png`): текстуры и `MI_Decal_\u003cфайл>` в `/Game/Materials/\u003cНабор>/Decals/`, общий мастер `M_Decal_Single` в `/Game/Materials/FloorDecals/` (ключ `master_dir` в `fisht_material.json`, по умолчанию равен `ue_dir`).\n- **Свежий мастер и падение редактора:** сразу после построения мастера скрипт ждёт 10 с (шейдеры ещё компилируются), иначе правка и повторная компиляция роняют редактор (MaterialEditor, access violation). Шаг `_pause()` в очереди `material_set_import.py`; ожидание шага ограничено 6000 тиков.\n\n## Как добавить категорию\nСоздай `Blender/\u003cКатегория>/[группы/]\u003cИмя>/\u003cИмя>.blend` и нажми «Обновить список». Код менять не нужно. Проект со своим конвейером добавь в словарь `CUSTOM` в `prop_menu.py`.\n\n## Панели (план)\nСейчас панель (`Building/Walls/Wall_01`) публикуется как статичный пропс. Дальше: необязательные поля `prop.json` `\"kind\": \"panel\"` и `\"interact\": {\"anchor\": ..., \"interface\": \"BPI_Interactable\"}`; публикация создаёт `BP_Prop_*` от шаблона панели и якорь взаимодействия. Контракт согласовать с чатом «Взаимодействие».\n\n## Что изменено в конвейере\n`prop_ue_import.py`: `find_prop_dir` ищет рекурсивно по `Blender/` (сначала Props, как раньше); `prop_blender.py`: `ue_path` для не-Props. Ключ `blender_root` в `props_config.json` необязателен.\n\n## Интерактивные пропсы\nВ меню проекта: «… как интерактивный…» → Кнопка / Дверь / Считыватель ключа. Пункт пишет в prop.json блок `interactive` (type, cap=\u003cИмя>_Cap, ring_slot=\u003cИмя>_Ring, travel_cm=0.8; уже заданные вручную поля сохраняются) и публикует с `PROP_TYPE='interactive'`. Если prop.json ещё нет, блок передаётся в глобале `PROP_INTERACTIVE`. Саму публикацию (BP от BP_Mech*) реализует чат props-rework; контракт: Docs/MECHANISMS.md.\n\n## Составная модель (несколько объектов в одном .blend)\nПункт проекта «Разделить на части (составная модель)» (`split_parts_run.py` -> headless Blender `split_parts.py`): каждый корневой меш становится соседним проектом `\u003cИмя>_\u003cЧасть>/\u003cИмя>_\u003cЧасть>.blend` со своими материалами и текстурами (меш `SM_\u003cИмя>_\u003cЧасть>`, масштаб применён, объект в нуле). Исходный .blend не меняется, уже созданные части пропускаются. Исходное положение детали пишется в `part_of.json` (`offset_m`). Сохрани .blend перед запуском (Blender читает файл с диска). Дальше части публикуются обычными пунктами меню. Имя части берётся из имени объекта (без `3d model`), при желании переименуй папку и `.blend` до публикации.\n","date":"2026-11-04"},{"path":"Docs/SURFACES_HOWTO.md","title":"Поверхность и коллизия пропса","section":"Модели и пропсы","md":"# Как задать поверхность и коллизию новому пропсу\n\nПолный дизайн: `Docs/PHYSICS_DESIGN.md`. Здесь только порядок действий.\n\n## 1. Поверхность (из чего сделан: звук шагов, удара, скольжение)\nПоверхность задаёт **материал**, не меш. У каждого материала (`M_` или `MI_`) в поле **Phys Material** стоит один из 16 ассетов `/Game/Fisht/Physics/Materials/PM_\u003cИмя>`:\nConcrete, Metal, MetalGrate, Wood, Glass, Tile, Carpet, Water, Dirt, Plastic, Cardboard, Rubber, Fabric, Gravel, Foam, Electronics. Не задано = `Default` (звучит как бетон).\n- Вручную: открой материал → Details → Physics → Phys Material.\n- Автоматически (рекомендую после импорта пропса, редактор открыт, PIE остановлен), через MCP или консоль Python:\n```python\nPHYS_MODE = \"fix\"; PHYS_ROOTS = [\"/Game/Fisht/Props/\u003cКатегория>\"]\nexec(open(r\"E:\\Unreal Projects\\FishtTheBattleDog\\Tools\\Physics\\audit_surfaces.py\", encoding=\"utf-8-sig\").read())\n```\n  Скрипт ставит поверхность по имени материала (правила в `Tools/Physics/surface_map.json`). Режим `audit` только пишет отчёт `Saved/Physics/audit.md` (материалы без поверхности, без правила, меши без коллизии). Нет правила: допиши его в `surface_map.json` или добавь точное имя в `overrides`.\n- Для конвейера Blender-пропсов: в `prop.json` поле `\"surface\": \"Metal\"` (или словарь `{\"M_X\": \"Wood\"}`), импорт ставит `PM_\u003cSurface>` (договорённость с чатом «Пропсы: Blender-проекты»).\n\n## 2. Коллизия (кто с кем сталкивается)\nПрофили проекта (Static Mesh / компонент → Collision Presets):\n| Профиль | Для чего |\n|---|---|\n| `BlockAll` | обычная твёрдая геометрия |\n| `Prop` | двигаемый предмет (мяч, миска) |\n| `Breakable` | разрушаемый (решётка, ящик) |\n| `DebrisPiece` | осколок |\n| `InteractableSolid` | двери, панели |\n| `SurfaceOnly` | декор, через который проходит персонаж, но по которому играют звуки |\n| `ZoneVolume` | объём зоны (вода, вентилятор), тип задаётся тегом `Zone.*` |\nЛазание: теги `Traverse.NoClimb` (перила, тонкие вещи), `Traverse.Beam`, `Traverse.Stairs`, `Traverse.Rope` на акторе или компоненте.\n\n## 3. Звуки\nЗвуки по поверхностям лежат в таблице `/Game/Fisht/Physics/DT_Surfaces` (строка = имя поверхности: StepWalk, StepRun, Jump, LandSoft, LandHard, Slide, Scrape, FootVFX, FootDecal, громкость/высота). Удары и поломки: `DT_ImpactSurface` (`Dash_Default`, `Break_Glass`…). Пока все звуки пустые: нужны ассеты (см. отчёт этапа 3). Положи файлы в `/Game/Fisht/Audio/Surfaces/\u003cПоверхность>/` и впиши в строку. SoundCue/MetaSound с рандомом лучше одиночного WAV.\n\n## 4. Новая поверхность\nДобавь имя в конец списка `Project Settings → Physics → Physical Surface` (номера не менять) → ассет `PM_\u003cИмя>` → строка в `DT_Surfaces` → правило в `surface_map.json`.\n","date":"2026-10-18"},{"path":"Docs/CARRY_MECHANIC.md","title":"Переноска предметов","section":"Модели и пропсы","md":"# Переноска предметов в пасти (этап 1, 2026-10-20)\n\nЧат «Переноска предметов в пасти». Сокет `Mouth_Carry`, утка и держатель-основа описаны в `CARRY_SOCKETS.md`; здесь сама механика.\n\n## Управление\n| Действие | Кнопка | Что происходит |\n|---|---|---|\n| Взять | E (`IA_Interact`) | `BP_CarryHolder.TryGrab`: ближайший актор с тегом `Item.Carryable` в радиусе `ReachRadius` (55) от точки в `ReachDist` (45) перед мордой; проигрывается клип укуса (строка `Bite` в `DT_ActionAnims`, без урона); предмет цепляется к сокету |\n| Отпустить | ЛКМ / правый триггер (`IA_Bite`) | `OnAttack` -> `Release`: предмет кладётся на `ReleaseDist` (60) вперёд и чуть ниже, получает скорость `ReleaseSpeed` (120) |\n| Бросить | ПКМ или левый триггер зажаты + ЛКМ | `Throw`: направление камеры (`ControlRotation`) + подъём `ThrowUp` (0.3), скорость `ThrowSpeed` (1100) x `ThrowSpeedScale` предмета |\nПока предмет в пасти, укус не срабатывает (ЛКМ = отпустить), E на кнопках и дверях работает как раньше (TryGrab при занятой пасти возвращает false и цепочка идёт дальше). Прицельные ПКМ/левый триггер читаются опросом `IsInputKeyDown`, новых Input Action нет.\n\n## Подсказка «Взять» и крючок для UI (2026-10-20, вечер)\n- `BP_CarryHolder` в Tick ищет ближайший `Item.Carryable` (`FindNearest`) и показывает подсказку через `PromptWidget` персонажа (`WBP_InteractionPrompt.ShowPrompt`, надпись кнопки E ставит сам виджет). Пропал предмет или пасть занята: вызывается `RefreshPrompt` персонажа (вернёт прежнюю подсказку интерактива или спрячет).\n- Текст подсказки лежит в одном месте: переменная `PromptTake` (Text) в `BP_CarryHolder`, сейчас «Взять». До String Table (правило 10 в PLAN.md §3, `Docs/LOCALIZATION.md` пока нет) это временное решение: заменить на ключ таблицы, когда чат локализации её введёт.\n- Крючок для будущего UI подсказок по клавишам: `BP_CarryHolder.NotifyUI(State: int)`, вызывается при смене состояния (0 = рядом предмет, можно взять; 2 = ничего). Пока тело пустое; состояние «1 = предмет в пасти» ещё не вызывается (добавить при подключении UI). Подписывать клавиши надо по действиям `IA_Interact` / `IA_Bite` + прицел (ПКМ, левый триггер).\n- Замок: `bConsumeKey` по умолчанию выключен (ключ может открывать несколько дверей); включается на замке в Details.\n- `Pickup` теперь не меняет масштаб предмета (раньше `MouthOffset` с масштабом 1 превращал ключ в куб 100 см); смещение и поворот берутся из `MouthOffset`, масштаб остаётся прежним.\n- Бросок: исправлен пин клавиши в `OnAttack` (было пусто, ПКМ не читалась). Проверено `inject_key RightMouseButton down` + `IA_Bite`: ключ полетел по направлению камеры.\n\n## Прицел и бросок (правка 2026-10-20, ночь)\n- Прицел теперь Input Action `IA_Aim` (`/Game/Input/Actions`, в `IMC_Default`: ПКМ, левый триггер). `BP_FishtCharacter`: `IA_Aim` Started/Completed -> `CarryHolder.SetAiming(true/false)`; `OnAttack` читает `bAiming`. Опрос `IsInputKeyDown` отменён (в игре не срабатывал). Сменить кнопку прицела: переназначить `IA_Aim` в `IMC_Default`.\n- Бросок выносит предмет на 55 см по направлению броска до старта (раньше утка стартовала внутри коллизии головы и падала у лап). Проверено: утка пролетела >10 м.\n- Отпускание (ЛКМ без прицела): предмет сдвигается на `ReleaseDist` (45) вперёд на высоте пасти и падает сам (раньше телепортировался на пол).\n\n## Ассеты (`/Game/Fisht/Gameplay/Carry/`)\n- `BP_CarryableComponent` (ActorComponent): параметры предмета в Details: `ItemId` (Name, для ключей и проводов), `CarrySocket` (Mouth_Carry), `MouthOffset` (Transform в сокете), `CarryMass`, `bCanThrow`, `ThrowSpeedScale`, `PickupSound`, `DropSound`. Функции `Pickup(CarrierMesh)` (физика выкл., коллизия NoCollision, крепление к сокету) и `Drop(Velocity)`.\n  Предмет без компонента в Details: хватает тег `Item.Carryable`, но компонент надо добавить (см. «Как сделать переносимым»). `CarryMass` и звуки пока не используются в логике (задел).\n- `BP_CarryHolder` (ActorComponent на `BP_FishtCharacter`, имя `CarryHolder`): `TryGrab`, `Release`, `Throw`, `Finish`, `OnAttack`. Сборка скриптом `Tools/Carry/build_holder.py` (exec после `Tools/DebugMenu/dm_lib.py`).\n- `BP_KeyLock`: замок. Поля: `RequiredItemId` (пусто = любой ключ), `TargetDoor` (BP_Door в уровне), `bConsumeKey`. Зона `AcceptZone` (Box, оверлап всех каналов выставляется в BeginPlay). Срабатывает, когда в зону вошёл актор с тегом `Item.Key` и подходящим `ItemId`, ИЛИ вошёл Фишт, у которого в пасти такой ключ; открывает дверь через `Unlock` + `Open`.\n- `BP_Key_Test`: тестовый ключ (куб 12x4x2 см), `ItemId = Key_Red`, теги `Item.Carryable`, `Item.Key`.\n- Теги в `Config/DefaultGameplayTags.ini`: `Item.Key`, `Item.Wire`, `Item.Quest`, `Item.Body` (рядом с `Item.Carryable`, `Item.Pushable`). Сейчас предметы помечаются тегами актора (Actor Tags), как и остальные `Item.*`.\n- Правки существующего: `BP_FishtCharacter` (компонент `CarryHolder`; в EventGraph `IA_Interact.Started` -> TryGrab -> (если не взято) прежняя цепочка; `IA_Bite.Started` -> OnAttack -> (если не использовано) прежний `TryActivate`). `BP_Duck_01`: корень `Body` (Box, профиль Prop), `DuckMesh` без коллизии, компонент `Carryable`.\n\n## Как сделать переносимым свой пропс (в том числе импорт из Blender)\n1. Актор-пропс: корневой компонент с коллизией (профиль Prop), тег актора `Item.Carryable` (+ `Item.Key` / `Item.Wire` / `Item.Quest`).\n2. Добавить `BP_CarryableComponent`, задать `ItemId` (для ключей и проводов), при необходимости `MouthOffset`.\n3. Импорт одной кнопкой (`Tools/Props`, `prop.json`) не менялся; поле для переносимости в `prop.json` пока не заведено (следующий шаг).\n\n## Провода (заготовка)\n`BP_WireSocket` будет копией `BP_KeyLock` с тегом `Item.Wire`: зона принимает провод с нужным `ItemId` и вызывает свой делегат; для соединения двух разъёмов будет проверяться пара ItemId.\n\n## Ловушки\n- `Sphere Trace` по Visibility не находит низкие предметы на полу (шар касается пола, ключ 2 см): поиск идёт по тегу (`GetAllActorsWithTag` + `FindNearestActor`).\n- `GetComponentByClass.ComponentClass` через `pin_defaults` build_graph не задаётся: ставить `set_node_pin_value` (иначе компонент не найден, молча).\n- Пересоздание функции `TryGrab` через `fresh_function` сохраняет вызовы из `BP_FishtCharacter` (по имени), но после этого пересобрать и сохранить персонажа.\n- Выпущенный из пасти предмет падает на коллизию головы и «зависает» на псе: `Release` сначала переносит его вперёд и вниз.\n- Результатная нода функции с выходом даёт предупреждение компиляции «Исполнительный контакт возвратного узла...» (дубль exec-пина у `existing` result), работает.\n- Стенд проверки: `L_JR_Preview`, актёры `CarryTest_*` (дверь+замок+ключ, дверь+кнопка), `TestDuck`.\n\n## Подгонка положения в пасти\nПока предмет в пасти, BP_CarryableComponent каждый кадр применяет MouthOffset (живая правка). В PIE: взять предмет, в World Outliner выбрать его актор, в Details компонента Carryable менять MouthOffset (Location/Rotation) и смотреть. Найденное значение вписать в MouthOffset компонента Carryable в Blueprint предмета (PIE-правки не сохраняются). Единицы смещения в системе координат сокета Mouth_Carry (масштаб кости может умножать значение, у утки 1 см смещения ≈ 1.4 см на экране).\r\n\n## Отпускание рядом с псом\nОтпущенный или брошенный предмет временно «призрак» для Pawn (ответ Overlap, переменная bGhost), пока пересекает носителя; когда вышел из пересечения, ответ возвращается в Block (Tick компонента). Поэтому малый ReleaseDist не толкает Фишта. Скрипт: Tools/Carry/build_carryable.py (build_ghost, build_tick).\r\n\n\n## Провода (этап 3, 2026-10-20)\n- `BP_WireSocket` (гнездо, `/Game/Fisht/Gameplay/Carry/`): аналог `BP_KeyLock` для тега `Item.Wire`. Поля Details: `RequiredItemId` (пусто = любой провод), `TargetDoor`. Зона `AcceptZone`, точка вставки `PlugPoint` (двигать в Blueprint, чтобы вилка садилась куда нужно). Принимает брошенный/оставленный в зоне провод или провод в пасти вошедшего Фишта (держатель освобождается через `BP_CarryHolder.Forget`).\n- При подключении: физика и коллизия вилки выключены, она крепится к `PlugPoint`, её теги очищаются (больше не берётся), у `TargetDoor` вызываются `Unlock` и `Open`, срабатывает диспетчер `OnConnected(Item)` (на него можно подписаться из уровня, например для мигающих ламп или цепочки нескольких гнёзд). Подключение однократное (`bConnected`); вытаскивание не сделано.\n- `BP_Wire_Test`: тестовая вилка (цилиндр 5 x 25 см), `ItemId = Wire_A`, теги `Item.Carryable`, `Item.Wire`.\n- Стенд в `L_JR_Preview`: `CarryTest_WireSocket` + `CarryTest_Door3` + `CarryTest_Wire`. Проверено в PIE: взять вилку (E), войти с ней в зону гнезда -> дверь открылась, вилка на `PlugPoint`, держатель пуст.\n- Скрипт: `Tools/Carry/build_wire.py` (build_forget, build_wire_test, build_socket, build_socket_events).\n- Не сделано (идея): кабель с двумя разъёмами между двумя гнёздами (пара ItemId), вытаскивание вилки, подсветка гнезда.\r\n\n### Вытаскивание вилки и план кабеля (2026-10-20, позже)\n- `BP_WireSocket.bAllowUnplug` (по умолчанию ВКЛ, опционально): вилку можно взять обратно на E. Гнездо следит в Tick, что родитель вилки остался гнездом; если вилку забрали, `bConnected = false`, срабатывает диспетчер `OnDisconnected(Item)`. `bCloseDoorOnUnplug` (по умолчанию ВЫКЛ): закрывать ли дверь при вытаскивании. При `bAllowUnplug = false` теги вилки очищаются и она не берётся (прежнее поведение). Проверено в PIE: вставил, вытащил, `bConnected` вернулся в false, дверь осталась открытой.\n- Сейчас есть только вилка (один разъём), кабеля нет.\n- ПЛАН (запрос пользователя): кабель с двумя разъёмами между двумя гнёздами (соединение двух источников питания); затем ограничение движения собаки длиной кабеля. Задумка: актор `BP_Cable` из двух концов-вилок (`Item.Wire`, общий `CableId`), визуально `CableComponent`/сплайн; гнездо знает свой `PowerId`; цепь замкнута, когда оба конца вставлены в гнёзда; `OnConnected` у гнезда получает конец, `BP_CableLink` проверяет пару. Ограничение длины: пока Фишт держит конец в зубах, а второй вставлен, `MaxLength` ограничивает расстояние до второго конца (оттяжка капсулы/скорости); отдельный шаг после первого прототипа.\r\n\n## Респавн потерянных предметов (2026-10-21)\n`BP_CarryableComponent` сам возвращает предмет на точку, если он потерян. Параметры в Details компонента `Carryable`:\n- `bRespawnIfLost` (по умолчанию ВКЛ);\n- `RespawnPoint` (Actor-точка из уровня; пусто = место, где предмет стоял в начале игры, запоминается в BeginPlay как `HomeTransform`);\n- `MaxDistance` (3000 см от точки), `FallDepth` (500 см ниже точки), `CheckInterval` (1 с).\nУсловие потери: предмет дальше `MaxDistance` ИЛИ ниже точки на `FallDepth`. Не проверяется, пока предмет в пасти или вставлен в гнездо/на другом родителе. Респавн обнуляет скорости.\nВручную: функция `RespawnNow` (освобождает носителя через `Forget`, вынимает из гнезда, переносит на точку; диспетчер `OnRespawned`). Сюда же можно повесить Tab-кнопку «вернуть предмет» или кнопку у NPC.\nНе покрыто: предмет «застрял внутри меша» на высоте ближе FallDepth и в пределах MaxDistance (не определяется); нужен будет отдельный признак (долго без движения внутри геометрии) или ручной RespawnNow.\nСкрипт: `Tools/Carry/build_respawn.py` (build_vars, build_respawn_now, build_check_lost, build_begin_play, build_tick; после пересборки EventGraph очистить его целиком).\r\n\n## Кабель с двумя разъёмами (2026-10-21)\n- `BP_CableEnd`: конец кабеля (переносимая вилка, как `BP_Wire_Test`; теги `Item.Carryable`, `Item.Wire`, у компонента `Carryable` свой `ItemId`).\n- `BP_Cable`: связка двух концов. Поля Details: `EndA`, `EndB` (акторы `BP_CableEnd` из уровня), `LinkedDoor` (опционально), `bCloseDoorOnUnlink` (выкл), `Thickness` (толщина линии), `MaxLength` (ЗАРЕЗЕРВИРОВАНО под ограничение длиной, пока не используется). Линия между концами это растянутый цилиндр, обновляется каждый кадр. Диспетчеры `OnLinked` / `OnUnlinked`.\n- Кабель замкнут (`bLinked`), когда ОБА конца вставлены в гнёзда `BP_WireSocket` (родитель-актор конца = гнездо). Какой конец в какое гнездо: у каждого конца свой `ItemId` (например `Cable_1`, `Cable_2`), у гнезда `RequiredItemId` с тем же значением; без `RequiredItemId` гнездо примет любой конец.\n- Гнёзда для кабеля делаются без `TargetDoor` (теперь это безопасно, `TryPlug` проверяет дверь); дверь открывает сам кабель (`LinkedDoor`), либо подпишитесь на `OnLinked`.\n- Проверено в PIE (стенд `CarryTest_*` в `L_JR_Preview`: два гнезда, два конца, кабель, дверь 4): конец 1 в гнездо 1: `bLinked = false`, дверь закрыта; конец 2 в гнездо 2: `bLinked = true`, дверь открыта, линия длиной 200 см между концами.\n- Скрипт `Tools/Carry/build_cable.py`. Не сделано: ограничение длины кабелем (`MaxLength` + натяжение для собаки), провисание линии, подсветка.\r\n\n## Длина кабеля, свободные и неснимаемые концы, провисание, застревание (2026-10-21)\n**Длина (`BP_Cable.MaxLength`, см; 0 = без ограничения).** Кабель не резиновый: расстояние между концами не бывает больше `MaxLength` (допуск 1 см).\nСостояния конца: anchored = `bFixed` или вставлен в гнездо; carried = в пасти; иначе free. При превышении (`Constrain`, каждый кадр):\n- свободный конец (не anchored и не carried) подтягивается к другому на `MaxLength - 0.5` (телепорт, скорость обнуляется, Z вниз не опускается);\n- иначе, если один конец в пасти у собаки, а другой anchored: собака откатывается назад на лишнюю длину (`PullCarrier`, двигается только Character);\n- иначе (оба anchored или оба в пасти) ничего.\nЗначит: оба конца свободны, кабель можно нести, второй конец волочится; один конец зафиксирован в стене (`bFixed`) или в гнезде, собаку держит натяжение.\n\n**Неснимаемый конец.** `BP_CableEnd.bFixed` (Details конца, по умолчанию ВЫКЛ): в BeginPlay очищаются теги (Фишт его не берёт), респавн отключён, физика выключена. Ставится в стену как «источник питания», от него тянут свободный конец.\n\n**Провисание.** Визуал кабеля: `Segments` (16) цилиндров в `InstancedStaticMeshComponent CableSegs`, парабола с глубиной h = sqrt(3/8 * d * (MaxLength - d)); при натяжении прямая, при MaxLength = 0 тоже прямая; не опускается ниже пола (один трейс вниз за кадр -> `FloorZ`). Толщина `Thickness`.\n\n**Застревание.** `BP_CarryableComponent`: `bRespawnIfStuck` (вкл), `StuckTime` (5 с). Раз в `CheckInterval` предмет проверяется шаром 0.4 см на начальное перекрытие с геометрией (канал Visibility); если «внутри» дольше `StuckTime`, вызывается `RespawnNow` (на `RespawnPoint` или стартовую точку). Проверено: ключ телепортирован в стену, за `StuckTime` = 2 с вернулся на старт.\n\n**Исправленные ошибки по пути.**\n- `TryPlug` не сбрасывал `bCarried`: вставленный в гнездо конец считался «в пасти» и кабель двигал само гнездо. Теперь сбрасывается.\n- Оверлап замка/гнезда срабатывал от любых компонентов Фишта (большая сфера запаха), из-за чего ключ в пасти вставлялся в гнёзда издалека (ловушка из CLAUDE.md §16). Теперь для пути «предмет в пасти» нужна капсула (`CapsuleComponent`).\n- Свободный конец при постоянной подтяжке с телепортом проваливался сквозь пол: добавлены допуск 1 см и «Z не вниз».\r\n\n### Доработки кабеля (2026-10-21, позже)\n- Был невидим: меш `CableSegs` в уровне оказывался пустым (перекрытие значения экземпляра); теперь `SetStaticMesh(Cylinder)` вызывается в BeginPlay. Толщина по умолчанию 0.03 (3 см).\n- Провисание учитывает рельеф: для каждой точки кабеля трейс вниз (канал Visibility, концы кабеля игнорируются), точка не опускается ниже найденной поверхности (раньше одна оценка пола под серединой). 17 трейсов за кадр на кабель.\n- Волочение свободного конца плавное: если конец симулируется физикой и до цели не дальше 40 см, он получает скорость к цели (err*15, с коллизиями); иначе телепорт с обнулением скорости. Проверено: собака шагает по 200 см, свободный конец тянется следом, расстояние 278-282 из 300.\n- Проверено размыкание и повторное замыкание: оба конца вставлены -> `bLinked`, дверь открыта; вытащить конец -> `bLinked = false`; вставить снова -> `bLinked = true`.\n- Известный нюанс (наблюдать): один раз свободный конец, возвращённый `RespawnNow` из пасти при зажатой подтяжке, оказался под полом (z ~ -240, ровно на длине кабеля под другим концом); в повторных чистых прогонах не воспроизвёлся. Если встретите, пишите: сначала проверять `RespawnNow` у конца в пасти.\r\n\n## Камера и кабель (2026-10-21)\nПричины скачков камеры и «исчезновения» собаки, найденные замером в PIE (покадровая запись позиции собаки и камеры):\n- **Сегменты кабеля блокировали камеру.** У `CableSegs` на размещённом в уровне экземпляре стоял профиль `BlockAllDynamic` (компонент добавили после установки актора, шаблон `NoCollision` не дошёл). Пружина камеры упиралась в кабель у головы и схлопывалась в собаку (в 62% кадров). Исправление: в `BeginPlay` кабеля `SetCollisionEnabled(NoCollision)` на `CableSegs`.\n- **Жёсткий рывок собаки.** `PullCarrier` каждый кадр сдвигал капсулу назад (`AddActorWorldOffset`), а ввод толкал её вперёд, и капсула дрожала. Добавлен «мягкий поводок»: `Leash`/`LeashEnd` (вызываются в Tick перед `Constrain`) гасят у собаки только составляющую скорости наружу от закреплённого конца, когда расстояние между концами > `MaxLength - 60`. `PullCarrier` остаётся запасным вариантом.\n- Замер после правок: камера не схлопывается, обратных скачков собаки нет, шаг \u003c= 6 см, расстояние между концами 300.0 при `MaxLength` 300. Скрипт: `Tools/Carry/build_cable_leash.py` (поле 60 см правилось в графе вручную; в скрипте margin=20).\r\n\n## Физический кабель (2026-10-21)\nВизуал и поведение кабеля теперь на встроенном плагине `CableComponent` (включён в .uproject): компонент `CableSim` в `BP_Cable`, 20 сегментов, `bEnableCollision`, гравитация, `CollisionResponse`: блокирует WorldStatic/WorldDynamic, игнорирует Pawn, PhysicsBody, Camera, Visibility. Материал `M_Cable` (тёмная резина).\n- Начало кабеля каждый кадр переносится в позицию `EndA` (Tick), конец привязан к корню `EndB` (`SetAttachEndToComponent` в BeginPlay). `CableLength` = `MaxLength`, а при `MaxLength=0` расстояние между концами x 1.15.\n- Кабель лежит на полу, свисает из пасти, не проваливается (замер: мин. z частиц 0.9, три частицы застревают на z -14 на стыке пола, не критично).\n- Старые `CableSegs`/`UpdateVisual`/`SagPoint` остались в ассете как неиспользуемые (скрыты в BeginPlay); `Constrain`, `Leash`, `PullFree` по-прежнему ограничивают длину.\n- ЛОВУШКА: уже стоящий в уровне `BP_Cable` не получил значения нового компонента (коллизия оставалась выключенной): экземпляр пришлось удалить и создать заново (`CarryTest_Cable`). Новые экземпляры берутся из шаблона и корректны.\r\n","date":"2026-11-07"},{"path":".claude/skills/tripo-prop-import/SKILL.md","title":"Навык: пропс из Tripo","section":"Модели и пропсы","md":"---\nname: tripo-prop-import\ndescription: Обработка модели из Tripo (GLB/.blend) и импорт в Unreal-проект Fisht: Blender-чистка, FBX, импорт, материал, коллизия. Использовать, когда пользователь даёт файл Tripo и просит поставить предмет в игру.\n---\n\n# Импорт пропса из Tripo (Fisht the Battle Dog, UE 5.8)\n\nИсточники правил: `ART_DIRECTION.md` (раздел «Правила генерации»), `Docs/TRIPO_IMPORT_GUIDE.md`, `CLAUDE.md` §7 (SamplerType) и §16 (ловушки).\n\n## Вход (спроси, если нет в задании)\nИмя, категория (`/Game/Fisht/Props/\u003cКатегория>/`), размер в см, путь к GLB/.blend, ломается ли (части), тип коллизии (box/convex), пивот, особенности (эмиссия, декаль).\n\n## Шаги\n1. **Blender** (MCP, Blender-питон `...\\Blender 5.1\\5.1\\python\\bin\\python.exe` для скриптов вне MCP; проверь, что не закрываешь чужие сцены): импорт; масштаб в см; пивот (по умолчанию низ по центру); ориентация +X вперёд; удалить мусор/дубли/внутренние грани; упростить (5–15k для мелких, 30–50k для крупных); при необходимости разделить на части (рама/створка/решётка); один PBR-материал (BaseColor, Normal, ORM: R=AO, G=Roughness, B=Metallic, Emissive отдельно); без текста в геометрии (надписи декалью).\n2. **Экспорт FBX** в `E:\\Unreal Projects\\Battle_Fisht_Ref\\work\\incoming\\\u003cимя>\\` + `SOURCE.txt` (источник Tripo, дата, параметры, кредиты, лицензия).\n3. **Unreal** (`execute_python_code`, ОДИН ассет за вызов, отложенный импорт через post-tick, save после каждой части; большие вызовы роняют Python):\n   - импорт `SM_\u003cИмя>`, текстуры `T_\u003cИмя>_BC/N/ORM/E`, материал `M_\u003cИмя>`;\n   - сжатие: BaseColor sRGB/TC_DEFAULT, Normal TC_NORMALMAP (sRGB off), ORM TC_MASKS (sRGB off);\n   - коллизия из Python (`KBoxElem` в `body_setup.agg_geom`; `UCX_` в FBX не импортируется);\n   - Nanite для статики, имена по правилам, папка категории.\n4. **Проверка:** материал не серый (`get_material_diagnostics`), размер в см, пивот, коллизия, кадр редактора. Вердикт по виду за пользователем (CLAUDE.md §12).\n5. **Коммит** (только `Content/Fisht/Props/\u003cКатегория>/...`, не `Ref/`, не исходники Tripo). Кредиты Tripo записать в `ASSETS.md`.\n6. **Отчёт ≤10 строк:** что сделано, размеры, пути, что не проверено.\n\n## Правила\nКлюч Tripo/OpenAI никогда не печатать и не писать в файлы. Токены экономить: не читать большие файлы целиком, не печатать дампы.\n","date":"2026-10-15"},{"path":".claude/skills/breakable-prop-add/SKILL.md","title":"Навык: разрушаемый пропс","section":"Модели и пропсы","md":"---\nname: breakable-prop-add\ndescription: Добавить в проект Fisht разрушаемый объект (ящик, бочка, решётка, часть модели ломается, остальное остаётся целым): подготовка в Blender, публикация prop.ps1, данные в Blueprint, актор в уровне, проверка. Использовать, когда пользователь просит сделать объект или его часть разбиваемой.\n---\n\n# Разрушаемый пропс (Fisht the Battle Dog, UE 5.8)\n\nПорядок обновлён 2026-11-08. Таблицы `DT_Breakables` больше НЕТ (удалена, коммит 7b1998a): данные пропса лежат в переменных Blueprint `BP_Prop_\u003cИмя>` (родитель `BP_BreakableGrate`). Импорт, материал, коллизия и Blueprint делает одна команда `prop.ps1 publish`. Python-импорт руками больше не нужен.\n\nОснова (читай по необходимости, не целиком): `Docs/PROPS_PIPELINE.md` (быстрый путь, три категории, контракт светодиодов, ловушки), `Docs/BREAKABLES_GUIDE.md` (переменные, эффекты, §11 звук/падение/взрыв, §8 чек-лист), `Docs/starters/props_blender.md`, `CLAUDE.md` §7 и §16. Для модели из Tripo: `Docs/TRIPO_IMPORT_GUIDE.md`.\n\n## Вход (спроси недостающее одним сообщением)\n- Имя пропса (папка `Blender/Props/[\u003cКатегория>/]\u003cИмя>/\u003cИмя>.blend`, файл и папка одноимённые).\n- Вариант: `-Type full` (ломается целиком, ящик/бочка), `-Type partial` (рама остаётся, часть ломается: решётка, дверь с окном), `-Physics` (толкается и падает). Без `-Type` выбирается по составу модели.\n- Размеры в см, здоровье, нужен ли порог урона (`ArmorThreshold`), светодиоды (`-Led`), звук/взрыв/урон от падения (поля `breakable_row`, см. PROPS_PIPELINE «Новые поля пропса»).\n- Источник модели: GLB/.blend на диске (Tripo или своя). Проход Фишта через проём рамы не меньше 73×67 см.\n\n## Шаги\n1. **Blender (на диске, лучше headless, не трогай несохранённую сцену пользователя):** модель в `Blender/Props/\u003cИмя>/\u003cИмя>.blend`, 1 ед. = 1 м, низ на Z=0, Origin to 3D Cursor, Ctrl+A All Transforms, один материал, UV. Для `full`/`partial` нарежь аддоном Fisht Props: коллекции `\u003cИмя>_Chunks` (осколки) и для `partial` рама `_Frame` + ломаемая часть. **Пивоты рамы и ломаемой части в одной точке.** Текст в геометрии не нужен (кириллица декалью).\n2. **Условия публикации:** редактор открыт, PIE остановлен, нет `Saved/PIE_LOCK.txt` (иначе жди), `.blend` сохранён и закрыт в Blender.\n3. **Публикация** из корня проекта:\n   `.\\Tools\\Props\\prop.ps1 publish \u003cИмя> -Type full|partial [-Physics] [-Led] [-Level /Game/Fisht/Levels/\u003cУровень> -At \"X Y Z\"]`\n   Или меню редактора Fisht → Опубликовать: \u003cИмя>. Лог: `Saved/PropImport/log.txt`, в конце `ГОТОВО`. Скрипт сам: приводит имена к `SM_\u003cИмя>[_Frame/_Chunk_NN]`, достаёт текстуры, ставит сжатия (ORM = Masks, Normal = Normal Map), строит `M_\u003cИмя>`, импортирует меши, ставит Box-коллизию, поверхность из `prop.json`, создаёт `BP_Prop_\u003cИмя>` с данными (`MaxHealth`, `GrilleMesh`, `FrameMesh`, `ChunkMeshes`, `LedColorOk`…). Повтор безопасен.\n4. **Настройка значений:** постоянные значения для повторных публикаций пиши в `prop.json` → `\"breakable_row\": {\"MaxHealth\": 45, \"DebrisImpulse\": 600}`; разово правь переменные в Details `BP_Prop_\u003cИмя>` или экземпляра в уровне. Теги и поверхность: `\"tags\": [\"Breakable.Light\"]`, `\"surface\": \"Metal\"` в `prop.json`.\n5. **Уровень:** если `-Level` не задан, перетащи `BP_Prop_\u003cИмя>` в уровень руками (уровни сам не открывай и не сохраняй без владельца уровня, PLAN.md §3).\n6. **Проверка (PIE по замку `Saved/PIE_LOCK.txt`, не дольше 15 мин):** рывок или Tab → «Разрушаемые и опасности» → «Сломать ближайший пропс» ломает часть, рама остаётся, обломки появляются и исчезают, коллизия ломаемой части отключилась, Фишт проходит проём и не застревает, нет `Accessed None`. Вид и светодиоды оценивает пользователь.\n7. **Коммит** только `Content/Fisht/Props/\u003cКатегория>/` и `Tools/Props`-данные пропса (`prop.json`), не `Blender/`, не `Ref/`. Отчёт ≤10 строк.\n\n## Ловушки\n- Уже созданный `BP_Prop_\u003cИмя>` не пересоздаётся: при смене варианта удали его в Content Browser и запусти снова (команда напишет `ВНИМАНИЕ`).\n- Во время PIE импорт и правка Blueprint не работают (реестр ассетов слеп).\n- Экземпляры в уровне не получают новые компоненты Blueprint, добавленные позже: удали и поставь заново (`CLAUDE.md` §16).\n- Части `_Parts` (отваливающиеся) импортируются как `SM_\u003cИмя>_Part_NN`, но механики в игре пока нет.\n- Компонент PropPhysics шаблонов общий: массы физичных вариантов правь в самом Blueprint пропса, не через родителя.\n- Рама с проёмом точной формы: `\"collision\": {\"SM_\u003cИмя>_Frame\": \"ucx\"}` в `prop.json` и `UCX_`-меши в Blender, либо правка в редакторе меша.\n- `.ps1` с кириллицей только с BOM; `2>&1` на `blender.exe` ломает `ErrorActionPreference=Stop`.\n- Не вызывай `compile_blueprint` для чужих ассетов «на пробу»; не удаляй `BP_CharTestRoom` через Python. Ключи API не печатать.\n","date":"2026-11-08"},{"path":"Docs/MECHANISMS.md","title":"Механизмы и сигналы","section":"Уровни","md":"# Механизмы и сигналы (кнопки, ключ-карты, провода)\n\nЧат «Механизмы и сигналы», 2026-10-28. Все ассеты: `Content/Fisht/Gameplay/Mechanisms`. Старые `BP_InteractionButton`, `BP_Door`, `BP_ButtonGate`, `BP_KeyLock` НЕ менялись (работают как раньше). Новая система живёт рядом; в `L_JR_Preview` стоит тестовая сцена `Mech_*`.\n\n## Схема\n- **`BP_MechanismComponent`** (на любом акторе): считает состояние `E_MechState` из требований, а не выставляется руками.\n  Locked (красный) → Ready (жёлтый) → Active (зелёный); Off (серый); Reserved (запас).\n  - Требования: `bNeedKey` + `SetKeyOk`, `bNeedWire` + `SetWireOk`, каналы `InChannels` с режимом `InMode` (0 И, 1 ИЛИ, 2 N из M, `MinCount`).\n  - Действие: `Trigger()` (из Ready в Active, возвращает успех). `bAutoTrigger` = становится Active сам, когда требования выполнены (двери, считыватели).\n  - Выход: `OutChannel` (FName): в Active включается канал в хабе, иначе выключается.\n  - Диспетчер `OnStateChanged(Old, New)` для любых подписчиков.\n- **`BP_SignalHub`** (один на уровень, ставить вручную): `SetChannel`, `IsChannelOn`, `CountOn`, диспетчер `OnChannelChanged`; хранит сохранение (`bUseSave`, `ClearSave`).\n- **Приёмник — «что делает пропс при смене состояния»**:\n  1. Интерфейс `BPI_MechReceiver.OnMechState(Old, New, Color, Intensity, PulseRate, PulseAmp, HintKey, SoundKey)` на самом акторе: там можно сменить материал, сдвинуть меш, поменять параметр материала, включить звук, и т.д. Параметры берутся из строки таблицы.\n  2. Встроенный свет `bAutoLed` (по умолчанию включён): пишет `LED_Color`, `LED_Intensity`, `LED_PulseRate`, `LED_PulseAmp` в материалы первого `StaticMeshComponent` актора (материал `M_MechLed` или материал пропса по контракту LED v2). Выключи `bAutoLed`, если свет делает приёмник.\n- **Таблица `DT_MechStates`** (структура `S_MechStyle`): строка `\u003cТип>_\u003cиндекс состояния>` (0 Locked, 1 Ready, 2 Active, 3 Off, 4 Reserved); типы `Button`, `Door`, `Lock`, `Default`; поля `Color`, `Intensity`, `PulseRate`, `PulseAmp`, `HintKey`, `SoundKey`. Тип механизма = `MechType` на компоненте. Все поля в JSON задавай полностью (ловушка CLAUDE.md §16).\n- **Сохранение**: слот `MechSave` (`BP_MechSave`): на каждый `MechId` три бита (1 нажато, 2 ключ, 4 провод). `MechId` пустой = берётся имя актора (стабильно для размещённых в уровне). `bPersist` на компоненте выключает сохранение. Сбросить: `ClearSave` на хабе.\n\n## Готовые акторы\n| Актор | Что |\n|---|---|\n| `BP_MechButton` | настенная кнопка, `BPI_Interactable` (E), в Details: `InteractionText`, компонент `Mech` (`InChannels`, `OutChannel`) |\n| `BP_MechDoor` | дверь + лампа статуса; открывается, когда канал(ы) `InChannels` включены; `OpenOffset`, `OpenTime` |\n| `BP_MechKeySlot` | считыватель ключ-карты: `RequiredItemId` (из `BP_CarryableComponent.ItemId`), `bConsumeKey`, `OutChannel` |\n| `BP_MechSignalBridge` | провода: `Cable` (`BP_Cable`) и/или `Socket` (`BP_WireSocket`) → `Channel`. Соединили концы / вставили вилку → канал включён |\n\n## Тестовая сцена `L_JR_Preview` (цепочка)\n`CarryTest_Key` (Key_Red) → `Mech_KeyReader` (канал `TestKey`) → `Mech_Button` (`InChannels=TestKey`, `OutChannel=TestDoor`) → `Mech_Door` (`InChannels=TestDoor`). Хаб: `Mech_Hub`. Для проводов: поставь `BP_MechSignalBridge`, укажи `Socket`/`Cable` и `Channel`, этот канал впиши в `InChannels` кнопки.\n\n## Контракт для пайплайна пропсов (шаг 6; реализуют чаты «Пропсы: Blender → игра» и «Меню Fisht»)\nПодготовленный образец: `Blender/Props/Buttons/Button_01/Button_01.blend` (бэкап до правок: `Button_01_before_mech.blend`).\n- Объекты: `Button_01` (корпус; слот 0 = основной материал, слот 1 = `Button_01_Ring`, это светящееся кольцо вокруг колпачка) и `Button_01_Cap` (колпачок отдельным мешем, origin в центре его задней грани; ось нажатия = +Y Blender). Одна коллекция, без родителей.\n- Правило подготовки: подвижная часть = отдельный объект `\u003cИмя>_Cap` с origin на оси движения; светящаяся поверхность = отдельный материальный слот `\u003cИмя>_Ring` (маска `T_*_E` не нужна: параметры `LED_*` пишутся в этот слот).\n- В UE: `BP_Prop_\u003cИмя>` = ДОЧЕРНИЙ от `BP_MechButton` (`/Game/Fisht/Gameplay/Mechanisms`). Корневой `ButtonMesh` = меш корпуса, `CapMesh` (дочерний компонент) = меш колпачка в исходной позиции. Слот кольца получает материал с параметрами `LED_Color`, `LED_Intensity`, `LED_PulseRate`, `LED_PulseAmp` (образец `M_MechLed`; для текстурного корпуса можно `M_Prop_Master`-подобный с этими параметрами).\n- Анимация нажатия уже в `BP_MechButton`: `CapTravel` (см, по умолчанию 0.8), `CapDir` (направление в локальных осях `CapMesh`/родителя; после импорта FBX ось Blender +Y может стать -Y, проверить глазами и поправить `CapDir`), `CapPressTime`.\n- Масштаб: высота 10 см (`HeightCm` в `prop.json`; в Blender панель ~94 «метра»).\n- Блок `prop.json`: `\"interactive\": {\"type\": \"button\", \"cap\": \"

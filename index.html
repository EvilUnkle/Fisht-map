<style>
:root{--bg:#12151a;--card:#1c2128;--line:#2d343d;--tx:#e8ecf1;--mut:#8b96a4;--idea:#8b96a4;--wip:#e5a63b;--built:#4aa3e8;--ver:#46c26b;--ask:#e8603c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:80px}
header{padding:14px 16px 4px}
h1{margin:0;font-size:20px}
.sub{color:var(--mut);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0c0e12;border-top:1px solid var(--line);z-index:5}
nav a{flex:1;text-align:center;padding:10px 4px;color:var(--mut);text-decoration:none;font-size:12px}
nav a b{display:block;font-size:20px;font-weight:400}
nav a.on{color:var(--tx);background:var(--card)}
nav .n{background:var(--ask);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:3px}
main{padding:8px 12px;max-width:900px;margin:0 auto}
section{display:none}section.on{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg)}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ask);border-radius:10px;padding:11px 12px;margin:8px 0}
.item.q{border-left-color:var(--wip)}
.item .t{font-size:16px}
.item .m{color:var(--mut);font-size:12px;margin-top:4px}
.tag{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-right:6px;background:var(--ask);color:#fff}
.item.q .tag{background:var(--wip);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sys{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:hidden}
.sys img{width:100%;border-radius:8px;margin-bottom:8px}
.sys h3{margin:0 0 6px;font-size:17px}
.st{display:inline-block;font-weight:700;font-size:15px;padding:4px 10px;border-radius:8px;color:#000}
.st.idea{background:var(--idea)}.st.wip{background:var(--wip)}.st.built{background:var(--built)}.st.verified{background:var(--ver)}
.bar{display:flex;gap:3px;margin:8px 0}.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.bar i.f.idea{background:var(--idea)}.bar i.f.wip{background:var(--wip)}.bar i.f.built{background:var(--built)}.bar i.f.verified{background:var(--ver)}
.sys p{margin:6px 0 0;font-size:14px}
.sys .m{color:var(--mut);font-size:12px;margin-top:6px}
.dec{display:flex;gap:10px;margin:0 0 12px}
.dec .d{flex:0 0 74px;color:var(--mut);font-size:12px;padding-top:2px}
.dec .b{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dec .r{color:var(--mut);font-size:13px;margin-top:5px}
.dec .r s{color:#c98}
.plan{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--mut)}
.leg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;font-size:12px;color:var(--mut)}
.wc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0}
.wc h4{margin:0 0 5px;font-size:16px}.wc p{margin:0;font-size:14px}
.wc .m{color:var(--mut);font-size:12px;margin-top:6px}
.wc .sb{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-left:6px;background:var(--line);color:var(--tx);vertical-align:middle;font-weight:400}
.wc.gap{border-left:5px solid var(--ask)}.wc.gap.missing{border-left-color:var(--wip)}
.wh{margin:14px 2px 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--mut);padding:20px;text-align:center}
</style>
</head>

скин","doc":"Docs/VEST.md"},{"id":"progress","name":"Прокачка","icon":"📈","status":"idea","check":"утверждено, не начато","note":"Навыки экипировки за улучшающий пластик, схрон. После уровня Training","doc":"Docs/PROGRESSION_PLAN.md"},{"id":"mechanisms","name":"Механизмы","icon":"🔌","status":"built","check":"вид не проверен","note":"Кнопки, двери, ключ-карты, провода, сигналы","doc":"Docs/MECHANISMS.md"},{"id":"interaction","name":"Взаимодействие","icon":"🖐","status":"built","check":"не проверено","note":"Фокус по E, переноска предметов","doc":"Docs/INTERACTION.md"},{"id":"training","name":"Уровень Training","icon":"🏗","status":"wip","check":"полный прогон ботом не сделан","note":"Цепочка загадок собрана; нет надеваемого жилета, станций лечения","doc":"Docs/LEVEL_TRAINING.md"},{"id":"friend11","name":"Друг-11","icon":"🛸","status":"wip","check":"не проверено","note":"Летающий друг со скелетом","doc":"Docs/FRIEND11.md"},{"id":"anim","name":"Анимация","icon":"🐕","status":"wip","check":"не проверено глазами","note":"Мастер-пёс JR, прыжки, уступы; ждёт паки клипов лестницы","doc":"Docs/plan/anim.md"},{"id":"camera","name":"Камера","icon":"🎥","status":"wip","check":"не проверено","note":"Правая кнопка только приближает; открыто: пила на лестнице","doc":"Docs/plan/gameplay.md"},{"id":"ui","name":"Интерфейс","icon":"🖥","status":"wip","check":"геймпад не проверен","note":"HUD, подсказки, глифы, главное меню","doc":"Docs/plan/ui.md"},{"id":"localization","name":"Локализация","icon":"🌐","status":"wip","check":"не проверено","note":"Тексты через String Table, подсказки по устройству","doc":"Docs/LOCALIZATION.md"},{"id":"physics","name":"Физика и поверхности","icon":"🧱","status":"wip","check":"не проверено","note":"Шаги, следы; ждёт звуковые ассеты","doc":"Docs/SURFACES_HOWTO.md"},{"id":"props","name":"Пропсы","icon":"📦","status":"built","check":"светодиоды не проверены","note":"Blender → игра одной командой, разрушаемые","doc":"Docs/PROPS_PIPELINE.md"},{"id":"ropes","name":"Верёвки и балки","icon":"🪢","status":"wip","check":"не проверено","note":"Раскачивание, переноска","doc":"Docs/ROPE_BEAM.md"},{"id":"world","name":"Сюжет и мир","icon":"📖","status":"idea","check":"есть черновик сценария, много пробелов","note":"Завязка и два ИИ есть, финал и роли не придуманы; см. вкладку «Мир»","doc":"Ref/Сценарий.docx"},{"id":"perf","name":"Производительность","icon":"⏱","status":"idea","check":"замер устарел","note":"Нужен новый замер на мастер-псе","doc":"Docs/plan/qa.md"}],"decisions":[{"date":"2026-11-06","system":"progress","title":"Навыки — это навыки экипировки, покупаются улучшающим пластиком","replaced":"личные навыки Фишта","doc":"Docs/PROGRESSION_PLAN.md"},{"date":"2026-11-06","system":"progress","title":"Экипировка меняется в схроне","replaced":"смена в любой момент (F1 — только для отладки)","doc":"Docs/PROGRESSION_PLAN.md"},{"date":"2026-11-06","system":"vest","title":"Форма от детали, украшение от скина; скин не даёт статов","replaced":"цвет и материал внутри детали","doc":"Docs/PROGRESSION_PLAN.md"},{"date":"2026-11-06","system":"combat","title":"Двойной прыжок заменён джетпаком: второе нажатие в воздухе включает его","replaced":"двойной прыжок (оставлен выключенным, MaxAirJumps = 0)","doc":"PLAN.md §6"},{"date":"2026-11-04","system":"combat","title":"Рокет-джамп заменён джетпаком (увеличенный прыжок за энергию)","replaced":"рокет-джамп (взрыв под Фиштом)","doc":"Docs/COMBAT_PLAN.md"},{"date":"2026-11-04","system":"combat","title":"Правая кнопка только приближает камеру; тело к прицелу не доворачивается","replaced":"режим прицеливания с разворотом тела (StrafeMode)","doc":"Docs/COMBAT_PLAN.md"},{"date":"2026-11-04","system":"combat","title":"Электроника стала двумя видами пластика: боевой (боеприпасы) и улучшающий (улучшения)","replaced":"один ресурс «электроника»","doc":"Docs/COMBAT_PLAN.md"},{"date":"2026-11-04","system":"combat","title":"Укус не боевой; атаку заменяет рывок-удар с разбега","replaced":"укус как атака","doc":"Docs/COMBAT_PLAN.md"},{"date":"2026-11-04","system":"combat","title":"Оружие встроено в жилет, модульность через боеприпасы, а не стволы","replaced":"сменные стволы","doc":"Docs/COMBAT_PLAN.md"}],"atlas":[],"world":{"story":[{"id":"st-premise","title":"Завязка (черновик сценария)","text":"2126 год. Орбитальная станция МИР-11: огромный медицинский комплекс с роботизированными платформами. Рядом новый модуль тренировки служебных собак для дальних космических миссий (сопровождение и спасение людей). Фишт, лучший из отобранных на Земле, прошёл подготовку и готов лететь на Марс, но события прерывают миссию.","src":"Ref/Сценарий.docx","state":"черновик"},{"id":"st-ai","title":"Конфликт двух ИИ","text":"Друг-11: не друг и не враг, хочет спасти человечество, уничтожив всех, кто разрабатывает ИИ, и все базы с ИИ (против деградации, потери работы, перенаселения). МИР-11: разрабатывает медустановки и спасает остаток людей на базе. Цели не раскрываются по ходу, финал «совсем не очевиден».","src":"Ref/Сценарий.docx","state":"черновик"},{"id":"st-art","title":"Мир в арт-направлении","text":"Космическая станция-корабль «Звёздная Помощь» (миротворческая, с медицинским и спасательным уклоном). Медицинские и транспортные роботы сошли с ума и напали на экипаж. Фишт — боевой пёс на борту.","src":"ART_DIRECTION.md","state":"черновик"},{"id":"st-mvp","title":"MVP-уровень Сектор 7","text":"Старт → коридор → след запаха → запертая дверь → вентиляция → пульт → кнопка → дверь. Есть робот-охранник, техник-компаньон, чекпоинты. По ТЗ без боя: обойти, переждать, спрятаться.","src":"ТЗ_MVP.md; PLAYTEST.md","state":"есть"},{"id":"st-training","title":"Уровень Training: тренировочная база","text":"Зал со змейкой, каюта Фишта (C02), каюта тренера (C15), комната жилета (V), прачечная, жилой коридор, выход. Загадки: кабели, ключи K1/K2, предохранитель, гермодверь D4. Есть слой «следы катастрофы»: панели, мусор, дым, огонь.","src":"Docs/LEVEL_TRAINING.md","state":"собрано"},{"id":"st-friend","title":"Друг-11 как сюжетный ход","text":"Встречает Фишта, ведёт себя как робот-помощник и консультант, ведёт инструктаж. Скрытая черта: иногда «замирает», глаз вспыхивает красным, звучат зловещие реплики. Позже возможна вторая форма: огромный страшный робот.","src":"Docs/FRIEND11.md; Docs/starters/friend11.md","state":"есть"}],"characters":[{"id":"ch-fisht","title":"Фишт","text":"Боевой пёс. Лучший кандидат на программу. В игре: джек-рассел на мастер-скелете JR, жилет с оружием и джетпаком.","src":"Ref/Сценарий.docx; Docs/JR_MASTER_NOTES.md","state":"есть"},{"id":"ch-f11","title":"Друг-11","text":"Робот-консультант на воздушной подушке, рост 1,3 м, глаз-линза, антенны. Состояния: спокоен, говорит, обнаружил, тревога, скрытый, выключен. В сценарии также ИИ дата-центра.","src":"Docs/FRIEND11.md; Ref/Сценарий.docx","state":"есть"},{"id":"ch-mir","title":"МИР-11","text":"Второй ИИ, оппонент Друга-11. Только в сценарии: ни модели, ни голоса, ни роли в уровнях.","src":"Ref/Сценарий.docx","state":"нет"},{"id":"ch-robots","title":"Враждебные роботы","text":"Белые корпуса с красными «глазами»: медицинские и грузовые (по 8 концептов). В игре: охранный робот, дроны (MD-01 и др.), робот на подушке.","src":"ART_DIRECTION.md; Docs/ENEMY_ROADMAP.md","state":"есть"},{"id":"ch-humans","title":"Люди: техник, инженер, тренер","text":"Техник (MVP) и инженер (песочница) подбираются как компаньоны; в Training есть каюта тренера и «питание тренера». Кто они и живы ли, нигде не описано.","src":"PLAN.md; Docs/plan/levels.md; Docs/LEVEL_TRAINING.md","state":"заглушка"}],"dialogues":[{"id":"dl-lines","title":"Реплики Друга-11","text":"28 реплик, 7 групп по 4, ru и en: Greet, Idle, Follow, Detect, Alarm, Stare, Off. Тайные (Stare): «Скоро.», «Ты мне доверяешь, Фишт?», «Всё идёт по плану.», «Так и должно быть.»","src":"Blender/Frend11/Friend11_Form1/tools/voice_lines.json","state":"заглушка"},{"id":"dl-scene","title":"Схема сцены знакомства","text":"Встретил → поговорил → провёл → заставил потренироваться. По 2–3 реплики на навык: покажи, сделай, похвала. Тайную сторону включать редко и когда Фишт не смотрит.","src":"Docs/FRIEND11.md","state":"черновик"},{"id":"dl-loc","title":"Языки и субтитры","text":"Интерфейс, субтитры и озвучка переключаются независимо (ru/en). Субтитры в таблице ST_Subtitles; реплики показываются над головой робота.","src":"Docs/LOCALIZATION.md","state":"есть"},{"id":"dl-quests","title":"Задания","text":"Явные задания в интерфейсе и неявные (локальные головоломки). Простые: принести ключ, части механизма, соединить провода. Отдельной системы квестов нет.","src":"Ref/Референс разнообразных находок.txt","state":"идея"}],"sound":[{"id":"sn-voice","title":"Озвучка","text":"Сейчас синтезированный голос с робо-фильтром (Windows TTS). Настоящих записей нет; структура папок под озвучку (en/ru) готова. Есть вариант платного синтеза.","src":"Docs/FRIEND11.md; Docs/LOCALIZATION.md","state":"заглушка"},{"id":"sn-sfx","title":"Звуки","text":"Друг-11, выстрелы, взрывы, шаги по поверхностям: все синтезированные заглушки. Затухание настроено, настоящие ассеты ждут.","src":"Docs/FRIEND11.md; Docs/COMBAT_PLAN.md; Docs/ENEMY_ROADMAP.md","state":"заглушка"},{"id":"sn-music","title":"Музыка и атмосфера","text":"В документах не упоминается.","src":"—","state":"нет"}],"style":[{"id":"sy-look","title":"Материалы и цвета","text":"Бело-серый потёртый металл, чёрные узлы и резина, синие и янтарные световые полосы, синий медкрест, красно-белые предупреждающие полосы. Надписи кириллицей.","src":"ART_DIRECTION.md","state":"есть"},{"id":"sy-training","title":"Training: референс уровня","text":"Бежево-серые панели с красными полосами, оранжевые светодиоды, эстакады с канатом и мостиками, интерактивные пропсы в одном стиле.","src":"Docs/starters/level_training.md","state":"есть"},{"id":"sy-enemy","title":"Враги и насилие","text":"Враги: те же белые корпуса, красные сенсоры. Насилие только над роботами: без крови, искры, дым, обломки, взрывы.","src":"ART_DIRECTION.md; Docs/COMBAT_PLAN.md","state":"есть"},{"id":"sy-led","title":"Язык света","text":"Цвет светодиода сообщает состояние: у Друга-11 спокоен голубой, тревога красный; у механизмов красный, жёлтый, зелёный, серый.","src":"Docs/FRIEND11.md; Docs/MECHANISMS.md","state":"есть"},{"id":"sy-text","title":"Правило надписей","text":"Текст в геометрии не генерируем (нейросеть путает буквы): кириллица отдельными декалями и текстурами.","src":"ART_DIRECTION.md","state":"есть"}],"gaps":[{"id":"g-ship","kind":"contradiction","title":"Станция или боевой корабль?","text":"Сценарий: орбитальная медицинская станция МИР-11. Арт-направление: миротворческий корабль с экипажем и спасательными операциями по галактике.","src":"Ref/Сценарий.docx; ART_DIRECTION.md"},{"id":"g-cause","title":"Почему роботы напали?","text":"Арт-направление: роботы «сошли с ума». Сценарий: идёт война двух ИИ. Связь между ними не описана: безумие это работа Друга-11?","src":"ART_DIRECTION.md; Ref/Сценарий.docx"},{"id":"g-breed","title":"Порода Фишта","text":"В сценарии вельштерьер. В игре риг, референс и модель — джек-рассел-терьер.","src":"Ref/Сценарий.docx; Docs/JR_MASTER_NOTES.md; Ref/Models"},{"id":"g-f11body","title":"Друг-11: дата-центр или робот 1,3 м?","text":"В сценарии это один из двух мощнейших ИИ дата-центров. В игре — летающий робот-консультант. Как связаны тело и сеть, не сказано.","src":"Ref/Сценарий.docx; Docs/FRIEND11.md"},{"id":"g-mir","title":"МИР-11 не представлен в игре","text":"Второй ИИ из сценария не имеет ни образа, ни голоса, ни места в уровнях. Игрок не узнает о его цели.","src":"Ref/Сценарий.docx"},{"id":"g-timeline","title":"Training: до катастрофы или после?","text":"Сценарий: Фишт «только что прошёл подготовку». Но в уровне Training уже есть следы катастрофы (дым, огонь, обломки), а Друг-11 проводит инструктаж.","src":"Ref/Сценарий.docx; Docs/LEVEL_TRAINING.md"},{"id":"g-weapons","title":"Зачем служебной собаке оружие?","text":"Сценарий: пёс для сопровождения и спасения. ТЗ MVP: боя нет, только скрытность. Сейчас жилет с пулемётом и ракетами: мотивация не объяснена.","src":"Ref/Сценарий.docx; ТЗ_MVP.md; Docs/COMBAT_PLAN.md"},{"id":"g-humans","title":"Где люди и кто они","text":"Техник, инженер, тренер упомянуты в уровнях, но не описаны: имена, судьба, роль в сюжете. Куда делся экипаж, не сказано.","src":"PLAN.md; Docs/LEVEL_TRAINING.md"},{"id":"g-mars","title":"Марс","text":"Первая миссия на Марс упомянута один раз как причина подготовки. Что с ней стало и вернётся ли она в сюжете, не определено.","src":"Ref/Сценарий.docx"},{"id":"g-reveal","title":"Как раскрывается Друг-11","text":"Тайная сторона есть только как случайные жуткие реплики и вспышки глаза. Момент, способ и последствия раскрытия не придуманы.","src":"Docs/FRIEND11.md"},{"id":"g-ending","title":"Финал","text":"Сценарий лишь говорит, что он «не очевиден». Не придуман. Акты, главы и порядок уровней тоже.","src":"Ref/Сценарий.docx"},{"id":"g-intro","title":"Текста сцены знакомства нет","text":"Группы реплик Intro и Train описаны как формат, но не написаны. Есть только 7 общих групп поведения.","src":"Docs/FRIEND11.md; voice_lines.json"},{"id":"g-audio","title":"Озвучка, музыка, амбиент","text":"Настоящей озвучки нет, решения о голосе и музыке не принято, музыка в планах не упоминается.","src":"Docs/LOCALIZATION.md; Docs/FRIEND11.md"},{"id":"g-quest","title":"Нет системы заданий","text":"Явные задания в интерфейсе и связь загадок с сюжетом задуманы, но в проекте их нет.","src":"Ref/Референс разнообразных находок.txt; Docs/LEVEL_TRAINING.md"}]},"generated":"2026-11-06 18:13"};
